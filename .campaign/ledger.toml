[[row]]
id = 'cp-credential'
title = "A provider's credential_command supplies and renews its key"
feature = 'custom-provider'
status = 'todo'
owner = ''
blocked_by = [
  'cp-schema',
  'cp-picker',
]
guard = false
spec = '''
A provider on `auth = { kind = "command", credential_command = "..." }` (grammar: cp-schema) gets its key from the team's own command, as Claude Code's apiKeyHelper does for Anthropic and awsAuthRefresh for Bedrock (issue #680, outcomes 4 and 6), so a short-lived personal key renews by itself and nobody pastes keys.

After this item:
- What the command prints (decided here): one JSON object `{"token": "<key>", "expires_at": "<RFC 3339>"}` on stdout, `expires_at` optional; a stdout that is not JSON and is one non-empty line is taken as the key with no expiry (apiKeyHelper's form), so a helper that already exists works. Anything else, a non-zero exit, or no answer within 30 seconds is a failed run whose words are its stderr (trimmed, at most 500 characters), else `exited <code>`.
- When it runs: when splice holds no key for the provider, when the key it holds expires within five minutes (the window the ChatGPT sign-in renews in), and once after the provider answers 401 to a turn; that turn is then sent once more with the new key. A second 401 is not retried. One run at a time per provider: concurrent turns wait for the same run. A key with no expiry is used until a 401.
- No credential, no request (decided once for the feature): a turn on a provider that has no usable credential is refused before anything goes upstream, with the status and error type the door already uses when no account is signed in (door-default.md decision 6: a 4xx Claude Code shows once and does not retry), and the message `splice: <provider> has no key: <why>. Type /login to sign in on splice's accounts page, or run splice login <head> in a terminal.` <why> is `you are not signed in` when the command failed and said nothing, else the command's own words, or `<provider> refused a renewed key (401): <the provider's message>` after the second 401.
- The credential is per provider, held in the daemon's memory alone: never in a file, a log line, splice's state, the environment of any process splice starts (the session's, the credential command's own, the login command's), or an answer of the control plane. The command runs with /bin/sh -c and the daemon's environment, to which splice adds nothing it holds.
- Such a provider's heads are in the door and in /model whether or not a key is held now (a person signs in from inside the session, so the row must be there before).
Build it on the existing RefreshableAuthProvider (core/src/main/kotlin/splice/core/auth/Credentials.kt: refresh, allowRefreshAfterFailure, upstreamAnswered), which already carries the 401-and-retry-once path the ChatGPT sign-in uses (CodexAuthProvider), rather than adding a second retry path; the auth kind is generic, no vendor in it. Retries are total: a run that fails is reported honestly, never looped. GET /api/auth, splice login and the accounts page are cp-login's and cp-accounts'; the state shown there is `held` (with expires_at) / `none` / `failed` (with error), which this item keeps on the provider for them to read.

Where: core/.../auth (a command credential beside Credentials.kt), the place a head's openai-chat arm takes its credential (app/.../provider), DesktopLineup.kt only for keeping the head in the door without a key. No new top-level functions or companion objects.

Proven by: bun test ./.campaign/checks/custom/credential.test.ts — the first turn carries the key acme-ai printed; a fresh key is reused; a revoked key is renewed once and the turn answered; a key within five minutes of expiry is renewed before sending; two 401s refuse in Anthropic's shape naming acme, /login and `splice login acme` after two tries; signed out, and with a failing command, the refusal comes with nothing sent upstream; the head is in /model with no key; no key printed is in a file, a log, the session's env or the command's env.'''
checks = [
  'bun test ./.campaign/checks/custom/credential.test.ts',
]
sources = [
  'core/src/main/kotlin/splice/core/auth/Credentials.kt',
  'integrations/providers/codex/src/main/kotlin/splice/provider/codex/auth/CodexAuthProvider.kt',
