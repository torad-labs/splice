d, drop the `restartRequired` flag in the  || VERIFY-SPEC: `ConfigServiceTest` cases for the new knobs' defaults, env aliases, and clamp floor; an `AuthProbeLoopTest` case asserting jitter is applied to subsequent ticks but not the first. Gate: `npm run gate`. --- ## 7. Improvements — just works || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### SH-20'"
