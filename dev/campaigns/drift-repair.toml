id = "DR-8"
phase = "launch"
title = "SECURITY: LoginInterception.wire() wraps its ENTIRE hook-materialization body in runCatchingCancellable{}.getOrElse{emptyMap()}, so one IOException anywhere silently drops ALL hook entries — including the token-capture UserPromptSubmit hook whose stated job is to stop a pasted API key from reaching the model. Orchestrator-VERIFIED by reading lines 68-96: the buildMap that writes the commands dir, the login interceptor AND the capture hook is one try block with a single empty-map fallback. Concrete: ~/.claude-openrouter/commands exists as a regular file (operator artifact or a prior half-run); writeCommandsDir calls Files.createDirectories which throws FileAlreadyExistsException (an IOException); the whole map is abandoned; materialize() returns a normal MaterializeResult; LaunchService.launch discards it; the shim execs claude. The user then pastes sk-or-v1-... at the prompt and with no capture hook it is an ordinary user message — it travels through the gateway to the upstream and is persisted in the session transcript. Nothing logs. The same swallow drops the /login interceptor, so /login submits the raw sentinel SPLICE_CODEX_LOGIN to the model as a billed turn. Three materially different causes (commands dir unwritable, capture hook unwritable, no login command configured) produce an identical empty map. Contrast writeHookScript twenty lines below, which DOES log a failed chmod through a LogSink already present in this file. Fix: return a typed result or take the LogSink, so a non-empty spec that produced zero hooks logs, and for tokenCapture != null FAIL the launch rather than launch a head that cannot intercept a pasted credential."
