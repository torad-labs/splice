# [2026-09-13] [2026-09-13] REVIEW 2 (splice-astra): exact row verify PASS (exit 0, no output) on HEAD eb868145. The cap-overflow defect is fixed, but ONE BLOCKER remains in provider-spi CodeModeLimits.kt:22-25: when maxChars is smaller than the marker reserve, boundedText returns value.take(maxChars), which can cut inside a surrogate pair despite the function's code-point-safe contract. Concrete minimum edge: boundedText("😀x", 1) returns one unpaired high surrogate (confirmed with Kotlin: length=1, high=true). Make the marker-too-small fallback advance only by whole code points and add this non-BMP minimum-cap regression. Verdict: NOT ACCEPTABLE until fixed and exact gate re-passes.
