# ── 2 names, suspend () -> Unit ───────────────────────────────────────────────────────────────────
[[groups]]
signature = "suspend ()->Unit"
dated = "2026-09-17"
names = [
    "Heartbeat",
    "MgmtRoute",
]
reason = """Heartbeat is "the one frame the pinger may write for the turn: a `ping` event, after message_start only" — a PERIODIC write, bounded to a single legal frame type because the wire must stay legal, and it exists against the client's 600 s stream watchdog (two 11-12 minute compactions on 2026-09-05 hung at exactly 600 s without it). MgmtRoute is "the body of one authenticated `/mgmt` route, run only AFTER the bearer key matched", and its KDoc says that ordering IS the type's content: everything mutating on the control plane is wrapped in one, so a route responding outside one would be reachable without the management key. A repeating one-frame-only writer and an authorization-gated route body are the two seams whose confusion either breaks the wire or removes the auth gate."""

