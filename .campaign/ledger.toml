spec = '''
`splice desktop` names, for each mode, every Claude Desktop feature that depends on the backend, and whether it works on splice (outcome 6).
`--json` gains `features`, a list of {"name", "mode": "standard"|"app", "state": "works"|"partly"|"unavailable"|"unknown", "reason"}, with a reason (one sentence) on every state but "works". The names, in this order, are: "auto mode", "effort", "context window and compaction", "titles", "subagents", "web search and fetch", "images and files", "MCP", "scheduled tasks", "fast mode", "Remote Control and cloud environments", "claude.ai connectors", "SSH sessions", "usage display". The words print "Features (<mode> mode):" for the mode Desktop is in (standard while off), one line each: "  <name>: <state>[ — <reason>]".
The states known now:
- Auto mode works in both modes: splice reviews Claude Code's auto-mode check on every head, and app mode turns it on (df-app-on).
- Context window and compaction, and subagents, work in both modes (df-app-window; tiers follow the session's head, df-claude-picks).
- Titles work in app mode.
- In app mode, fast mode, Remote Control and cloud environments, and claude.ai connectors are unavailable, because Desktop itself turns them off in third-party mode. The reason names Desktop.
- Effort: "partly" when any head in the door tops out below Desktop's "max" (its vocabulary maps max to a lower rung), with the reason naming those heads and their top rung; "works" otherwise.
- Web search and fetch, and images and files: computed from the heads in the door (which models take images, which heads answer Anthropic's server web tools). They are "partly" with the heads named when only some do.
- MCP and scheduled tasks run on the person's computer and work.
- SSH sessions are unavailable on splice in both modes. The reason: "the door listens on 127.0.0.1 only, which a session on another machine can't reach". Desktop needs a gateway address that isn't localhost for SSH.
- Usage display (Desktop's plan-usage meter, which reads Anthropic's unified rate-limit headers, df-wire-limits), in both modes: "works" when every head in the door reports plan windows (Anthropic's own headers, ChatGPT's 5-hour and weekly windows, any QuotaHeaderFamily). It is "partly" when some do, and "unavailable" when none do. Wherever it isn't "works", the reason names the heads that report none. The live test settles whether app mode's meter reads these headers or Desktop's own cost estimate, and corrects the app-mode row.
- What the app study left open (standard mode's titles, connectors and Remote Control under the switch) is "unknown" until the live test (df-live-run) settles it.
This is a reading of what splice knows. It changes no behaviour. Files: a new app/src/main/kotlin/splice/app/desktop/DesktopFeatures.kt, DesktopService.kt, app/cli/desktop/DesktopSaid.kt. Proof: `bun test ./.campaign/checks/desktop-full/features.test.ts`.

