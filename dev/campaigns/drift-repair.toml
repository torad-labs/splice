[[items]]
id = "DR-1"
phase = "launch"
title = "SessionRegistryLink.migrate is not collision-safe and is silent on every failure path. Files.move without REPLACE_EXISTING throws FileAlreadyExistsException on a PID-filename collision; that extends IOException so runCatchingCancellable swallows it, the loop continues, Files.delete then fails on the non-empty dir (DirectoryNotEmptyException, also swallowed), migrate returns false and link() returns WITHOUT creating the symlink. End state: a partially-emptied head sessions/ dir, a foreign stale entry now sitting in the operator global registry with no cleanup owner, no symlink, and NOTHING logged — and it is unrecoverable by retry because every relaunch re-hits the same collision, so that head stays permanently invisible to cross-head ListAgents (the entire point of 843bc00). If the moved file belonged to a LIVE session, its exit-time unlink targets the local path the file no longer occupies, so peers list a dead session forever. Fix: two-phase migration (probe every target for existence before moving anything, or stage+rollback), a log line on every decline (the call site at ClaudeConfigMaterializer.kt:115-117 wraps the whole thing in runCatchingCancellable with no log), Files.createDirectories(globalSessions) so the feature is not silently inert when the operator has never run plain claude, and a temp-symlink + ATOMIC_MOVE swap to close the window where the head has no sessions/ dir at all. Header comment must stop claiming the refusal path is complete."
files = ["gateway/core/src/main/kotlin/splice/core/launch/SessionRegistryLink.kt"]
status = "verified"
verify = "cd gateway && ./gradlew :core:test --console=plain"
