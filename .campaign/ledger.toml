The window in app mode (outcome 6, the context meter and compaction; repo CLAUDE.md §22). In app mode Desktop launches its Code tab's Claude Code with CLAUDE_CODE_MAX_CONTEXT_TOKENS=200000, and 1M for a model picked as its 1M variant (an id ending `[1m]`). splice writes the counts, so it scales them, the same way the standard-mode door scales to the window it told the store.
