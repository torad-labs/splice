# LAW [2026-07-26]: WALLS-BEFORE-GREEN (#924/#954, ported from qgre law-wall-registry-gate): every item here must name its enforcing wall in dev/campaigns/proxy-hardening/walls/wall_registry.toml. An item with no wall is UNENFORCED DOCUMENTATION and reads RED in `npm run gate:campaign`. A registry row may NEVER be deleted to silence the gate — the fix is BUILDING THE WALL. Birth state 2026-07-26: 83 items, 80 UNWALLED, 3 walled-and-red.
# LAW [2026-07-26]: POLARITY LAW (the red-green proof, mechanized): a wall whose item is todo/in_flight MUST FAIL — a wall that passes while its item is unfinished is VACUOUS and reads RED. A wall whose item is done/verified MUST PASS or the status is a lie. Polarity is checked by RUNNING the wall, never by reading it. You cannot land a wall that was never red, and you cannot mark an item done until its wall flips. Green is EARNED, never protected (#954).
# LAW [2026-07-26]: NEVER LOOSEN A WALL TO GET GREEN (#954 sub-lesson c): a wall's thresholds derive from a committed measurement or a spec, never from a literal in the wall itself — NF-02 reads its ceiling from config/splice.example.toml's own measurement line, so editing the wall alone cannot buy headroom (qgre zero_ratchet NO-SAVED-TRUTH). Fix the SITE; the wall moves only when the measurement it cites is legitimately re-measured.
# LAW [2026-07-26]: gate:campaign is deliberately NOT in `npm run gate` while the worklist is red — no knowingly-red rung lands in the main ladder (qgre's own sequencing rule). It joins the gate when UNWALLED reaches 0.
# LAW [2026-07-26]: MIGRATION ORACLE (bun pattern, captured 2026-07-26 BEFORE server/ is deleted): dev/campaigns/proxy-hardening/oracle/fixtures/ holds both wire directions of the LEGACY Node stack recorded byte-exactly while it was green (104/104). It is a RECORDING, not a spec — it encodes the reference's bugs too. Every replay divergence is classified in dev/campaigns/proxy-hardening/oracle/expectations.toml as not-yet-replayed / kotlin-wrong / sanctioned(+G-number, bytes still pinned). A row NEVER leaves by deletion, only by passing (bun#34441: an unenrolled pass is neither counted nor protected). Capture is byte-stable across runs under ONE declared canonicalization rule (msg_<digits>); widening that rule requires an observed diff, never anticipation.
# LAW [2026-07-26]: LAYOUT — every artifact of this campaign lives under dev/campaigns/proxy-hardening/ (research/ = the provenance document, walls/ = the gate + registry + wall scripts, oracle/ = the frozen migration oracle). ONLY the ledger .toml stays flat in dev/campaigns/, because manifest.py finds sibling ledgers via parent.glob('*.toml') — moving it into the folder would silently kill cross-ledger id-reuse checking and laws aggregation, and any OTHER .toml placed flat there would be mistaken for a ledger. Walls and oracle are campaign-BORN but repo-DURABLE: when a wall goes green it GRADUATES into npm run gate (a green wall that only a campaign runs is not protecting anything — bun#34441).
# LAW [2026-07-26]: POSITIVE CONTROL (2026-07-26 self-review finding #1, PROVEN): polarity alone is NOT enough. A wall that is merely `sys.exit(1)` has honest polarity on a todo item — proven by registering a do-nothing wall, which counted as `walled` and produced ZERO findings. Every wall MUST therefore also pass its own `--selftest`, running its detection against synthetic open-gap AND closed-gap inputs (gate C6). Red-green applied to the walls themselves. This immediately caught three real bugs in the first four walls, including NF-01's 400-char lookbehind counting a nearby constant DECLARATION as the clamp being APPLIED.
# LAW [2026-07-26]: SEVERITY IS SPLIT (finding #2): BLOCKING = C1/C2/C3/C5/C6/C9/C10 — a lying wall, a lying status, a broken law, or two in_flight items writing one file are never acceptable and now run inside `npm run gate`. ADVISORY = C4 unwalled / C7 provisional fence overlap / C8 unlawed — the standing worklist, reported without failing. Lumping them kept the whole gate OUT of the ladder, so nothing ran it and a false-green could sit forever. `--strict` fails on advisory too (the end state).
# LAW [2026-07-26]: LAW ENFORCERS HAVE INVERSE POLARITY (finding #3): an ITEM wall must FAIL while its item is unfinished; a LAW enforcer must PASS today, because the law is supposed to hold right now — red means the law was BROKEN (gate C9). Mixing the two is a category error that cost a false C9 at authoring (MIGRATION-ORACLE was mapped to CX-19's item wall). law_registry.toml is the census: wall = '' reads RED-UNWALLED, and a row may NEVER be deleted to silence the gate.
# LAW [2026-07-26]: CENSUS MODES CANNOT FAKE A PASS (findings #9/#10): `--no-run` skips C5/C6 and therefore exits 2 BY CONSTRUCTION, never 0, so it cannot be wired into CI and mistaken for a passing polarity run. The ledger parser cross-checks its item count against the raw TOML and REFUSES to run on disagreement rather than emit confident wrong verdicts.
# LAW [2026-07-26]: FAIL-CLOSED BUDGET (review finding #8): wall execution shares a total budget (900s) on top of the per-wall timeout (120s). If it is exhausted, unrun walls raise C11 UNVERIFIED and BLOCK — an unrun wall has UNKNOWN polarity and must never be reported as a pass. Timing out into green is the exact shape of fake-green this whole gate exists to prevent.
