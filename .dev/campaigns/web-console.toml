# [2026-09-18] DECISIONS worth the record. (1) Discovery is LAZY, not eager: an eager glob pulls every page into the boot module graph, so one page momentarily broken in the shared worktree takes the whole console down — it broke my own suite at 01:45 when M2-02's pages/sessions/index.tsx imported a CSS file that did not exist yet. Lazily the cost is that route only, and each lazy component is built once and cached so a page never remounts. (2) The nearest-window cell is built from the two routes the row names, and it has to be: ProviderAuth carries account_id_masked/login but NO window, Us-agePayload carries warn{pct,source,reset} + window_hours but no account, so head+account+window+pct is exactly usage+auth (pages/auth/index.tsx:17 keys AuthPayload by head). A head whose warn.source is 'none' is not a candidate — an absence cannot be nearest to exhaustion. (3) daemon health: shared/api/index.ts:95-100 ControlStatusPayload carries no health field, so red/green come from the status resource's own error/payload and amber comes from /api/heads' HeadStatus.running/healthy (shared/api/index.ts:128-145) — the daemon's own verdict, not a guess.
# [2026-09-18] GREEN under the amended law. tsc: the only remaining errors are in src/pages/projects/index.tsx (M2-02, mid-write), outside my fence, and that file list is the proof the law asks for. eslint 0 after the eslint.config.mjs:48 remedy, vitest 39/39 across router.test.ts and views.test.ts, ast-grep 0, detect 0 on all five fence dirs, and a full vite build produced the single inlined 549 kB artifact, so the shell bundles.
# [2026-09-18] SURFACES CHOSEN INSIDE THE TITLE. Type rungs: wordmark at --text-6 (22px, comp measured 23) and clocks/window/count at --text-5 (18px, comp measured 17), the ladder's nearest steps, since a font size may only come from --text-N. The rule is 5.8vh and the rail 9vw, the scaffold's own percent-of-frame basis so the hero diff aligns at any capture size, with px floors (rule 56, rail 118) so a short window cannot crush the cells. The window cell prints the reset time after the pct when the route reports one: the row's format is head, account, window, pct%, and the comp's nearest-window region carries the reset, so the row's field order ships and the comp's extra datum ships with it. The count cell renders nothing until the usage route answers: an absent count is not zero.
