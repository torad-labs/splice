# [2026-09-18] 2026-09-18 ITEM 2, AND THE ONE PLACE IT COULD NOT FOLLOW THE CONTRACT LITERALLY: CONTRACTS.md section 6 says entity stores subscribe and refetch. They cannot: the boundaries wall denies entities-api -> entities, so an entity may not import the events slice, and the events slice may not import the entities either. I probed it before designing around it (a throwaway import in entities/heads/api; eslint: 'no policy allowing dependencies from entities-api slice=heads to entities slice=events'), then reverted the probe. So each entity DECLARES its kinds beside its store (entities/<x>/model/live.ts: LIVE_KINDS) and widgets/rule/wire.ts is where the bus meets them, in the one in-fence layer that can see both - the same file that already calls connect(). The wiring TABLE is exported (LIVE_BINDINGS) so a test reads it rather than a doc. If a row owns src/app later, that is the more usual home for composing six slices; flagged rather than left as a surprise.
# [2026-09-18] 2026-09-18 WIRING TABLE (each row = the slice, its kinds, and the read that brings it current): heads on head.state + turn.end -> fetchHeads; usage on head.state + turn.end -> fetchUsage; perf on turn.start + turn.end -> fetchPerfTurns; session on session.change + message.edge -> fetchSessions; account on account.switch -> fetchAccounts; auth on account.switch -> fetchAuth. Two judgement calls: perf refetches the TURNS store and leaves the windowed summary on its own 15 s cadence (the summary is an aggregate over a window the events do not name); and session refetches the REGISTRY on message.edge, not a per-session edge read, because an edge frame means a session rewrote its own registration and the per-session edges are read when a session is opened. Neither is a new route and neither parses a frame payload: an event says what happened, and the console still reads the truth from the route that owns it.
# [2026-09-18] 2026-09-18 TEST: webui/tests/live.test.ts, 11 tests. Each entity's declared kinds are pinned (a slice that forgets them goes quietly stale, which looks exactly like a quiet daemon), the wiring table is checked against the six kinds the daemon can send in both directions (every kind is one the daemon can send; every kind has a follower), and each kind is fed through the REAL bus with fetch stubbed to assert exactly which routes are read: turn.end -> heads, usage, turns; turn.start -> turns only; head.state -> heads and usage, NOT turns; session.change and message.edge -> the registry; account.switch -> accounts and auth; an unknown kind -> nothing. Plus wireLive idempotence (wiring twice does not double the reads) and its unsubscribe. verify: tsc clean tree-wide, eslint clean on the fence and on src/entities, vitest 46 across the five files including both walls, ast-grep and detect.mjs clean.
