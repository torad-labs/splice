<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounts · splice</title>
<link rel="stylesheet" href="console.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="mark">splice</div>
    <!-- A LINK IS HERE ONLY ONCE ITS PAGE IS (Marlin, Oct 10, 2026). 0.4.0 ships eight pages and
         Accounts is the first of them; until each of the others lands, its link is not in this nav,
         because the control plane serves what is packaged under console/ and nothing else can
         resolve: builder2's walk of the installed build found seven of eight leading to a 404 with
         an empty body, and a first-time reader cannot tell a dead link from a slow one. Each link
         comes back in the commit that brings its page. The order they land in: Sessions, Teams,
         Requests, Usage, Models, Compare models, Settings.

         WITH ONE PAGE THE NAV DRAWS NOTHING (hitstop, Oct 10): a lone link repeats the page's own
         title, and a single selected box reads as a strip with its other tabs torn off. The column
         keeps its width, its wordmark and its theme toggle, so nothing moves when the links return.
         The second page to land brings both links back in the normal selected style. -->

    <div class="foot">
      <button class="icon" data-act="theme" aria-label="Day or night">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </aside>
  <main class="page">
    <header class="head">
      <h1>Accounts</h1>
      <div class="read">
        <button class="act quiet small" data-act="probe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>Read again
        </button>
      </div>
    </header>
    <section class="board" id="board" aria-live="polite"></section>
  </main>
</div>
<script src="api.js"></script>
<script src="accounts.js"></script>
</body>
</html>
