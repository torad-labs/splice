A person whose team provider does not work can see why without reading logs (issue #680, outcome 13).

After this item:
- `splice claude --json` gains `heads`: one entry per head the door knows (listed or left out), each `{head, command, provider, listed, reason?, credential?, last_error?}`. `listed` says whether its models are in /model and `reason` why not (the same reason as left_out). `credential` is present for a provider on command auth: `{state: "held" | "none" | "failed", expires_at?, error?}` (the feature's credential states: held with expires_at RFC 3339 UTC when the key has one; failed with error, the credential command's own words). `last_error` is the last error the provider answered a turn with, `{at (RFC 3339), status, message}` (the provider's message as shown to the session), kept until a newer error replaces it, so it survives the retry that worked.
- `splice claude` (text) says the same in one line per head: e.g. `acme  claude-acme  provider acme  listed  signed in until 21:40  last error 503 at 20:12: GLM-5.3-Flash is loading.`, times in local time, and for a failed credential the command's own words.
- `splice doctor` has one check per provider on command auth, in its accounts section: signed in (until when), not signed in (`run splice login <head>, or /login in a claude session`), or failed (the command's own words and `splice login <head>`). Under it, in short, the same two things `splice claude` says of that provider's heads (outcome 13 asks both commands for them): `  in /model` or `  left out of /model: <reason>`, and `  last error <status> at <local time>: <message>` when there is one. `splice doctor --json` carries them as `heads` entries of `splice claude --json`'s shape.
- Every row of /api/perf/turns carries `provider`: the provider key of the head that ran the turn, on a head's port and through the door alike.

