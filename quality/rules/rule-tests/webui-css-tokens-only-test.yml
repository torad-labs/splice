id: webui-css-tokens-only
valid:
  - '.myx-panel { padding: var(--space-2); gap: var(--space-3); margin: 0; }'
  - '.myx-divider { border-width: 1px; }'
  - '.myx-panel { padding-inline-start: var(--space-2); margin-block-end: var(--space-3); }'
  - '.myx-bay { top: 8.599%; left: 2.5%; }'
  - '.myx-panel { margin: calc(-1 * var(--space-5)); inset: 0; }'
invalid:
  - '.myx-panel { margin: 0.5rem; }'
  - '.myx-panel { padding: calc(var(--space-1) + 2px); }'
  - '.myx-panel { gap: 4px 8px; }'
  - '.myx-panel { padding-inline-start: 8px; }'
  - '.myx-panel { margin-block-end: 1.5rem; }'
  - '.myx-panel { gap: 10PX; }'
  - '.myx-panel { margin-bottom: 7vh; }'
  - '.myx-panel { column-gap: 0.5cqw; }'
  - '.myx-panel { padding-inline-start: calc(var(--space-4) + 8ch); }'
  - '.myx-panel { gap: min(var(--space-6), 2.4vh); }'
