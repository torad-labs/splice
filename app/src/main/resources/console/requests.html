<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests · splice</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/splice-app-256.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="sessions.css">
<link rel="stylesheet" href="reqview.css">
<link rel="stylesheet" href="requests.css">
<link rel="stylesheet" href="composer.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="mark"><img class="lockup night" src="brand/splice-horizontal-night.svg" alt="splice" width="380" height="128"><img class="lockup day" src="brand/splice-horizontal-day.svg" alt="splice" width="380" height="128"></div>
    <!-- The nav is drawn by kit.js from its one PAGES list: which pages exist, in which order, and the
         rule that a link appears only with its page (Marlin) and that one page draws no nav (hitstop). -->

    <div class="foot">
      <button class="icon" data-act="theme" aria-label="Day or night">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </aside>
  <main class="page">
    <header class="head">
      <h1>Requests</h1>
      <div class="tools">
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg><input class="field" id="q" placeholder="Search" aria-label="Search requests" autocomplete="off"><button class="clr" type="button" data-clears aria-label="Clear the search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></label>
      </div>
    </header>
    <div class="pickline" id="pickline"></div>
    <div class="filters-row" id="filters"></div>
    <div class="rqband-row" id="band"></div>
    <div class="requests" id="requests" aria-live="polite"></div>
  </main>
</div>
<script src="kit.js"></script>
<script src="api.js"></script>
<script src="reqview.js"></script>
<script src="knobs.js"></script>
<script src="perf-heads.js"></script>
<script src="console.js"></script>
<script src="composer.js"></script>
<script src="pilot.js"></script>
<script src="requests.js"></script>
</body>
</html>
