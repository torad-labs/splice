# [2026-09-13] [2026-09-13] REVIEW 1 CORRECTION (splice-astra): the preceding REVIEW 1 note was shell-mangled where backtick spans were interpreted; this note is the complete authoritative verdict. Exact row gate PASS with no output: cd gateway && buildgate ./gradlew --offline :app:test --tests "*AddCommand*" -q. Verdict: UNACCEPTABLE. Finding 1 (contract/correctness): AddChecks.listedModels returns null for every openai-chat /models failure (non-200, malformed JSON, or no response), and modelsListed treats null as success with no model list and rows trusted. Concrete case: base URL GET answers 200 but GET /models answers 404; reachability passes, model validation passes, and an unlisted model is saved even though openai-chat is exactly the dialect with a model list. Finding 2 (contract/auth): AddChecks.credential delegates to LoginIo.credentialConfigured, which checks only file, environment, or KeyStore presence; any existing OAuth file, including empty or expired token material, bypasses sign-in and passes the required credential-present-and-unexpired check. Finding 3 (operator promise): AddChecks.liveTurn returns ok=true with skipped for every non-openai-chat profile, so explicit splice add codex, grok, kimi, or claude with --live performs no live turn and still saves; the row promises one optional live turn rather than a no-op flag. Additional confirmed routing defect: AddPrepare.keyProblem compares the existing nullable claude.command to an empty string rather than using the effective command (claude.command or head key), so a new explicit command can collide with an existing head whose command is omitted, despite Topology.resolveHeadKeys treating that head key as its command. The four-test exact gate covers api-key success and failure plus codex login only; it cannot detect these cases or establish all five profile paths. Fix-forward requires fail-closed model-list outcomes distinct from dialect-without-list, a provider-aware usable and unexpired credential check, honest --live behavior or explicit refusal for unsupported profiles, and effective-command collision coverage.
