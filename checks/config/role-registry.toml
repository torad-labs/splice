reason = """OutputClamp clamps a turn's output-token figure to what the client asked for, because a client that sees `output > max_tokens` mis-draws its context bar. Its KDoc is itself a record of this wall's doctrine working: OutputClampPolicy.makeOutputClamp and TurnPipeline.clampOutput "were two declarations of the same `(Long) -> Long` with no type in common… so this is ONE role and now one type." SynthesizeExpiry derives a credential expiry for a provider whose token response omitted one, in that provider's own module. A token count and an epoch millisecond, both Long — the widest unit confusion available, and one the perf plane and the auth plane would each accept in silence. SynthesizeExpiry is declared once per vendor (codex at CodexAuthJson.kt:31, kimi at KimiRefreshedTokens.kt:42) under the 2026-09-15 SEPARATION law, which is why one name appears at two paths; the registry reports same-name declarations rather than grading them, for that reason."""

