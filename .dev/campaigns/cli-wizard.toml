# [2026-09-15] SLOT — complete design, zero design freedom. Depends on CW-1 landing (TerminalMode bracket plus KeyReader). (1) Internal class SelectPrompt taking the KeyReader seam, a TerminalMode, and an injected Appendable. One public member: ask(question, options, initialIndex) returning a sealed outcome class with Chosen carrying the value and Cancelled. Options are a data class of value, label and an optional hint. (2) Render: the question line in CliStyle BOLD, then one line per option. Cursor row = CYAN pointer glyph U+276F, then the label in normal weight, then two spaces and the hint in DIM. Non-cursor rows = two leading spaces, label in DIM, hint in DIM. This matches the torad init idiom where the preset select carries counts in its hints, which the study called out as the reason the choice is made on numbers not adjectives. (3) Navigation inside the TerminalMode raw bracket: Up and Down move the cursor with WRAPAROUND at both ends, Enter returns Chosen, Escape and CtrlC return Cancelled. (4) REDRAW CONTRACT, the thing that makes it feel native: after the first paint, each keystroke rewinds EXACTLY the number of lines previously drawn using CSI A (cursor up) once per line plus CSI 2 K (erase line), then repaints. Scrollback must hold ONE final rendered state, not one copy per keystroke. Test this by asserting the emitted string contains exactly as many cursor-up sequences as lines drawn, per repaint. (5) Non-TTY: emit nothing interactive, return Chosen with the option at initialIndex, and assert the output carries no escape character.
