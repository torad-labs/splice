ne entry, and provider references become ambiguous; account-N aliases have the same collision with a real account-N label. Test unsafe+safe collisions and allocate aliases from a reserved/non-token namespace or skip every occupied safe name. Fixes verified: unsafe topology prose fields are otherwise omitted; unsafe single keys consistently alias across topology/accounts/perf; foreign paths and FileSystemException paths are redacted; log errors are separate typed metadata and logs remains <=500; the exact perf type/field allowlist, strict option parser, fences, JSON parsing and failing-check verdict remain green.
