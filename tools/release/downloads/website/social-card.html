<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/console/tokens.css">
<link rel="stylesheet" href="/console/console.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: var(--wall); color: var(--text); font-family: var(--font-name); }
  .ground { position: absolute; inset: 0; background-image: radial-gradient(circle at center, color-mix(in oklab, var(--text) 16%, transparent) 1px, transparent 1.7px); background-size: 24px 24px; background-position: 12px 12px; }
  .glow { position: absolute; inset: 0; background: radial-gradient(60% 80% at 92% 8%, var(--shaft), transparent 70%); }
  .copy { position: absolute; left: 64px; top: 56px; width: 600px; }
  .mark { height: 40px; display: block; }
  h1 { margin: 44px 0 0; font: 600 62px/1.02 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -.045em; color: var(--text); }
  p.lead { margin: 22px 0 0; font: 400 25px/1.35 var(--font-name); color: var(--text-body); max-width: 30em; }
  p.url { position: absolute; left: 64px; bottom: 52px; margin: 0; font: 500 21px/1 var(--font-data); color: var(--text-body); }
  .stack { position: absolute; right: 64px; top: 60px; width: 420px; display: grid; gap: 22px; }
  .win { position: relative; background: var(--obj); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 7px 7px 0 var(--c); padding: 16px 18px 17px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid var(--ink); }
  .cmd { font: 600 19px/1 var(--font-data); color: var(--text); }
  .model { font: 500 16px/1 var(--font-data); color: var(--text-body); }
  .m { grid-column: 1 / -1; margin-top: 13px; height: 8px; border-radius: 4px; background: color-mix(in oklab, var(--text) 12%, transparent); overflow: hidden; }
  .m > i { display: block; height: 100%; width: var(--w); background: var(--c); }
</style>
</head>
<body>
  <div class="ground"></div><div class="glow"></div>
  <div class="copy">
    <img class="mark" src="/console/brand/splice-horizontal-night.svg" alt="splice">
    <h1>Use all your AI plans in Claude Code.</h1>
    <p class="lead">Switch between ChatGPT, Grok, Kimi, Muse, API keys, OpenRouter and your own GPU.</p>
  </div>
  <p class="url">github.com/torad-labs/splice</p>
  <div class="stack">
    <div class="win" style="--c:var(--claude);--w:38%"><i class="dot"></i><b class="cmd">claude-splice</b><span class="model">opus-5.5</span><span class="m"><i></i></span></div>
    <div class="win" style="--c:var(--gpt);--w:61%"><i class="dot"></i><b class="cmd">claudex</b><span class="model">gpt-6-sol</span><span class="m"><i></i></span></div>
    <div class="win" style="--c:var(--grok);--w:24%"><i class="dot"></i><b class="cmd">claude-grok</b><span class="model">grok-4.7</span><span class="m"><i></i></span></div>
    <div class="win" style="--c:var(--kimi);--w:47%"><i class="dot"></i><b class="cmd">claude-kimi</b><span class="model">kimi-k3</span><span class="m"><i></i></span></div>
    <div class="win" style="--c:var(--muse);--w:15%"><i class="dot"></i><b class="cmd">claude-muse</b><span class="model">muse-spark-1.3</span><span class="m"><i></i></span></div>
  </div>
</body>
</html>
