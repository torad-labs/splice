e dir, file:// release built from the same jar + bin/splice-launch, pristine 0.3.1 seeded, live shim carrying a simulated hostshield line): upgrade --now staged releases/0.3.2, live jar -> releases/0.3.2/splice.jar, wrapper KEPT with the one-line diff, current=0.3.2 previous=0.3.1, version prints 0.3.2; tampered sha256sums -> refused, 0.3.2 stays active, no staging dir; --rollback --now -> live jar -> releases/0.3.1/splice.jar, current=0.3.1 previous=0.3.2, wrapper still kept; config+credential hash identical before/after all three runs. The real splice.service was untouched (NRestarts 0, health 200): the unit check named a different jar, and the verb's cold start in the isolated home lost the lock to the real daemon (a test-home artefact of -Duser.home not reaching the spawned child; the acceptance is the layout, not the restart). Not live-tested: a remote https base (gh is not authenticated on this machine; the refusal path is unit-tested).
