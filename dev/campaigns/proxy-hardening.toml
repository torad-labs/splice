title = "An edited `splice.toml` is silently inert || PROBLEM: Topology is read once at daemon start and is explicitly not hot-reloadable. The launch shim only replaces a running daemon on a `GATEWAY_VERSION` mismatch, so after an operator edits splice.toml (adds a head, changes a port, changes `pinned_model`) and relaunches `claudex`, the still-running old daemon serves the old topology with **zero signal**. Nothing compares the file on disk against what the daemon booted with — not the shim, not doctor, not the dashboard. This is the classic 'I changed the config and nothing happened' dead end, and the only recovery is knowing that `splice restart` exists and is required. || SPLICE TODAY: `gateway/app/src/main/kotlin/splice/app/TopologyLoader.kt:3-4` ('Loaded ONCE at daemon start … (no hot topology)') and `:56-62`. `bin/splice-launch:104` replaces the daemon only on `[ '$RUNNING_VERSION' != '$SPLICE_GATEWAY_VERSION' ]`. `gateway/control/src/main/kotlin/splice/control/ControlServer.kt:392-404` (`controlHealthJson`) carries version/heads counts but no config identity. `DoctorCommand.kt:96-126` parses the file fresh and never compares it to the running daemon. (The adjacent thing that *does* exist is restart-required tracking for runtime **knobs** — `webui/src/shared/api/index.ts:152,164`, … || PROPOSAL: The daemon computes a `topologyDigest` (sha-256 of the exact bytes it parsed, plus the resolved config path) at boot and publishes both on `/health` next to `wantShimVersion`. `bin/splice-launch` recomputes the digest with the same `python3` it already uses and prints a non-fatal WARNING (same shape as the shim-staleness warning at `:149-154`) when it differs, naming `splice restart`. `splice doctor` adds a configuration-section row: OK when digests match, WARN with fix `splice restart` when they differ, INFO when the daemon is stopped. The dashboard config page shows the same mismatch banner. **Deliberately no hot-reload** — the locked 'no hot topology' decision stands; this only makes the required restart visible. || EFFORT/RISK: M. **Risk** Digesting on the shim's hot path adds a file read + hash per launch (negligible against the existing curl round-trips) but must fail **open** — an u || VERIFY-SPEC: `gateway/control/src/test/kotlin/ControlServerTest.kt`: assert `/health` carries `topologyDigest` + `configPath`. New `DoctorCommand` test: stub `/health` with a mismatched digest, assert the WARN row and the `splice restart` fix. Shim-side branch covered in `checks/release/launcher-test.sh`. Gate: `npm run gate`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### JW-04'"
