guard = false
spec = '''
A model's `max_output_tokens` (cp-schema) is the most it is asked to write (issue #680, outcome 9). Claude Code asks a model it does not know for 32,000 output tokens or more, which a self-hosted model serving less refuses outright.

After this item, a turn on a model that declares max_output_tokens asks its provider for min(what the turn asked, max_output_tokens), in whichever field the dialect uses (quirks.maxTokensField: max_tokens or max_completion_tokens), on the head's own port and on the door alike. A turn that asks for less asks for what it asked. A turn that names no max_tokens asks for max_output_tokens. A model that declares none is asked for what the turn asked, as today. The effort and thinking mapping is unchanged (cp-parity holds it).

Where: the request assembler of each dialect that writes max tokens (ChatRequestAssembler / ChatRequestBuilder for openai-chat, and the Responses and passthrough assemblers where they write one), reading ModelEntry.maxOutputTokens. Tests check what the provider is sent.

Proven by: bun test ./.campaign/checks/custom/output.test.ts — a door turn asking 32000 on a model with max_output_tokens = 8192 asks the gateway for 8192; one asking 4000 asks 4000; a model with none is asked 32000.'''
