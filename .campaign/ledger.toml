- `start [--width W] [--height H] [--theme night|day] [--live] <url>`: starts a private X display of its own (Xvfb on a free display number, never `$DISPLAY`), and on it Chrome (`google-chrome`, or `$CONSOLE_LOOK_BROWSER`) with a throwaway profile under /tmp, a window of exactly W×H (default 1440×900; 3840×2160 for the wide check), and a DevTools port of its own; opens <url>; prints one JSON line `{"id": "...", "display": ":N"}` last and exits 0, leaving the display and browser running. The theme is set the way the console saves it (localStorage `splice-console-theme`) before the page loads.
- `shot <id> <file.png>`: a screenshot of the whole display, taken from the display itself (ffmpeg x11grab), W×H pixels.
- `click <id> <x> <y>`, `move <id> <x> <y>`, `scroll <id> <dy>`, `key <id> <keys>`, `type <id> <text>`: pointer and key input to that display (xdotool with its DISPLAY), as a person would.
- `goto <id> <url>`, `text <id> [css]`: navigate; print the innerText of the selector (default body), read over DevTools, a complement to looking, never instead of it.
- `--live` (for the live Splice): every request the page makes that is not GET or HEAD is refused before it leaves the browser (DevTools Fetch interception), except POST /api/console/key (the sign-in trade); GET /api/console/pilot/next is answered 204 without being sent, so the live Splice never hands the review tab an agent's order. `blocked <id>` prints each refused request as `<METHOD> <path>`, one a line.
- `sign-in <id>`: signs that tab in to the live console without the tool ever holding the management key: it runs `splice console --no-browser`, reads the single-use code from the launch page it prints, and opens the tab's own origin at `/#c=<code>`.
- `serve --console <dir> [--daemon http://127.0.0.1:3096]`: serves a checkout's console folder on a port of its own and forwards only GET/HEAD /api/* to the daemon (any other method answers 405 there and is never forwarded), so this build's pages can be read on live data without touching the running Splice; prints its URL. Use with `start --live`.
- `stop <id>`: closes the browser and the display and removes the profile; a crashed or forgotten session is reaped by the next `start`.
- Screenshots meant for judging go to captures/console-night-deck/<item>/ by convention (git-ignored); the tool never writes into the repo otherwise.
- A README.md in the folder says how a review uses it: serve the build, start --live at 1440×900 and 3840×2160, sign in, shot, use, read the images; writes only on tools/console-own's Splice.

Proven by: `bun test ./.campaign/checks/console-night-deck/look.test.ts` (it runs the tool with Bun.spawn and awaits it, since its stub daemon answers on the test's own thread, and gives each test its own stub; decided Nov 19, 2026 after the round-2 dispute): a stub page opened at 3840×2160 is shot as a 3840×2160 PNG and its text read; with --live, the page's GET reaches the stub and its POST and PATCH do not, and `blocked` lists both.

Judged: the feature review runs the tool against the stub probe page and against the live console (read-only) and reads the screenshots it took.'''
