[[items]]
id = "DR-14"
phase = "ws"
title = "ResponsesWsSession.chains (line 60) is bounded at 256 CONVERSATIONS with no byte cap and no TTL, while each Chain retains the entire conversation history plus the full tool surface as strings. Chain.input is input.map{it.toString()} — the whole logical input array — and Chain.props is the whole request minus input, i.e. every tool schema, serialized. This file own header sizes that at roughly 177k tokens / 480KB per conversation, so 256 entries is about 120 MB retained on the ~1 GB heap that BufferCapacity header says is shared by codex plus grok plus kimi, and per-conversation size is itself unbounded (a 1M-context conversation multiplies it). The TTL gap bites harder than the byte gap: eviction is COUNT-driven only, and a head talks to a handful of live sessions, so with fewer than 256 keys nothing is ever evicted and every conversation full history stays pinned for the daemon lifetime — this file documents a daemon that had been up 91 hours. cleared() and completed() remove and re-insert the key; they never expire it. The sibling ReasoningCache, hardened in the same era, has all three: a count bound, a 64MB byte cap, a 30-minute idle sweep, and an eviction log line. Fix: add a total-bytes accumulator over input+props with a cap, and an idle-timestamp sweep in frameAndEpoch/completed — ReasoningCache.sweepLocked is the shape, and epochOf absent-key fallback already makes eviction safe. The epoch protocol itself was probed and is SOUND (cleared re-inserts at the LRU tail so the most-recently-stamped key is never the eviction victim); this is a memory finding only."
files = ["gateway/dialect-openai-responses/src/main/kotlin/splice/dialect/responses/ResponsesWsSession.kt", "gateway/dialect-openai-responses/src/test/kotlin/ResponsesWsSessionTest.kt"]
status = "todo"
verify = "cd gateway && ./gradlew :dialect-openai-responses:test --console=plain"

[[items]]
id = "DR-15"
phase = "responses"
title = "SharedSummaryParts.trimToLast (Turn.kt:100-105) evicts by VALUE across all keys, so trimming one aged copy of a part revokes a dedup record still in force for a different item — silently re-enabling the duplication the mechanism exists to kill. emittedParts legitimately holds duplicates: when an item recap cursor is RECAP_DONE, markEmitted(oi, part) appends a second copy of a part already recorded under a different oi, which is the documented 2026-07-20 coincidence behaviour. trimToLast then drops emittedParts[0] and does itemEmitted.values.forEach { it.remove(dropped) }, stripping that string from EVERY item set including items whose own copy is still present in the list. Concrete: a multi-day session on one conversation key; ConversationSummaryParts.forConversation trims to 512 on every fetch and the file header records a live session that reached about 1600 parts, so trimming is the steady state rather than an edge; once a coincidentally-shared paragraph oldest copy ages out, the still-live item set no longer knows it emitted that paragraph, the next reasoning_summary_text.done restating it passes markEmitted as fresh, and the duplicate paragraph reaches the client thinking block — the exact user-visible symptom this whole subsystem was built to eliminate. The state also grows, since a third copy is appended. Fix: reference-count parts, or condition the itemEmitted removal on the dropped part no longer being present in emittedParts. Land with DR-5, which owns the other half of this file bounding story."
files = ["gateway/core/src/main/kotlin/splice/core/turn/Turn.kt", "gateway/core/src/test/kotlin/TurnTest.kt", "gateway/dialect-openai-responses/src/test/kotlin/SummaryDedupCrossTurnTest.kt"]
status = "todo"
verify = "cd gateway && ./gradlew :core:test :dialect-openai-responses:test --console=plain"

[[items]]
id = "DR-16"
phase = "ws"
title = "InboxListener.assembly (line 27, appended at line 42) is the WebSocket fragment-reassembly buffer and has NO cap at all — the one accumulation surface the shared runaway guard structurally cannot cover. assembly.append(data) grows on every onText and is reset only inside if(last). spi/BufferCapacity exists for exactly this threat and names the consequence: an upstream streaming deltas forever without a terminal event does not fail a turn, it OOMs the ~1G heap and takes codex plus grok plus kimi down simultaneously. But BufferCapacity.over(...) is evaluated in the TRANSLATOR, which only ever sees COMPLETE events pulled off the inbox — a message that never sets last=true never produces an event, so no cap is ever consulted, and the bounded Channel(INBOX_CAPACITY) does not help for the same reason. The watchdog does eventually bound it (WsRoundStream.finishRound -> pool.failRound -> conn.kill() -> socket.abort()) but the turn coroutine is parked in receiveCatching receiving nothing, so it is the 180s IDLE timer that must expire — 180 seconds of unbounded StringBuilder growth on a heap shared by every head. Requires a misbehaving or hostile upstream, which is precisely the threat model BufferCapacity was written for. Fix: check assembly.length against BufferCapacity.MAX_BUFFERED_CHARS after each append and route over-cap to the existing onAnomaly(), which already kills the connection and falls back to SSE — status quo, no new failure mode, so NEVER-BELOW-STATUS-QUO is satisfied by construction. This file is the one 71c0849 just touched; the fix sits three lines from the poisoning change."
files = ["gateway/dialect-openai-responses/src/main/kotlin/splice/dialect/responses/InboxListener.kt", "gateway/provider-spi/src/main/kotlin/splice/spi/BufferCapacity.kt", "gateway/dialect-openai-responses/src/test/kotlin/WsUpstreamTest.kt"]
status = "todo"
verify = "cd gateway && ./gradlew :dialect-openai-responses:test --console=plain"
# [2026-08-27] DEPLOY PAIRING (orchestrator, 2026-08-27): commit 71c0849 (InboxListener poisons the pooled connection on onClose/onError) is COMMITTED AND PUSHED BUT NOT DEPLOYED — the jar is built and hashed bb14490014eca1b2, but a 50-minute watcher never found a 3-minute quiet window to restart the daemon in, and the operator holds the deploy decision because a restart cancels other sessions' in-flight turns and wipes the reasoning cache. DR-16's fix (cap InboxListener.assembly against BufferCapacity.MAX_BUFFERED_CHARS and route over-cap to onAnomaly) lands in THE SAME FILE, three lines away, so it should ride the SAME restart rather than buying a second one. Live rate while parked: 69 stale sends in the current daemon.log, 8 of them after the fix was committed, all benign (round rides SSE, no failed turn) — which is the argument for batching rather than rushing the restart. Whoever takes DR-16 must rebase onto 71c0849 first and re-read InboxListener.onClose/onError, since that commit changed both callbacks.
# [2026-08-27] POST-DEPLOY EVIDENCE for 71c0849 (orchestrator, 2026-08-27 02:14, PRELIMINARY — N=3 ws rounds in 22 minutes, far too small for a rate claim). The fix is LIVE and firing: jar bb14490014eca1b2 deployed at 01:52, and both new diagnostics appear. Two poisonings observed, and they split into the two DIFFERENT mechanisms the commit message predicted. (1) 02:14:19 status=1006 (abnormal closure, no close frame) fired STANDALONE with no accompanying send failure — this is the fix working exactly as designed: a dead socket poisoned proactively so no later round is handed the corpse. (2) 02:13:58 status=1011 fired in the SAME SECOND as a send failure on ws-7e15559a, poisoning line first. That socket connected at 01:55:05 and had been idle 18m53s with no intervening round, so the server had almost certainly dropped it silently long before; the send is what SURFACED the close, and the JDK delivered onClose as part of the failure. The poisoning was a consequence of the failed send, not a preventive of it — i.e. exactly the silent-drop half the commit message said this change could not cover. CONCLUSION SO FAR: close-poisoning removes the reuse-after-observed-close case but not the idle-silent-drop case, and the idle case may be the dominant one. The residual fix is a KEEPALIVE PING (or a pre-send liveness probe) on idle pooled sockets, not a further liveness flag — no flag can know about a close the peer never announced. Do NOT open that as an item on this evidence; re-measure over a multi-hour window with real ws traffic first, counting standalone poisonings vs poison-with-simultaneous-send-failure. That ratio IS the metric.
# [2026-08-27] METRIC SHARPENING (orchestrator, 2026-08-27 02:45, N=3 poisonings over 50 min of now-heavy ws traffic — still preliminary but a clean pattern). The close STATUS CODE predicts which mechanism fired, 3/3 so far: status=1011 (server terminating on an unexpected condition) has BOTH times coincided with a send failure in the same second, poisoning line first — the send is what surfaced a socket the server had already abandoned, so the fix cannot prevent these; status=1006 (abnormal closure, no close frame) fired STANDALONE with no send failure — the fix working proactively. Both 1011 cases followed a multi-minute IDLE gap on the key: ws-7e15559a connected 01:55:05 and failed at 02:13:58 (18m53s idle), then last chained 02:32:23 and failed at 02:42:11 (9m48s idle). If that correlation holds at larger N the residual work is precisely scoped: a keepalive ping on sockets idle beyond ~8 minutes, which is cheaper than a pre-send probe and targets the only case left. SEPARATE OBSERVATION, not investigated, do not act on it without evidence: key ws-9dfcfb60 registered four generations (5,6,7,8) in 3.5 minutes and logged 12 'busy — concurrent round rides SSE' lines in the same window. Everything degraded correctly to SSE and no turn failed, but that is more connection churn than the one-socket-per-key model implies, and nothing in the log explains what retired generations 5-7. Worth a look ONLY if it recurs at scale.
