cture be7sdt8uj exit 0: rules47/0, concentration HIGH0, whitespace clean. BEHAVIOR SPEC / accepted minors: clamp notice wording changes on one-account heads too; an unfitting min(post,turn) backoff in a later non-pooled round now gives up with one call where origin/main made three; admission t0 charges queue time unlike watchdog startedAt. Public arm/markUnavailable and single-caller armAt remain minor API debt; lexicographic suffix preference, existing uncapped portable head-key length, default pool-dir umask and extreme-clock local-add behavior remain stated nits, not hidden new guarantees. No commits, pushes, stash actions, settings edits, gate weakening, peer-owned hunks, or verified-status claim.
