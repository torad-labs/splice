# [2026-08-15] ADVERSARIAL REVIEW (operator-requested, pre-merge): feature-dev code-reviewer found NOTHING at confidence>=80 after probing the auth bypass, header precedence, quirks inversion vs the goldens, ktoml quoting and the architecture laws. The silent-failure hunter found REAL defects the code review missed — all in OPERATOR-FACING surfaces that branch on auth kind, which the campaign wired into the daemon's three decision points but not into the CLIs. FIXED PRE-MERGE, each verified against the code first and pinned by a test: (1) CRITICAL — SignInPlan returned a non-blank 'claude-max login' for the client kind, which makes LoginInterception.wire PLANT splice's own /login + prompt hook into the head's config dir, whose flow ends at LoginCommand's else-branch ('no browser login for that kind') and fails forever — a decoy competing with the client's native /login on the ONE head that keeps it enabled, and the same string was the '— run: claude-max login' hint in every 401 (the receipt had even quoted that hint approvingly). Command is now BLANK: nothing planted, no false instruction. (2) CRITICAL — doctor/status fell through to the api-key branch, so a WORKING claude head reported FAIL 'CLAUDE-MAX_API_KEY is not set' with fix 'export CLAUDE-MAX_API_KEY=…' — a name export cannot accept (hyphen), and with a single head that is a hard FAIL. Added a self-managed state: authPresent short-circuits true, envVar stays null, label reads 'client-native — splice holds no credential for this head'. (3) HIGH — block_allowlist = [] (the only way to write 'no allowlist') produced an EMPTY allowlist, dropping every content block of every message with no error; empty now means OFF, red-proven. Gate PASS after all three.
# [2026-08-15] DEFERRED from the same review, recorded not lost (none block merge; each is real): (a) a non-kimi anthropic-compatible vendor on auth kind api-key still inherits Kimi's full deformation set AND User-Agent KimiCLI/1.5, which extra_headers can replace but not REMOVE (documented as deliberate in CH-3, but the hunter is right that a TYPO'd kind lands there silently — AuthKind.from has zero production callers, so nothing validates auth.kind at boot); (b) no boot log of the resolved passthrough profile, which would make every quirk-misread in this list greppable in one line; (c) an ambient ANTHROPIC_API_KEY now survives the launch recipe and can silently bill pay-per-token instead of the subscription — the head could log which header NAME it forwarded; (d) a caller forwarding NO credential 401s upstream and charges health.provider(), reading as 'Anthropic is failing'; (e) repeated inbound headers truncate to the first value (anthropic-beta is legally repeatable); (f) last-wins dedup is right for anthropic-version, lossy for the set-valued anthropic-beta; (g) extra_headers/passthrough quirks are silent no-ops if declared on an openai dialect; (h) staticHeaders normalizes rather than validates a header name; (i) four unconditional builder transforms not listed in its own invariant comment (disabled-thinking dropped, empty-thinking dropped, non-array messages coerced, effortLadder populating TurnMeta.effort even with the mapping off).

