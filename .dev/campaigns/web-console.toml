# [2026-09-18] READINGS (no design freedom invented; each is the title's literal text where the title is silent). (1) THE TOPOLOGY VALIDATOR TAKES A PARSED OBJECT, not TOML text: no TOML parser exists in the tree (checked smol-toml, @iarna/toml, toml, @toml-eslint-parser - none resolvable), and CONTRACTS.md 8 / FEATURES 4.7 say the write goes through the daemon's structured writer, never raw text. So the console's half is a key-set mirror over the already-parsed topology, and 'the example' in the test is built as an object from FEATURES 2.3's own listing. (2) RUNTIME_KNOBS (33, FEATURES 2.2) is duplicated in topology/model/schema.ts SOLELY so [defaults] can be key-checked. The authoritative parse of Knob.kt is the coverage gate's (row M1-04), which is what catches a rename; the comment in the file says so. (3) PENDING IDs ARE PER-ROUTE-VALUE, not per-slice: auth writes and the accounts route are both V4-132 and share it; topology is V4-128; claude-head is V4-129. (4) saveTopology/wrap/unwrap THROW on a pending route rather than resolving to the honest empty: there is no honest empty for a WRITE, and the page needs to be told the route is absent so it can print the CLI command that stands in today. The READ routes resolve to { pending } in the store as specified. (5) auth: one authActionStore holds the last write's outcome, tagged by which write it was, SEPARATE from authStore - the read card stays the source of truth and a write's response is a transient outcome shown once. All four pre-existing auth exports and all eight pre-existing config exports are untouched.
