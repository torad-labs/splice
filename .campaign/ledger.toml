The door answers Desktop's model discovery (outcome 2). Decision: Desktop's picker is filled by discovery, not by an inferenceModels list. Discovery follows the lineup at every launch with nothing rewritten, and inferenceModels, once set, replaces discovery wholesale (Desktop 5.11492.5, see the evidence). The fields discovery can't carry (maxEffort, behavesAs) are covered by the tier and by splice's own effort mapping.
`GET /desktop/v1/models` (query `limit`, default and maximum 1000, and `after_id`), behind the desktop key as Bearer or x-api-key (df-wire-door's admission, the same 401 words), never a redirect, answers `{"data":[...],"has_more":bool,"first_id":id|null,"last_id":id|null}`, the shape of Anthropic's own /v1/models. The rows are DesktopLineup.picker, read at each request, so a head signed in or added reaches the next discovery. The door's saved default model (`splice desktop on --model`) is the first row, and the rest follow in the picker's own order. When the saved default isn't in the picker, the picker's order stands as it is. Decision: Desktop makes the first model of its list the default a new session starts on (`defaultModel: {model: wT(e)[0]?.id}` in 5.11492.5, see the evidence), so the model the person chose for the door is the one Desktop opens on. This only moves one row. It doesn't fork the picker. Each row:
- `type` "model", `id` the selector, `display_name` the row's label, `created_at` (any RFC 3339 time).
- `description` "splice · <command>", the same words the terminal picker shows, at most 100 characters, which is all Desktop keeps.
- `anthropic_family_tier`: every row carries one, because Desktop drops any GPT, Grok, Kimi or GLM id without one. A Claude model gets its own tier (AnthropicTiers). Any other model gets the first of opus, sonnet, haiku, fable its head's model_slots names it for, else "opus". Opus gives Desktop the full effort ladder and the largest limits, and the door scales windows itself.
- `is_family_default`: always false. A family default makes Desktop resolve a tier alias to one fixed row, while the door resolves a tier by the session's head (DoorRouting).
- `supports_1m` true only when the model's own context window is at least 1,000,000. `max_input_tokens` is that window.
- Display names are unique. Desktop folds Claude-looking rows that share a name and tier into one row, so a repeated label gets " (<command>)" added.
- Desktop's own effort ladder is low, medium, high, xhigh, max. A head whose vocabulary tops out lower (Grok keeps xhigh for max) still runs the nearest rung it has, as today.
