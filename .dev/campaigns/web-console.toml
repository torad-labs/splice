title = "THE TWO NEW WALLS, RED FIRST (FEATURES.md section 7; CONTRACTS.md section 4; global rule: derive the denominator from the source). LABEL WALL webui/tests/labels.test.ts: a function checkLabels(table) returns every label longer than three words, containing an em-dash, or with an uppercase first letter; the test globs webui/src/**/strings.ts at test time (fs walk, never a hand list), flattens every string value, asserts zero findings, AND asserts checkLabels on the fixture webui/tests/fixtures/walls/bad-strings.ts reports its four planted violations by key. COVERAGE WALL webui/tests/coverage.test.ts: the denominator is parsed at test time from gateway/core/src/main/kotlin/splice/core/config/Knob.kt (every enum entry name, i.e. each `NAME(` at entry indentation inside the enum body) and for ROUTES from .dev/web-console/FEATURES.md tables in sections 2.1 and 6 (first column, backticked spans, normalized by the CONTRACTS.md section 4 rule: strip the method prefix and any ?query, expand {a,b} alternates and GET/PUT into separate items, drop a span not starting with `/`; measured today: 19 and 35 backticked spans before normalization), and for TOPOLOGY KEYS from the @SerialName(\"...\") values across gateway/core/src/main/kotlin/splice/core/topology/Topology.kt, QuirksConfig.kt, TopologySchema.kt, gateway/core/src/main/kotlin/splice/core/prompt/HeadSystemPrompt.kt, gateway/core/src/main/kotlin/splice/core/model/TokenCost.kt and gateway/core/src/main/kotlin/splice/core/compaction/CompactionScope.kt (measured today: 22, 28, 4, 2, 2, 0; 58 distinct; FEATURES.md 2.3 is prose, not a table, so it is never the denominator); Knob entries measured today: 45 (`^    [A-Z][A-Z0-9_]*\\(` in Knob.kt); the test prints all three counts and fails if any is zero; a function checkCoverage(denominator, dispositions) returns names with no disposition, names with two page dispositions, `excluded` without a reason, and `pending` without a `where`; the test globs webui/src/**/coverage.ts plus webui/src/shared/coverage/baseline.ts, asserts zero findings on the tree, AND asserts the fixture webui/tests/fixtures/walls/coverage-missing.ts (a denominator with one extra name and an empty exclusion) reports both by name. BASELINE webui/src/shared/coverage/baseline.ts: every Knob, topology key and route gets disposition `pending` with `where` naming the M2 row that covers it (exact normalized names, no globs: knobs and topology keys M2-05; /health, /api/status, /api/heads, /api/heads/{head}/start, /stop, /restart, /api/usage M2-01; /api/sessions and the transcript and edges routes M2-02; /api/perf, /api/perf/summary, /api/perf/turns, /api/logs/{head} M2-03; /api/auth and every /api/auth/... route, /api/accounts M2-04; /api/config, /api/topology, /api/claude-head and its wrap and unwrap M2-05; /api/economics, /api/compact, /api/models M2-06; /api/mcp, /mcp/{name}, /api/doctor, the capture, budgets, alerts and playground routes M2-07; every /api/teams... and /api/projects... route M2-08; /api/events M3-01; a name the map does not cover fails the test by name until dispositioned), or `excluded` with the reason FEATURES.md section 5 gives (POST /api/daemon/shutdown: destructive, CLI only; /launch and /statusline: head-internal). Print the measured counts in the ledger note (knobs, topology keys, routes) with the parse method; if a FEATURES.md table does not parse, fix the parser or report the table line, never hand-list. Read /home/user/.claude/skills/impeccable/reference/craft-floor.md and .dev/web-console/CONTRACTS.md before editing."
