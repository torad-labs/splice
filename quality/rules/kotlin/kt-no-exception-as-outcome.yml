# THE LAW. An EXPECTED refusal is an outcome, not an exception. `throw` is the channel for "this
# cannot happen" — a broken invariant, unrecoverable, reported to a human. The moment a class is
# declared so that a caller can `catch` it BY NAME and continue, the throw is a return statement
# wearing a stack trace, and every property the type system would have given a sealed return is
# lost: the compiler cannot tell a caller it forgot a case, the signature does not say the refusal
# exists, and the refusal travels up through every `catch (e: Exception)` on the way — including the
# broad catches kt-catch-swallows-cancellation already had to be written to police.
#
# Worse here specifically: these extend RuntimeException and IllegalStateException, so they pass
# through `runCatching`, `Result`, and any `catch (e: IllegalStateException)` written for a genuine
# invariant break. A refusal and a bug become indistinguishable at the catch site — the 2026-07-18
# "auth failure looked identical to a missing file" shape that kt-no-silent-result-collapse exists
# for, one level earlier in the design.
#
# THE SCAR (ARCH-AUDIT 2026-09-17, audit A row 9 / B rows 1,7). `AllAccountsExhausted` is the named
# one: AccountPool.select throws it when no account can start a turn — an entirely ordinary,
# expected, per-request condition — as an IllegalStateException, which HeadAdmission.kt:233 then
# catches by name and turns into a 429 with a reset hint. Selection's answer "no account is
# available, earliest reset is T" is a VALUE the caller must handle.
#
# THE REMEDY. A `sealed class` return from the function that decided — `sealed class`, not `sealed
# interface`: kt-no-sealed-interface owns that convention and a `sealed interface` remedy trips it
# (measured against the hook, 2026-09-17). `AccountPool.select` returns `AccountSelection`, today a
# plain class (AccountSelection.kt:85): the remedy makes it a sealed class whose Exhausted subtype
# carries `earliestResetEpochSeconds`, and HeadAdmission's `catch` becomes a `when` branch the
# compiler checks. Same shape for the rest: the refusal rides the return type of the call that
# refused. `TurnOutcome` (core/turn/TurnOutcome.kt:92) is the in-tree example of the target shape.
#
# THE CENSUS (measured 2026-09-17, `ast-grep scan`). The audit row named ONE and predicted the
# declaration-side matcher would find it; the matcher finds NINE, all in :upstream, all expected
# refusals, and the eight extra are recorded here because that list IS the fix row's work:
#   integrations/upstream/src/main/kotlin/splice/upstream/credentials/AccountSelection.kt:144  AllAccountsExhausted : IllegalStateException
#   integrations/upstream/src/main/kotlin/splice/upstream/transport/UpstreamErrors.kt:13     UpstreamAuthMissing : RuntimeException
#   integrations/upstream/src/main/kotlin/splice/upstream/transport/UpstreamErrors.kt:16     UpstreamTurnWaitExhausted : RuntimeException
#   integrations/upstream/src/main/kotlin/splice/upstream/transport/UpstreamErrors.kt:23     StreamTornBeforeClient : RuntimeException
#   integrations/upstream/src/main/kotlin/splice/upstream/transport/UpstreamErrors.kt:26     UpstreamFailed : RuntimeException
#   integrations/upstream/src/main/kotlin/splice/upstream/retry/InflightGate.kt:192      GatewayAtCapacityException : RuntimeException
#   integrations/upstream/src/main/kotlin/splice/upstream/transport/UpstreamResponse.kt:72   UpstreamBodyLimitException : RuntimeException
#   integrations/upstream/src/main/kotlin/splice/upstream/failure/SseSpuriousWakeupException.kt  SseSpuriousWakeupException : RuntimeException
#   integrations/upstream/src/main/kotlin/splice/upstream/WsRoundRunner.kt:111     WsRoundNeedsSse : RuntimeException
# core/src/main: ZERO — and that zero is a real reading, not an unrun check: the same
# matcher over the same glob reports the nine above, so :core's emptiness is measured against a
# denominator that demonstrably produces findings ("empty" and "empty in X" are different
# sentences, §24).
#
# (Census as measured 2026-09-17; every entry is a value since 2026-10-09, see the dispositions below.)
#
# Six of the nine were caught or dispatched BY NAME from :features-turns main sources, which is the proof
# that they are control flow and not invariant breaks: HeadAdmission.kt:233 (AllAccountsExhausted),
# TurnFailures.kt:26 / TurnKnownEnd.kt:31 / TurnDriver.kt:149 (UpstreamAuthMissing),
# SseRoundPost.kt:62 (UpstreamTurnWaitExhausted), AdmissionGate.kt:37 (GatewayAtCapacityException),
# SseRoundDriver.kt:119 (StreamTornBeforeClient). WsRoundNeedsSse announces its own control-flow
# purpose in its name.
#
# THE MATCHER IS THE DECLARATION SIDE, and that is a rule-shape fact worth stating: "is this class
# caught by name somewhere else" is a cross-FILE question and ast-grep matches one file at a time.
# The audit row chose the declaration side for exactly this reason. It means the rule cannot
# distinguish "declared as an exception AND caught by name" from "declared as an exception"; it
# fails CLOSED on the second, which is correct, because a RuntimeException subclass nobody catches
# by name has no reason to be a distinct type at all.
#
# NO EXEMPTION STANDS (2026-10-09). The rule used to carry four dated `ast-grep-ignore` exemptions, on the argument that
# a caller which can only REPORT a failure is not branching on it. That argument was wrong in every case: the retry
# loop caught a torn stream by name and re-issued the request, the round driver caught it by name and re-anchored, and
# the turn's boundary dispatched on the other three by class. They are sealed values now, and a genuine invariant
# break is spelled check()/require()/error(), never given a catchable name. Nothing here takes a directive.
#
# THE DISPOSITIONS (V4-114, 2026-09-17). All nine census entries above are now dispositioned, and
# the split is one test applied to the CATCH SITE, not to the class's name: after catching, does the
# caller produce a DIFFERENT CONTINUATION (a refusal value, a substitute outcome, another transport),
# or does the turn end in a failure the client is told about? The first became a sealed outcome at once. The
# second was left an exception, and 2026-10-09 retired that half: every one of them was caught by name and branched on.
#
#   SEALED OUTCOMES (4 — the refusal now rides the return type of the call that decided it):
#     AccountSelection.kt:144  AllAccountsExhausted      -> V4-99: AccountPool.select returns a
#                              sealed Selection; HeadAdmission.kt:233's catch becomes a `when`.
#     InflightGate.kt:192      GatewayAtCapacityException -> InflightGate.acquire returns
#                              `Admission { Acquired | AtCapacity }`. PROOF it was control flow:
#                              AdmissionGate.kt:37 caught it and RETURNED NULL + 529, and the
#                              window-closed refusal ten lines below was already a returned null —
#                              one gate, two refusals, two channels.
#     UpstreamErrors.kt:16     UpstreamTurnWaitExhausted -> UpstreamClient.post returns
#                              `UpstreamPost { Delivered | TurnWaitExhausted }`. PROOF: SseRoundPost
#                              .kt:62 built a SUBSTITUTE outcome (the translator over an empty flow)
#                              and returned it normally. It is also the one ending this loop DECIDES
#                              rather than suffers: no request was sent, no response exists.
#     WsRoundRunner.kt:111     WsRoundNeedsSse           -> deleted from the SPI; WsRoundDrive
#                              returns `WsRoundResult { Streamed | NeedsSse }`. PROOF: WsRoundDriver
#                              .kt:112 RE-SERVED the round over SSE, so the caught signal led to a
#                              successful turn. It was also declared in :upstream while being
#                              thrown and caught entirely inside :features-turns — nothing in :upstream
#                              referenced it. The residual throw is a private in-file loop break
#                              between two adjacent statements (a suspend `collect` has no other way
#                              to stop early), which is why the SPI class is gone rather than moved.
#
#   SEALED OUTCOMES, SECOND HALF (4, 2026-10-09 — the four once exempted, now the vocabulary of UpstreamEnding):
#     UpstreamErrors.kt  UpstreamAuthMissing, UpstreamFailed, StreamTornBeforeClient, and SseFrameTooLarge (the old
#       SseFrameTooLargeException) are subtypes of `sealed class UpstreamEnding`. UpstreamClient.post answers
#       `UpstreamPost.Ended(ending)`; the response handler answers `StreamRead { Read | Torn | Oversized }`; every round
#       port answers `RoundResult { Outcome | Ended }`; TurnEnding.emitEnding is an exhaustive `when` over the four.
#       The two thrown from inside the SSE flow (the tear and the oversized frame) are recorded in a per-attempt latch
#       (RoundEnd) while the flow completes, and the translator's closing write is gated off the client, the way the
#       websocket path already re-served a round (SseReserve).
#
#   FIXED BY DELETION (1, and it was in neither bucket): UpstreamResponse.kt:72
#     UpstreamBodyLimitException was `private`, caught by NOBODY, and only ever handed to
#     `channel.cancel(...)` as a diagnostic cause. A named RuntimeException subclass no reader
#     branches on is a type with no job: it is a plain IOException now and the class is gone.
id: kt-no-exception-as-outcome
language: kotlin
severity: error
message: "Expected refusals are sealed OUTCOMES, not exception types: return the refusal from the function that decided it, so the compiler checks the caller's `when`. A named RuntimeException/IllegalStateException subclass is a return statement wearing a stack trace."
note: >
  Add the refusal as a subtype of a `sealed class` the call returns (`sealed class`, never `sealed
  interface` — kt-no-sealed-interface owns that): AccountPool.select returns AccountSelection, so
  the exhausted case becomes one more subtype carrying its reset hint and the catch site becomes an
  exhaustive `when`. TurnOutcome is the in-tree example of the shape. These subclasses are worse than a plain outcome because
  they extend RuntimeException/IllegalStateException: they slip through runCatching, Result, and any
  catch written for a real invariant break, making a refusal and a bug indistinguishable. A genuine
  invariant break is spelled check()/require()/error() and never given a name; no directive exempts a class.
# NO `files:` LIST (2026-10-09). It used to name six roots, which made the law a property of where
# a class happened to live: features/turns declared RequestBodyTooLarge and the rule never looked.
# A denominator taken from the list being checked cannot fail for what the list omits, so the rule
# now binds every production root the scan walks, and a new module inherits it the day it appears.
#
# Test sources are excluded by SOURCE SET, never by module: a private test double that models an
# invariant break is exactly what this law permits, and HeadServerFailureBranchTest.kt:88 and
# PassthroughStreamTranslatorTest.kt:1058 are two of them. A new module's tests inherit this.
ignores:
  - "**/src/test/**"
  - "**/src/testFixtures/**"
rule:
  all:
    - kind: class_declaration
    # the grammar's own name for "this class extends X": present iff there is a supertype clause.
    # `stopBy: end` reaches the user_type through the constructor_invocation wrapper that a
    # supertype WITH arguments (`: RuntimeException("msg")`) adds and a bare one does not, so both
    # spellings match — pinned in the rule-test.
    - has:
        kind: delegation_specifier
        has:
          stopBy: end
          kind: user_type
          regex: '^(kotlin\.)?(IllegalStateException|RuntimeException)$'
