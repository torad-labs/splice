ops over 9 leaf exception types x 13 wrap depths = 117 cases on phase/retryable/DNS, plus the 8-link boundary (found at index 7, invisible at index 8) and a cyclic chain; red-proven by widening the bound to MAX_CAUSE_DEPTH + 1, probe RED at both pinning assertions, restored, GREEN. UpstreamClientTransportTest 19 / UpstreamClientRetryPolicyTest 17 / UpstreamClientConnectTimeoutTest 2, 0 failures. gradle check --rerun-tasks on the COMMITTED tree: BUILD SUCCESSFUL in 2m 13s, 162 of 162 tasks executed. npm run gate: GATE: PASS, 17/17 legs. TWO THINGS FOR THE ORCHESTRATOR. (1) The oracle's ceiling entry for this file still records 6.14 and its prose still quotes the pre-change 491 logic / 319.5 C; the measured ratio is now 6.01. Ratcheting the ceiling down is a gate STRENGTHENING and is not done here — checks/concentration.py belongs to another in-flight item (47ff00d, minutes old) and racing it would collide. (2) CONCURRENCY HAZARD, not a code finding: this ran in the shared checkout while another builder was editing and BUILDING the same tree. Two full 'gradle check --rerun-tasks' runs died on it — first java.io.EOFException on :gateway:test with 0 test failures and 24 of the module's result files written, then 12 NoClassDefFoundError/ClassNotFoundException failures in ScenarioIntegrationTest + WsRoundDriverTest — both runs carrying 'Detected multiple Kotlin daemon sessions' and 4 live Gradle daemons; both went away entirely once the tree was quiet (0 such markers, 162/162 green, twice). Neither red was a code defect. Worktrees are operator-banned, so the only isolation available is SEQUENCING: engine-touching builders must not run gradle in this checkout at the same time.
