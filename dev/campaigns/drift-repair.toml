# [2026-08-31] 2026-08-31 claude-splice: FIXED @ ab7199f2. The discriminator is end < ch.size() - a window cut by the BYTE CAP has more file past it, so the line can never complete inside one window; a window that ended at EOF is the ordinary torn tail where waiting is correct. Only the first case skips. NEVER-BELOW-STATUS-QUO reasoning: today's behavior is a PERMANENT freeze losing every subsequent line for the life of the process while re-reading 1 MiB twice a second, silently; skipping one over-long line loses one line and keeps the follow alive, and the skip is announced in-band (the DR-68 idiom) because a silent gap in a log follower is its own defect. MUTATION: exact pre-fix (no-newline window consumes nothing) over both Logs classes, 11 tests, 1 red = DR-138 only, zero collateral, FileSources.kt restored byte-identically to f8553dcb. Five DR-100 arms and the roll control stayed green throughout both mutants.
