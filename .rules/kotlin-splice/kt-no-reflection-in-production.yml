# Type-identity discipline — reflection asks the RUNTIME what something is, in code that already
# knows at compile time. Every site this wall cleared out was the same shape: a catch clause that
# had just narrowed the throwable to a named type, then reflected on the caught object to recover
# the name it was standing in. `catch (e: AccessDeniedException) { "(${e.javaClass.simpleName})" }`
# is a runtime lookup for a string the compiler could have written. The cost is not speed, it is
# that the value stops being checkable: nothing tells you when the branch and the reported name
# drift apart, and a subclass silently changes an operator-facing message.
#
# Compliant forms:
#   - name it from the BRANCH. A `catch (_: NoSuchFileException)` clause knows its own label, and
#     splitting one broad catch into the clauses that actually occur is both the fix and better
#     diagnostics (MgmtKey.ensure, DoctorProbeWrite.writableProbe).
#   - a `when` over a CLOSED set, where the closure is provable. TurnFailures.gatewayBugKind and
#     DaemonBoundary.reason are `when`s over exactly the classes their own catch lists convert into
#     failures — nothing else can reach them, so the mapping is total rather than best-effort.
#   - for classpath resources, ask the class loader by name: `ClassLoader.getSystemResourceAsStream`
#     rather than a class token whose only role was to name a loader (DashboardHtml).
#   - for the running jar, read the JVM's own `java.class.path` rather than this class's protection
#     domain (AdminSupport.selfJar).
#
# THIS RULE MATCHES SPELLINGS, NOT SEMANTICS — the same lesson kt-no-system-getenv and
# kt-no-todo-throws record. `e::class.simpleName` is the same runtime lookup and is NOT matched by
# any branch below. That is a known hole, deliberately left as a hole rather than papered over with
# a branch that would also catch legitimate `::class` uses: writing it to get past this wall would
# be evading the wall, which the campaign forbids outright. Treat the four branches as the shapes
# known to occur here, never as closure.
#
# PROMOTED 2026-08-16 (HD-18) from the dormant .rules/kotlin/ast-grep pack, which sgconfig.yml
# references from nowhere and so had never run. Red-proven against a synthetic violation before the
# census was trusted: 6 hits in gateway/*/src/main, all six converted in the same commit. The
# source pack's `ignores: **/di/**` is dropped — there is no DI container here, and the production
# glob below already exempts src/test and src/testFixtures without a second list to keep in sync.
id: kt-no-reflection-in-production
language: kotlin
severity: error
message: "No reflection — name the type from the branch, a closed `when`, or the class loader."
files:
  - gateway/*/src/main/**/*.kt
rule:
  any:
    # The class token: `Daemon::class.java.getResourceAsStream(...)`, `X::class.java.protectionDomain`.
    - pattern: $T::class.java
    - pattern: $T::class.qualifiedName
    # The instance form — this is the one that had five of the six hits, always inside a catch.
    - pattern: $X.javaClass
    # Name-based loading: no compile-time reference at all, so nothing links or renames with it.
    - pattern: Class.forName($$$ARGS)
