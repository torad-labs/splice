title = "No cooldown on repeated non-`invalid_grant` refresh failure || PROBLEM: `InvalidGrantLatch` suppresses re-POSTing only for a **confirmed** `invalid_grant`. Every other terminal rejection — `Rejected` with a non-invalid_grant reason, `Denied('HTTP 400')`, 'refresh retries exhausted', `TransportFailed`, `PersistFailed` — has no memory at all. Two amplifiers compound: (1) `AuthProbeLoop` calls `refresh()` on every tick whenever `credentials()` is null, and each `refresh()` runs `refreshWithRetry`'s 3 attempts with 2s/4s backoff, so a dead-but-not-invalid_grant endpoint gets 3 POSTs a minute forever; (2) in the prefetch tier every `credentials()` call does `prefetchScope.launch { … || SPLICE TODAY: `gateway/core/src/main/kotlin/splice/core/auth/InvalidGrantLatch.kt` is a single mtime-keyed boolean armed only on `outcome.reason == INVALID_GRANT_REASON` (kimi `:117`, grok `:174`, codex `:146`). `AuthProbeLoop.kt:56-61` ticks on a fixed interval and calls `refresh()` unconditionally when `credentials()` is null. `RefreshRetry.kt:57-74` runs `maxAttempts` per *call* with no cross-call state. `gateway/provider-spi/src/main/kotlin/splice/spi/SingleFlight.kt:41-42` comments 'reuse only a still-running refresh; a settled one means the next wave starts fresh', and both grok (`:111`) and kimi (`:89`) fire … || PROPOSAL: Generalize `InvalidGrantLatch` into a `RefreshCooldown` in `:core`, keyed like the latch on the auth-file mtime so a re-login clears it automatically. On each terminal non-Granted outcome record `(reason-class, consecutive-failure count, nextAttemptAtMs)` with escalating backoff: a short leash for transport/5xx (30s → 1m → 5m capped) and a long one for endpoint rejections (5m capped, matching qwen-code), honouring a `Retry-After` when the refresh response carried one. `doRefresh()` consults it in the same position the latch is consulted today (before any file read or network call), returning `RefreshOutcome.Rejected('cooling down: <reason>, <n>s remaining')` so `credentialsOrNull` still owns the one logging flatten. Success clears it. || EFFORT/RISK: M. **Risk** Medium: too long a cooldown delays recovery from a genuinely transient outage. Mitigated by (a) escalation from a 30s floor rather than a flat 5m, ( || VERIFY-SPEC: New test alongside `gateway/core/src/test/kotlin/InvalidGrantLatchTest.kt` pinning the escalation curve and mtime auto-clear; plus a provider-level test asserting that 10 consecutive `credentials()` calls against a permanently-`Denied` `refreshCall` produce ONE 3-attempt cycle, not ten. Gate: `npm run gate`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### SH-05'"
