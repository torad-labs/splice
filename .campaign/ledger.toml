spec = '''
A splice command run in the first seconds after the daemon is up runs on that daemon (found while cutting custom-provider, Nov 18, 2026). Today the CLI's cold-start check (DaemonLaunch.ensureDaemon -> DaemonHealth.daemonUp -> DaemonProbe.healthView) can miss a daemon that is up but slow to answer its first /health; the CLI then goes the spawn path, finds the control port bound, waits, and refuses with `splice: control port N is still bound (a daemon is still shutting down); retry in a moment` and `splice claude: the daemon isn't running and couldn't be started`. The person's command does nothing, and the reason given is false. Every campaign check that calls the CLI right after boot (`splice claude door` in tiers and parity, every time) fails on it at random.

After this item: when the control port is bound and the listener there is splice's (it answers /health, or accepts connections while starting), the CLI waits for /health to answer, bounded (up to the cold-start budget it already uses for a daemon it started itself), and runs the command on that daemon once it answers with the expected version. "Still shutting down" is said only of a port that stays bound by a listener that does not answer /health for that whole budget; a daemon of another version keeps today's handling. A second daemon is never spawned beside one that is starting. The probe's own timeout for a single /health stays short; the fix is in what the CLI concludes from one miss, not in waiting longer on every call.

Where: features/lifecycle/src/main/kotlin/splice/lifecycle/start/DaemonLaunch.kt and DaemonSpawn.kt (startableJar), integrations/daemon-client/.../DaemonHealth.kt / DaemonProbe.kt. No other item changes these files.

Proven by: bun test ./.campaign/checks/custom/ready.test.ts — three boots in a row, each followed at once by `splice claude door` and `splice claude --json`, all exit 0 and none says "still shutting down".'''
