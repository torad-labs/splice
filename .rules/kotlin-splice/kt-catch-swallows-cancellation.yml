# Structured-concurrency honesty — a broad catch that does not rethrow
# CancellationException silently eats coroutine cancellation (watchdog aborts,
# client disconnects) and resurrects the Node-era zombie-stream bug class.
# Widened: the exemption was a free-text regex (`has: {regex: CancellationException,
# stopBy: end}`) over the whole catch-block subtree, so a catch body containing only a
# comment or log string mentioning the class name (e.g. `// CancellationException handled
# by caller`) satisfied the exemption without any real rethrow. Replaced with a structural
# `pattern: $_ is CancellationException` check — only a real parsed type-check counts.
# Widened again 2026-07-27 (review round 2): the exemption stopped one rung short of the rule's
# OWN message, which demands `if (e is CancellationException) throw e`. A type-check with no
# rethrow — `if (e is CancellationException) { log.debug { "cancelled" } }` — satisfied the old
# `$_ is CancellationException` exemption while still eating the watchdog abort or client
# disconnect, i.e. the zombie-stream class this rule exists for. The check now BINDS the tested
# variable as $V and requires `throw $V` in the same catch block; ast-grep holds $V consistent
# across the `all`, so rethrowing some OTHER variable does not satisfy it either (proved: a
# `throw other` arm still trips the wall). Verified 0 new hits on the tree at 24eefbf.
id: kt-catch-swallows-cancellation
language: kotlin
severity: error
message: "catch (Exception|Throwable) must rethrow CancellationException (`if (e is CancellationException) throw e`) before handling."
files:
  - gateway/*/src/main/**/*.kt
rule:
  kind: catch_block
  regex: ':\s*(kotlin\.)?(Exception|Throwable)\b'
  not:
    all:
      - has:
          pattern: $V is CancellationException
          stopBy: end
      - has:
          pattern: throw $V
          stopBy: end
