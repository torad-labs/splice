spec = '''
Everything a head of a provider does today behaves the same on a door turn on that provider (issue #680, outcome 2), so a team can leave the deprecated head command for `claude` on the door and lose nothing: `local` (per-turn token counts, earlier reasoning replayed as reasoning_content), the quirks `stream_usage`, `slot_affinity` and `chat_effort_vocabulary` (the /effort pick and a thinking budget mapped to the provider's own effort words), and the provider's `extra_headers` and `forward_headers`. After this item, for the same turn the provider is sent the same request whether Claude Code sent it to the head's own port or through the door (/desktop/v1/messages on the terminal's key): the same JSON body, and the same headers, the fixed extra_headers and every header named in forward_headers that the session sent. The session sees the same answer text. The one designed difference stays: the door reports counts scaled to the session's window (DoorRelay, ClientWindows; cp-window), which is not a difference in what the provider is sent.

A door turn reaches its head through the relay LAN share uses (DoorRelay -> ShareRelay -> the head's port), so whatever the door or the relay drops or adds on the way (a forwarded header, the slot lease keyed by session, a body field) is the place to fix; never re-apply a head feature a second time on the door side. Reasoning effort is part of the prompt-cache key and never varies by turn type (repo CLAUDE.md).

Where: app/src/main/kotlin/splice/app/desktop/DoorRelay.kt, DesktopDoor.kt, features/share/.../ShareRelay.kt (which headers it forwards to a head). Vendor facts stay in their provider module.

