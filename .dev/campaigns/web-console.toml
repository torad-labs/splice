# [2026-09-18] 2026-09-18 FINDING (fixture address): the fixture must ride in the URL SEARCH, not the hash. The shell canonicalizes at boot (webui/src/app/rows.ts:90-95 rebuilds the hash as #/<slug>) and webui/src/app/index.tsx:19-20 replaces location, so #/sessions?fixture=board loses its query before React renders. The working address is http://localhost:5173/?fixture=board#/sessions. My fixture readers check window.location.search first and the hash second, so both forms work once the shell stops rewriting; noting it because the contract says 'the address carries ?fixture=' and the hash form silently renders live data (I lost one capture to it).
# [2026-09-18] 2026-09-18 FINDING (for every page row's test): a component test that renders a page reading a zustand store can only ever see that store's INITIAL state. renderToStaticMarkup is a server render, and zustand v5 passes getInitialState() as the server snapshot, so seeding a store with setData and rendering shows the empty page (measured: six M2-02 tests failed this way before the refactor). The fix that keeps the tests real: each page exports a BOARD component that takes its payload as a prop, and a default export that reads the entities and any fixture. The boards are then directly testable and the stores are not mocked. Worth one line in CONTRACTS.md section 4 for the page rows still to come (M2-03..M2-08).
