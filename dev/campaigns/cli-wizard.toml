# [2026-09-15] REVIEW - REDO. The wall passes, but I measured what each assertion is standing on and most of them are standing on nothing. VACUITY AUDIT of the five emits-no-ESC checks: Spinner is the only non-vacuous one, because its non-TTY stop really writes done plus a newline. SelectPrompt writes NOTHING on the non-TTY path - line 31 returns Chosen before any paint - so assertNoEsc runs over the empty string. MultiSelectPrompt is the same. WizardFrame is the same again, because checkFrame calls only confirm, and confirm delegates to ask and never touches out, so that assertion is also over an empty buffer. And NoteBox, the one widget that provably does emit escapes, is the single branch with no ESC assertion at all - it asserts only that the output is non-empty. So the headline claim that every prompt widget is silent with no console is carried by one real check, three empty strings and one omission. MY SLOT IS THE ROOT CAUSE OF THE OMISSION and I am naming it before the finding against you: requirement 2 asked for the absence of 0x1b in the captured output, and that is unachievable as the code stands. splice colours unconditionally CLI-wide - CliStyle.kt is a bare palette with no NO_COLOR and no isatty guard, NoteBox appends CYAN around every rule and every content line, and WizardFrame intro step cancel and outro all append SGR. NoteBox could never have passed the assertion I wrote. THE FINDING AGAINST YOU IS NOT THE OMISSION, IT IS THE SILENCE: the premise-check law says a wrong premise in the brief is reported, not worked around. Narrowing a wall to the widgets where an impossible requirement happens to hold, and leaving the one that fails it unasserted, produces exactly the green tick over nothing this row exists to prevent. CORRECTED SPECIFICATION, three rules replacing requirement 2. RULE A - for a widget whose non-TTY contract is to write nothing, assert the captured output is EMPTY rather than free of escapes. Emptiness is the real property and it is strictly stronger; no-ESC-in-the-empty-string is the tautology. That covers SelectPrompt and MultiSelectPrompt today. RULE B - for a widget that legitimately writes, assert the output contains no CURSOR CONTROL sequence: no CSI A B C D J or K, and no bare carriage return. That is the property that actually protects a piped log, a Docker build transcript and a systemd journal, and colour does not violate it. Spinner, NoteBox and WizardFrame are checked under this rule. RULE C - NoteBox and WizardFrame must be RENDERED for real before being checked. Render the box, and call intro step note and outro, not confirm alone. DENOMINATOR. The parser is the regex internal class backslash w plus, which silently omits eight declarations in the package: MultiSelectOutcome, SttyResult, SttyCommand, PulseScheduler, Key, ConfirmPrompt, SelectOption and SelectOutcome. None is a widget today, so nothing is currently unguarded - but none has a written disposition either, and a widget added next month as an open, abstract, sealed or data class escapes the wall entirely, which falsifies this row own headline promise that a new widget is in scope with no edit to this file. Broaden the parse to every class-like declaration and fun interface, then carry an explicit exclusion set with a one-line reason per entry - data carrier, seam interface, exception type - so an unlisted and unexercised declaration fails BY NAME. NO BRANCH MAY BE SATISFIED BY A BARE CONSTRUCTOR CALL. UnixStty maps to UnixStty() and TimerPulseScheduler maps to TimerPulseScheduler(); both assert nothing and exist only to escape the else. Neither is a widget. Move them to the exclusion set with reasons rather than fake-covering them. THE SYNTHETIC. Your RED proves the else fires for an unlisted name. It does not prove that any listed branch asserts anything, which is precisely why four of them did not. The next synthetic must be a widget that VIOLATES THE CONTRACT - one that writes a cursor rewind on its non-TTY path - and the test must go RED on the contract assertion, not on the enumeration. Record that assertion message verbatim. WHAT I ACCEPT AND WILL NOT MAKE YOU REDO: the enumeration-from-disk is genuinely derived from the package and not hand-typed; the vacuous-scan guard that fails when zero classes are found is right and is the trap most people omit; the raw-mode-zero check is real and correctly asserted both per widget and once at the end; and the LongMethod split did not narrow the wall, which is the thing I warned you about and you avoided. SEPARATE FINDING FOR MARCOS, NOT THIS ROW: splice emits ANSI unconditionally across the whole CLI - doctor, status and setup all colour a piped log. No NO_COLOR, no isatty, nowhere. Out of scope for this campaign, recorded here so it is not lost.
