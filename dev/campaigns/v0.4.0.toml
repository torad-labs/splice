# [2026-09-13] FIX P6 (splice-astra, 2026-09-13): null-session turns still re-evaluate selection policy on every turn, but retain only their previous transition under a lock so an unchanged backup emits no repeated switch, cache_cold, or log. AccountPoolTest proves first backup cold, repeat warm, and a later real move cold.
# [2026-09-13] FIX P7 (splice-astra, 2026-09-13): HeadServer restart now resets the account pool when pooled turns bypass the client-owned cooldown, while the legacy UpstreamClient clear remains for non-pooled heads. AccountPool.reset clears both account horizons and runtime choices; AccountTurnSelectionTest proves an armed primary selects backup before restart and primary after restart.
# [2026-09-13] FIX C1 (splice-astra, 2026-09-13): an unlabeled OAuth login always targets the legacy primary path, including when that file already exists; labeled additions still require an existing primary. AccountLoginTest replaces a revoked primary and proves no pooled credential directory is created.
