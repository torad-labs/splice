title = "Unbounded, unclearable per-head 429 cooldown horizon || PROBLEM: A single 429 whose `Retry-After` says a large number arms a head-wide fail-fast horizon of exactly that length: no ceiling, no half-open probe, no clear-on-recovery, no operator escape short of killing the daemon. ChatGPT quota errors legitimately carry multi-day resets — splice's own classifier humanizes `resets_in_seconds` as '6d 4h' and the code comment cites a real 142h reset observed 2026-07-26. `accumulateAndGet(max)` means the *longest value ever seen* wins permanently, so one malformed pushback poisons the head for every concurrent and future turn. || SPLICE TODAY: `gateway/provider-spi/src/main/kotlin/splice/spi/UpstreamClient.kt:406-412` — `val until = clock() + (failed.retryAfterMs ?: DEFAULT_RATE_LIMIT_COOLDOWN_MS)` then `rateLimitedUntilMs.accumulateAndGet(until) { c, cand -> maxOf(c, cand) }`, with `retryAfterMs` (`:361-362`) an uncapped `seconds * 1000`. The `RETRY_AFTER_GIVE_UP_MS` clamp at `:418-422` is **unreachable for 429s** — the `status == RATE_LIMITED` branch returns GIVE_UP at `:412` first, so G3's absurd-pushback guard never touches the cooldown horizon. Fail-fast at `:295-304`. The `AtomicLong` lives on the `UpstreamClient` built once at … || PROPOSAL: Three bounded changes in `UpstreamClient.kt`: (1) clamp the armed horizon to a new `MAX_RATE_LIMIT_COOLDOWN_MS` (suggest `120_000L` — long enough to starve a herd, short enough that a recovering account resumes inside one client-retry cycle) while keeping the *full* pushback value in the surfaced message so the operator still learns the real reset; (2) add `internal fun clearRateLimitCooldown()` and call it from `HeadServer.startLocked()` next to `driver.resetHealth()`, making restart a real escape hatch; (3) expose `rateLimitedForMs` on the snapshot so NF-10/JW-11 can surface it. Leave `RETRY_AFTER_GIVE_UP_MS` untouched. || EFFORT/RISK: S. **Risk** A genuinely hour-long provider limit gets re-probed every 2 minutes instead of once — bounded, ~30 extra single requests per hour per head, and NF-1 || VERIFY-SPEC: `UpstreamClientRetryPolicyTest.kt:169` currently *pins* honour-the-full-pushback with a 30s case — that test must be rewritten, not extended. New cases: a 429 with `Retry-After: 86400` arms a horizon no longer than `MAX_RATE_LIMIT_COOLDOWN_MS` (assert via injected clock plus a follow-up post that succeeds once the clamp expires); the surfaced message still contains the true pushback. New case in `gateway/gateway/src/test/kotlin/head/HeadServerCapacityTest.kt`: `restart()` clears an armed cooldown. Gate: `npm run gate`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### NF-01'"
