title = "FLEET PAGE (FEATURES.md 4.2). One Bay of head Strips from @entities/heads, @entities/usage and the public API of @entities/auth (owned by M2-04; ask splice-design for a missing field, never edit it): each strip carries StripFields key, port, dialect, model, account label, in-flight against max, the window nearest exhaustion, last turn; cocked with a printed label when the head needs attention (unhealthy, version mismatch, token missing or expired, account excluded, queue at max, topology stale), struck when disabled; provider family printed as a field and as a monochrome mark (a glyph in text, never a color). The opened strip swells (--dur-2) into the detail column: knobs with provenance from @entities/config's public API, the account pool, start/stop/restart through the existing POST /api/heads/{head}/{action}. The Rule's nearest-window line is fed from the derivation this row adds to @entities/usage's public API (export nearestWindow()). Stop importing webui/src/widgets/head-plate and webui/src/widgets/fleet-banner (they stay in the tree, unrouted, until M3-04 deletes them); new widget webui/src/widgets/head-strip. Views: defaults `by head` (default), `by provider`, `attention first`. Page rules (CONTRACTS.md section 4): default export; strings.ts and coverage.ts beside the page; every figure through Figure with its basis; a window a provider does not report reads `not reported by provider`; every pending route renders <Empty> naming the V4 row; saved views through useViews and ViewTabs; motion only swell and cock; radius 0, no icons, no glow; both themes; the page is built inside the spec system (same rules, strip geometry, palette as the hero), nothing the comp does not show except what this page needs and the comp never covered. One 1536x1024 dark capture of the page into webui/.impeccable/review/sections/<page>.png (fixture allowed under the fixture rule, named in the note). TEST webui/tests/fleet.test.ts: attention derivation per cause, struck when disabled, nearest window text, markup contains every field label. Read /home/user/.claude/skills/impeccable/reference/craft-floor.md and .dev/web-console/CONTRACTS.md before editing."
