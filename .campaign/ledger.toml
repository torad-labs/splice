spec = "A command linked from a server whose profile names a telemetry relay (telemetry.otlp, as server-telemetry-relay serves it) launches Claude Code with CLAUDE_CODE_ENABLE_TELEMETRY=1, OTEL_METRICS_EXPORTER=otlp, OTEL_LOGS_EXPORTER=otlp, OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf (Claude Code's own OTLP/HTTP encoding, and the smaller one) and OTEL_EXPORTER_OTLP_ENDPOINT set to exactly the profile's telemetry.otlp, <server>/server/otlp. The person's key is in none of the environment: the command's settings carry an otelHeadersHelper that prints {Authorization: Bearer <key>} as JSON from the same owner-only key file the apiKeyHelper reads, so a new sign-in reaches a running session; with no key it says on stderr how to sign in (splice login <server>) and exits non-zero. Prompts are never logged: splice sets no OTEL_LOG_USER_PROMPTS and clears one the shell sets, and it clears OTEL_EXPORTER_OTLP_HEADERS and every per-signal OTLP endpoint, protocol and headers variable the shell sets, because Claude Code sends the helper's headers to every exporter and those would carry the key somewhere else. Where the command's organisation-managed settings (remote-settings.json in its config folder) set telemetry of their own (CLAUDE_CODE_ENABLE_TELEMETRY or any OTEL_ variable in their env, or an otelHeadersHelper), splice adds no telemetry and clears nothing: the organisation's policy wins, as Claude Code lets no other settings override it. Managed settings that set none, or an absent or unreadable file, leave the relay on. The laptop's own commands, and a command from a server with no relay, get no telemetry from splice. The relay is kept with the login at splice remote add and remote refresh, and followed from the next launch. remote add prints one line when the profile names a relay: Claude Code's telemetry from <server>'s commands goes to <relay>, from their next launch. A refresh that changes the relay prints that line for the new relay, or Claude Code's telemetry from <server>'s commands is no longer relayed, from their next launch, when the server stops relaying; a refresh that changes nothing says nothing about telemetry. Why: the person is told where their usage goes when it starts and when it changes, in one wording. The parked code (git diff 0970e5f5d 0970e5f5d^) holds this item's half and only lacks the remote add line: app cli/share RemoteAdd, RemoteNames, RemoteRefresh; features/launch (LaunchTypes, TeamServerLaunch, recipe/LaunchService, recipe/LaunchTelemetry, LaunchTeamServerTest); share KeyHelpers, RemoteLaunches, ServerLogins and ServerLoginsTest; integrations/claude-code ClaudeConfigKeys, ClaudeConfigMaterializer, ManagedSettings, SessionHelpers, wrap/WrappedHeadTypes; README's laptop paragraph and its server-logins row. Proven by bun test ./.campaign/checks/server/telemetry-recipe.test.ts, which links a laptop to a server with a relay, reads each launch's recipe and runs its headers helper."
