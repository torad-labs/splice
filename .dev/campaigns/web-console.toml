# [2026-09-18] 2026-09-18 WHAT SHIPPED: entities/events (connect/disconnect/subscribe/subscribeAll + a store), shared/lib/live.ts (the SSE frame parser and the backoff schedule, both pure), and a ConnectionCell in widgets/rule beside health. Transport is ONE streaming fetch of /api/events from the api segment with the bearer header; EventSource is not used because it cannot send a header. No entity subscribes in this row, as specified.
# [2026-09-18] 2026-09-18 NOTE (the deep import): shared/lib/live.ts is imported as '@shared/lib/live', not through the shared/lib barrel, because webui/src/shared/lib/index.ts is outside this row's fence and the fence names live.ts exactly. eslint's boundaries wall is green on it (checked before writing anything else), but it is the only import in the tree that reaches past a shared barrel, so it is named here rather than left as a surprise. A one-line re-export in shared/lib/index.ts would remove it whenever a row owns that file.
# [2026-09-18] 2026-09-18 CONTRACT REQUEST (the 401 path): the stream's 401 is handed to the shared client with ONE control.status() read, which is what sets the lock and calls the listener the shell's key gate is bound to. I did that instead of re-implementing a lock because a second lock is one the key gate could not clear, and instead of exporting a setter because @shared/api is outside this row's fence. A one-line exported noteUnauthorized() there would do the same job without the request. Flagging it so the daemon-side 401 story stays in one place.
# [2026-09-18] 2026-09-18 PARSER DECISIONS (each one a way a stream is misread): (1) carriage returns are normalised on the WHOLE buffer, not per chunk - a chunk can end between a \r and its \n, and splitting on a blank line would then miss the frame boundary. (2) A block with no field lines at all is the HEARTBEAT: it is not a frame and it is not a dropped frame either, so a 15 s keepalive never inflates a loss count. (3) A frame with no event name, no data, or data that is not one JSON object is dropped AND COUNTED, never silently skipped; the count lives in the store. (4) An id that is not an integer leaves the resume point where it was rather than clearing it. (5) A kind this build does not know is still a frame: it is dispatched (to subscribeAll, and to nobody else) and it resets the backoff, because stream health must not depend on which kinds this build happens to understand.
# [2026-09-18] 2026-09-18 DESIGN NOTE (two times, one cell): the store keeps lastFrameAt (a real frame) and lastBeatAt (any byte, heartbeats included) separately, because a quiet daemon and a dead stream both leave an old frame behind and only the state word tells them apart. The rule prints the frame age with its basis flipping to 'stale' at the console's own 15 s, so a 40-minute-old frame on a LIVE stream reads as a quiet daemon, not a broken one. The dropped count is carried in the store and deliberately not printed: the row enumerates what the rule prints, and a number nobody renders is still better than a silence nobody can see.
# [2026-09-18] 2026-09-18 NOTE (who opens the stream): the rule calls connect() in its mount effect. It is the chrome that outlives every page and the surface that prints the connection, and connect() is idempotent, so the shell or a page row may call it too and get the same one stream. disconnect() exists for tests only (a single-file app lives until its tab does); it is exported and documented as such.
# [2026-09-18] 2026-09-18 TEST (35 across the four files the verify runs): 20 in tests/events.test.ts - the parser on hand-written frames including a frame split across two chunks, a heartbeat, CRLF, multi-line data, an unknown kind, and four shapes of unreadable frame counted; the backoff schedule up to its cap; connect() streaming with the bearer and going live; a stream that ends reopening with Last-Event-ID: 2; a frame resetting the backoff to one second; a 401 stopping the stream and handing it over; no key meaning no stream at all; a second connect() opening nothing; and subscribe/unsubscribe delivery by kind. tests/rule.test.ts gains the connection cell's three states, the never-a-frame case, and the stale-versus-measured basis. tsc is clean tree-wide, ast-grep and detect.mjs clean.
