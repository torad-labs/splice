guard = false
spec = '''
activity.html is the approved Activity page (prototype activity/final, console/activity.html, words in activity/final/NAMES.md), a new page, on live data: the requests splice sent to providers, and where the usage went. It is read, not driven: no rails, no composer.

What a person sees and can do once this is built:
- The header names the window every figure covers (`Last 7 days`, with its dates). This week: Requests, Output tokens, Input tokens · Cached, API value (plans cover it; not money spent), Paid (requests on API keys, real cost), Failed, Rate limited. The figures (`[data-fig]`) open their glass with where each came from.
- Requests per hour: the week drawn by hour (`.ac-col`), one colour per provider, failures marked under each hour; hovering reads the hour (`#read`), pressing opens it.
- Where it went: the window split by Providers, Accounts, Models, Projects and Sessions (`[data-where]`), each item with requests, output tokens, API value and failed; pressing an item filters Latest requests (`.ac-filter`, with a button to clear it).
- Latest requests: the newest requests (`.rw`, a failed one `.rw.is-bad`): time, outcome, provider and model, session and project, time to first token, duration, output tokens, API value. Outcome words exactly as NAMES.md: OK, Cancelled, Cut by restart, Rate limited, Connection reset, Empty response, Failed. Filters All, Failed, Cancelled; `/` searches sessions, projects, models and accounts (`.find-list`).
- Pressing a request grows its glass: its timing on one bar (`.rail-bar` with three segments: received → sent to provider → first token → done), Time to first token, Duration, tokens (input, cached, cache written, output), API value, account, session, project, request size, retries, and for a failure why (`.lx-out`).
- Its address (decided here; other pages link with it and nd-whole redirects to it): `activity.html?session=<id>`, `?project=<id>`, `?account=<label>`, `?model=<id>`, `?provider=<command>` (one filter, shown in `.ac-filter`), and `#request=<turn id>` opens that request's glass.

Where the data comes from: GET /api/perf/turns per head (rows; the daemon's folded totals per account, model, session and day with n=1, as today's usage.js reads them, so a week's figures are never a count of the newest rows), /api/economics (hourly buckets per command: requests, failed, rate limited, value), /api/heads, /api/status, /api/models (labels), /api/sessions (a session's name and project; Projects are folded from the per-session totals the way today's Usage folds them), /api/accounts. A figure nobody reported is a dash.

Not here: the full request document (nd-requests) and the 5 h / 30 d windows (nd-usage); requests.html and usage.html stay until those items.

Proven by: `bun test ./.campaign/checks/console-night-deck/activity.test.ts`: no rails, no composer; at 1440 and 3840 the stub's two requests are listed, the refused one says Rate limited, five or more figures with the first opening a glass, the other request's glass has the three-part timing bar and Time to first token; `?session=bbbb2222` filters to its one request and `#request=r-ok` opens that request.

## Decided once for every page of console-night-deck (the same text is in every page item)

- Files. A page is `<page>.html` plus its own `deck-<page>.css` and `deck-<page>.js` in app/src/main/resources/console. The kit is `deck.css`, `deck.js`, `deck-lens.js`, `deck-composer.js`, `deck-common.js` (item nd-kit); a page item never forks or restyles it, and a change the kit truly needs is made in the kit, kept general. Flat plain names, because ConsoleMount serves only plain names (and fonts/, brand/). The `deck-` prefix keeps the new files apart from the old console's until nd-whole removes the old ones.
- Frame. The page's HTML holds only its own field (`<main class="field" id="field"><section class="centre">…`) and its rails (`<aside class="glass rail rail-l|rail-r" data-lens aria-label="…">`), with `body` classes `no-rail-l`, `no-rail-r`, `no-comp` for what it does not have. deck.js draws the room, the nav (Sessions, Accounts, Teams, Providers, Activity, Settings, from its one list), the Night/Day switch, the need float and, unless `no-comp`, the composer. Scripts, in order: api.js, deck-lens.js, deck.js, deck-composer.js (composer pages only), deck-common.js, pilot.js, deck-<page>.js. Rails and composer: Sessions has the right rail and the composer; Accounts both rails and the composer; Teams, Providers, Activity and Settings none.
- Composer. deck-composer.js is the kit's one composer. A page tells it, from its own deck-<page>.js, what its context strip names and where Enter sends the text. Where deck-composer.js has no hook for that yet, nd-sessions-open adds one to the kit, kept general, and nd-accounts-signin uses the same hook for the manager (it waits on nd-sessions-open for that reason).
- The target is the approved prototype: `~/scratch/splice-redesign/night-deck/console/<page>.html` (open it first) and its source folder (accounts/final, sessions/i-teams-reader, teams/final, providers/final, activity/final, settings/m-machine): field.html, rail-*.html, page.css, page.js, page.json, test.ts, NAMES.md, and settings/USER-LANGUAGE.md. Keep its markup, classes, ids and data-* hooks (the checks and the prototype's test.ts select by them), its words exactly, its layout, glass and interactions. Only data.js is replaced, by live reads. Never copy a data.js, or any name, email, path or figure from one, into the repo, a test, a commit or a PR: tests use made-up data.
- Live data. Every figure, name and state comes from /api/* through api.js's API, polled no faster than today's page polls the same read. A figure nobody reported is a dash, never a zero (the rule today's usage.js states). A field the prototype shows that no read gives is added as a GET in the module that owns the data, with a Kotlin test of what the route answers; never derived from a snapshot or invented. The console shows what the data holds, names, emails, accounts and per-person usage included; nothing is masked or left out: the console is the person's own view of their own Splice, and the privacy rule binds the repo, checks, cases, commits and pull requests, never what the running page shows.
- Writes go to the route today's console uses for the same act, and the control says what the daemon answered, in the kit's words (Deck.saveState: saving, Applied, At restart, Not saved with why; the old value comes back on a refusal).
- Words: plain developer words from NAMES.md / USER-LANGUAGE.md and the prototype; no agent jargon, no internal Splice names, no question headings, no sentence captions. Choices are never pill buttons.
- No raw values: the page's CSS and JS pass `bun tools/console/deck-raw.ts` (nd-kit), which the gate runs.
- Old tests: the tools/console tests this item names pin the old page. Each is rewritten for the new page where what it pins is in the approved design (same behaviour, new markup), or deleted where the approved design dropped it; the commit message names each one and which. New tools/console tests check only what a user sees or what a route returns, through the real page against a stub daemon with made-up data. Shared old files (kit.js, console.js, console.css, tokens.css, composer.*, knobs.*, reqview.*, perf-heads.*) stay until nd-whole; the old page's own files go in this item. A tools/console test this item breaks is this item's to rewrite or delete, even when another item names it (the gate runs them all on every push); a test another item names and this one does not break is left to that item.
- Links between pages use the addresses decided in nd-activity and nd-providers: `activity.html?session=|project=|account=|model=|provider=<value>`, `activity.html?win=5h|7d|30d`, `activity.html#request=<turn id>`, `providers.html?cmd=<command>`, `providers.html?open=compare|add`.
- Commits and the pull request carry no Claude author, co-author trailer, session link or "Generated with" line, and go through the active gh account, which is never switched.
