# [2026-08-31] 2026-08-31 REDO, escalated by codex-splice and accepted: the ordering patch above was the WRONG SHAPE and never reached a commit, so this row's single landing change is the redo. codex mutation-proved from the scanner source that the same root cause - reading brace depth off text that still contains non-syntax - also produces FALSE NEGATIVES in the other direction: a close brace inside a block comment, and a close brace inside a char literal, each popped the real depth, closed the failure span early, and let a genuine raw dollar-it render go unseen. A false negative makes the green gate a lie, which is worse than the URL false positive that opened the row. Ordering tweaks cannot reach this class - a per-line regex structurally cannot span a block comment opened on one line and closed on another. REPLACED failure_spans' per-line stripping with mask_source, a single stateful lexical pass over the whole file that blanks normal strings, raw triple-quote strings, char literals, line comments and block comments, carrying block-comment and raw-string state ACROSS lines; brace depth and the failure-combinator search now read only what survives. renders_throwable still reads the RAW line, because the interpolation lives inside a string. Three new permanent arms carry codex's fixtures verbatim - 12e block comment containing a close brace, 12f char literal holding a close brace, 12g the multi-line block comment the per-line regex could never express - each asserting the violation IS still found; 20 arms total. EXACT-PRE-FIX REPLAY, not a reconstruction: the new 20-arm selftest run against git show HEAD (7559c950) of the scanner reds FOUR arms - 12d URL expected rc 0 got 1, and 12e, 12f, 12g each expected rc 1 got 0 - which is one false positive plus three false negatives on the committed baseline, all green after. Restore byte-identical sha256 e991ab7fe8a0b780739f18b71ff65a9833ed02e0ac574f4592db5b65e8d36432. My first hand-written mutant reproduction was WRONG (i