title = "PassthroughTerminalState.kt:122 maps model_context_window_exceeded to ErrorType.API_ERROR with a bespoke message, defeating the compaction contract its sibling classifier documents as the entire point. UpstreamFailureClassifier header states the law: overflow must be INVALID_REQUEST and must carry the phrase prompt is too long, which is Claude Code compact trigger phrasing. This stop-reason path never reaches that classifier because it is a STREAM TERMINAL, not an HTTP error, so it produces API_ERROR which CollectingTerminal.statusFor turns into a 502 whose message matches no trigger. Concrete: a Kimi passthrough session grows past the context window; instead of a 400 plus prompt is too long that makes Claude Code auto-compact and continue, the user gets a 502, and every subsequent turn re-sends the same oversized history and hits the same wall — a deterministic failure surfaced in the one shape that invites replay — until the user notices and compacts by hand. Fix: map it to INVALID_REQUEST with the prompt is too long prefix, reusing UpstreamFailureClassifier.overflowFailure so the one contract has one implementation. Kimi byte-identity is NOT at risk here (this is an error-path classification, not a built request), but confirm that explicitly in the item note before landing."
