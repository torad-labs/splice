proof = "2026-09-21: two mutations. (a) openai-chat's canary sentence renamed away -> wall RED (the byte-identity canary test is gone for openai-chat) and CompactionIsATurnLawTest RED (4 tests, 1 failure). (b) the chat builder pinned an effort on compact (`val effort = if (compact) \"compact-pin\" else ...`) -> wall RED (openai-chat reads the compact flag while building the request), the law RED, AND the byte-identity canary itself RED (ChatRequestBuilderTest 19 tests, 1 failure) on that one mutation. Restored, wall GREEN and 19/19. The canary is the real guarantee and stays where it is: it compares the two request bodies byte for byte, so it catches a reshaping anywhere in the builder's call graph. What the law adds is the thing a canary cannot do for itself -- every *RequestBuilder.kt found by sweeping must have a canary in its module, so a fourth dialect cannot ship without one, where the wall carried two hand-written maps of five and three paths. Its token ban is scoped to builders on purpose: widening it to dialects/ was measured and reds correct code, since seven compact reads live in the response path and the cache policy (ResponsesTurnSeams.kt:57-77, ReasoningCachePolicy.kt:23, ResponsesOutcomePayload.kt:41) where consulting the flag is right"

