# [2026-09-18] READINGS AND THREE CROSS-ROW FINDINGS. (A) PRIMITIVE DEFECT, shared/ui, not my fence: a StripField's 'width: <w>ch' is declared on the BOX, so ch resolves against the box's inherited font, not the value's. When --text-1..6 changed to 12/14/16/18/20/23px (4a4b99f1) the value text grew 23% and the box did not, and every strip field began clipping. Two lines on .myx-sfield fix it for good (font-family: var(--font-figure); font-size: var(--text-3)) plus one restoring the label face for non-figure values; both are scoped in widgets/head-strip/head-strip.css because ui.css is outside this fence, and the same three lines are needed there for EVERY page. (B) PRIMITIVE DEFECT: .myx-sfield is a flex item with default flex-shrink 1, so an overflowing rack squeezed all nine columns below their declared widths instead of scrolling the bay - one overflow truncated nine fields at once. Fixed the same way (flex: 0 0 auto), same file, same request to hoist. (C) LAYOUT, mine: measured after the type change, a nine-field head strip needs ~123 characters of value width = ~1206px with its field padding. Beside a 24rem detail column the bay is 970px, so the rack overflowed and the bay CLIPPED the tail of the window field and all of 'last turn' - the clipped-text defect the operator had seen. pages/fleet/fleet.css now drops the detail column under the bay below 1600px rather than below 1120px, which is the brief's own responsiveness rule; measured after: bay 1366px, strip 1348px, zero clipped fields. (D) 'last turn' is fed by the gate's live list, the only turn source among the three routes the title names: a head with nothing in flight prints 'no turn in flight' rather than a zero, and a LANDED turn's time needs /api/perf/turns (V4-127). (E) 'dialect' is two hops through the topology payload (heads.<key>.provider -> providers.<name>.dialect); with /api/topology still V4-128 the field reads 'not built' and the page prints one honest empty naming V4-127 and V4-128 rather than nine bare placeholders. (F) account excluded is left false in the head signals rather than guessed: the pool route is V4-132 and a head must not read as excluded on a route nobody has read. (G) Buttons are raw <button> in the page's own CSS, as on the accounts page: CONTRACTS.md section 2 retires Btn/ConfirmBtn when M2 removes their last consumer. (H) The provider mark is a two-letter monogram (cg, gk, km, ms, an, ak, lo), not a glyph set, because a symbol table would be an icon system smuggled in as text; it carries no colour, per the brief. (I) No capture fixture: #/fleet renders seven real heads from the running daemon, which is a truer artifact than sample rows. (J) The Rule's nearest-window line: @entities/usage now exports nearestWindow(usage, auth) with the same signature and semantics the rule bar already implements locally, so adopting it is a one-line change in widgets/rule - which is M1-03's fence, so it is exported and reported rather than edited from here.
