dated = "2026-10-22"
names = ["ChildReaped", "Generation"]
reason = """ChildReaped observes whether one child process has been reaped. Generation checks whether a decoded stdout message still belongs to the hosted server's active child generation. A reaped child is not necessarily current, and a current child is not necessarily reaped; substituting them would make cleanup retire a live generation or keep a dead one."""

# ── 2 names, (Process,McpProcessGeneration) -> Boolean ────────────────────────────────────────────
[[groups]]
signature = "(Process,McpProcessGeneration)->Boolean"
dated = "2026-10-22"
names = ["FailureRelease", "LaunchAdoption"]
reason = """LaunchAdoption attaches a newly launched child and its generation to hosted ownership. FailureRelease releases that same pair after a hosted transport failure. The first makes a generation eligible to serve and the second removes it after failure; confusing them either retains a failed child or drops a successful launch."""

# ── 2 names, (McpWriteTarget) -> Boolean ───────────────────────────────────────────────────────────
[[groups]]
signature = "(McpWriteTarget)->Boolean"
dated = "2026-10-22"
names = ["McpFenceHeld", "McpWriteTargetAcceptance"]
reason = """McpFenceHeld recognizes an already sealed, live generation so replacement-owned reverse work can publish only under that exact fence. McpWriteTargetAcceptance admits new writes only to an open, unretired target. Their Boolean answers describe opposite states, so swapping them would accept writes after sealing or reject work protected by the held fence."""

[[groups]]
signature = "()->Collection<String>"
dated = "2026-10-25"
names = ["CodeModeOnlyModels", "CodeModeOriginalImageModels"]
reason = """CodeModeOnlyModels selects backend models whose tool_mode requires the exec surface. CodeModeOriginalImageModels selects models that permit original image detail. Surface eligibility and image-detail capability are independent published model facts; substituting these roles would enable exec for an image-capable model or allow unsupported original images. Both ports read the current roster on each turn."""

# ── 2 names, (Throwable) -> Unit ─────────────────────────────────────────────────────────────────────────────
[[groups]]
signature = "(Throwable)->Unit"
dated = "2026-10-25"
names = ["NativeGrpcSessionFailure", "NativeGrpcTransportFailure"]
reason = """NativeGrpcTransportFailure reports a broken byte connection, which invalidates the native host process and every session using it. NativeGrpcSessionFailure reports a failed lease or subscription, which invalidates only its owning session. Swapped, a dead connection would leave its other sessions waiting on it, and one session's failed lease would end every session on a healthy process."""

# ── 2 names, suspend () -> JsonObject ────────────────────────────────────────────────────────────────────────
[[groups]]
signature = "suspend ()->JsonObject"
dated = "2026-10-25"
names = ["ListingAsk", "NativeGrpcCommand"]
reason = """ListingAsk is the tools/list request the MCP listing cache sends a hosted child when it holds no listing, and the cache keeps its answer. NativeGrpcCommand is one native gRPC operation's body, whose JSON result the bridge sends back as the response frame for that request id. A command wired as the cache's ask would keep an operation's result as a tool listing, and an ask wired as a command would answer a native request with a listing."""


[[groups]]
signature = "(String,SessionEnding)->Unit"
dated = "2026-10-27"
names = ["SessionEndingChanged", "SessionWakeEvent"]
reason = """These are different parameter types whose package names the signature census intentionally omits. SessionEndingChanged publishes a newly retained splice.head.perf.SessionEnding from one head after state publication; its fields include outcome, account, resetEpochSeconds and ts. SessionWakeEvent carries splice.sessions.http.SessionEnding after app-owned SessionPerfFacts resolves head identity, display account and reset/resume milliseconds for session wake scheduling. A raw per-head perf event cannot be passed where the interpreted session-ending event is required: Kotlin rejects the different DTO types. The app adapter performs that conversion and supplies the head name, keeping sessions independent of turns rather than collapsing the two domains onto one event port."""
