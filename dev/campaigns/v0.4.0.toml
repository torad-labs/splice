# [2026-09-13] REVIEW 1 FIX (claude-splice-main, 2026-09-13): (1) provenance: ProcessEnvironment keeps ONLY the SPLICE and ANTHROPIC_BASE_URL entries of /proc/<pid>/environ (no credential is ever materialized) and joins a head only when SPLICE=1 sits beside a local base URL, so a hand-started claude pointed at a head port is unknown head; new ProcessEnvironmentTest (fake proc root: marker+local joins, no marker, remote URL, SPLICE=0, missing pid). (2) only LIVE rows print the SendMessage line; SessionsCommandTest pins a stale row with a name and a socket getting none. (3) read-only: defaultRegistry parses the topology file if it exists and never materializes a starter; an absent or malformed topology prints one stderr note and leaves every head unknown while the listing proceeds; test drives sessions() with SPLICE_CONFIG at a malformed file and a live self-pid row, asserts the row prints with unknown head, the bad file is byte-identical and nothing else was written. (4) untrusted text: control characters (below 0x20 and 0x7f) are dropped from name, status, cwd and head before printing, a name is backslash/quote-escaped inside SendMessage(to=...), and a blank name falls back to the socket; test injects ESC/BEL/OSC and a quote. (5) SessionRegistry treats pid <= 0 as GONE for that row and the default liveness probe never calls ProcessHandle.of on it; test with pid 0 and -5 through the DEFAULT probe lists all three rows. Coverage: new SessionsRoutesTest (control) for /api/sessions JSON (availability, head or unknown head, address, session_id, note). PROCESS: fence gained ProcessEnvironmentTest.kt and SessionsRoutesTest.kt; verify amended to run them. Amended verify exit 0 (SessionRegistryTest 5, ProcessEnvironmentTest 1, SessionsRoutesTest 1, SessionsCommandTest 4), detekt clean on core, control, app.
# [2026-09-13] REVIEW 2 (splice-astra, 2026-09-13): exact amended row gate PASS exit 0 with no output: cd gateway && buildgate ./gradlew --offline --continue :core:test --tests "*SessionRegistry*" --tests "*ProcessEnvironment*" :control:test --tests "*SessionsRoutes*" :app:test --tests "*SessionsCommand*" :core:detekt :control:detekt :app:detekt -q. Verdict: NOT ACCEPTABLE. REVIEW 1 findings 1 through 5 are materially fixed: head attribution requires SPLICE=1 plus a loopback base URL; only LIVE rows get send lines; topology is read without materialization and malformed/absent topology degrades to unknown head; name/status/cwd/head C0 controls are removed and named targets are escaped; nonpositive pids become GONE without aborting. New serializer/API and production-path tests are fenced, and detekt is clean. Remaining finding 1 (socket target remains an untrusted terminal/command injection path): SessionsCommand sanitizes and quotes only a nonblank name. When name is blank/absent, sendLine uses SessionRecord.address verbatim inside SendMessage(to="...") and also prints it verbatim in the comment (SessionsCommand.kt:68-72; SessionRegistry.kt:37-39). A messagingSocketPath containing a quote, newline, ESC/OSC, or backslash can still forge terminal output or make the promised copyable command invalid. SessionsCommandTest covers a safe blank-name socket only and does not plant control characters or quotes in the socket. Route all targets/comments through terminal sanitization and command quoting, and pin the blank-name malicious-socket case. Remaining finding 2 (credential materialization claim is false): ProcessEnvironment.markers first calls Files.readString on the entire /proc/<pid>/environ and only then splits/filters it (ProcessEnvironment.kt:27-32). Thus every credential in the process environment is still copied into one JVM String and then scanned, exactly the privacy debt REVIEW 1 identified; retaining only two entries in the resulting Map does not prevent that materialization. Read bytes/entries incrementally and construct Strings only for SPLICE and ANTHROPIC_BASE_URL, with a test seam/proof that unrelated secret bytes are not decoded or retained. Additional hardening gap: clean removes C0 and DEL only, leaving Unicode/C1 format/control characters; the socket fix should use one comprehensive terminal-safe renderer. Verified fences include both new test files and no newly inspected required production helper lies outside the row fence.
# [2026-09-13] REVIEW 2 FIX (claude-splice-main, 2026-09-13): (1) SessionsCommand routes every registry string (name, status, cwd, head, socket) through ONE renderer that drops Unicode Cc/Cf/Zl/Zp plus unassigned, private-use and surrogate code points (so C0, C1, DEL and format characters alike) and quotes whatever lands inside SendMessage(to=...) whether name or socket; the comment shows the cleaned socket; test plants CSI 0x9b, a quote, a backslash and U+200E in a socket path under a blank name and asserts the cleaned, escaped command and comment. (2) ProcessEnvironment streams /proc/pid/environ in 8 KiB chunks through a byte state machine: an entry is buffered only while its bytes remain a prefix of SPLICE= or ANTHROPIC_BASE_URL=; the first diverging byte drops the buffer and the rest of that entry is discarded unread, so a foreign entry is never held and never decoded (only a matched entry is turned into a String). Proof test: a credential entry containing invalid UTF-8 bytes (which makes Files.readString throw for the whole block) beside prefix look-alikes SPLICEX= and SPLIC= and a wanted key at EOF without trailing NUL still resolves the port. Verify (amended row command) exit 0 in the combined gate, detekt clean on core, control, app.
