reason = """CodeModeJsonFieldEncounter checks a JSON field name before its colon/value, preserving serde duplicate-field error positions. CodeModeJsonField consumes that field value after its colon. Swapping them would read a value before its colon or delay the duplicate refusal until after its value; neither reports text or acts on an identifier. ReasoningTextEmitter forwards readable model reasoning through Responses summary folding. It does not log diagnostics, commit executable source or write raw SSE frames. A diagnostic sink would lose model reasoning, a source commit would persist prose as executable source, and a raw wire sink would bypass reasoning-block framing. CodeModeQueryPreparation sweeps and saves exactly the conversation a query is about to read while holding its key. It neither reports text nor releases that conversation. A diagnostic sink here would leave stale owners available to a retry, and a session-end callback would dispose the engine during an ownership query. NativeAuthAnnouncement carries only a validated native authorization URL to login progress, never raw child output or credentials; a diagnostic or client-wire sink in that role would publish the URL to the wrong audience. CodeModeSourceCommit makes an accumulated executable source prefix durable before a cursor can hand it to the worker. It is a persistence ordering boundary, not a diagnostic or wire sink. Wiring LogSink there would let uncommitted bytes execute, and wiring the commit where a text report belongs would persist diagnostic text as source. CodeModeSessionEnd releases the native engine for one expired conversation key, never renders or logs that key; wiring a diagnostic sink there would leak engines and wiring a release callback where LogSink belongs would close active guest state. Six text destinations plus that lifecycle command share the string shape, and the split that must not compile is diagnostic plane versus client wire. TerminalOutput (core/terminal, 2026-09-23, LAYOUT-01) writes one operator-facing line to the terminal a CLI verb runs in — model listings and the sign-in flows' progress both leave through it, which is why it replaced the two per-feature copies (ModelReportOutput, LoginOutput) that had the same role under two names; it is not daemon diagnostics and not client protocol frames. LogSink writes a DIAGNOSTIC to the daemon log and stderr, head-scoped so every line carries its `[<headKey>]` prefix. MalformedLine reports one unparseable upstream SSE line, and its contract is that it is "a REPORT and not a throw" — a malformed frame must never crash the stream. RawSseWrite puts BYTES ON THE CLIENT SOCKET (the bottom rung of the write-port ladder). RetryNotice is client- and operator-facing text about a retry already decided — "a NOTICE, not a decision", and the only account an operator gets of a 429 cooldown or a stream re-issue. A LogSink wired where RawSseWrite was meant sends the client nothing and the turn hangs; the inverse writes daemon diagnostics into a transcript. RigProgress (app/cli/setup, 2026-09-24) carries one line `rig up` wrote to its stderr into the setup wizard's spinner as the line arrives — PROGRESS for a redraw, never a result, never logged, never written to a client; wired where TerminalOutput was meant it would print rig's whole build log over the wizard, and wired where LogSink was meant it would bury the only sign a 7 GB download is moving in a daemon log nobody is reading during setup. LoginJoined (caec32f94) tells the daemon a login joined the named head, so the sessions a plan limit stopped can be woken; SessionActed (019b7a320) records that a person acted on the named session from a card. Both take an identifier, never text to show, and they act on different subjects: wiring one for the other would wake sessions when he answers a card, or mark a session handled when a login is added. Neither is a sink, so a LogSink or TerminalOutput in either place would drop the event silently. HostedSpawnTearDown disposes a spawned child when its handshake is cancelled or refused; it owns process teardown, not a client request. PendingFailure resolves one pending hosted request with its own failure text; sending that text to a general sink would leave the request pending, while a pending-failure callback in a sink would answer a request that never failed."""

