# [2026-09-15] SLOT — complete design, zero design freedom. Independent of every widget row, which is why it runs in parallel. (1) Internal class SetupDetection over INJECTED seams only: an env reader, a credential-presence probe, and a daemon-up probe. No direct File or System.getenv inside the detector, so the whole matrix is testable without touching the machine. (2) It answers what splice already knows and currently throws away: which splice-owned credential files under the auth dir hold a credential (take the paths from AuthKindRegistry rather than typing them, so a new kind is in scope with no edit here), whether OPENROUTER_API_KEY is set, and whether a daemon answers on the control port. (3) Emit an immutable detection value plus a suggested starting point, mirroring how torad suggestPreset maps Kotlin to full and TypeScript to standard. (4) PRESENCE ONLY, NEVER CONTENT - the probe reports whether a credential file exists and is non-empty and must never read, log or return a single byte of it. This is the same law DoctorAuth already follows by reporting secrets by presence. (5) The test is a matrix over the injected fakes covering at minimum: fresh machine with nothing present, OPENROUTER_API_KEY only, one OAuth credential present, all credentials present with a daemon running, and a daemon that does not answer.
