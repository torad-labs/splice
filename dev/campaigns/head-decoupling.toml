title = "Harden the e2e harness — the mapper run found the harness itself is the risk, not the gateway: (3) SAFETY, must land before claude-splice ships — WANTED_HEADS (heads-e2e.sh:30) is dead (assigned, never read) and discovery iterates every head /api/heads returns (:255-268), so a client-auth head gets probed automatically; stream_probe.py:150-153 sends Authorization: Bearer <mgmt>, HeadServer.authorize short-circuits true (HeadServer.kt:478) and forwardedClientHeaders copies that header upstream verbatim (:398-402), sending the daemon's own 32-byte key to api.anthropic.com. Teach discovery the auth kind: skip client-auth heads in tier 1 with an explicit reason, or send a SPLICE_E2E_CLIENT_TOKEN when supplied. (5-harness) perf_rows_ok (:177-198) reads only ts/outcome/total — assert attempts==1, retries==0, refreshes==0 on a clean tier-2 run. (6) that same function filters outcome=='ok', so a failed turn's row is structurally unreadable and the harness cannot fail on a head that is alive but wrong — count non-ok rows in the window and fail if any appeared. (DEFECT) the cheap-model regex mini|spark|flash|lite matches nothing in the Anthropic catalog, so an anthropic-passthrough head silently probes the most expensive model available."
