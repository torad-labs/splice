rip); prefers-reduced-motion sets every --dur-N to 0ms. CONTRAST WALL: rewrite webui/tests/contrast.test.ts to parse tokens.css at test time (both theme blocks; never a hand copy of values) and assert AA for every pairing the contract names: 4.5:1 for --ink, --ink-mute, --ink-strong on --room and --room-deep, --strip-ink and --strip-ink-mute on --strip and --strip-field, --scope-ink on --scope; 3:1 for each --edge-* on --room and on --strip; both themes; the test also proves it can fail (a fixture pair below AA is reported by name). THEME TEST webui/tests/theme.test.ts: default dark with no stored value, stored light wins, reduced motion zeroes durations; pure functions, no jsdom. The old contrast test pinned a token sheet that no longer exists; replacing it is the row, not a deviation. Read /home/user/.claude/skills/impeccable/reference/craft-floor.md and .dev/web-console/CONTRACTS.md before editing."
