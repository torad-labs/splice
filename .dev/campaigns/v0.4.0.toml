# [2026-09-13] [2026-09-13] REVIEW 1 (splice-astra): exact row verify PASS (exit 0, no output). Adversarial read of commits 8de134e8, 47179d51, f145ba9b found BLOCKERS: (1) HostedServer.kt:128-156 remaps notifications/cancelled by client id only, ignoring Pending.sessionId; two sessions using id 7 can cancel each other's call, and unmatched ids are forwarded raw. (2) HostedServers.kt:34-44 + HostedServer.kt:104-105,143-172,191-197,236-243 have generation/lifecycle races: capacity can evict a published-but-not-started server whose close returns early, after which it starts orphaned outside the registry; cancellation during handshake leaks the child; an old pump can pass its identity check, race a replacement during waitFor, then clear the replacement. (3) McpHost.kt:119-132 fabricates the client-requested protocolVersion over the child's negotiated value; McpRoutes.kt:26-29 never reads/validates mandatory MCP-Protocol-Version on later requests. (4) McpSharing.kt:102-116 checks expansion only in args/env, not command, and detects only exact absolute-directory values: command='${HOME}/bin/mcp', args='.'/'./repo'/'--root=/abs/repo' are wrongly shared; HostedServer.kt:175-181 advertises roots then answers roots/list empty, changing root-dependent servers instead of leaving them per-client. (5) tools/list is never cached; every session forwards a fresh call (McpHost.kt:135-160, HostedServer.kt:110-125). (6) launch identity includes name and HostedServers is name-keyed (McpSharing.kt:27-33, HostedServers.kt:22-43), so aliases with identical expanded command/args/env spawn separate processes despite tuple identity. (7) notify delivery failures are swallowed and HTTP 202 is returned; runCatching also swallows coroutine cancellation (HostedServer.kt:128-133,210-222; McpHost.kt:141-147). (8) /api/mcp infers hosting enabled when disabled with an empty global set and exposes only session counts, not required per-session ownership (McpStatus.kt:18-46). (9) checks/mcp-host/bench.py:152,197-217 is fail-open: it does not require session exit 0, per-server activation/tool-surface parity, or >50% savings; a mostly failed hosted run can write a high-savings receipt and exit 0. The receipt's gitignored/ledger-only policy is acknowledged; the blocker is the harness's false-proof behavior, not file absence. Verdict: NOT ACCEPTABLE until these contract failures are fixed and regression-tested.
# [2026-09-13] REVIEW 1 FIX (orchestrator, 2026-09-13), by finding: (1) notify(sessionId, msg) remaps cancelled by (session, client id) and DROPS a cancel that names no request of its own session — test 'a cancel is remapped to that session's own request and dropped when it names none' (fake server now echoes cancelled ids on its notification stream). (2) HostedServer: stateLock + closed flag — close() marks closed and a spawn landing after it destroys its child and throws; launch() adopts the process under the lock; handshake cancellation tears the child down (CancellationException rethrown); the pump compare-and-clears under the lock so an old child's EOF never clears a replacement; failed handshakes use tearDown (respawnable) not close (permanent). (3) initialize returns the child's result verbatim (child's protocolVersion recorded on the session); MCP-Protocol-Version on later POST/GET must equal it or 400 — test 'a later request must name the negotiated protocol version'; Claude Code 2.1.257 accepted it live. (4) McpSharing checks expansion in the command too, rejects '.', './x', '../x' as relative (project-scoped), and finds directories behind flag values (--root=/abs) and env values; the host advertises NO capabilities (no roots) — McpSharingTest case added. (5) tools/list caching DECLINED: would have to honour tools/list_changed and per-session capabilities; the child answers immediately. (6) HostedServers is keyed by McpIdentity(command,args,env): aliases share one process, a rebinding name releases the old tuple only when no alias remains, eviction is per identity — test 'aliases with an identical launch tuple share one process and a different tuple does not'. (7) notify returns whether the child took it; McpHost answers 503 in words when not, 202 otherwise; no runCatching in the path. (8) /api/mcp hosting = planner.enabled; session_ids per server — tests added. (9) bench.py fails closed: any non-zero session exit, a differing/empty tool surface, or saving < 0.5 prints BENCH FAILED and exits 1 with no receipt. GATE: McpHostTest 13/13, McpRoutesTest 2/2, McpSharingTest 5/5, detekt core+control clean. LIVE on jar 871c2c45: 4 sessions x {ast-grep, remotion-docs, figma-comments}: one child per server (pids 1943484/5/6), 4 session_ids each, restarts 0, unhosted 2,228,772 kB vs hosted 538,848 kB = 0.758 saving, tools 9/9/9/9 both modes, bench exit 0.
# [2026-09-13] [2026-09-13] REVIEW 2 (splice-astra): exact row verify PASS (exit 0, no output) on HEAD eb868145. Review-1 fixes materially close session-scoped cancellation, tuple identity, status ownership, notification failure, and protocol fabrication, but FOUR BLOCKERS remain. (1) McpHost.kt:86-89 explicitly accepts a missing MCP-Protocol-Version, McpHostTest.kt:171-178 pins missing as 200 despite naming the test 'must name', and McpRoutes.delete:70-73 never validates the header; post-initialize requests must name the negotiated version or 400. (2) HostedServer.handshake checks p.isAlive at :233-237 then publishes initResult unsynchronized at :239; close can clear/kill under stateLock between those operations, after which initialize still succeeds and creates a session for a dead/unbound server. Publish only while the same process is live and not closed under stateLock. (3) McpSharing.kt:111-125 checks relative syntax only on the whole value and probes directories only when absolute, so option-relative --root=./repo and bare existing relative directory repo remain wrongly hostable despite being client/project scoped. Apply relative/directory checks to bare and flag-extracted candidates. (4) bench.py:152,197-205 still discards tool identities into one total count per session; equal counts can hide a missing server/tool replaced by another and do not prove the review-required per-server activation/tool-surface equality. Retain and compare exact tool-name sets grouped by configured server. Verdict: NOT ACCEPTABLE until fixed and exact gate re-passes.
# [2026-09-13] REVIEW 2 FIX (orchestrator, 2026-09-13), by finding: (1) DECLINED AS SPECIFIED, PARTLY APPLIED: MCP Streamable HTTP says a server that receives no MCP-Protocol-Version header falls back to what it can identify otherwise, naming the version negotiated at initialize as the example; the host has exactly that per session, so absence rides the negotiated version and any other named version is 400 — McpHost.protocolAccepted now documents this with the spec wording and the test is renamed to say what it pins; DELETE now validates the header too (400 on mismatch, session untouched) — McpRoutesTest asserts it. (2) handshake publishes initResult under stateLock only while THIS child is adopted, alive and not closed; otherwise tearDown + reject. (3) McpSharing checks every value bare AND as a flag payload for relative syntax and for naming an existing directory (a bare 'repo' that IS a directory is refused; flags themselves are not probed) — new McpSharingTest case (--root=./repo, repo, --mode=repo refused; --stdio hosted). (4) bench.py reads the tool surface from Claude Code's own stream-json system/init event (tools loaded + mcp_servers status), never prose (prose once named tools of servers the session did not have), compares exact tool-name sets per server and requires status connected per server per session. Exact row verify exit 0 (McpHostTest 13, McpRoutesTest 2, McpSharingTest 6). LIVE bench on jar 44e92ae1 (isolated daemon :3196, 4 sessions x ast-grep,remotion-docs,figma-comments): every session connected to all 3 servers in both modes, tool sets identical per server (9 tools), one child per server, server RSS 2131696 KB unhosted vs 640576 KB hosted = saving 0.699, daemon RSS 176748 KB.

