title = "No pre-dispatch context-overflow check, and an empty compaction is told to 'retry' forever || PROBLEM: splice knows each head's context window and knows the request it is about to send, and never compares them. Overflow is discovered only as an upstream rejection, after quota is spent. Worse: when the *compaction* turn is what overflows (or otherwise returns nothing), the pipeline emits `api_error: 'compact returned no content from model — retry'`, and Claude Code retries the identical, deterministically-failing payload. That is the exact codex deadlock — a thread that can neither proceed nor compact, recoverable only by abandoning the session. || SPLICE TODAY: `gateway/gateway/src/main/kotlin/splice/gateway/head/HeadServer.kt:352-370` (`prepareTurn`) validates only `provider.catalog.contains(parsed.typed.model)` — no size comparison — even though `ModelCatalog.contextWindowFor` exists (`ModelCatalog.kt:75`) and is already called for the usage payload (`TurnDriver.kt:752`) and launch recipes (`Daemon.kt:726`). `gateway/provider-spi/src/main/kotlin/splice/spi/UpstreamFailureClassifier.kt:22-27,124-127` already knows how to rewrite an overflow into Claude Code's compaction-trigger phrase — but only reactively, after the 400. The retry-shaped compaction terminal is … || PROPOSAL: Two moves. (1) **Pre-dispatch**: estimate input tokens once at build time (reusing CX-03's corrected estimator) and when the estimate exceeds the head's window, fail *before* the upstream call with the overflow-classified message the classifier already produces — same signal, seconds earlier, zero quota burned. (2) **Break the loop**: record the compact attempt against `TurnMeta.conversationKey` in `CompactStats` and, on the second consecutive `empty_model`/overflow compact for that key, emit a terminal that does *not* say 'retry' and names the manual escape ('compaction cannot fit this transcript — start a new session or reduce context'). Never hand Claude Code a retry instruction for a deterministic failure. This does not violate the locked no-transcript-shrinking / no-fake-summaries rules: it rejects and … || EFFORT/RISK: M. **Risk** **Hard dependency: CX-03 must land first.** The estimator today is raw-bytes/3 and shipping the pre-flight rejector on it would reject every image-b || VERIFY-SPEC: `HeadServerIntegrationTest.kt`: a body whose estimate exceeds the catalog window is rejected before any upstream call (assert `mock.upstreamBodies` unchanged — the existing count_tokens test already uses that shape). A `TurnPipeline`/`CompactStats` test: the second consecutive empty compact for one `conversationKey` emits the non-retry wording. Gate: `npm run gate` + `checks/e2e/heads-e2e.sh --tier 1`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### CX-15'"
