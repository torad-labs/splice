# [2026-09-01] 2026-09-01 REDO ACCEPTED AND FIXED. codex-splice's adversarial replay found FOUR real defects in the shipped probe and grok-splice independently reproduced all four plus a fifth. Every one came from the same root cause, which I had not named: A NUMBER A HOSTILE FILE CHOSE IS AN INPUT, NOT A FACT. I wrote the parser as if headers were well-formed and then claimed a fail-open law on top of it. (1) A 32-bit PNG width read into a signed Int made 0x80000000 NEGATIVE, so ImageFloor reported a huge image as under the floor and DELETED it - fail-CLOSED, the one direction this policy must never take. (2) A JPEG SOF declaring length 2 - an empty segment - had height and width read out of whatever bytes followed and returned a confident 1x1. (3) A WebP VP8X declaring size 1 had ten bytes read past its own end, and that direction FORWARDS an undersized image, so the borrow lies both ways. (4) A WebP chunk declaring 0xFFFFFFFF overflowed the walk cursor negative and threw ArrayIndexOutOfBoundsException - a crash out of a parser whose stated law is that failure is always null, on exactly the turns this row exists to protect. (5) grok's sweep for siblings: PNG ignored IHDR's own declared length, the same borrow in a third format. FIXES: every multi-byte read is unsigned into a Long; a dimension outside 1..Int.MAX_VALUE is UNKNOWN rather than small (so zero is a broken header, not a tiny image - the old zero-is-under-the-floor arm was itself wrong and is retired); PNG checks IHDR's declared 13; SOF requires its declared length to cover its own fields; every RIFF reader is bounded by the size its chunk DECLARED as well as by the array; the cursor is a Long and a zero-size chunk breaks BEFORE parsing. SEPARATELY, codex caught probeBase64 filtering whitespace across the ENTIRE payload before taking 128 chars - the header-window law was a comment the code contradicted, and a multi-MB screenshot was copied in full, twice for an undersized one. It now stops at the window, and the parameter is a CharSequence so a counting fake can PROVE it: the law is an assertion now, not a sentence. Also corrected a claim both seats flagged from opposite directions and were each half right about: the shipped config/splice.example.toml puts providers.xai on openai-responses while the operator config behind the DR-152 soak has it on openai-chat. Both are live. That is the actual argument for putting the floor on BOTH profiles, and all four of my comments now say so instead of picking one. EVIDENCE: core 258 tests 0 failures (26 DR-155 arms across three classes - note the multi-class trap, MalformedHeaderTest is a third class in the same file and codex hit that trap too). 23 mutants total, ZERO survivors: the original 16 re-run against the restructured probe, plus 7 hardening mutants each restoring one hole exactly - Int overflow, zero-as-small, PNG length ignored, SOF length ignored, chunk size ignored, cursor wrap, and whole-payload scan. Every restore byte-identical by sha256.
