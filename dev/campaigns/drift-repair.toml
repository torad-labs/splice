[[items]]
id = "DR-10"
phase = "responses"
title = "state.upstreamFailure is the WIDEST feeder into RETRYABLE and was never audited — a superset of the DR-2 seed. Every response.failed event whose text misses three regexes becomes API_ERROR and is then handed a non-null partial even when the round produced NOTHING, which after e00ecdc routes to the verbatim whole-request restart. Orchestrator-VERIFIED: UpstreamFailureClassifier.kt:131 is a bare `else -> ClassifiedFailure(ErrorType.API_ERROR, ...)`, reached because onFailure classifies with FailureSource.SSE and NO status so classifyContent falls through to statusFallback(null, msg). ResponsesTerminalDecision then attaches partial = payload.partialOrNull(state), non-null for every non-compact turn regardless of content; eligible() passes since API_ERROR is in RETRYABLE; hasSalvage is false on an empty partial, so the controller returns round.requestBody — the original request, verbatim. Concrete: a 180k-token conversation gets a response.failed carrying a deterministic policy or parameter rejection before any output item; the gateway re-POSTs the identical 180k body twice more for three identical rejections — roughly 540k input tokens and three prefill latencies for an outcome that could not change. Where DR-2 needs a content-filtered response.incomplete, this arm catches ANY upstream error the three regexes miss. Amplifier: FoldRounds.kt:43 deliberately blanks bodyText as a wire-safety sentinel (prose buffered, never forwarded), and the widened hasSalvage now reads that blanking as content ABSENCE, so on the fold path a failure with prose but no completed reasoning envelope takes the full verbatim re-POST instead of a marker continuation — one field carrying two incompatible meanings. Fix: intersect RETRYABLE with a transience predicate, or give ClassifiedFailure an explicit deterministic flag set by the classifier so the reanchor gate reads provenance instead of an ErrorType bucket that means two different things. Land with DR-2; same seam, one test suite."
