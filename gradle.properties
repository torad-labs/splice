# Splice Gradle settings. Splice builds on JDK 21: splice.kotlin-common pins jvmToolchain(21), so Gradle compiles and
# tests on a JDK 21 it finds on the machine whatever `java` the machine defaults to, and tools/gate/src/lib/jdk.ts
# resolves the same 21 for the gate, the hooks' linters and the release launcher ($JAVA_HOME, $SPLICE_JAVA, PATH, then
# the installers' folders; `bun tools/gate run --java-home-only` prints which). A machine that keeps its 21 somewhere
# unusual names it once, for Gradle and the gate alike, in ~/.gradle/gradle.properties:
# org.gradle.java.installations.paths=/path/to/jdk-21. No one exports JAVA_HOME to build (2026-11-02).
#
# Cap heap/metaspace so the splice daemon holds a bounded footprint instead of the 2 GB default
# (it was one of several ~0.7-1 GB idle daemons contributing to memory-pressure slowness).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

# Reap this daemon 30 min after idle (matches the global default; explicit here for the repo).
org.gradle.daemon.idletimeout=1800000

# The Kotlin compile daemon gets the same cap as the Gradle daemon, so a warm pair stays inside the build gate's memory budget.
# `kotlin.daemon.jvmargs` is the name the Kotlin Gradle plugin reads (PropertiesProvider, KGP 2.4.0); the
# `kotlin.daemon.jvm.options` this line used to set is a JVM system property and did nothing here.
# On a machine whose ~/.gradle/gradle.properties sets a memory guard, that file outranks this one, so its -Xmx2g is the one in force.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

# Incremental builds: a task whose inputs have not changed is taken from the build cache, and an unchanged configuration is loaded from the configuration cache.
org.gradle.caching=true
org.gradle.configuration-cache=true

# Projects build in parallel, as the pre-push has always asked for with --parallel (tools/gate/src/commands/hook.ts); the
# gate of record, CI and a plain ./gradlew take it from here. The worker count is the machine's: hostshield's
# ~/.gradle/gradle.properties caps it at 6 on the dev box, CI's runners have 4 cores. A gate that ran 740 tasks one after
# another took 40 minutes on 16 cores (2026-11-02).
org.gradle.parallel=true
