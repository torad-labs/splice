# [2026-09-15] SLOT — complete design, zero design freedom. (1) ONE test class that enumerates every widget class in the package splice.app.cli.prompt FROM THE PACKAGE, not from a hand-typed list. Use the same denominator discipline the v0.4.0 campaign settled on: derive the set from what is on disk or from the classpath so a widget added next month is in scope with zero edits to this file. A hand-typed list here would be a tautology wearing a green tick - it cannot fail for a widget nobody remembered to add. (2) For each widget, with System.console absent, assert three things: it returns its declared default, it emits NO escape character at all (assert on the absence of 0x1b in the captured output, not on a formatted string), and it enters raw mode ZERO times. (3) PROVE THE GATE CAN FAIL. During development add a temporary synthetic widget that violates the contract, watch this test go RED naming it, then remove the synthetic and watch it go GREEN. Record both observations as a dated note on CW-8 with the actual assertion message. A wall that has never failed is not known to be able to fail. (4) WHY THIS ROW EXISTS: a widget that hangs a headless install is the single worst thing this campaign can ship - it would wedge Docker builds, CI and systemd start - and a per-widget test that someone forgets to write is exactly how it would ship.
