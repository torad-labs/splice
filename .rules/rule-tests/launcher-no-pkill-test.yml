id: launcher-no-pkill
valid:
  - 'execSync("pgrep -f codex-proxy")'
  - |
    res.end(`<!doctype html><body>`
      + `<h2>Signed in</h2></body>`);
  # 2026-07-27 review: a two-literal concat in exec arguments that has nothing to do with pkill
  # used to trip this wall. A rule that flags compliant code teaches people to ignore it.
  - 'execSync("ls" + " -la")'
  - 'spawnSync("echo " + "hello")'
invalid:
  - 'execSync("pkill -f codex-proxy")'
  - 'const cmd = `pkill -f ${name}`'
  - 'execSync("pk" + "ill -f " + name)'
  - 'spawnSync("pk" + "ill", ["-f", name])'
  # every remaining split point of the morpheme — same runtime command, same trap
  - 'spawn("p" + "kill", ["-f", name])'
  - 'execSync("pki" + "ll -9")'
  - 'execSync("pkil" + "l -f x")'
  - 'execSync(`pki` + `ll -9`)'
