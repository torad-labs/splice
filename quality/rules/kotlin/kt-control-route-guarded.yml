# THE LAW. The control plane is the daemon's ADMIN surface: it reads every head's config, mints and
# hands out launch specs, streams logs, and can shut the daemon down. Its only defence is the
# management key, and that defence is applied per-route, by wrapping the handler in `guarded(call)`.
# A route registered without that wrapper is not "less protected" — it is UNAUTHENTICATED, reachable
# by anything that can open a socket to the control port, and nothing about its declaration says so.
# Authorization by convention is authorization that a five-line diff removes by accident.
#
# THE SCAR (ARCH-AUDIT 2026-09-17, audit D row 6). `post("/statusline/{head}")` and its `get` twin
# (ControlServer.kt:158-159) are registered bare, with the reason carried only in a trailing
# comment — "stdin-piped per tick; no bearer". Whatever the merit of that decision, it is invisible
# to the build: the 20 guarded routes and these 2 are the same shape to every tool in the repo, and
# the next route added next to them inherits whichever spelling the author's eye landed on.
#
# THE REMEDY. Wrap the handler: `get("/api/x") { guarded(call) { … } }` — 20 of the 25 routes
# already read exactly that way, so the compliant form is the local majority, not an invention. A
# route that genuinely must stay open takes a DATED entry in the allowlist regex below, which turns
# "someone forgot" into "someone decided, on this date, for this reason".
#
# THE CENSUS (measured 2026-09-17, daemon/control/src/main). Denominator from the source: 25 route
# registrations, 20 carrying `guarded(`, 5 bare, 1 of those allowlisted, 4 RED:
#   daemon/control/src/main/kotlin/splice/control/ControlServer.kt:128  get("/")
#   daemon/control/src/main/kotlin/splice/control/ControlServer.kt:129  get("/dashboard")
#   daemon/control/src/main/kotlin/splice/control/ControlServer.kt:158  post("/statusline/{head}")
#   daemon/control/src/main/kotlin/splice/control/ControlServer.kt:159  get("/statusline/{head}")
#
# `/` AND `/dashboard` ARE A PREMISE CORRECTION, not a widening: the audit row named `/statusline`
# as the only unguarded route and allowlisted only `/health`. The matcher finds two more, both
# serving `dashboardHtml()`. They are probably deliberate — ControlServer.kt:122 mints the mgmt key
# eagerly "BEFORE the port opens — a dashboard load must not race it", which only makes sense if the
# dashboard page itself is fetched without a bearer. That is an argument for a dated allowlist entry
# and it is NOT a wall row's call to make: deciding a route may stay unauthenticated is the fix
# row's (and the operator's) decision, so both stay red with their reasoning recorded here.
#
# ALLOWLIST (dated; each entry is a route that may be reached with no management key):
#   2026-09-17: `/health` — the unauthenticated liveness probe the launch shim polls to tell a
#     running daemon from a cold start. It MUST NOT need the mgmt key (that is the whole point of the
#     probe) and it returns no head or config detail: ControlServer.kt:126-127 states both halves.
#   2026-09-18: `/` and `/dashboard` — the web console PAGE (orchestrator decision, V4-107 follow-up).
#     Both serve dashboardHtml(): a static bundle (console/dist/index.html or the jar copy) with no
#     head, config or key rendered into it. Every call the page makes goes to /api/* with the mgmt
#     key the operator pastes once (console/src/shared/api/index.ts:8-52, localStorage
#     'myx-mgmt-key'), and those routes are guarded. A browser cannot send a bearer on the page
#     load itself, which is why ControlServer.kt:122 mints the key before the port opens. The page
#     is the login screen; the data behind it is not reachable without the key.
# The allowlist is a PATH regex, so it is anchored per route and cannot be widened by accident; an
# entry admits exactly the path it spells.
#
# WHAT THIS RULE DOES NOT CHECK. `guarded(` appearing anywhere in the handler satisfies it — the
# rule cannot prove the guard WRAPS the privileged work rather than sitting beside it. The remaining
# hazard is a handler that calls `guarded(call) { }` and then does the real work outside it. That is
# a shape no route in this tree has, and closing it needs the guard to become the route registrar
# (a `guardedGet("/api/x")` helper) rather than a wrapper — a design change, not a matcher.
id: kt-control-route-guarded
language: kotlin
severity: error
message: "Unauthenticated control-plane route: wrap the handler in `guarded(call) { … }` (20 of the 25 routes already do). A route that must stay open needs a dated entry in kt-control-route-guarded's allowlist, not a trailing comment."
note: >
  The control port reads every head's config, hands out launch specs, streams logs and can stop the
  daemon; the management key is its only defence and it is applied per route. A bare registration is
  reachable by anything that can open a socket to that port, and looks identical to a guarded one in
  every tool in this repo. Compliant form: `post("/api/x") { guarded(call) { handler(call) } }`, or
  `guarded(call, mcp = true) { … }` for the MCP access key.
files:
  - features/sessions/src/main/**/*.kt
  - features/usage/src/main/**/*.kt
  - integrations/http/src/main/**/*.kt
  - integrations/mcp/src/main/**/*.kt
  - core/src/main/kotlin/splice/core/util/LogSafe.kt
  - features/heads/src/main/**/*.kt
  - features/accounts/src/main/**/*.kt
  - features/turns/src/main/kotlin/splice/head/compact/CompactPayloads.kt
  - features/turns/src/main/kotlin/splice/head/compact/HeadCompactSource.kt
  - features/turns/src/main/kotlin/splice/head/compaction/CompactionInstructionsRoute.kt
  - features/turns/src/main/kotlin/splice/head/wire/CaptureRoutes.kt
  - features/diagnostics/src/main/**/*.kt
  - features/lifecycle/src/main/**/*.kt
  - features/models/src/main/kotlin/splice/models/roster/ModelsRoute.kt
  - features/launch/src/main/**/*.kt
  - features/configuration/src/main/**/*.kt
  - app/src/main/kotlin/splice/app/control/**/*.kt
  - features/events/src/main/**/*.kt
rule:
  all:
    # A route registration: an HTTP verb, a PATH string literal, and a handler lambda. The path
    # literal is the discriminator that keeps this off kotlinx's `put(key, value)` — deliberately
    # NOT `inside: routing { … }`, which would miss any route registered in another function or
    # file (measured: both forms report the same 25 today, so the stricter reading costs nothing
    # and the looser one has a blind spot).
    - kind: call_expression
      regex: '^(get|post|put|patch|delete|head|options|route)\(\s*"/'
    - any:
        - pattern: get($P) { $$$B }
        - pattern: post($P) { $$$B }
        - pattern: put($P) { $$$B }
        - pattern: patch($P) { $$$B }
        - pattern: delete($P) { $$$B }
        - pattern: head($P) { $$$B }
        - pattern: options($P) { $$$B }
        - pattern: route($P) { $$$B }
    - not:
        has:
          stopBy: end
          regex: '\bguarded\s*\('
    # ALLOWLIST — see the dated entries in this rule's header. One anchored alternative per route.
    - not:
        regex: '^(get|post|put|patch|delete|head|options|route)\(\s*"(/health|/|/dashboard)"'
