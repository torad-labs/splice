[[items]]
id = "M1-01"
phase = "m1"
title = "TOKENS, BOTH THEMES, FONTS (CONTRACTS.md section 1; brief OWN-WORLD; FEATURES.md 4.1). Rewrite webui/src/shared/tokens.css as two complete token sets: `:root, :root[data-theme='dark']` is the graphite room and the default; `:root[data-theme='light']` is the paper bay; every token named in CONTRACTS.md section 1 exists in both (scales --space-1..8 and --text-1..6, --room, --room-deep, --hair, --hair-strong, --ink, --ink-mute, --ink-strong, --strip, --strip-ink, --strip-ink-mute, --strip-field, --strip-field-line, --edge-green, --edge-amber, --edge-red, --edge-grey, --scope, --scope-ink, --scope-grid, --focus, --font-label, --font-figure, --dur-1..3, --ease-out). Dark values are MEASURED from the approved comp: run `cd webui && node /home/user/.claude/skills/impeccable/scripts/comp-spec.mjs --print` and take --room from the top-rule and rail grounds, --room-deep from the rail, --strip from the team-header strip ground, --strip-ink from its ink, --edge-green from the health square; light values are the paper bay of webui/.impeccable/mocks/decision/assigned.png. Old tokens (--paper-0, --ink-900, --surface, --font-mono, --font-body, --font-display, --space-0, --space-5, --space-11, --text-10, and the rest) keep their names so old pages render until M2; --font-mono, --font-body and --font-display alias to the new faces. FONTS: archivo-var.woff2 and jetbrains-mono-var.woff2 (already at webui/src/shared/fonts/ with OFL-Archivo.txt and OFL-JetBrainsMono.txt) become the only @font-face rules in webui/src/shared/fonts.css (url() so vite inlines them under assetsInlineLimit); leave ibm-plex-mono-400.woff2, ibm-plex-mono-500.woff2, ibm-plex-mono-600.woff2 and OFL.txt in place but unreferenced (nothing is deleted before M3-04; an unreferenced font is not inlined). THEME: webui/src/features/theme/index.ts exports useTheme() and applyTheme() per the contract; localStorage key splice.theme; opens dark regardless of the OS; switching is a cut (no transition on --room or --strip); prefers-reduced-motion sets every --dur-N to 0ms. CONTRAST WALL: rewrite webui/tests/contrast.test.ts to parse tokens.css at test time (both theme blocks; never a hand copy of values) and assert AA for every pairing the contract names: 4.5:1 for --ink, --ink-mute, --ink-strong on --room and --room-deep, --strip-ink and --strip-ink-mute on --strip and --strip-field, --scope-ink on --scope; 3:1 for each --edge-* on --room and on --strip; both themes; the test also proves it can fail (a fixture pair below AA is reported by name). THEME TEST webui/tests/theme.test.ts: default dark with no stored value, stored light wins, reduced motion zeroes durations; pure functions, no jsdom. The old contrast test pinned a token sheet that no longer exists; replacing it is the row, not a deviation. Read /home/user/.claude/skills/impeccable/reference/craft-floor.md and .dev/web-console/CONTRACTS.md before editing."
files = ["webui/src/shared/tokens.css", "webui/src/shared/fonts.css", "webui/src/shared/fonts/**", "webui/src/features/theme/**", "webui/tests/contrast.test.ts", "webui/tests/theme.test.ts"]
status = "todo"
verify = "cd webui && npx tsc --noEmit && npx eslint src/features/theme tests/contrast.test.ts tests/theme.test.ts && npx vitest run tests/contrast.test.ts tests/theme.test.ts && cd .. && for d in webui/src/features/theme; do test -e \"$d\" || exit 1; done && ast-grep scan -c sgconfig.yml webui/src/features/theme && node /home/user/.claude/skills/impeccable/scripts/detect.mjs webui/src/features/theme && for f in webui/src/shared/tokens.css webui/src/shared/fonts.css; do test -e \"$f\" || exit 1; done && ast-grep scan -c sgconfig.yml webui/src/shared/tokens.css webui/src/shared/fonts.css && node /home/user/.claude/skills/impeccable/scripts/detect.mjs webui/src/shared/tokens.css webui/src/shared/fonts.css"
