# [2026-08-16] AUTH-BYPASS DERIVATION FIXED (adversarial-review defect, HD-2 area) — Daemon.assembleHead now sets forwardClientAuth = wired.auth is ClientAuthProvider instead of ctx.providerCfg.auth.kind == CLIENT. The two halves of one security decision were derived independently: ProviderAssembly.buildProvider dispatches on DIALECT first, so auth.kind = 'client' on openai-chat (Daemon.kt:478-494) or openai-responses (:612-651) fell through to ApiKeyAuthProvider while the string still opened HeadServer.authorize's unconditional bypass (HeadServer.kt:478) — a head that skipped the mgmt-key door AND held a real vendor key. Structural now: no ClientAuthProvider, no bypass. RED PROOF: NEW gateway/app/src/test/kotlin/ClientAuthDerivationTest.kt boots a REAL daemon carrying both shapes on one topology — anthropic-passthrough+client (bypass expected) and openai-chat+client (mgmt key expected). Reverting the one line to the string comparison made the stray head answer an unauthenticated caller 200 OK with 'stray: no upstream credentials' where 401 Unauthorized is asserted, i.e. the door open on the api-key-wired head, exactly the defect. Daemon.kt restored byte-exactly (sha256 c13ca886 before and after); 2/2 green on --rerun-tasks.
# [2026-08-16] THE GAP THAT ALLOWED IT, CLOSED — HeadServerClientAuthTest.startHead built the auth provider FROM the flag (ClientAuthProvider when true, FakeApiKeyAuth when false), so only the two AGREEING cells of the flag x credential matrix ever existed; the disagreeing one the daemon could actually reach (bypass true + a real api-key provider) was never constructed, which is why the defect survived this wall. startHead gained an `auth` override (default = the old pairing, via defaultAuthFor) and one new cell: 'bypass alongside a splice-held credential opens the door and spends splice's own key' — a caller with NO Authorization header gets 200 and splice's own x-api-key 'splice-held-secret' reaches the wire. RED PROOF chosen to prove it is NEW coverage, not a duplicate: gating the bypass on 'deps.forwardClientAuth && provider.auth is ClientAuthProvider' failed ONLY the new case ('expected: <200 OK> but was: <401 Unauthorized>') while the other 5 stayed green. HeadServer.kt restored byte-exactly (sha256 5a766dff before and after); 6/6 green on --rerun-tasks.
# [2026-08-16] CLI LABELS + DEFERRED MINORS — (a) StatusCommand.isClientAuth / DoctorCommand.credentialLabel keep their predicate; the WORDING was corrected. Both read topology TOML and can never see the wired providers, so 'client-native — splice holds no credential for this head' asserted a fact about the running daemon this process cannot check; doctor now says 'client-native — declared auth.kind = client, so there is no key to set' and both KDocs name the DECLARED kind and why declaration and wiring can disagree. Deliberately NOT re-deriving the label from (dialect, kind) in the CLI: that is a second copy of the dispatch table, i.e. the very two-independent-derivations shape this item exists to remove. Substring 'client-native' kept — DoctorCommandTest.kt:144 pins it, and docs/superpowers/specs/2026-08-15-claude-head-design.md:105 names it. (b) Command.kt success(): the KDoc claim that sealed => 'no type outside this file' is FALSE on Kotlin 2.3.21 (libs.versions.toml:5) — sealed subclasses have been PACKAGE+MODULE scoped since 1.5. Corrected to state the real reach (any ': Command()' in package splice.app.cli inside :app; all 13 cases nested in this file today, verified by grep). 'private' was TRIED and does NOT compile: 'Cannot access fun success(block: () -> Unit): Int: it is private in splice.app.cli.Command' at Command.kt:40:71 — protected IS the minimum. (c) Daemon.kt:331 KDoc link [Daemon.responsesQuirks] -> [ProviderAssembly.responsesQuirks] (symbol moved in the collaborator split; dokka is not in check, no gate catches it). (d) TopologyLoader.staleProbe public -> internal (sole caller Daemon.kt:842, :app is a leaf). (e) Wired: 'private' PROBED and rejected by the compiler — "'internal' function exposes its 'private-in-file' return type 'Wired'" at Daemon.kt:460, so internal IS the minimum; left as-is, Daemon.kt restored byte-exactly. NOT CHANGED, FLAGGED: Daemon.launchSpecFor still derives nativeClientAuth from providerCfg.auth.kind == CLIENT (the LAUNCH-RECIPE half of the same declaration). No security gap remains — after this fix the misconfigured head fails CLOSED — but the two derivations still disagree on that path; out of the stated scope, worth its own row. CITATIONS: all verified against df7325e, none stale; a few carry +-2 line drift (label at DoctorCommand.kt:343 not :342, Wired at Daemon.kt:434 not :436) and Item 2 quotes the KDoc sentence in paraphrase ('can widen the reach', not 'can subclass it'), substance identical. GATES: ':app:test :gateway:test' BUILD SUCCESSFUL; 'check --rerun-tasks' BUILD SUCCESSFUL in 2m15s, 162/162 tasks executed, 1103 tests 0 failures across 14 modules, no NF-03 flake; 'npm run gate:rules' 32 passed 0 failed.
