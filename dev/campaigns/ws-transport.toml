# [2026-08-01] [2026-08-01] BLOCKED ON OPERATOR — everything upstream of it is merged to main (#72, 40a1634) and shipping DEFAULT OFF, so no behaviour changed. This item needs a human act that an agent must not perform: flip 'websocket = true' inside the codex inline quirks table, restart, then read telemetry for (a) '[ws] ... chained' lines appearing, (b) cache hit vs the 2026-07-31 90% baseline, (c) upstream_req_bytes collapsing on chained rounds. Known gap to wire during that step: codex.rate_limits arrives as a WS EVENT where the SSE path reads rate-limit HEADERS, so the statusline soft-warn goes stale on a WS-only head until it is mapped.
# [2026-08-11] [2026-08-11] CLOSED ON MEASURED LIVE EVIDENCE — the canary ran, the telemetry is in, and the operator decision is recorded. The item was written as 'BLOCKED ON OPERATOR — needs a human act an agent must not perform: flip websocket = true'. That flip HAPPENED (splice.toml line 60, codex quirks, dated 2026-08-07), so the human act was done and what remained was analysis, which is agent work. WINDOW: WS Aug 9-10 vs the SSE baseline Jul 31-Aug 1, from claudex-perf.jsonl and logs/daemon.log. (a) CHAINING ENGAGES: 28,393 '[ws] ... chained onto the previous response' lines across 1,072 connections. (b) CACHE HIT vs the 2026-07-31 ~90% baseline: 95.6-95.8% vs 89.0% — improved, no regression. (c) ERROR CLASSES: 0.4-1.3% vs 8.4% on the baseline day — no regression; the WS-specific classes are 63 'send failed async', 4 'no first event in 15000ms', 4 'inbox closed before first event' and 132 'frame arrived after the round terminal', all against ~30k rounds. (d) upstream_req_bytes: median 625K -> 474K (-24%), mean 684 -> 627 (-8%), 19.9GB -> 17.9GB over comparable round counts. THAT IS NOT THE PREDICTED 'COLLAPSE' and the item should not be read as if it were: only 0.4% of WS rounds are under 50KB, so chained rounds are NOT sending small deltas. CAVEAT stated rather than buried: this is an OBSERVATIONAL comparison across days with different workloads, and perf rows carry no 'chained' flag, so chained rounds cannot be isolated from unchained ones within a period. CANNOT BE COMPLETED AS WRITTEN: 'capture the codex.rate_limits event shape and wire it into usageStore'. Zero occurrences of 'rate_limits' in ~30k rounds of daemon logs, and zero handling in gateway/*/src/main/kotlin. The event's existence is an UNCONFIRMED PREMISE from the spike, not an observed fact; there is no shape to capture and I will not invent one. CONSEQUENCE, unfixed: the statusline soft-warn stays stale on a WS-only head, because the SSE path reads rate-limit HEADERS that WS does not carry. Filed as its own follow-up rather than held open here. DEFAULT DECISION: DEFAULT OFF STANDS. Rationale measured 2026-08-11: WebSocket is a ResponsesQuirks capability, and in the live topology codex is the ONLY head on the openai-responses dialect — xai and openrouter are openai-chat, kimi is anthropic-passthrough. So flipping the default would change the behaviour of exactly one head, which already opts in explicitly by config. provider-grok is built on ResponsesQuirks and is the only future candidate, but WS-0 probed chatgpt.com only, so xAI's backend speaking a Responses WebSocket is unverified.

