# [2026-08-17] HD-21 wave 4a landed. Matcher counts (ast-grep 0.44.0 scan --rule, gateway/*/src/main, never grep): 246 -> 116. Two independent movements, measured separately by diffing hit lists keyed on BYTE OFFSET (a (file,line,text) key silently collapses two identical seams on one line): role conversion 246 -> 120 (126 sites), rule amendment 120 -> 116 (4 sites), 0 newly flagged by either. THREE ROLES NAMED, in :core (core/src/main/kotlin/splice/core/util/RuntimePorts.kt, all public fun interface): LogSink(message: String), EnvReader(name: String): String?, Clock(): Long. :core and NOT :provider-spi (where HD-19 put Waiter/Ticker) because all three are pure kotlin-stdlib signatures and carry no kotlinx.coroutines dependency, so the 'production :core stays framework-free' cap does not bind; every module reaches :core under the module law. SITES: log 47, envReader 29 + env 27, clock 18 = 121 as briefed, PLUS 5 the brief did not count but that are the same role and had to move for the chain to typecheck: Main.persistentLogger's RETURN type, DaemonLog.sink + DaemonLog.install(logger), and HeadScopedLogs.headScopedLog's sink param AND return. 126 total. ENV/ENVREADER ARE ONE ROLE - PROVEN, not assumed: InstallCommand.localBin(env) passes its 'env' straight into InstallPaths(envReader = env), and all 56 declarations are the identical (String) -> String?. Unified to ONE type; the two PARAMETER SPELLINGS were deliberately left alone (renaming 56 params plus every named-arg call site is churn the rule does not ask for and is where a silent misbind hides) - the role is the TYPE. DESIGN CALL, reversible, mine (S21): the single abstract method is spelled 'operator fun invoke', so log(...)/env(...)/clock() call sites are BYTE-IDENTICAL and the diff is exactly the declarations + wiring. Evidence it was right: every one of the 14 modules' TEST sources compiled UNMODIFIED - DaemonLog.install { seen += it }, headScopedLog(k, captured::add)(...), persistentLogger(logs)(...) all still resolve. House style elsewhere uses named SAM methods (Waiter.wait, Ticker.awaitTick); this departs from that deliberately and is the repo's first operator fun invoke. Production defaults preserved EXACTLY, including the two DIFFERENT clock defaults that were NOT unified: System::currentTimeMillis (wall, 11 sites) and MonoClock::nowMs (monotonic, 7 sites).
# [2026-08-17] HD-21 PREMISE CORRECTION - THE INLINE EXEMPTION DROPS 4, NOT 18. The brief and the standing LAW both state 'the 18 block seams are the parameters of INLINE higher-order utilities'. Read end-to-end, only 4 of the 18 carry the inline modifier: Cancellables.runCatchingCancellable, DaemonBoundary.runCatchingDaemonBoundary (Daemon.kt), Command.success, TurnDriver.catchingTurnFailure. The other 14 are NON-inline and the inlining/non-local-return argument does not apply to them: CredentialLock.withLock + withFileLock, SingleFlight.run, UpstreamClient x3 (post/loop/retry block), RequestMaterializationGate.withLease + tryWithLease, HeadServer.materializeOrRespond, ControlServer.guarded, DoctorCommand.guarded, KeyStore.withStoreLock, TurnPerf.timed, TurnPerfTiming.timedOr. Those 14 remain flagged and are honest future work, not a rule defect. Verified by diffing the matcher's hit lists before and after the amendment on the SAME tree: exactly 4 dropped, 0 newly flagged. The law's reasoning is right for the 4; its count was wrong. RULE AMENDED (.rules/kotlin/ast-grep/rules/no-lambda-seam.yaml, still DORMANT - not promoted, 116 sites remain): a function_type inside the function_value_parameters of a function_declaration whose modifiers carry function_modifier =~ ^inline$ is exempt. Header states the reasoning (a fun interface param cannot be inlined AND forbids non-local return, so 'runCatchingCancellable { return x }' would stop compiling - a rule satisfiable only by damaging the code is wrong). GRAMMAR CHECKED, NOT ASSUMED: function_modifier is the same node kind that spells suspend/operator/tailrec, hence the anchored regex; the exemption still fires through type_modifiers (suspend () -> T) and through nullable_type -> parenthesized_type ((() -> T)?), where function_type is NOT a direct child of parameter.
# [2026-08-17] HD-21 RULE-TEST + THE DEAD-TEST TRAP IT EXPOSED (and two gates fixed, not routed around). A rule-test written the obvious way would have been DEAD: dropping no-lambda-seam-test.yml into .rules/rule-tests (the promoted-wall test dir) is SILENTLY SKIPPED, because no-lambda-seam is not in a root ruleDir - measured, 'ast-grep test' reported the same '43 passed' and never mentioned the file, no error, no warning. That is the campaign's own dead-matcher law one level up: a test that cannot fail. FIX: the dormant pack got its own testConfigs (.rules/kotlin/ast-grep/sgconfig.yml) + .rules/kotlin/ast-grep/rule-tests/, and npm run gate:rules now runs a SECOND invocation - 'ast-grep test --config .rules/kotlin/ast-grep/sgconfig.yml' - so a dormant matcher is red/green pinned BEFORE it graduates. Only tests run there, never scan, so the 116 live violations stay dormant as intended. 11 cases: 5 valid (the named-port compliant form; runCatchingCancellable; the suspend shape; the parenthesized-nullable shape; a plain inline) + 6 invalid. RED-PROVEN BOTH WAYS on a scratch copy, not asserted: (a) delete the exemption -> 4 valid cases FAIL; (b) widen stopBy to 'end' -> the object-expression case FAILS. Note (b) took two attempts and the first claim was WRONG: my initial 'stopBy is load-bearing' test used a non-inline local fun in an inline function's BODY, which passes under BOTH spellings (the outer param list is a sibling of the body, not an ancestor). The shape that actually distinguishes them is a non-inline member nested INSIDE the inline function's own parameter list (an object expression as a default value) - found by probe, then pinned as a test case so the header's claim is earned rather than plausible. GATES I BROKE AND FIXED: (1) checks/config-guard.sh went RED - it classifies any .rules/**.yml with an 'id:' as a rule needing severity: error, exempting only the hardcoded path .rules/rule-tests. Applied the guard's own stated intent ('rule-test fixtures also have an id but are not rule definitions') by classifying STRUCTURALLY - has valid:/invalid: and no rule: block - instead of by path. This STRENGTHENS it: red-green proven that a real rule with severity: warning still fails in a normal dir AND that a real rule smuggled into any rule-tests dir now fails too, which the old path-prune let through. (2) checks/rule-routing.sh passes unchanged (its .rules/kotlin allowlist entry covers the subtree) but its dated reason was rewritten to say UNSCANNED IS NOT UNTESTED, so the next reader does not assume the pack is inert. VERIFY: gradlew check --rerun-tasks BUILD SUCCESSFUL in 2m24s, 162/162 tasks, 1107 tests / 0 failures / 0 errors / 1 skipped / 14 modules - NF-03 did NOT flake, no isolated re-run needed (the brief's 1103 is stale; HD-19 and HD-20 both already record 1107). npm run gate: PASS, every leg green. KIMI BYTE-IDENTITY intact: git status --porcelain on gateway/dialect-anthropic-passthrough/src/test/ is EMPTY and PassthroughGoldenTest ran 9 tests / 0 failures unmodified; zero test files touched in the entire wave. DIFF DISCIPLINE: every added line under gateway/ either names LogSink/EnvReader/Clock or is one re-wrapped DaemonLog comment - mechanically verified. WALL NOT PROMOTED, as instructed: 116 sites remain. Report: .superpowers/sdd/2026-08-15-head-decoupling/hd-21-report.md
# [2026-08-17] HD-21 REMAINING WORK + RISKS A REVIEWER SHOULD CHECK HARDEST. REMAINING: 116 no-lambda-seam sites (was 246). Largest remaining roles, by the same matcher: the 14 NON-inline 'block' params above; refreshCall 5 (suspend (String) -> RefreshAttempt<T>, one per auth provider + 2 in Daemon - a real role, PROVIDER-specific generics, so it is a fun interface with a type parameter, not a copy of LogSink); clientGone 5, watchdogFired 5, isTerminal/terminalSeen, frameEmittedThisRound - these are the () -> Boolean family the SEAM CENSUS law explicitly warns must NOT be collapsed into a shared BooleanSupplier; decodeReasoningEnvelope 4; onRetry 3 and onMalformed 2 (notification callbacks, NOT LogSink despite the identical (String) -> Unit shape - deliberately left); sink/write/writeRaw/flush/flushRaw (the SseEmitter/ImmediateSseWriter wire-write family); identityHeaders 2, nowIso 2, nowEpochMs 1. NAME-BY-SHAPE TRAPS I HIT AND AVOIDED: UsageHud.persistRateLimit(header: (String) -> String?) is byte-identical in shape to EnvReader and is a DIFFERENT role (reads an HTTP response header) - left alone; the 3 onRetry + 2 onMalformed are shape-identical to LogSink and were left alone; Clock's KDoc records why nowIso/nowEpochMs were NOT merged into it (they report WALL time for the wire, where a monotonic reading would be wrong). RISKS: (1) 'operator fun invoke' is new to this repo and makes the seam INVISIBLE at the call site - log(...) reads exactly as it did when it was a lambda, so a reviewer cannot tell a named port from a raw function type by reading a call. That is the deliberate trade (byte-identical call sites, testable named port) but it means the naming win is only visible at declarations. (2) LogSink/EnvReader/Clock now sit in :core and are named in the PUBLIC signatures of :gateway, :control and the dialect/provider modules, all of which depend on :core via 'implementation', not 'api'. :app (the only real consumer) also depends on :core directly so it compiles