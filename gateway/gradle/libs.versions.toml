# Version catalog — single source of truth for the gateway build (P1-GRADLE).
# Versions verified against repo1.maven.org maven-metadata 2026-07-16 (the solrsearch
# index was stale — always check metadata <latest>, not search "latestVersion").
[versions]
kotlin = "2.3.21"
ktor = "3.5.1"
coroutines = "1.11.0"
serialization = "1.11.0"
ktoml = "0.7.1"
konsist = "0.17.3"
detekt = "1.23.8"
kover = "0.9.9"
junit = "6.1.2"
# TRANSITIVE CVE FLOOR (2026-07-27). netty is not a dependency we declare — it arrives under
# ktor-server-netty. Dependabot therefore could not fix it: every security-update job failed with
# `security_update_dependency_not_found` because there was no declaration to edit, which is why the
# alerts sat open with no PR ever appearing. Declaring the floor gives the resolver a minimum AND
# Dependabot a line to bump next time. Raise, never lower; drop it once ktor's own netty clears it.
#
netty = "4.2.16.Final"          # 4.2.15.Final resolved; CVEs in netty-codec-http/http2/compression
# jackson rides in on the PLUGIN classpath via detekt's jackson-dataformat-xml, which subproject
# constraints cannot reach — so the floor is applied in build-logic/build.gradle.kts, the one build
# that owns that classpath (see the reasoning there). Build-time only, never in the shipped jar.
# A detekt bump would be the cleaner fix but is unavailable: 1.23.8 is the latest release.
jackson = "2.21.5"              # 2.20.1 resolved; advisories in jackson-core/databind

[libraries]
zstd-jni = { module = "com.github.luben:zstd-jni", version = "1.5.6-9" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktoml-core = { module = "com.akuleshov7:ktoml-core", version.ref = "ktoml" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
# Upstream streaming client engine. JDK HttpClient (async NIO) — CIO's socket writer busy-spins on a
# non-writable upstream socket (macOS/kqueue especially), melting CPU under concurrent large-body
# streams; the JDK engine parks correctly and scales to the 1000-stream target on a few threads.
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# Kotlin compiler internals — the :fir-checks compiler-plugin module compiles against these
# (compileOnly: the compiler provides them at plugin-load time) and drives K2JVMCompiler in tests.
# Pinned to the toolchain version: FIR/checker API is internal and version-locked, no stability guarantee.
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
