# translate-request is PURE {req, meta} — the v29 body.__claudex* magic-prop
# side channel is dead. Any __claudex-prefixed property (dot/bracket access,
# object key, shorthand, or destructuring) reintroduces the hidden coupling
# this migration killed.
#
# Widened 2026-07-26 (ast-grep-walls-audit, split-literal evasion theme, §A.8):
# `body["__claude" + "xEffort"]` reproduces the identical property name with no
# node containing the `__claudex` prefix, so the four fingerprint branches above
# never saw it. Added a 5th branch: a string/template_string `+` concatenation
# whose result sits inside a subscript_expression (bracket access) or
# computed_property_name (computed object key) — the only two places a
# concatenated property name can land.
id: no-claudex-magic-props
language: javascript
severity: error
message: "No __claudex* magic props — pass request metadata through the pure {req, meta} contract."
note: |
  v29 smuggled routing state through body.__claudex* properties on the Anthropic
  request body. In splice, translate-request returns {req, meta}: upstream wire
  fields live on req, proxy-internal state lives on meta. Add a named meta field.
files:
  - server/**/*.mjs
rule:
  any:
    - kind: property_identifier
      regex: ^__claudex
    - kind: shorthand_property_identifier
      regex: ^__claudex
    - kind: shorthand_property_identifier_pattern
      regex: ^__claudex
    - kind: string_fragment
      regex: ^__claudex
    - kind: binary_expression
      all:
        - has:
            field: operator
            regex: ^\+$
        - has:
            field: left
            any:
              - kind: string
              - kind: template_string
        - has:
            field: right
            any:
              - kind: string
              - kind: template_string
        - inside:
            stopBy: end
            any:
              - kind: subscript_expression
              - kind: computed_property_name
