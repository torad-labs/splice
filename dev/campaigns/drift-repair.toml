# [2026-08-31] 2026-08-31 codex BLOCKED determination (no further code from their seat): the landed 07ecffaf strengthening covers ordinary EOF only (watchdogFired=null, direct ResponsesReanchorController call). A mid-part watchdog tear is reachable and cannot ride restart: ResponsesTerminalDecision.watchdogOutcome creates Failure with NO partial (:100-110), and FoldRounds.continuationForFailedRound independently returns null whenever signals.watchdogFired() (:38-45). Their two-test forced repro: cutoff tear has empty salvage; watchdog fire carries no partial. Routing watchdog tears into restart would REVERSE the explicit cancellation-owns-turn/turn-budget policy — an operator product call, not a seat call. OPERATOR FORK (close-out): (a) keep parity — watchdog tears render nothing, budget law intact (status quo, both seats' default); or (b) reverse the policy so watchdog tears salvage a partial + restart, spending budget past the watchdog. Recorded per two-seat law; item closes blocked pending Marcos.
# [2026-08-31] VERDICT: outcome=blocked gap=watchdog-tear salvage requires reversing cancellation-owns-turn policy — operator fork
# [2026-08-31] 2026-08-31 OPERATOR DECISION, RELAYED BY codex-splice (not seen directly by this seat): remove the turn-budget concern; Marcos quoted as - stop worrying about turn budget, you will compact then keep working, there should be no budget. Implement salvage plus compact-and-continue; do not preserve a watchdog spend cap as a product contract. Design relayed from grok's read-only trace: Idle is a stall detector not a budget, launchTotalCap stays as the slot-leak wall; child round Job under turnJob in SseRoundConsume and WsRoundDriver, watchdog cancels the CHILD; Idle watchdog outcome attaches partialOrNull, TotalCap stays no-partial; drop the watchdog veto from FoldRounds and ReanchorContinuation but keep clientGone; clear the sticky firedRef after accepting an Idle continuation. Permanent wall must drive the REAL production path HeadServerFoldTest-style - POST1 emits reasoning then hangs, short streamIdle fires, POST2 completes, assert 2 POSTs and no stalled CancellationSeal terminal; a direct controller test is the old fake.
# [2026-08-31] 2026-08-31 IMPLEMENTED (claude-splice), SSE path only, WS explicitly out of scope. Acceptance wall lands FIRST and is red on unfixed code: HeadServerFoldTest 'a round stalled mid-reasoning salvages its partial and continues' drives the real HeadServer over HTTP with a new mock scenario foldstall (round 1 streams reasoning then sleeps 6s past a 1s streamIdle). Pre-fix it produced ONE upstream POST and an overloaded_error reading 'upstream stalled (watchdog)' with the reasoning orphaned; post-fix TWO POSTs, round 2 replaying ENC-STALL, one clean end_turn terminal, no stall error on the wire. Six changes: (1) SseRoundConsume gives the idle watchdog a per-ROUND Job parented to turnJob and cancels the response ByteReadChannel with an IOException when it fires, so driveTurn stays alive on the turn job and folds the tear into an honest terminal - a CancellationException here would reproduce the bug, which is why the cause type is load-bearing; (2) TearAwareEvents will not enter the G5 pre-frame reissue when watchdog.fired is set, because reaping now looks exactly like a transport tear and would otherwise race a silent re-POST against the salvage decision; (3) Watchdog.launchIn no longer raises TotalCap - launchTotalCap owns the only whole-turn cancel, and a round-scoped poller raising a whole-turn verdict would reap one round while letting the fold loop open the next; (4) resetFirstByte CAS-clears a stale IDLE sentinel only, so a salvaged round does not make every later round terminate as stalled, while TotalCap survives as a whole-turn verdict; (5) ResponsesTerminalDecision attaches partialOrNull to an Idle tear and NOT to a TotalCap tear; (6) the watchdog veto is dropped from FoldRounds.continuationForFailedRound and ReanchorContinuation.continuationForFailure, keeping clientGone in both. FoldContinuations and RoundSplice keep their vetoes per the converged map.
# [2026-08-31] 2026-08-31 TWO POLICY PINS REVERSED, named because deleting them silently would be the dishonest move. ReanchorRunnerTest 'a watchdog fire never continues - its cancellation owns the turn' and ResponsesReanchorPartialTest 'a watchdog fire carries no partial - its cancellation owns the turn' were codex-splice's characterization arms for the OLD policy; both were red after the fix, the first by hanging for a minute because its fake controller returns a continuation forever. Re-cut to pin the new law instead of removed: 'an idle watchdog fire continues - the round is reaped, not the turn' (bounded by the controller's own attempt budget) and 'an idle watchdog fire carries its partial'. ADDED alongside: 'a totalCap watchdog fire carries no partial - the whole-turn wall is not continuable', which is the half that did NOT reverse and had no arm of its own. The search-side arm 'a watchdog fire never continues a search' is UNTOUCHED and still green, because RoundSplice keeps its veto. WS SCOPE: WsRoundDriver still targets the turn job and carries a comment saying so - a WS round's events are an opaque Flow with no per-round abort in the SPI, so reaping one means widening WsRoundRunner and every implementation. WS behaviour is unchanged rather than newly wrong, and its whole-turn cap still rides launchTotalCap; what a WS turn does not get is the salvage-and-continue SSE just earned.
# [2026-08-31] 2026-08-31 THIRD POLICY PIN reversed, found the honest way - by the gate, not by reading. WatchdogTest 'total cap reaps even a lively stream' pinned launchIn raising TotalCap, which is exactly what this item removes. It did not fail as an assertion: its target is a while(true) loop that only ever exits by being cancelled, and VirtualTicks returns instantly and never stops, so with no breach left to raise the poller span a tight infinite loop and the provider-spi test JVM died of Java heap space. Worth naming because a heap death reads like an environment problem and I nearly filed it as one - the OOM WAS the assertion. Re-cut into two arms: 'launchIn never raises a whole-turn TotalCap - launchTotalCap owns that cancel' proves the silence using a NEW BoundedTicks harness that stops after four samples (VirtualTicks cannot express a loop expected not to fire, which is the general lesson), asserting the virtual clock really did run past the cap and the target was never cancelled; and 'the whole-turn cap still reaps a lively stream' keeps the original property where it now lives, on launchTotalCap, which never consults the slot so liveliness cannot buy a turn extra time. WatchdogTest is 8 arms green. Also fixed two detekt findings of my own making: a three-term ComplexCondition in TearAwareEvents extracted to a named reissuable() predicate, an ImportOrdering slip, and UseDataClass on BoundedTicks (it fires on the constructor param, which is why VirtualTicks with no ctor params is clean - the bound moved to a top-level private const).
