dated = "2026-09-17"
names = [
    "BytesRead",
    "SearchRoundCounter",
]
reason = """Two observers whose Int is a different quantity in a different unit. BytesRead "reports the SIZE of one chunk lifted off the socket, before any decoding" — wire bytes, which is what `sse_bytes_in` on the perf row means, and it is a seam because after decode the chunk boundary is gone. SearchRoundCounter records how many search-continuation rounds the turn ran, stamped as an ABSOLUTE count rather than incremented, precisely so an unmoved counter is evidence rather than ambiguity — it is the expected-delta instrument the bring-up ritual reads. A swap would stamp a byte count as a round count, and the perf summary would render it without complaint."""

