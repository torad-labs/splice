# [2026-09-15] SLOT — complete design, zero design freedom. (1) Both classes are internal classes rendering to an injected Appendable, defaulting to standard out, so every test asserts exact emitted strings. No top-level functions, no companion objects. (2) NoteBox renders rounded box drawing: U+256D top left, U+2570 bottom left, U+256E top right, U+256F bottom right, U+2500 horizontal, U+2502 vertical. The title sits IN the top rule after one horizontal dash and a space, then a space and the rule continues to the box width. Content lines are indented one space inside the vertical bars and padded on the right to the box width. Box width is the widest visible content line, or the title width, whichever is larger, plus padding. (3) THE FAILURE THIS ROW EXISTS TO AVOID: measuring width with String.length. Content lines carry ANSI colour from CliStyle, so length counts escape bytes and the right border ends up ragged. Measure DISPLAY width - strip the CSI SGR sequences (escape, open bracket, digits and semicolons, letter m) before counting, and assert in a test that a line wrapped in CliStyle CYAN produces a border aligned identically to the same line uncoloured. (4) Spinner is an internal class with start(message), an optional update(message), and stop(finalMessage). Frames are the ten braille dots U+280B U+2819 U+2839 U+2838 U+283C U+2834 U+2826 U+2827 U+2807 U+280F, advancing on a timer, each redraw emitting carriage return then erase-line (CSI 2 K) then the frame and message. stop emits one final line with the CliStyle GREEN check glyph and the final message, leaving exactly ONE line in scrollback. (5) Non-TTY: when System.console is null Spinner emits NO frames and NO escape codes - start records the message, stop prints exactly one plain line. Asserted with a regex that the non-TTY output contains no escape character at all.
