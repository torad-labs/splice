# rule-coverage-exclusions.toml — every source root a routed ast-grep rule does NOT reach, with a
# date and a written reason.
#
# `bun tools/gate rules --prove-coverage` derives the denominator from the source — the Gradle
# source roots named by settings.gradle.kts and the workspace surfaces named by package.json — and
# requires every routed rule to reach every one of them. A rule that reaches none of a source root's
# files, or loses a file inside a root it does cover, fails BY NAME unless a row below says why.
#
# That is the point. `ast-grep scan` cannot see a glob that selects nothing: narrowing
# `gateway/*/src/main/**/*.kt` to `gateway/app/src/main/**/*.kt` leaves the scan green while fifteen
# modules lose enforcement. The rows here are the only way that narrowing can be legitimate, and
# each one is dated so the narrowing has a history instead of a habit.
#
# Row shape:
#   rule / rules   the routed rule id(s) this disposition speaks for (required)
#   modules        Gradle module ids or workspace names; omitted means every module
#   sourceSets     main | test | testFixtures | src; omitted means every source set
#   files          ast-grep path globs. A row WITH files excuses individual FILES inside a root the
#                  rule already covers. A row WITHOUT files excuses a WHOLLY lost source root, and
#                  only a wholly lost one — a partial loss must be spelled file by file, so that
#                  losing a whole module can never hide behind a broad row.
#   date           YYYY-MM-DD (required — an undated exclusion is not a disposition)
#   reason         why (required — a blank reason is an absence wearing a label)
#
# A row that excuses nothing is stale and fails too.

# ─── source-set scope ────────────────────────────────────────────────────────────────────────────

[[exclusion]]
rules = [
  "kt-cancellation-handler-total", "kt-catch-swallows-cancellation", "kt-control-route-guarded",
  "kt-embedded-server-loopback", "kt-error-envelope-single-source", "kt-failure-has-cause",
  "kt-flow-over-suspend", "kt-force-strict-false-is-literal", "kt-form-encoding-single-source",
  "kt-head-log-prefix", "kt-head-scoped-config-must-be-keyed", "kt-http-status-single-source",
  "kt-json-scalars-single-source", "kt-jsonl-sink-single-source", "kt-l3-end-turn-literal",
  "kt-l3-sole-wire-terminals", "kt-log-escapes-caller-input", "kt-no-atomic-in-data-class",
  "kt-no-blocking-io-under-monitor", "kt-no-companion-objects", "kt-no-coroutine-scope-factory",
  "kt-no-delay-in-production", "kt-no-exception-as-outcome", "kt-no-extension-functions",
  "kt-no-global-scope", "kt-no-hardcoded-dispatchers", "kt-no-lambda-seam", "kt-no-lateinit",
  "kt-no-object-command", "kt-no-println", "kt-no-raw-thread", "kt-no-reflection-in-production",
  "kt-no-request-body-gzip", "kt-no-runblocking-exported-bridge", "kt-no-runblocking-in-daemon",
  "kt-no-runcatching-in-coroutine", "kt-no-sealed-interface", "kt-no-secondary-constructor",
  "kt-no-silent-result-collapse", "kt-no-stream-options-request", "kt-no-system-getenv",
  "kt-no-todo-throws", "kt-no-top-level-functions", "kt-no-unsafe-bang-bang", "kt-no-unsafe-cast",
  "kt-no-vanilla-config-dir", "kt-outcome-tag-single-source", "kt-quota-tracker-single-resolution",
  "kt-secure-file-single-source", "kt-shared-summary-parts-single-source",
  "kt-state-paths-single-source", "kt-tool-partition-no-transcript",
  "kt-turn-finally-flush-quietly", "kt-wire-catch-ioexception-alone", "kt-ws-frame-without-epoch",
]
sourceSets = ["test", "testFixtures"]
date = "2026-09-20"
reason = """
Production-only walls: each grades what the shipped daemon does, and binds src/main by design. Test
sources are graded by the two walls that do bind them — kt-no-quality-suppress (main + test) and
kt-tests-no-wall-clock (test + testFixtures) — plus the Konsist laws in :arch-tests.
"""

[[exclusion]]
rule = "kt-no-quality-suppress"
sourceSets = ["testFixtures"]
date = "2026-09-20"
reason = """
The wall binds src/main and src/test but not src/testFixtures, so a @Suppress of a detekt structural
rule in one of the four shared fixture files is not caught. A real gap, recorded rather than closed:
widening a rule is a change to quality/rules/, not to this proof. Close it by adding
`"**/src/testFixtures/**/*.kt"` to the rule's files: and deleting this row.
"""

[[exclusion]]
rule = "kt-tests-no-wall-clock"
sourceSets = ["main"]
date = "2026-09-20"
reason = """
A test-determinism law: a test may not wait on the wall clock. Production waiting is governed by
kt-no-delay-in-production, which binds src/main.
"""

