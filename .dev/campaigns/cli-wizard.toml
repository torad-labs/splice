# [2026-09-15] ORCHESTRATOR REVIEW — one REAL defect, on exactly the surface this rows law protects. Everything else is clean: the bracket ordering is right (hook registered BEFORE entering raw, so a crash while entering still restores), the removeHook catch set is correct for removeShutdownHook (IllegalStateException for a shutting-down VM, IllegalArgumentException for not-registered), the non-TTY path provably makes zero stty calls, sealed CLASS not interface, no top-level functions, no companion. THE DEFECT: UnixStty.run discards the process exit code entirely and sets redirectErrorStream(true), which MERGES STDERR INTO STDOUT. So when stty dash g fails, saved becomes the ERROR TEXT rather than a mode string, TerminalMode enters raw mode anyway, and the restore call becomes stty followed by that error text, which also fails. Result: the terminal is left raw with echo off, which the campaign law names as strictly worse than no wizard because the damage outlives the process. The tests cannot catch it because RecordingStty always succeeds and always returns SAVED; there is no failing-stty case in the suite.
