nders LOGIN_PENDING_EMPTY('V4-132'). (G) Strip columns are CONTENT width plus the field's own inline padding: a 13ch box truncated 'chatgpt-oauth', so the widths are 16ch (text) and 12ch (figures). (H) AccountStrip always renders the window columns and lets the view name only the fixed ones, because a saved view cannot enumerate windows that depend on what a provider reported.
