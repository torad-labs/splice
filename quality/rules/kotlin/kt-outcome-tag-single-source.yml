# WALL (V4-90, ARCH-AUDIT 2026-09-17 row B2; concept #924 "make drift not compile"): the PERF-ROW
# OUTCOME VOCABULARY has ONE declaration. A perf row's `outcome=` tag is a wire contract with three
# readers that never see the writer — `splice/app/PerfRowsFileSource.kt` (journal -> rows),
# `splice/control/api/PerfSummary.kt` (rows -> the /api/perf summary and `splice perf`), and
# `core/perf/PerfSnapshot.kt` (the `[head] perf outcome=...` log line). Every tag is currently a
# BARE STRING LITERAL typed at the ending that emits it, so the vocabulary exists only as the union
# of 18 scattered literals and nothing can see when one drifts.
#
# WHY A LITERAL IS THE DEFECT, not a style preference. The tags are compared, prefixed and grouped
# by string identity on the reader side: PerfSummary.kt:112 splits failures from successes with
# `it != OK`, where `OK` is its OWN `private const val OK = "ok"` — a fourth copy of the same word,
# in a different module, that no compiler relates to the writer's. A writer that says `"OK"`,
# `"ok "` or `"okay"` still compiles, still writes a journal line, and silently reclassifies every
# healthy turn as a failure in the operator's summary. The `error:`/`failure:` PREFIX families are
# worse: `PerfSummary` groups by the whole tag, so a writer that emits `err:cancelled` instead of
# `error:cancelled` produces a new outcome bucket rather than an error — a green-looking failure.
#
# THE REMEDY, and the ONE file this wall points at. Fix row V4-102 creates
#   core/src/main/kotlin/splice/core/perf/OutcomeTag.kt   (`splice.core.perf.OutcomeTag`)
# holding the vocabulary as named constants plus the two prefix builders (`error(kind)`,
# `failure(wireName)`), so every ending NAMES a tag instead of spelling one and the readers compare
# against the same declaration they are handed. That file is in `core`, which is deliberately
# OUTSIDE this rule's `files:` scope (see NOT CAUGHT) — the declaration site is the one place a
# literal belongs.
#
# CENSUS AT AUTHORING (2026-09-17, derived from the tree with this rule, never hand-listed — 18
# sites in gateway + control main sources; the ARCH-AUDIT row named 9, so 9 more were found by
# scanning rather than by reading the audit):
#   gateway/control/api/PerfSummary.kt:32                "ok"              (the reader's own copy)
#   gateway/pipeline/TurnPipeline.kt:73                  "failure:${outcome.type.wireName}"
#   gateway/pipeline/TurnPipeline.kt:77                  "client_abort"
#   gateway/pipeline/StreamPromote.kt:15                 "ok"              (PromoteVerdict default)
#   gateway/pipeline/StreamPromote.kt:49                 "empty_model"
#   gateway/pipeline/StreamPromote.kt:59                 "empty_compact"
#   gateway/pipeline/StreamPromote.kt:66                 "empty_message"
#   gateway/pipeline/StreamPromote.kt:86                 "empty_model"
#   gateway/head/TurnTelemetry.kt:122                    "error:rate-limited"
#   gateway/head/TurnTelemetry.kt:141                    "error:all-accounts-exhausted"
#   gateway/head/TurnKnownEnd.kt:36                      "error:auth-missing"
#   gateway/head/TurnKnownEnd.kt:62                      "error:upstream-failed"
#   gateway/head/TurnEnding.kt:43                        "error:unexpected"
#   gateway/head/TurnConnEnd.kt:35                       "error:upstream-frame-too-large"
#   gateway/head/TurnFinish.kt:72                        "ok"              (a COMPARISON, not a write)
#   gateway/head/CancellationSeal.kt:75                  "client_abort"
#   gateway/head/CancellationSeal.kt:97                  "error:cancelled"
#   gateway/head/CancellationSeal.kt:106                 "client_abort"
# TurnFinish.kt:72 is in the inventory on purpose: `outcomeTag != "ok"` is the same literal doing
# the same load-bearing work in the opposite direction, and it is exactly the comparison that goes
# quietly false when a writer's spelling drifts.
#
# WHY THE KEY-POSITION CARVE-OUT IS REQUIRED AND NARROW. `put("ok", true)` appears three times in
# control/gateway (HeadDiagnostics.kt:44, AuthRoutes.kt:59/69, ControlPayloads.kt:59/103) and is a
# JSON FIELD NAME in an unrelated health ack (`{"ok":true}`), not an outcome tag. Matching it would
# make this wall red on correct code, and the usual response to that is to delete "ok" from the
# vocabulary — which would drop the single most load-bearing tag. So the rule exempts EXACTLY the
# FIRST argument of a `put(`/`putJsonObject(`/`add(` call (`nthChild: 1` over the named children of
# `value_arguments`, so the `(` and `,` tokens cannot shift the index) and nothing else. Measured
# both ways: `put("count", "ok")` — the same tag in VALUE position — is still caught, and the
# rule-test pins both halves so widening the carve-out to the whole call goes red.
#
# NOT CAUGHT, and why.
#   `core` main sources. This rule's `files:` are the gateway and control planes, per the row's own
#   wording. The consequence is visible and named rather than silent: core/turn/TurnOutcome.kt:68
#   declares `public const val CONN_RESET_OUTCOME: String = "error:$CONN_RESET_KIND"` — already a
#   NAMED constant, already the single source for that one tag, and the shape V4-102 generalises.
#   Folding it into OutcomeTag.kt is the fix row's call; widening this rule's scope to force the
#   move would be this wall legislating another row's design.
#   The "?" sentinel. `app/PerfRowsFileSource.kt:39` (`UNATTRIBUTED = "?"`) and
#   `control/api/PerfSummary.kt:35` (`UNATTRIBUTED_OUTCOME = "?"`) are two copies of one
#   reader-side tag for an unparseable row. A matcher on `"?"` would fire on punctuation across the
#   whole tree, so this pair is recorded here for the fix row instead of walled.
#   A NEW tag nobody declared. The vocabulary below is the tree's union today; a writer inventing
#   `"error_cancelled"` is invisible to this rule. That hole closes from the other side once
#   OutcomeTag.kt exists and `recordPerf` takes the type instead of a String — a rule cannot type
#   a parameter.
id: kt-outcome-tag-single-source
language: kotlin
severity: error
message: "Perf-row outcome tags have ONE declaration: name the tag from splice.core.perf.OutcomeTag (core/src/main/kotlin/splice/core/perf/OutcomeTag.kt), never a literal here."
note: "The tag is a wire contract compared by string identity in PerfRowsFileSource, PerfSummary (`it != OK`) and PerfSnapshot — three readers that never see this writer. A drifted spelling still compiles and silently reclassifies the turn. Use OutcomeTag.OK / CLIENT_ABORT / EMPTY_MODEL / EMPTY_COMPACT / EMPTY_MESSAGE, or OutcomeTag.error(kind) / OutcomeTag.failure(wireName) for the prefix families. A JSON field name in FIRST argument position (`put(\"ok\", true)`) is exempt — that is a key, not a tag."
files:
  - gateway/gateway/src/main/**/*.kt
  - gateway/control/src/main/**/*.kt
rule:
  kind: string_literal
  any:
    # The exact-tag vocabulary, derived from the census above.
    - regex: '^"(ok|client_abort|empty_model|empty_compact|empty_message)"$'
    # The two PREFIX families, literal or templated — `"failure:${t.wireName}"` is one
    # string_literal node carrying an interpolation, so the same anchored prefix reaches both.
    - regex: '^"(error|failure):'
  # THE CARVE-OUT: a JSON key, i.e. the FIRST argument of a put/putJsonObject/add call. Nothing
  # wider — a tag in value position is still a tag.
  not:
    inside:
      kind: value_argument
      nthChild: 1
      inside:
        kind: value_arguments
        inside:
          kind: call_suffix
          inside:
            kind: call_expression
            regex: '^(put|putJsonObject|add)\s*\('
