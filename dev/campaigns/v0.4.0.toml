# [2026-09-13] [2026-09-13] REVIEW 1 (splice-astra): exact row gate PASS with no output: cd gateway && buildgate ./gradlew --offline :app:test --tests "*Upgrade*" -q. Verdict: NOT ACCEPTABLE. Finding 1 (turn safety): UpgradeDaemon.waitIdle treats every null inflight read as zero, both initially and after a busy poll (UpgradeDaemon.kt:27-35). JdkUpgradeInflight returns null not only when no daemon exists but on a missing or unreadable management key, timeout, 401, malformed response, and any transport or parse failure (UpgradeInflight.kt:29-42); it also treats a head with a missing or malformed gate.inflight as zero. Concrete case: first poll sees 2 active turns and the next /api/heads request times out; waitIdle exits true and activates and restarts during both turns, contrary to waiting for every head to reach zero. Distinguish proven daemon absence from probe failure and fail closed or keep waiting on unknown. Finding 2 (requested version integrity): --to only selects the download URL. UpgradeRelease returns whatever text the candidate jar prints after splice, and UpgradeCommand never compares it with UpgradeArgs.to before using it as the release directory and activation target (UpgradeRelease.kt:74-85; UpgradeCommand.kt:38-64). A v9.9.9 release accidentally containing a 9.9.8 jar is checksum-valid and attested yet splice upgrade --to v9.9.9 silently activates 9.9.8. Validate normalized semver and require an explicit --to match before moving staging. Finding 3 (partial activation): activate repoints liveJar first, then performs wrapper I/O, then updates previous and current with no rollback, while upgrade catches only UpgradeRefused (UpgradeCommand.kt:26-35, 80-87). If wrapper replacement fails from permissions or disk exhaustion, or a later symlink move fails, the command throws after liveJar already points at the new release; metadata still names the old release and the daemon was never restarted. Build the complete link and wrapper transaction before exposure or restore every changed pointer on failure. Additional verified gap: late verification failures leave partial .staging-PID content because the finally block discards only when staging/splice.jar does not exist (UpgradeCommand.kt:41-46). A jar attestation failure, shim checksum or attestation failure, invalid candidate version, or failed candidate doctor happens after splice.jar was written, so staging remains; the current test simulates gh auth refusal before any asset fetch and therefore does not prove the ledger claim that failed attestation leaves no staging leftovers. The three-test gate establishes the happy path, early checksum and gh-auth refusal, wrapper preservation, polling success, rollback happy path, and config or credential byte identity, but not these failure transitions.
# [2026-09-13] REVIEW 1 FIX (orchestrator, 2026-09-13), by finding: (1) the in-flight read is a sealed InflightRead — Count, NoDaemon (health probe proves no listener), Unknown (no mgmt key, non-200, no answer, a head without gate.inflight) — and UpgradeDaemon.waitIdle treats Unknown like busy: it waits out the budget and then refuses with the reason; only Count(0) or NoDaemon activates. Test: Count(2) then Unknown forever, nothing activated, no restart, candidate stays staged. (2) --to must match: the version the candidate jar prints is compared with the normalized --to before the staging move; a mismatch is a refusal and the staging is discarded. Test: jar reporting 9.9.8 under --to v9.9.9. (3) activation is one transaction: wrapper first (its I/O can fail before anything is exposed), then previous, current, and the live jar LAST; any failure restores every pointer (links, live jar, and the shim from the pristine copy when it had been refreshed) and refuses naming the restored version. Test: share dir made read-only, live jar and shim untouched, no restart. (4) staging cleanup: any failure after the first byte — checksum or attestation of the second asset, invalid candidate, doctor not running — discards the staging directory (the helper only folded I/O failures; the refusal is now caught explicitly). Test: shim-only checksum failure after the jar was written leaves no .staging. UpgradeCommandTest 7, app detekt clean. Ready for REVIEW 2.
# [2026-09-13] REVIEW 2 (splice-astra, 2026-09-13): exact row gate PASS with no output: cd gateway && buildgate ./gradlew --offline :app:test --tests "*Upgrade*" -q. Verdict: NOT ACCEPTABLE. Finding 1 (NoDaemon is still an unknown signal): JdkUpgradeInflight returns NoDaemon whenever AdminSupport.daemonUp is false (UpgradeInflight.kt:39-42), but daemonUp is only a version-matching HTTP health reply; DaemonProbe.healthView folds timeout, transport failure, malformed JSON, and no listener alike to null (DaemonLock.kt:137-159), and a stale-version splice listener is also false (DaemonHealth.kt:18-20). A transient or stale /health reply while turns remain active therefore skips polling and activates immediately. NoDaemon must require positive absence evidence such as an explicit refused TCP connection; every ambiguous health failure must remain Unknown. Finding 2 (requested version integrity and path safety remain open): matched only strips one leading v and compares strings (UpgradeCommand.kt:94-100); UpgradeRelease.validate accepts any nonempty text after splice (UpgradeRelease.kt:72-85), and UpgradeLayout.versionDir resolves that text directly beneath releases without validating a single normalized semver path segment (UpgradeLayout.kt:29). A candidate reporting current, ../x, or an absolute path can collide with metadata, escape releases, and reach discard(dir) before activation; the explicit REVIEW 1 requirement to validate normalized semver was not implemented, and no invalid-version test exists. Finding 3 (partial-activation recovery is not proven): UpgradeActivation.restore performs fallible link rewrites and shim copy without catching restoration failure (UpgradeActivation.kt:32-46). The added chmod test makes the wrapper fail before any pointer is changed, so it does not exercise a failure after previous/current changed; a late point failure under the same filesystem condition can make restore throw midway, escaping the authored UpgradeRefused and leaving partial metadata. Add an injected late-transition failure and a fail-safe restoration path or accurately handle/report failed recovery. Premise/fence failure: modified UpgradeInflight.kt and new UpgradeActivation.kt are not listed in V4-05 files, even though the fix claim relies on both. Verified fixed: Count then Unknown waits/fails closed, explicit --to mismatch is refused with staging removed, and late stage verification failures discard staging.
