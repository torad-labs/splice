37 -> 24 at 647ed02^ and 23 at HEAD, over-1.8 60 -> 43. Of the 12 HD-24 targets 10 still read HIGH (TurnDriver 9.15, Daemon 7.93, ControlServer 6.93, ResponsesStreamTranslator 6.61, ChatStreamTranslator 6.08, HeadServer 5.91, PassthroughRequestBuilder 5.24, SseEmitter 4.05, UsageHud 3.36), the two landed ones read low (WsUpstream 0.54, ResponsesRequestBuilder 0.64), and ChatRequestBuilder drops HIGH -> moderate at 2.82 — it stays on the target list, since the item names it explicitly and the gate is 1.8, not the HIGH band. REPORTED, NOT FIXED (both pre-existing, neither introduced or masked by this change): (1) AnthropicRequest.kt reads 3.34 HIGH under the corrected metric at BOTH commits — a 133-line pure DTO file, 19 domain types, zero splice imports, so its only neighbours are its consumers. It is no longer a regression but it is still a decomposition target a '--top N' list would dispatch, and the honest reading is that C charges a domain-type module 11 points per declared type (3 export + 8 concern) while the docstring's old calibration sentence ('scores 2.0, the right shape') was true only because its consumers happened to be the fat request builders this campaign is decomposing. Whether C should score a DTO hub at all is a calibration decision about C and belongs to the orchestrator, not to a fix commit; the docstring now says so instead of claiming 2.0. (2) 'concentration.py --file ResponsesRequestBuilder' — the exact string in this item's verify note and in the review brief — exits 2 'no such production file' on the ORIGINAL script too: the --file matcher is r['file'].endswith(arg), which needs the '.kt'. Verified against 647ed02's own copy of the script run over this tree. Left alone as out of scope; use --file ResponsesRequestBuilder.kt. GATES on the fixed script: --file ResponsesRequestBuilder.kt = 0.64, band low, under 1.8. gateway ./gradlew check --rerun-tasks BUILD SUCCESSFUL, 162/162 tasks executed, 1107 tests / 0 failures / 0 errors across 14 module