# [2026-09-18] 2026-09-18 M1-10 THE ROW'S OWN NAMED WORK, which the wall does not flag because --space-0 is on section 1's kept list: the retired zero token is now gone from every widget in the fence -- widgets/rule/rule.css:18 and :105, widgets/team-board/board.css:58, :106 and :263, widgets/file-view/file-view.css:20, widgets/conversation/conversation.css:25, widgets/waterfall/waterfall.css:55 and :73 (11 sites). Each `margin: var(--space-0)` is `margin: 0` (the reset it always was) and each `padding: var(--space-0) var(--space-2)` is `padding: 0 var(--space-2)`; unitless 0 is clean under webui-css-tokens-only, which matches unit nodes (px/rem/em) structurally. No widget in the fence now uses a token outside section 1.
# [2026-09-18] 2026-09-18 M1-10 LOOK, the three captures read (#/fleet, #/teams?fixture=hero, #/sessions?fixture=board into webui/.impeccable/review/sweep/). One defect found and fixed, and it was mine: the activity rack on the teams board painted its LABEL row only, with the value cut off at the plate's bottom edge. Cause: in M1-06 I set the activity rows to 13.8% (31px) from a plate-row scan that read the comp's rows as 31px tall; the comp's activity plates actually tile their region at the same 38px as their pitch, and its labels sit 6px in with values 29px in. The rows are now 16.9% (the pitch), the value follows its label by --space-1 rather than --space-3, and the time cell -- the tightest cell in the board, a whole 14:01:30 into the comp's 42px -- is laid out at 141% and scaled 0.71 so it prints whole. The other two frames read as the world: no old paper, no radius, no shadow, no gradient, no serif, no vermilion, the two faces only.
