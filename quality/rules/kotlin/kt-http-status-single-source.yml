# WALL (#924 "make drift not compile"; ARCH-AUDIT 2026-09-17 audit B rows 4/9/11, C rows 7/11).
#
# LAW: an HTTP status code is declared ONCE, in splice.core.wire.HttpStatus. Everywhere else in main
# sources you reference that object; a second `const val … = 429` is a drift seed, not a convenience.
#
# SCAR: 429 and 529 were each declared five times under five different names, and nothing kept them
# in agreement. The 2026-09-17 architecture audit census (verified with ast-grep, not the prose list
# it arrived as — see the ledger note on V4-88 for the four name corrections):
#   429  provider-spi/RateLimitCooldown.kt:304        internal const val RATE_LIMITED
#        provider-spi/UpstreamFailureClassifier.kt:291 private const val RATE_LIMIT_STATUS
#        app/RefreshRetry.kt:25                        private const val HTTP_TOO_MANY
#        app/cli/UpgradeFetch.kt:24                    private const val HTTP_TOO_MANY
#        gateway/head/AdmissionResponses.kt:26         private const val RATE_LIMITED_STATUS
#        gateway/wire/CollectingTerminal.kt:24         private const val STATUS_RATE_LIMIT
#   529  provider-spi/UpstreamFailureClassifier.kt:296 private const val OVERLOADED_STATUS
#        gateway/head/AdmissionResponses.kt:24         private const val GATEWAY_CAPACITY_STATUS
#        gateway/wire/CollectingTerminal.kt:25         private const val STATUS_OVERLOADED
# Six spellings of one number is how a retry classifier and an admission responder come to disagree
# about what "overloaded" means on the wire while every unit test stays green.
#
# REMEDY: the fix row creates gateway/core/src/main/kotlin/splice/core/wire/HttpStatus.kt and every
# site above becomes `HttpStatus.TOO_MANY_REQUESTS`. That file is the sole allowed declaration site
# and is named in `ignores:` below, so it is exempt BY PATH — the exemption cannot be claimed by any
# other file, and the fix row's new file needs no edit to this rule.
#
# WHY TWO BRANCHES (the ambiguity the naive rule gets wrong): 400 and 500 are also the two most
# common round magnitudes in this tree — PROBE_TIMEOUT_MS = 400 (DaemonLock, ControlPlaneClient,
# DaemonHealth), MAX_LINE_CHARS = 400, LOG_TAIL_LINES = 500, RING_MAX = 500. A flat numeric-literal
# ban fires on all of those, and a wall that cries wolf gets suppressed. So:
#   branch 1  401 402 403 404 408 409 413 422 429 502 503 504 529 — unambiguous as magnitudes in
#             this tree (zero non-status declarations at those values); red on the NUMBER alone,
#             whatever the const is named, so a rename cannot dodge the wall.
#   branch 2  400 and 500 — red only when the name is in the HTTP status vocabulary
#             (HTTP_/STATUS/CLIENT_ERROR/SERVER_ERROR/BAD_REQUEST/…). Unit-suffixed names
#             (…_MS, …_CHARS, …_LINES, RING_MAX) stay green.
#
# DISCLOSED RESIDUAL GAP (verified, not overstated): this wall guards the DECLARATION site, which is
# what single-sourcing means. It does not match a plain (non-`const`) `val x = 429`, nor an inline
# comparison literal (`if (status == 429)`). Inline literals are the sibling instrument's subject
# (checks/silent-constants.py ratchet); do not widen this rule to cover them — at 400/500 it would
# re-acquire exactly the false positives branch 2 exists to avoid.
id: kt-http-status-single-source
language: kotlin
severity: error
message: "HTTP status codes are declared once, in splice.core.wire.HttpStatus (core/wire) — reference HttpStatus instead of re-declaring the number here."
note: "429 had six spellings and 529 had three, in five files, with nothing keeping them equal (ARCH-AUDIT 2026-09-17). The sole allowed declaration site is gateway/core/src/main/kotlin/splice/core/wire/HttpStatus.kt; every other main-source declaration of a status code is red. Reference the constant, do not re-derive it."
files:
  - "**/src/main/**/*.kt"
ignores:
  # the sole allowed declaration site — exempt BY PATH, so no other file can claim the exemption
  - gateway/core/src/main/kotlin/splice/core/wire/HttpStatus.kt
rule:
  kind: property_declaration
  all:
    - has:
        stopBy: end
        kind: property_modifier
        regex: '^const$'
    - any:
        # branch 1: unambiguous status numbers — red on the value, regardless of the name
        - has:
            kind: integer_literal
            regex: '^(401|402|403|404|408|409|413|422|429|502|503|504|529)$'
        # branch 2: 400/500 are also common magnitudes — red only when named as a status
        - all:
            - has:
                kind: integer_literal
                regex: '^(400|500)$'
            - has:
                kind: variable_declaration
                has:
                  kind: simple_identifier
                  regex: '(?i)(^|_)(HTTP|STATUS|UNAUTHORIZED|FORBIDDEN|NOT_FOUND|BAD_REQUEST|BAD_GATEWAY|RATE_LIMIT|TOO_MANY|OVERLOADED|UNAVAILABLE|GATEWAY_TIMEOUT|REQUEST_TIMEOUT|PAYMENT_REQUIRED|CLIENT_ERROR|SERVER_ERROR|TOO_LARGE|CONFLICT|CAPACITY|INTERNAL|REJECTION)'
