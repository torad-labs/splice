title = "`splice doctor` reports the daemon healthy while its heads are dead || PROBLEM: `/health` already carries `heads`, `readyHeads`, and `failedHeads` — the exact degraded-boot denominator the launch shim waits on — but the CLI's health client extracts only `version`. So doctor's daemon section prints a green `✓ daemon running 0.1.1 on :3096` on an install where every head failed to assemble or failed to bind its port, and then closes with `Everything checks out.` The one command whose whole promise is 'why isn't this working' is structurally blind to the most common partial-failure state, and the operator has to open the dashboard or grep daemon.log for `DEGRADED=` to find it. || SPLICE TODAY: `gateway/app/src/main/kotlin/splice/app/cli/ControlPlaneClient.kt:22-26` (`healthVersion` parses the body and reads only `.str('version')`); `gateway/app/src/main/kotlin/splice/app/cli/DoctorCommand.kt:41-45` (`DaemonSnapshot(port, healthVersion)`) and `:128-139` (`daemonChecks` branches on version only — null → INFO 'stopped', match → OK, mismatch → WARN); `:78` closes with 'Everything checks out.' whenever failures and warnings are both zero. The data exists at `gateway/control/src/main/kotlin/splice/control/ControlServer.kt:392-404` and is logged at `Daemon.kt:324`. || PROPOSAL: Widen `DaemonSnapshot` to `(port, healthVersion, heads, readyHeads, failedHeads)` and have `ControlPlaneClient.healthVersion` return a small `HealthView` (keep a thin version-only accessor for `restart()`). In `daemonChecks`: FAIL when `failedHeads > 0` with fix `splice restart (then: splice logs --head <key> --tail 50 to see why)`; WARN when `readyHeads + failedHeads < heads` (still converging). Additionally probe each configured head's TCP port from the topology and report a per-head `listening` / `not listening` row so a bound-but-unassembled head is distinguishable from an unbound one. || EFFORT/RISK: S. **Risk** Doctor must stay hermetic in tests: `DoctorCommandTest.kt:53-56`'s `hermetic(