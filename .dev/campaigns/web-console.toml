# [2026-09-18] READINGS (no design freedom invented; each is the title's literal text where the title is silent). (1) types.ts is a 10th file beside the nine primitives: Edge and Basis are shared vocabulary, so they live in a leaf file rather than making Strip import HolderEdge's file and Figure import ScopeInset's. (2) RAIL: contract section 1 lists --hair/--hair-strong under Colors, but tokens.css has --hair:1px and ~20 existing rules use it as a WIDTH; breaking that would break the old primitives this row must keep working. So the Bay rail is 'border-top/bottom: var(--hair) solid var(--hair-strong)' - width from the established token, colour from the contract's rail pair. (3) FOCUS RING written literally '2px solid var(--focus); outline-offset: 1px' per the title, not via --focus-width/--focus-offset, because tokens.css today has --focus-offset:2px and M1-01 owns that file. (4) STRIP STATE PRECEDENCE: struck outranks cocked (a disabled strip must never also read needs-me); cocked lifts green/grey to amber and leaves red red. (5) struck also suppresses onOpen - aria-disabled is honoured, not just painted. (6) mono: undefined renders the step's --font-figure face (the title's look); mono={false} is the escape hatch to the label face. (7) Reveal is one-way: there is no collapse control, so a revealed secret is scrolled past rather than re-hidden. (8) role='button' + onClick added to Strip: the title states tabIndex 0 and Enter/Space, and role/click are what make that keyboard contract honest to a screen reader.
