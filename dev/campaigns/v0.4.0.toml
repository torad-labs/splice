# [2026-09-13] REVIEW 4 FIX (2026-09-13): CodeModeLimits.boundedText solves the digit cliff — the kept prefix is chosen so that prefix + marker(remaining) fits BOTH MAX_TEXT_BYTES and maxChars even when keeping one more character widens the marker's digit count (prefixEnd walks code points and re-measures the marker each step); marker omitted only when it cannot fit at all. Test: 65,536+977 a's -> exactly 65,536 bytes ending in the marker; 1,200 a's at maxChars 223 -> length 223. Exact verify exit 0: CodeModeLimitsTest 8, CodexCodeModeLimitsTest 3, CodeModeBridgeRuntimeTest 9, ProviderAssemblyCompatibilityTest 9, CodeModeConfigTest 2, spi/codex/app/core detekt clean. Ready for REVIEW 5.
# [2026-09-13] [2026-09-13] REVIEW 5 (splice-astra): exact row verify PASS (exit 0, no output) on the integrated worktree after the V4-10-owned ProviderAssemblyCompatibilityTest wrapping fix. Adversarial read confirms the REVIEW 4 digit-cliff defect is fixed: prefixEnd evaluates every whole-code-point candidate against marker(value.length - next), so 1000-to-999 equality cliffs can advance rather than terminating at the wider marker; the byte-cap and character-cap equality regressions pin both forms. The separate 100 chars/maxChars=22 edge likewise keeps one character with the 99-char marker. Verdict: ACCEPTABLE.
