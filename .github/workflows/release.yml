name: release

# Two ways in, ONE release identity (the vX.Y.Z or vX.Y.Z-PRERELEASE tag):
#
#   promote:  merge the main -> prod PR (merge commit, never squash). The merge's push fires
#     this workflow, which builds, attests and drafts the release (published as below). The version is
#     DERIVED from the promoted code (the launch shim's SPLICE_GATEWAY_VERSION, the same marker
#     `bun tools/release accept` pins against the jar), and the tag is created by the publish step at the promoted
#     commit — an artifact of promotion, never a second manual pointer that can disagree (fleet's
#     release-line pattern, minus changesets: splice's versions are hand-paired in code, so the
#     bump lands on main via PR). `npm run promote` merely OPENS the promotion PR.
#     Promoting without a version bump fails twice: promotion-check.yml pre-merge, and the
#     resolve step here at build time.
#
#   tag push (the plumbing):  git push origin v0.3.0-beta.1     — still works, unchanged.
#
# Where the release lands (Oct 31, 2026, Marcos: "I dont want the release download to be there [GitHub] ... being at
# Cloudflare makes more sense"): this workflow builds, accepts and attests, and leaves the GitHub release as an
# unpublished draft carrying the notes and no file. The downloads are served from splice.torad.ai/download, which is
# written from the maintainer's machine with a token scoped to the release bucket that its keyring holds, never with a
# Cloudflare token in this repository:
#
#   bun tools/release publish <version> --run <this run's id>
#
# takes the accepted-release artifact from this run, checks every file's attestation from this workflow and its
# sha256sums.txt, puts every file on splice.torad.ai/download, lists the release there, and only then publishes the
# draft, which creates the tag.
#
# The tag is created when `bun tools/release publish` publishes the draft from the maintainer's machine, with their
# gh login rather than this workflow's GITHUB_TOKEN. If that tag's push fires the tag path below, its resolve step
# finds the release already published and stops before building, so a publish can never start a second release.
on:
  push:
    tags:
      - "v*"
    branches:
      - prod

permissions: {}

# ONE group for BOTH entry points (review of #86): ref-scoped grouping put a prod promotion
# (refs/heads/prod) and a manual tag push (refs/tags/vX.Y.Z) in DIFFERENT groups, so the same
# version could build twice concurrently — each passing its own existence check before the other
# published, then both publishing competing drafts. Serialized, the loser of either ordering now
# fails its resolve step inside the critical section: a promotion finds the tag already created,
# a tag re-push finds the release already published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup java
        # Cache derives from reviewed main code; the attestation chain is the integrity control.
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: setup node
        # No `cache:` input, so nothing is cached here; zizmor flags the action by name.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24

      - name: setup bun
        # The gate's Bun legs and the arch tests spawn `bun`; it comes from this pinned action
        # (SHA + version, as in ci.yml), not from an npm package. No cache: a release job
        # downloads its own toolchain.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: resolve release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            # The serialized-concurrency partner guard: a tag run whose release already exists is
            # a re-release attempt (or the losing side of a promotion race) and must stop here,
            # not upload competing assets. Deliberate re-release means deleting the release first.
            # Drafts are invisible to this read-scoped token, so a mid-flight failed run can still
            # be re-run — only a PUBLISHED release refuses.
            if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release: v${version} is already published — deliberate re-release requires deleting the release first" >&2
              exit 1
            fi
          else
            # Promotion path: the promoted CODE is the version authority — the same shim marker
            # accept.sh compares against the jar, so resolve and accept can never disagree.
            version="$(awk -F'"' '/^SPLICE_GATEWAY_VERSION="/ { print $2; exit }' app/src/main/dist/bin/splice-launch)"
            if [ -z "$version" ]; then
              echo "release: could not read SPLICE_GATEWAY_VERSION from app/src/main/dist/bin/splice-launch" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
              echo "release: tag v${version} already exists — promotion without a version bump" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release version: ${version}"

      - name: release notes from the CHANGELOG
        # V4-198: the release page opens with the version's CHANGELOG section, above GitHub's
        # generated PR list. A version with no section stops here, before anything is built.
        env:
          RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        run: bun tools/release notes "$RESOLVED_VERSION" --out "$RUNNER_TEMP/release-notes.md"

      - name: install workspaces
        run: bun install --frozen-lockfile

      # The gate's consoleTests row (tools/gate/config/ladder.json) drives the console's pages in Chromium, the one
      # Playwright bundles for its own version. The runner has none and bun install downloads none, so the gate would stop
      # the release at its first console test (PR 456's review, round 1). The OS libraries it needs come with it.
      - name: install Playwright's Chromium
        run: bunx playwright install --with-deps chromium

      - name: repository gates
        run: npm run gate

      - name: build exact release jar and compliance reports
        run: ./gradlew :app:shadowJar --no-daemon --no-parallel --stacktrace

      - name: place the qualified hub pair
        # Kotlin/Native writes each source file's absolute path into a binary, so a hub built on this runner can never
        # hash to tools/release/mcp-hub.sha256. The bytes hostshield-lead qualified are committed in
        # tools/release/mcp-hub/ beside their pins; this puts them where :app:stageRelease reads the hub binaries and
        # stops the release here if either one does not hash to its pin. It also warns, without stopping, when
        # integrations/mcp-hub is no longer the tree the pair was built from (tools/release/mcp-hub.tree).
        run: bun tools/release hub place

      - name: stage exact release bundle
        # DR-19: thread the resolved version in as the tag so the SemVer + tag/version equality
        # block runs on the PROMOTION path too (a real pushed tag still wins inside the task via
        # GITHUB_REF_TYPE). Without this, the gate was skipped exactly where releases are cut.
        # The two -x flags skip linking the hub: the placed, qualified pair above is what ships, not a build of it.
        env:
          RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        run: SPLICE_RELEASE_TAG="v$RESOLVED_VERSION" ./gradlew :app:stageRelease --no-daemon --no-parallel -x :integrations-mcp-hub:linkHolderReleaseExecutableLinuxX64 -x :integrations-mcp-hub:linkFrontReleaseExecutableLinuxX64

      - name: accept exact release bundle
        env:
          RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        run: SPLICE_EXPECTED_VERSION="$RESOLVED_VERSION" bun tools/release accept

      - name: hub pair matches the qualified hashes
        # The MCP hub's two binaries ship only as the bytes hostshield-ctl qualified: each staged one must hash to its
        # line in tools/release/mcp-hub.sha256, as lead-install.sh checks on this machine. The step before staging
        # checks the committed pair; this checks what the stage put in dist/. Without that file the release stops
        # here, before anything is uploaded, so the check is never skipped.
        run: |
          pins=tools/release/mcp-hub.sha256
          if [ ! -f "$pins" ]; then
            echo "::error::release refused: $pins is missing, so the MCP hub pair has no qualified hashes to match"
            exit 1
          fi
          for b in splice-mcp-holder splice-mcp-front; do
            got=$(sha256sum "dist/$b" | cut -d' ' -f1)
            want=$(awk -v n="$b" '$2 == n {print $1}' "$pins")
            if [ -z "$want" ] || [ "$got" != "$want" ]; then
              echo "::error::release refused: dist/$b is $got, qualified in $pins is ${want:-none}"
              exit 1
            fi
          done

      - name: transfer accepted bundle to publisher
        # The whole dist/ is what reaches splice.torad.ai: the publish job attests it, and `bun tools/release publish
        # --run <id>` downloads this artifact on the maintainer's machine, so it is kept for a week, not a day.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: transfer the release notes to publisher
        # Beside the bundle, never in it: dist/ is the enumerated asset set accept verified.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    # The build job resolved the ONE version both paths share; the tag is created from it here,
    # at exactly the commit that was gated, built, and attested.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: download the accepted bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: accepted-release
          path: dist

      - name: download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: verify transferred checksums
        working-directory: dist
        run: sha256sum -c sha256sums.txt

      - name: attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/sha256sums.txt

      - name: attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/splice.jar
          sbom-path: dist/bom.cdx.json

      - name: draft the release notes, with no file to download
        # Draft first, as before: attestations complete before anything goes public. The draft stays a draft here.
        # `bun tools/release publish` publishes it once splice.torad.ai serves every file, so the notes never name a
        # release nobody can download yet.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.2 # zizmor: ignore[superfluous-actions]
        with:
          draft: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          # Explicit on BOTH paths: on a prod promotion there is no tag yet — it is created when
          # the draft publishes, at the exact SHA the build job gated and attested.
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          # The CHANGELOG section first; GitHub's generated notes are appended below it.
          body_path: notes/release-notes.md
          generate_release_notes: true
