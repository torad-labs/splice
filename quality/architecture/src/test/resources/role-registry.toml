another session as a peer's words. It keeps its own port because wiring ClaudeVersionRead, McpBearer or TopologyDigest in its place compiles and sends a version, a secret or a hash to another session as a message. FailureDescription renders the cause of one hosted-child transport failure before its retry or release path acts; it is neither a credential, a version nor an operator-facing status read, and a substituted string would name the wrong failure while the host changes lifecycle state. Current (added 2026-10-26, key rotation, HeadDeps.HeadTokens.Current) is one of a head's two bearer credentials AS IT IS NOW, the turn key or the management key, read on every request the head checks, so a key replaced while the head runs (`splice rotate-key`) is refused from that moment. It is a SECRET compared against what a client presents: wiring McpBearer in its place compiles and admits turns and operator routes with the MCP-scoped key, and wiring TopologyDigest or ClaudeVersionRead makes a hash or a version the bearer every request must carry. HookStdin (2026-10-27) reads one harness-owned JSON hook event after the stdin-terminal check; its session_id, cwd and event name select the current hook invocation. PeerStdin reads the operator-authored message body delivered to another session. Sharing the role would make a hook event become peer message text or make message prose become hook session identity; credentials and version/status strings are likewise not hook payloads. OwnCgroup (added 2026-10-29, socket activation) reads the cgroup membership of the process running `splice restart`, as /proc/self/cgroup prints it, so a restart started inside splice.service leaves the ports alone rather than stop the daemon it runs under. It keeps its own port because wiring SupervisorUnitName in its place compiles and always reads as "inside splice.service", so a restart from a terminal would never hand the ports to systemd, and wiring any other string here makes the restart stop the da