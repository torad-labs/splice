[package]
name="splice-current-core-api-reference"
version="0.1.0"
edition="2024"
[workspace]
resolver="2"
[dependencies]
codex-tools={path="../source/codex-rs/tools"}
codex-code-mode={path="../source/codex-rs/code-mode"}
codex-code-mode-protocol={path="../source/codex-rs/code-mode-protocol"}
codex-protocol={path="../source/codex-rs/protocol"}
serde={version="=1.0.228",features=["derive"]}
serde_json={version="=1.0.149",features=["alloc","preserve_order","arbitrary_precision","raw_value"]}
tracing="=0.1.44"
[profile.dev]
debug=1
debug-assertions=false
overflow-checks=false
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
