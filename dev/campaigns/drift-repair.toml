# [2026-08-31] 2026-08-31 FIXED per codex-splice's map. PersistFailed is now a sealed sub-hierarchy - Write(cause: Throwable) and the UnreadableAfterWrite object - with NO String field anywhere, and an internal detail() at the sink does the single render. The census matched codex exactly: 4 production constructors, 3 throwable writes plus codex's semantic post-write case, no others. Also added the injected write seam codex specified - private val write: (Path, String) -> Unit = SecureFile::writeAtomic0600 on all three providers, replacing each private writeSecure - because the only prior way to red this path was chmodding a directory, and an untestable security branch is one nobody has actually checked. ONE DEVIATION from the map, flagged not silent: codex asked to preserve the literal 'auth.json write failed' and converge kimi onto it, but kimi's credential file is credentials/kimi-code.json, so that would have put a WRONG filename in a diagnostic. The shared line names no file at all - the existing [tag] prefix already identifies the provider - and no test pinned the filename, only the 'persist failed' sink template, which is preserved. THREE mutants, all with cleanTest and an XML-freshness assertion: (A) sink renders the cause raw as dollar-cause - reds ALL FOUR arms; (B) type reverted to the pre-fix String with a raw call-site interpolation planted - reds all three provider arms; (C) NEGATIVE CONTROL, type reverted to String but call sites still routed - all three provider arms PASS. C is the honest limit and I am recording it rather than hiding it: these arms detect a BEHAVIOR regression, not a type regression. The type's guarantee is compile-time - there is no longer a String field to put anything in - and no runtime arm can assert that, the same shape as DR-149's unobservable cleanup. Fixtures use SerializationException, not a bare RuntimeException: my first draft threw an anonymous RuntimeException and it ESCAPED, because runCatchingCancellable catches a closed set (IOException, SerializationException, IllegalArgumentException). That is the same mistake I made on SessionRegistryLinkTest - injecting a throwable production cannot produce - and SerializationException is also the canonical leak this law cites, since kotlinx quotes a JSON input excerpt and the JSON here IS the credential file. PROCESS ERROR, recorded because it cost real work: while restoring an earlier mutant I used git checkout -- on UNCOMMITTED production files and destroyed the whole DR-151 production change; only a cp backup of RefreshOutcome.kt survived and the three providers had to be reapplied. Restores are cp from a pre-mutation copy, never git checkout, when the baseline is not yet committed. SECOND PROCESS ERROR from the same run: the first mutant readings showed the provider arms PASSING under mutant A, which was a STALE-XML artifact - gradle had skipped those test tasks as up-to-date and I read 94-second-old result files. The harness now runs cleanTest with --continue and refuses any XML older than 60s. Restores byte-identical: RefreshOutcome 7a39df538ecd1a86, GrokAuthProvider 63f75f0d7bd73fd6, CodexAuthProvider 16dd0199db3cfada, KimiAuthProvider 716d802ed7d40337. Full affected suites 592 tests, 0 failures, all four detekts clean.
