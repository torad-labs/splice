# [2026-09-18] 2026-09-18 M1-05 HERO: gate reads hero 81% (match) with ONE region below its verdict, and it is not this row's. Every page region -- team-header, bay-claude, bay-claude-label, lead-strip/-2/-3, bay-deepseek, bay-deepseek-label, builder-strip/-2/-3, handoff-strip, chat-bay, chat-label, chat-strips, activity-bay, activity-label, activity-strips, footer-strip -- now reads drift or match. The only contradicted region is rail-labels (structure 42%, detail added 9%), which the row assigns to M1-03.
