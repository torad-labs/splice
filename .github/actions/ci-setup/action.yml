name: CI tools
description: Pinned tools and dependency caches for an independent CI worker
inputs:
  browser:
    description: Install Chromium for browser or release proofs
    default: 'false'
  cache-write:
    description: Allow the designated main worker to write dependency caches
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: ${{ inputs.cache-write != 'true' }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    - shell: bash
      run: bun install --frozen-lockfile
    - name: Install Chromium when this worker needs it
      if: inputs.browser == 'true'
      shell: bash
      run: bunx playwright install --with-deps chromium
