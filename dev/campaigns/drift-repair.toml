phase = "ws"
title = "ResponsesWsSession.chains (line 60) is bounded at 256 CONVERSATIONS with no byte cap and no TTL, while each Chain retains the entire conversation history plus the full tool surface as strings. Chain.input is input.map{it.toString()} — the whole logical input array — and Chain.props is the whole request minus input, i.e. every tool schema, serialized. This file own header sizes that at roughly 177k tokens / 480KB per conversation, so 256 entries is about 120 MB retained on the ~1 GB heap that BufferCapacity header says is shared by codex plus grok plus kimi, and per-conversation size is itself unbounded (a 1M-context conversation multiplies it). The TTL gap bites harder than the byte gap: eviction is COUNT-driven only, and a head talks to a handful of live sessions, so with fewer than 256 keys nothing is ever evicted and every conversation full history stays pinned for the daemon lifetime — this file documents a daemon that had been up 91 hours. cleared() and completed() remove and re-insert the key; they never expire it. The sibling ReasoningCache, hardened in the same era, has all three: a count bound, a 64MB byte cap, a 30-minute idle sweep, and an eviction log line. Fix: add a total-bytes accumulator over input+props with a cap, and an idle-timestamp sweep in frameAndEpoch/completed — ReasoningCache.sweepLocked is the shape, and epochOf absent-key fallback already makes eviction safe. The epoch protocol itself was probed and is SOUND (cleared re-inserts at the LRU tail so the most-recently-stamped key is never the eviction victim); this is a memory finding only."
