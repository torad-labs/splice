[[row]]
id = 'df-wire-door'
title = 'The door takes Desktop as a gateway: x-api-key, the root probe, one-shots'
feature = 'desktop-full'
status = 'todo'
owner = ''
blocked_by = []
guard = false
spec = '''
The door takes Claude Desktop as a gateway client (outcome 5).
- The desktop key opens the door sent as `x-api-key` as well as `Authorization: Bearer`, on /desktop/v1/messages and /count_tokens, with or without ?beta=true. Desktop sends a gateway credential as x-api-key unless told bearer, and its main process uses x-api-key under Mantle. The terminal's key is taken the same two ways. A wrong, replaced or missing key is refused 401 `authentication_error` naming `splice desktop`, as today, and the management and turn keys open nothing here. When both headers are present, Authorization decides.
- Desktop probes the address's root before it uses the gateway. `GET /` and `HEAD /` on the control port answer 200 with a short text/plain body ("splice"), no key needed, and nothing in the body. A request whose Accept names text/html still gets today's redirect to the console, so a browser lands where it did.
- Desktop's own non-streamed one-shots (connection test, titles, Claude in Chrome; `stream` false or absent, any max_tokens) are answered as one Anthropic `message` JSON, on a selector or a tier, through the same routing as any door turn. A request with max_tokens 1 that is not streamed keeps today's probe routing (the door's default model), since Claude Code's start-up check and Desktop's connection test send the same shape and the door can't tell them apart. It is answered 200 as one Anthropic `message` JSON too, so Desktop's connection test passes.
Files: app/src/main/kotlin/splice/app/desktop/DesktopDoor.kt (admission), app/src/main/kotlin/splice/app/control/mount/ConsoleMount.kt (root). Proof: `bun test ./.campaign/checks/desktop-full/wire-door.test.ts`.

Shared across desktop-full (decided once, the same in every item): one door at /desktop on the control port and one desktop key serve both of Desktop's modes. "Standard mode" is today's Code-tab door through Desktop's environment store (`splice desktop on`). "App mode" is Desktop's third-party gateway mode, the whole app on splice (`splice desktop on --app`). In JSON the mode is one of "off", "standard", "app", "other" (a third-party configuration that is not splice's). Every request Desktop sends in app mode carries the header `x-splice-desktop: app`, which splice writes into the configuration's inferenceCustomHeaders. That header is how the door tells an app-mode request from a standard one. Refusals keep the door's Anthropic error shape and the "splice desktop: " prefix. Picker rows are DesktopLineup.picker, the terminal's rows (don't fork them; the custom-provider campaign, #680, is changing labels and tiers there at the same time). Vendor facts about Desktop (paths, key names, row fields, ID filter) live in integrations/claude-code/src/main/kotlin/splice/client/desktop/, beside the other Desktop facts. Goal: docs/specs/desktop-full.md.'''
