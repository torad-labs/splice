# A mutation's handlers do not hand their refetches to React Query. A mutation stays pending until the promise its
# onSettled or onSuccess returns settles, so `onSettled: () => Promise.all(keys.map(invalidateQueries))` held the write's
# busy state, and every confirmation that reads the mutation's result ("Written."), until the slowest of those reads
# answered: on a slow daemon the page sat on "Writing…" after the PUT had been answered (clean-jar suite run 2,
# settings-behavior.spec.ts:31, 2026-09-30). `refetch(client, keys)` (src/api/refetch.ts) reads again and moves on;
# `awaitRefetch` waits, for the place where the refreshed data is the done state. Either name shows the choice at the call.
id: webui-mutation-hooks-never-return-refetch
language: typescript
severity: error
message: "Do not call invalidateQueries inside onSettled or onSuccess; use refetch(client, keys), or awaitRefetch when the refreshed data is the done state."
note: |
  Returning (or awaiting) invalidateQueries in a mutation handler keeps the mutation pending until every refetch answers.
  Use `refetch(client, [keys])` from src/api/refetch.ts when the confirmation stands on the write's own answer, and
  `awaitRefetch(client, [keys])` when the page showing what the write changed is what "done" means. A `void`ed call
  is the same choice made by hand; prefer the helper.
files:
  - console-next/src/**/*.ts
ignores:
  - console-next/src/api/refetch.ts
rule:
  pattern: $C.invalidateQueries($$$A)
  inside:
    kind: pair
    stopBy: end
    has:
      field: key
      regex: ^(onSettled|onSuccess|onError|onMutate)$
  not:
    inside:
      kind: unary_expression
      regex: ^void
      stopBy: end
