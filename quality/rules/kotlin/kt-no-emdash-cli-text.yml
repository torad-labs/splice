# Copy gate for the text splice's diagnostics print (V4-219, 2026-09-25): zero em-dashes in the
# sentences `splice doctor`, `splice logs` and `splice wire` write, the same locked decision
# webui-no-emdash-ui-text.yml enforces on the console. Doctor's details reach the console verbatim
# (Doctor, Needs you), so an em-dash here printed in the UI past the console's own wall; and the
# CLI prints the same sentences. Split the clause, or use a colon, a semicolon or a comma.
#
# Both spellings are matched: the character itself, and the `—` escape, which parses INSIDE
# string_content on tree-sitter-kotlin (measured on ast-grep 0.45: `"x — y"` is one
# string_content node), so an escape would otherwise be a silent way around the wall. Comments are
# free. The report's fix separator is the one em-dash on the wire and it is not text: the console
# splits on it and never prints it, so it is built from its code point (DoctorReportShape
# FIX_SEPARATOR), which no string_content holds.
#
# Scope: the diagnostics module, where these sentences are authored. Strings doctor QUOTES from
# other modules (SafeFailureText, the topology's messages) were rewritten in the same pass; the rest
# of the daemon's text is dispositioned in tools/gate/config/rule-coverage-exclusions.toml.
id: kt-no-emdash-cli-text
language: kotlin
severity: error
message: "Zero em-dashes in doctor, logs and wire text (locked copy gate): rewrite the sentence."
note: |
  Split the clause, or use a colon, a semicolon or a comma. The report's fix separator is built
  from its code point in DoctorReportShape and is the only em-dash the wire carries.
files:
  - features/diagnostics/src/main/**/*.kt
rule:
  kind: string_content
  regex: "—|\\x5Cu2014"
