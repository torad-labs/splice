[[row]]
id = 'df-diagnostics'
title = "splice desktop and splice doctor say Desktop's mode, relaunch, picker and last turn per mode"
feature = 'desktop-full'
status = 'todo'
owner = ''
blocked_by = [
  'df-app-window',
]
guard = false
spec = '''
`splice desktop` and `splice doctor` say which mode Claude Desktop is in, whether it has been reopened since splice changed its configuration, the picker rows Desktop is given, and the last turn per mode (outcome 7).
- The mode is read from splice's desktop record and Desktop's library, checked in this order:
  - "other": the library applies a configuration that is not splice's, or /etc/claude-desktop/managed-settings.json exists (existence only). The words are "third-party mode with another configuration (<its _meta.json name>)", or "(a managed configuration)" for the managed file. This wins over splice's own state: in that case Desktop reads neither splice's config nor its environment store.
  - "app": splice's configuration is applied. The words are "on, app mode: all of Desktop (Chat, Cowork and the Code tab) runs on splice".
  - "standard": the door is on in standard mode. The words are "on, standard mode: the Code tab runs on splice through Desktop's environment variables; Chat and Cowork stay on claude.ai".
  - "off": the words are "off".
- `splice desktop`'s first line is "Desktop: <words>". `splice doctor` has a check named "desktop" whose line is "Claude Desktop: <words>". It passes in every mode, and warns only in app mode while Desktop has not been reopened. Under that line, doctor gives the rest in short: "  picker: <n> rows" (outside app mode, "  picker: not read by Desktop in this mode", since only app mode's picker is splice's) and "  last turn: standard <at|none>, app <at|none>", and `splice doctor --json`'s desktop check carries `mode`, `relaunched`, `picker_current`, `picker` and `last_turns` as `splice desktop --json` has them. The full rows are `splice desktop`'s to list.
- Reopened: splice records when it last wrote or removed its configuration (`on --app`, `off`, plain `on` after app mode, and a daemon start that rewrites the door's address, df-app-on), and the last time a request carrying `x-splice-desktop: app` reached the door (a turn, a count or a discovery). `relaunched` in --json is true once such a request came after the write, false before, and null outside app mode. While it is false, both commands add "; quit and reopen Claude Desktop to apply it". Desktop reads its configuration only at launch.
- `--json` gains `mode`, `relaunched`, `other` (the other configuration's name, or null), `picker` (the rows GET /desktop/v1/models answers, df-models, the same objects) and `last_turns` {"standard": <turn>|null, "app": <turn>|null}. Each turn has the fields last_turn has today. `last_turn` stays, as the latest of the two.
- The words list the picker rows (id, label, tier) under "Picker:", and each mode's last turn under "Last turn (standard mode):" and "Last turn (app mode):", with its session id.
- Which mode a turn belongs to is the x-splice-desktop header, never a guess.
- Picker changed (outcome 2: a sign-in or an added head reaches the picker at Desktop's next launch, and `splice desktop` says when a relaunch is needed). Desktop discovers models only at launch. At each app-mode discovery, splice keeps the rows it answered (id and label, in order) in its desktop record, so they survive a daemon restart. `picker_current` in --json is null outside app mode or before Desktop's first discovery since the write. It is true while the rows the door would answer now are those same rows, and false when a row was added, removed, relabelled or moved. While it is false, both commands say "the picker changed since Claude Desktop last read it; quit and reopen Claude Desktop to see it", and `splice doctor`'s desktop check warns. The next discovery makes it true again.
Files: app/src/main/kotlin/splice/app/desktop/DesktopService.kt, DesktopRecord.kt, DesktopCaller.kt (recording by mode), DesktopModels.kt (a discovery counts as Desktop seen, and keeps the rows it answered); app/cli/desktop/DesktopSaid.kt; features/diagnostics doctor (a DesktopRead beside ClaudeLaneRead, wired in app/src/main/kotlin/splice/app/DoctorWiring.kt). Proof: `bun test ./.campaign/checks/desktop-full/diagnostics.test.ts`.

