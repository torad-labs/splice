# LAW [2026-08-26]: EVIDENCE-FIRST — every item lands a test that FAILS on unmodified HEAD before
#   its fix. A fix without a red-green proof is unvalidated and cannot be set done. This is the
#   ws-close precedent (71c0849): three tests red for the right reason, then the two-line fix.
# LAW [2026-08-26]: NEVER-BELOW-STATUS-QUO — every fix degrades to today's behavior on its error
#   path. A fix that surfaces a client-visible error where the old code fell back (to SSE, to a
#   full send, to verbatim, to a silent decline) is a blocker regression, not a fix.
# LAW [2026-08-26]: OPERATOR LOCKS — mirror_reasoning stays FALSE on every head (never re-enable
#   for parity/continuity/any agent theory: ASK and wait). Kimi's built requests and goldens stay
#   BYTE-IDENTICAL. Neither may be touched by any item here.
# LAW [2026-08-26]: NO GATE BYPASS — no --no-verify, no skip envs, no renaming to dodge a matcher.
#   A wrongly-blocking hook gets the hook fixed and the gate re-run. Each item's `verify` is its
#   own targeted command; `npm run gate` (38 legs) is the ORCHESTRATOR's act, never a builder's.
# LAW [2026-08-26]: COMMENTS ARE DESIGN LAW — this codebase's comments carry ported invariants and
#   dated rulings, so a comment asserting what the code does NOT do is a defect of the same rank as
#   the code being wrong. Comment corrections ride the commit that touches their file; DR-6 exists
