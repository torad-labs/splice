reason = """Four generic suspend producers whose contracts are about DUPLICATION and OWNERSHIP, which a type parameter cannot say. CoalescedWork "runs EXACTLY ONCE per wave however many callers pile up and however many of them are cancelled mid-wait", in a scope SingleFlight owns rather than any caller's — so it must not close over one caller's cancellation or deadline. CredentialRefresh is "the whole indivisible unit" run under the credential-file lock, where anything split out leaves the race open, and it may deliberately run WITHOUT the lock once the bounded wait expires (SH-06: bounded beats hung). MaterializedRequest produces the turn's request body under the materialization gate and must NOT hold its lease across the upstream call, or it starves every other head; its `T : Any` bound makes null mean CONTENTION and nothing else. TimedWork is the body TurnPerf wraps to measure, charged to its counter even when it throws, and deliberately not inlined. Collapsing any two would make "run this at most once" and "run this and time it" the same seam. NativeCodexMcpDialog is one request or notification operation run under the RPC session's timeout and cancellation boundary, unlike coalesced work, credential refresh, request materialization, or performance timing. CodeModeInvocationAction is callback delivery or its continuation, run under a code-mode cell invocation's live trace context when one exists; it is resumed work, never coalesced or timed. NativeGrpcObservation is one native RPC's awaited response, which NativeGrpcDeadlines bounds by the transport or yield deadline and whose timeout invalidates the session; run as invocation work it would wait with no deadline."""

