[[items]]
id = "WC-10"
phase = "console"
title = "FLEET PAGE (FEATURES.md 4.2; after the hero gate closes in WC-02). One bay of head strips from /api/heads, /api/usage and /api/auth (entities exist; extend them here): each strip carries key, port, dialect, model, account label, in-flight against max, the window nearest exhaustion, last turn; cocked with a text label when the head needs attention (unhealthy, version mismatch, token missing or expired, account excluded, queue at max, topology stale), struck when disabled; provider family printed and as a monochrome mark, never a color; the opened strip swells into the detail column (knobs with provenance from the config entity, the account pool). Every number measured, estimated, unavailable or stale and says which; every empty names its source; windows a provider does not report read 'not reported by provider', never zero. The Rule's window-nearest-exhaustion line is fed from here. Replaces widgets/head-plate and widgets/fleet-banner. Motion: swell and cock only."
