name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 3"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # console/dist/index.html is the single-file bundle: every dependency's minified code
          # inline, and CodeQL read it as ours — two "high" alerts on 2026-09-20 were react-router's
          # redirect-protocol allowlist and style-mod's `&` selector nesting (#5, #8). Since PR 4 the
          # bundle is no longer committed (:console:bundle builds it), so this only matters when a
          # local build left one behind; console/src stays scanned.
          config: |
            paths-ignore:
              - console/dist
      - name: build Kotlin
        if: matrix.language == 'java-kotlin'
        run: ./gradlew classes --no-daemon --stacktrace
      - name: analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
