# [2026-08-17] HD-21 REVIEW FIX — Clock SPLIT INTO WallClock + ElapsedClock. Finding 1 [Important] against RuntimePorts.kt:32/:68 VERIFIED BEFORE ACTING, both halves true. The KDoc this wave existed to add was factually wrong about production: :68 claimed 'Production wires MonoClock.nowMs' and :32 listed the defaults as '(DaemonLog::write, System::getenv, MonoClock::nowMs)', but measured with the MATCHER (ast-grep scan --rule, gateway/*/src/main, never grep) 10 of the 15 defaulted Clock sites wired System::currentTimeMillis (TurnPerf, CodexAuthProvider, AuthProbeLoop, PerfStats, Compact:120, CompactStats:170, MgmtKey, UsageHud, KimiAuthProvider, GrokAuthProvider) and only 5 wired MonoClock::nowMs (ReasoningCache, InflightGate, Watchdog, UpstreamClient, HeadDeps). The wave recorded the two DEFAULTS as deliberately not unified but not that the TYPE was — the actual defect, since one Clock made wall/monotonic transposition exactly as expressible as the raw () -> Long it replaced, which is what this file's own WHY BY ROLE AND NEVER BY SHAPE paragraph says a named port must prevent. FIX: Clock deleted; two ports named for the timebase production actually reads at that seam, so every site's type matches its wiring 1:1 and both KDocs are uniformly TRUE. WallClock (epoch ms, System::currentTimeMillis, 9 sites) is required wherever the reading CROSSES A BOUNDARY — persisted (PerfStats/CompactStats ts, UsageHud updated_at), minted (MgmtKey.mintedAtMs, which doctor/status compare against daemon uptime), or weighed against a foreign epoch (codex/grok/kimi token expires/exp, Files.getLastModifiedTime). ElapsedClock (monotonic, MonoClock::nowMs, 9 sites) is meaningful only as a difference: watchdog caps, gate-slot idle, reasoning TTL, upstream timeouts, turn latency. 9+9=18, matching the original Clock census EXACTLY (user_type ^Clock$ = 18 at HEAD; ^WallClock$ = 9 and ^ElapsedClock$ = 9 after). TurnPerf is the one site that moved class, on MEASURED evidence not taste: production already passes it the monotonic clock (HeadServer.handleMessages does TurnPerf(clock) off HeadDeps.clock = MonoClock::nowMs) and it consumes only differences, so its wall DEFAULT is reached only by tests calling a bare TurnPerf(). That default was left BYTE-IDENTICAL rather than retuned — retuning is a behaviour change on a frozen tree — with the reasoning now a KDoc on the class. AuthProbeLoop deliberately stayed WallClock: it also consumes only differences, but its PRODUCTION wiring is wall and SH-04 documents that choice in the adjacent comment, so typing it ElapsedClock would have made ElapsedClock's 'production wires MonoClock::nowMs' claim false — the exact defect being fixed. RED PROOF, not asserted: the finding's literal scenario (normalise the outlier wall site to the monotonic port) now fails to compile — 'PerfStats.kt:38:77 Initializer type mismatch: expected WallClock, actual ElapsedClock, BUILD FAILED'. At HEAD that same edit compiled silently because both spellings were the identical type Clock. PerfStats.kt restored and verified byte-identical by hash (sha256 0528cb45 before the probe and after). GATES: gradlew check --rerun-tasks BUILD SUCCESSFUL in 2m31s, 162/162 tasks, 1107 tests / 0 failures / 0 errors / 1 skipped / 14 modules — identical to this wave's own baseline. npm run gate PASS every leg. npm run gate:rules 43 passed 0 failed plus the dormant pack's no-lambda-seam 11 cases. BEHAVIOUR FROZEN, VERIFIED: git status --porcelain on gateway/*/src/test EMPTY and on the whole dialect-anthropic-passthrough module EMPTY — zero test files and zero goldens touched; PassthroughGoldenTest 9 tests 0 failures unmodified. SEAM CENSUS UNCHANGED: no-lambda-seam 116 -> 116, measured on the worktree and again on a stashed HEAD (splitting one named port into two does not change how many RAW function types exist; a moved count would have meant something else changed). GATE I BROKE AND FIXED, never routed around: detekt ImportOrdering on MgmtKey.kt — detekt wants java/javax/kotlin and aliases LAST, so the first placement pass put WallClock after java.security.SecureRandom; corrected to sort within the non-java group and then checked mechanically across all 16 touched Kotlin files (0 violations) rather than trusting one green run. 17 files: 16 Kotlin main sources + the no-lambda-seam.yaml rule header, whose note named the now-deleted Clock (orphaned by this change) and now says four roles LogSink/EnvReader/WallClock/ElapsedClock. REPORTED NOT FIXED (behaviour frozen): (1) AuthProbeLoop's restart-budget window is wall-clock and consumes only differences, so an NTP step or suspend/resume can widen or collapse the rolling RESTART_WINDOW_MS window and mis-count the budget — structurally an ElapsedClock seam wired to wall, SH-04's deliberate choice, belongs to whoever owns that budget; (2) TurnPerf's default diverges from its real composition root, harmless today because only tests reach it, but a future production caller constructing a bare TurnPerf() silently gets the wall timebase; (3) RESIDUAL HOLE the split does NOT close — WallClock(MonoClock::nowMs) is still EXPRESSIBLE, since SAM conversion accepts any () -> Long at a declaration site. What is now impossible is passing an already-typed port of the wrong role, and each KDoc names the exact corruption the wrong timebase causes. Closing the last gap needs an ast-grep wall pinning each port to its permitted function reference; NOT added here because the finding did not ask for a 40th wall and ElapsedClock(System::currentTimeMillis) legitimately exists at TurnPerf's default, so that rule needs a considered exemption rather than a quick one. Report: .superpowers/sdd/2026-08-15-head-decoupling/hd-21-report.md section 10.

