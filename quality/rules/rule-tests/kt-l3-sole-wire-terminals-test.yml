id: kt-l3-sole-wire-terminals
valid:
  # the one declaration of each terminal, exempt by its shape: a const val
  - 'internal const val MESSAGE_STOP: String = "message_stop"'
  - 'internal const val MESSAGE_DELTA: String = "message_delta"'
  - 'val evt = "content_block_delta"'
  - '// comment naming message_stop is fine (PORT-OF headers cite invariants)'
  - 'val msg = "the message " + received'
  - 'val msg = "stop" + "watch"'
invalid:
  # a literal that is not a const declaration is the drift this wall exists for
  - 'val MESSAGE_STOP = "message_stop"'
  - 'write("event: message_stop\ndata: {}\n\n")'
  - 'val kind = "message_delta"'
  - 'val kind = "message_" + "stop"'
  - 'val kind = "message_" + "delta"'
