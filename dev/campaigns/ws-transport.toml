# [2026-07-31] landed: ResponsesWsSession.kt — chaining state + BAIL-CLOSED delta classifier. 12 walls in ResponsesWsSessionTest, all driven by the REAL builder (a fixture would pin my assumptions about item shapes, which is the actual risk). Chains: pure tool round -> delta is EXACTLY [function_call_output]; assistant-text round -> assistant message dropped (server-held); user follow-up -> the user message. Bails: reconnect generation, effort flip (props), rewritten prefix, identical retry (empty delta), unknown item type, other conversation key, null response id. Measured magnitude on a 12-round loop with 2KB tool results: wire bytes FLAT at ~2385 while full send grows linearly (round 12: 31882 -> 2387, 92.5% saved; total 208674 -> 29250, 86%). Constant-vs-linear: the saving grows with conversation length.
# [2026-07-31] ATTEST: scoped diffstat: .../splice/dialect/responses/ResponsesWsSession.kt | 140 +++++++++++++++++++++ | 1 file changed, 140 insertions(+); sidecar: .claude/ledger-diffs/WS-2.diff; off-scope: gateway/dialect-openai-responses/src/test/kotlin/ResponsesWsSessionTest.kt
# [2026-08-11] [2026-08-11] PRODUCTION INCIDENT — the WS chaining state wedged the daemon, and WS-5's sign-off could not have seen it. SYMPTOM: a daemon up 91h stopped serving; a probe held the connection 60s and got ZERO bytes and ZERO log lines (the request never reached the classifier), while the control plane answered {ok:true, readyHeads:4, failedHeads:0}. Operator saw requests silently never complete, and a fresh account with full quota changed nothing. ROOT CAUSE, from a jstack taken before the restart (kept at dev/research/daemon-wedge-2026-08-11.jstack.txt): SIX Netty event-loop threads spinning inside java.util.HashMap.remove at ResponsesWsSession.trimLocked, burning ~2 CPU-HOURS EACH (cpu=5,575,076ms to 7,244,167ms). Netty loops are SHARED, so every connection those loops served was accepted and never dispatched; the control plane survived because it runs on a different loop group. WHY IT HAPPENED, and this is sharper than 'missing lock': the class doc promised 'the WS transport serializes rounds PER CONVERSATION and every method runs inside that serialized window' — but chains/epochs are GLOBAL maps shared by every conversation, so two conversations completing at the same instant both mutate one LinkedHashMap while fully honouring that contract, corrupting its internal list into a cycle. trimLocked made it unavoidable rather than merely possible: eviction touches OTHER conversations' keys, so even a strict per-key lock would not have serialized it. The 'Locked' suffix named a lock that never existed. FIXED: one lock guarding chains/epochs/seq, taken by epochOf/frameFor/completed/cleared; trim is now iterator-based so it is bounded by construction and cannot walk a cycle even if the lock discipline is ever broken again; the class doc now states the real contract instead of the insufficient one. RED-GREEN: ResponsesWsSessionConcurrencyTest drives 12 threads x 4,000 ops over 512 keys (far past MAX_CONVERSATIONS, so eviction runs constantly) — it FAILS against the pre-fix shape and passes in 835ms with the lock; the @Timeout is what turns 'hangs forever' into a failing test rather than a wedged CI job, which is the same distinction the outage turned on. MY OWN MISS, recorded: WS-5's 2026-08-11 sign-off reported 'no error-class regressions' from perf-row error RATES. A wedged daemon writes no perf rows, so that instrument was structurally blind to the worst failure mode of the very feature it was clearing. Rate-based evidence cannot see an outage; the next canary needs a liveness probe that completes a real turn, not a counter.
# [2026-08-12] [2026-08-12] BOTH UPTIME ITEMS LANDED — the two things the 91h wedge exposed beyond its own bug. (1) TURN-PATH LIVENESS PROBE: TurnPathProbeLoop per head — every 30s a loopback POST to the head's own /v1/messages with no auth and a garbage body, because the pipeline's quick 401/400 IS the liveness proof; the wedge signature is accepted-but-silent (measured: 60s curl, zero bytes). Two consecutive 5s timeouts flip the head stalled; /health then reports ok:false + turnPathStalled:[...] — under the old hardcoded put("ok", true) the wedge served green for 91 hours. Red-green: TurnPathProbeLoopTest drives ticks against an answering-with-400 server (never stalls), an accept-then-hang server (stalls at exactly the threshold, logs the transition once), connection-refused (stalls), and recovery (clears + logs). ControlHealthTest pins the JSON contract both ways, including that the happy path stays byte-shaped as before (no stall array) so existing consumers see nothing new. (2) CLI STOP ESCALATION LADDER in ControlPlaneClient.stopDaemon: the old code DISCARDED a 401 from /api/daemon/shutdown — the endpoint is bearer-guarded, so a key mismatch meant shutdownDaemon() never ran and the CLI polled 15s watching a daemon nobody had asked to stop, then printed 'terminate it manually' (observed twice 2026-08-11). Now: auth rejection is printed loudly; then graceful poll 8s -> SIGTERM every splice daemon (ProcessHandle, cmdline-scoped to splice.jar/app-all.jar) -> poll 12s past the daemon's own 10s halt(0) floor -> SIGKILL -> poll 3s; port release is the sole success signal at every rung. DEPLOYED: jar 0bbd5458 installed (backup .bak-2026-08-12-uptime), single daemon confirmed, /health ok:true with topologyDigest. The restart that deployed it was itself the first live exercise of the ladder. Verified in the order that proves it: gate PASS -> shadowJar -> oracle 11/11 against the printed sha.

