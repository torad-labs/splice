# TENET: Name seams with fun interface, not raw function types.
# Rationale: A function type as parameter/property/return is an unnamed, transposable seam.
# Name it with a `fun interface` for typed, non-transposable params and KDoc.
# @Composable slots and lambda literals at call sites are exempt.
#
# INLINE-FUNCTION PARAMETERS ARE EXEMPT (HD-21, 2026-08-17) — this is a rule defect fixed, not a
# code defect waived. The measured census found 18 seams named `block`, all of them the parameter
# of a higher-order utility (`Cancellables.runCatchingCancellable(block: () -> R)`,
# `DaemonBoundary.runCatchingDaemonBoundary`, `Command.success`, `TurnDriver.catchingTurnFailure`
# and their non-inline siblings). For the ones declared `inline`, obeying this rule would make the
# code STRICTLY WORSE: a `fun interface` parameter cannot be inlined, so every call site gains an
# object allocation, and — the part that is not merely a cost — the lambda loses NON-LOCAL RETURN.
# `runCatchingCancellable { return x }` compiles today and would stop compiling, so the rule as
# written asked callers to restructure working control flow to satisfy a matcher. A rule that can
# only be satisfied by damaging the code is wrong; complying blindly is the failure mode.
#
# The exemption is deliberately NARROW — it covers a function type sitting in the parameter list of
# a declaration carrying the `inline` modifier, and nothing else. Red-proven in both directions
# against a synthetic probe (see rule-tests/no-lambda-seam-test.yml): it does NOT exempt a return
# type, a constructor property, a non-inline sibling of the same shape, or a non-inline local
# function nested inside an inline one. The `stopBy` on the parameter list is load-bearing — it
# stops at the FIRST enclosing parameter list so an outer inline declaration can never launder an
# inner non-inline seam. `function_modifier` is the node kind that also spells `suspend`,
# `operator` and `tailrec`, so the anchored regex is what makes this mean `inline` and not
# "any modifier"; it is checked against the grammar, never assumed.
#
# NOTE (2026-08-17): this rule is still DORMANT — it lives here, not in .rules/kotlin-splice, and
# does not run in `ast-grep scan`. HD-21 named four roles (LogSink/EnvReader/WallClock/ElapsedClock
# — the `() -> Long` shape carries two non-substitutable roles) and cleared 126 of the 246 sites;
# 120 remain, so promoting it to a live wall is a later wave.
id: no-lambda-seam
language: kotlin
severity: error
message: "Name the seam with a `fun interface`, not a raw function type. @Composable slots and inline-function parameters are exempt."
files:
  - "**/*.kt"
ignores:
  - "**/test/**"
rule:
  kind: function_type
  all:
    - not: {inside: {stopBy: end, has: {kind: type_modifiers, has: {kind: annotation, regex: "Composable"}}}}
    - not: {inside: {kind: type_projection}}
    # A parameter of an `inline` declaration: inlining and non-local return are the contract.
    - not:
        inside:
          kind: function_value_parameters
          stopBy: {kind: function_value_parameters}
          inside:
            kind: function_declaration
            has:
              kind: modifiers
              has: {kind: function_modifier, regex: "^inline$"}
