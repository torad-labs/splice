reason = """OAuthAccountIdentity is the "stable provider identity used only to recognize an existing credential, never printed" — it reads a secret-bearing auth.json and its null means the file's shape carries no identity. It has a sibling in the same file, OAuthAccountLabel, for the operator-visible label, which is exactly why the identity must not double as one. ReasoningEnvelopeEncoder mints a `redacted_thinking` envelope FOR THE WIRE; its KDoc makes the separateness deliberate — it is the inverse of ReasoningEnvelopeDecoder, the two are wired at different seams by different components, and "only the stream translator is entitled to mint an envelope". One reads credential material, the other writes a value that goes upstream: a shared port is the shape that puts the first into the second."""

