title = "sequential_cutoff mode drops streaming deltas, so a round torn mid-part now renders NOTHING for that part where the old path had already shown partial text — a user-visible content loss that no test pins. In cutoff mode onSummaryPartAdded returns immediately, reasoning_summary_text.delta is dropped, maybeEmitLateReasoning returns, and reasoning_summary_text.done is the only render surface; thinking therefore lands in atomic per-part bursts instead of streaming token-by-token. This IS codex parity and it is not a client-visible ERROR, so it does not breach NEVER-BELOW-STATUS-QUO — but it is a deliberate behaviour change that 22a0744 landed uncosted and unpinned. Decide explicitly: either accept it as parity and land a test that PINS the tear-path behaviour (so a future change cannot alter it silently), or restore delta rendering for the torn case only. Operator input may be wanted on which — this is the one item in the campaign that is a judgement call rather than a defect with an obvious correct end state."
