name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate of record: the check branch protection requires. It passes only when the Linux ladder and the macOS
  # parity job both passed. The two run side by side, because the ladder used to wait for macOS to finish first,
  # which added 4 to 7 minutes to every run (runs 37730125071 and 37836315947).
  gate:
    needs: [ladder, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require the ladder and macOS parity
        run: test "${{ needs.ladder.result }}" = success && test "${{ needs.macos.result }}" = success

  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's gate reads the diff against its merge base with main, so the history comes with it.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # Gradle's caches (dependencies, build cache, wrapper): a pull request reads them and a push to main writes them, so a
      # fork or branch run can never poison what main serves. The configuration cache is on in gradle.properties.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Most gate legs are bun scripts (tools/gate/config/ladder.json) and `bun tools/gate run` is the
      # gate of record's entry from PR 3 — so this job runs bun, and gets it from a pinned action
      # rather than from the `bun` npm package's postinstall.
      # BOTH pins are load-bearing: the SHA (resolved from the GitHub API, tag v2.2.0) because a
      # mutable tag is a supply-chain hole, and bun-version because setup-bun falls back to the
      # LATEST bun when it cannot resolve one — an unpinned toolchain on the leg whose verdict is
      # the gate.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: install workspaces
        run: bun install --frozen-lockfile
      # A push to main runs the whole ladder on everything. A pull request runs what its diff against main affects: the
      # same selector as pre-push (tools/gate/src/lib/selector.ts), so a check still runs whenever its inputs change.
      - name: complete repository gate
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run gate
      - name: scoped repository gate
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun tools/gate run --since "origin/$BASE_REF"
      # Where the gate's minutes went: the profile `bun tools/gate run` asks Gradle for, and every
      # suite's JUnit report with each test's time. Kept on a red run too, which is when they are read.
      - name: keep the gate's timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-timings
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          retention-days: 14
          if-no-files-found: warn
      # The jar this green gate built and ran (codeModePackagedMock depends on :app:shadowJar), kept so
      # an install takes the exact sha's artifact from the gate of record instead of a local copy of
      # the tree (operator, Sep 28: no worktrees, build trees included).
      - name: keep the gate-built jar
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: splice-jar
          path: |
            app/build/libs/app-all.jar
            app/src/main/dist/bin/splice-launch
          retention-days: 14
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # Gradle's caches (dependencies, build cache, wrapper): a pull request reads them and a push to main writes them, so a
      # fork or branch run can never poison what main serves. The configuration cache is on in gradle.properties.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: install workspaces
        run: bun install --frozen-lockfile
      - name: verify stock Bash
        run: /bin/bash -c 'test "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2'
      - name: portable process and hook tests
        run: |
          ./gradlew :core:test --tests splice.core.process.LaunchOwnersTest
          ./gradlew :features-sessions:test --tests splice.sessions.registry.ProcessEnvironmentTest
          ./gradlew :integrations-claude-code:test --tests splice.client.login.PortablePendingLoginTest --tests splice.client.login.PortablePendingScriptTest
          ./gradlew :app:test --tests splice.app.cli.CommandParserTest
      - name: build packaged daemon
        run: ./gradlew :app:shadowJar
      - name: launcher ownership across exec
        run: bun test tools/e2e/test/launch-owner.test.ts
      - name: packaged daemon conformance
        run: |
          mkdir -p test-results
          bun tools/e2e conformance --artifact app/build/libs/app-all.jar --json test-results/macos-conformance.json
      - name: keep macOS proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-proof
          path: |
            **/build/test-results/**/*.xml
            test-results/macos-conformance.json
          retention-days: 14
          if-no-files-found: warn

  walls-annotate:
    # Annotation-only surface for ast-grep wall violations.
    # The gate job (`npm run gate` = `bun tools/gate run`) remains the SOLE pass/fail authority
    # (same checker run twice deliberately). The `|| true` is deliberate:
    # this job exists only to surface violations as PR diff annotations, not
    # to block merges. GitHub caps annotations at roughly 10 error + 10 warning
    # per step, so large violation sets truncate to the log.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: install workspaces
        run: bun install --frozen-lockfile
      - name: annotate wall violations
        run: ./node_modules/.bin/ast-grep scan --format github || true

  wrapper-validation:
    # Validates the Gradle wrapper checksum on every pull request.
    # This catches a tampered gradle-wrapper.jar arriving via fork PR before
    # any build step executes it. The action discovers wrapper files recursively,
    # so no path inputs are required (repo has gradlew + wrapper jar at the root).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
