# [2026-09-01] 2026-09-01 claude-splice IMPLEMENTED per the recorded map. Shape: a header-only probe in core (ImageHeaderProbe: png needs a real IHDR at offset 12, jpeg walks the marker chain to a true SOF including progressive SOF2 and skipping C4/C8/CC, gif87a/89a, webp VP8/VP8L/VP8X with the minus-one canvas and chunk skipping, classified from BYTES not the declared media_type, base64 decoded only in a 128-char window) plus ImageFloor, which answers the floor a source is PROVEN under and null for every unknown. Both dialects ask the floor BEFORE mapping rather than routing a fourth cause through imagePart's already-thrice-overloaded null - that is codex's typed-outcome requirement satisfied by keeping the reason out of the null entirely, so every existing null meaning is byte-identical and the new policy carries its own count and its own sentence (one wording, owned by ImageFloor.reason, so the two dialects cannot drift). Wiring: ChatQuirks.minImageEdgePx and ResponsesQuirks.minImageEdgePx both default null, 8 set ONLY at grok-oauth and GrokQuirks, no TOML overlay. The chat quirk selection moved from inline-in-ChatArm to QuirksOverlay (whose own KDoc has claimed all three dialects since the decomposition and was missing chat) because a vendor fact is only pinned if a test can reach it, and the old home also builds an auth provider and starts a token prefetch. Responses tool_result gained a floor marker where it was silent; the UNRELATED unsupported-drop silence there is deliberately unchanged and pinned by an arm so it is a recorded decision rather than an oversight. EVIDENCE: 44 new arms - core 20, chat 8, responses 7, app wiring 5, plus module regressions. Fresh XML verified under 10s in every case. Whole-suite: core 173, chat 93, responses 346, app green; no pre-existing arm moved. MUTATION PROOF: 15 mutants, ZERO survivors, each naming an arm's own claim - no floor check at all (the exact pre-fix behaviour), boundary <= for <, fail-CLOSED on unknown, single-edge check, png without IHDR, jpeg SOF0-only, Huffman-as-frame, VP8X minus-one dropped, webp first-chunk assumption, chat relabel-as-unreadable, chat probing with vision off, responses unsupported-source relabel, responses tool_result silence, floor never wired to grok, floor wired to every chat vendor. All six mutated production files restored byte-identical by sha256 after every round (never git checkout, the baseline is uncommitted). Harness kept at scratchpad/dr155_mutants.py for replay.
