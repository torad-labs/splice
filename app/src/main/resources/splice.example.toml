# AddProfileCatalog's are compared mechanically by ModelCatalogsSingleSourceLawTest, and THIS
# file is the source of truth for the windows: the roster's WINDOW_* constants must agree with the
# context_window values below, so a vendor raising a ceiling is a one-line change here plus the
# constant. The head below slots four of the ten — declaring a row and serving it are separate
