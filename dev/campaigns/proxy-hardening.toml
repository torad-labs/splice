n account t || VERIFY-SPEC: Per-provider tests asserting `verifyUpstream()` maps 401/403 to `Dead` and 200 to `Healthy` without touching the credential file; an `AuthProbeLoopTest` case asserting the slow cadence (verification fires on tick N, not every tick). Gate: `npm run gate` plus a manual pass of `checks/e2e/heads-e2e.sh` against a live head. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### SH-07'"
