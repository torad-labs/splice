# [2026-08-17] DESIGN LANDED (no Kotlin touched, git diff -- '*.kt' empty). Matcher RED-PROVEN first: synthetic probe under src/main gave 4/4 expected hits (class-body var incl. object body) and 0 false hits on val + function-body var. Census re-taken: ast-grep scan --rule .rules/kotlin/ast-grep/rules/no-mutable-var.yaml gateway/*/src/main = 79, matching the 2026-08-16 TRUE CENSUS. All 79 classified into 9 classes summing to 79: A set-once honesty latch 27 (all VERIFIED monotone, no '= false' after init anywhere), B last-wins usage slot 11, C latched verdict/terminal payload slot 13, D true running counter 15 (D1 6 lock-guarded / D2 9 turn-confined), E rebindable streaming accumulator 2, F lazily-opened wire-block slot 2, G lifecycle handle 4, H decode/walk cursor 3, I mutable aggregate field in a keyed store 2. VERDICT: 15 migrate, 64 exempt. MIGRATE NOW: G (AtomicReference; 4 sites) and B (immutable rebuild onto the existing splice.core.turn.Usage, 11 vars -> 3). KEEP with scoped exemption: the rest — the only genuinely compliant shape for reducer state is an immutable Flow.fold, which IS HD-13 S3/S5, not a mechanical sweep; a MonotoneFlag/Latched<T> holder type would drop the count without removing one mutable cell and is explicitly REFUSED as rename-to-dodge. TWO CLASSES WHERE THE RULE IS WRONG, with evidence: E (ResponsesStreamTranslator:405/406 are var only because the W4-A harvest fallback REBINDS at :366/:369; the NF-06 runaway guard reads reducer.textBuf.length live at :173-174, and the sibling translators' buffers are already val StringBuilder at Passthrough:72,73 and Chat:54,55 — proof the codebase reaches for var here only where rebinding is required) and H (SseReader DecodeScratch's KDoc at :228 declares 'one allocation per stream, zero per chunk'; an immutable rebuild allocates per chunk by construction, and ReasoningCache StaleReasoningWalk.inDroppedRound is not even monotone, :311 true / :319 false). D1 is a third: converting lock-guarded counters to Atomic* is a CORRECTNESS REGRESSION — ResponsesWsSession:73 says 'THE lock for chains, epochs and seq' and epochs[key] = ++seq at :171 must be atomic WITH the map write; an atomic advertises lock-free safety that does not exist and is how the 91h LinkedHashMap-cycle wedge comes back. RATCHET DEFECT FOUND AND MEASURED: the rule's anchored regex misses 16 @Volatile class-body vars (ControlServer.server:141, HeadServer.server:140/accepting:150, ConfigService.fileCache:68, DaemonLog.sink:25, three *AuthProvider.cache, MgmtKey.mintedAtMs:31, UsageHud.persistedVersion:406, InvalidGrantLatch:12, AuthProbeLoop x3, CodexAuthProvider:114) and 8 primary-constructor var params (Chat:99,100, ResponsesStreamTranslator.BlockState.sawDelta:148, InflightGate.Waiter:55,56, LogsCommand:90,91,92) — so a ratchet dated at 79 can be SATISFIED by adding @Volatile, which adds a barrier and removes nothing. Fix the regex before dating the ratchet; honest class-body ceiling is 95 (103 with ctor params). BUG REPORTED NOT FIXED: Daemon.kt:819 'private var control: ControlServer? = null' is written in start() at :872 outside any lock and read in stop() at :903 inside stopLock.withLock — a Mutex held only by the reader gives no happens-before edge with an unguarded write, so a start/stop pair on different threads may see null and SILENTLY SKIP control.stop(), leaving the port bound; the sibling fields of the same role ARE @Volatile (ControlServer.kt:141, HeadServer.kt:140), so this is an inconsistency inside the repo's own idiom. Daemon:822 stopped is fine (both accesses under stopLock). Doc: .superpowers/sdd/2026-08-15-head-decoupling/hd-23-design.md (gitignored path, as with every prior HD report); report: hd-23-report.md.

