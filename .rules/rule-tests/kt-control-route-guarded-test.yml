id: kt-control-route-guarded
valid:
  # the compliant form — 20 of the 25 routes already read this way
  - 'get("/api/status") { guarded(call) { respond(call, payloads.statusJson()) } }'
  - 'post("/api/heads/{head}/{action}") { guarded(call) { headRoutes.headAction(call) } }'
  - 'patch("/api/config") { guarded(call) { configRoutes.patchConfig(call) } }'
  - 'delete("/mcp/{name}") { guarded(call, mcp = true) { mcpRoutes.delete(call) } }'
  # guarded deep inside a multi-statement handler still counts
  - |
    post("/api/daemon/shutdown") {
        guarded(call) {
            call.respondText(payloads.okJson(), ContentType.Application.Json, HttpStatusCode.Accepted)
            shutdownDaemon()
        }
    }
  # dated allowlist: the unauthenticated liveness probe
  - 'get("/health") { call.respondText(payloads.controlHealthJson(), ContentType.Application.Json) }'
  # kotlinx buildJsonObject `put` is not a route registration — the path literal is what separates them
  - 'put("total", summaries.sumOf { (_, summary) -> summary.total })'
  - 'put("sessions", buildJsonArray { listing.sessions.forEach { add(row(it)) } })'
  - 'put(KEY, m.head.key)'
  # a route helper call with no handler lambda is not a registration
  - 'val path = get("/api/status")'
invalid:
  # the census
  - 'post("/statusline/{head}") { statuslineRoute.statusline(call) }'
  - 'get("/statusline/{head}") { statuslineRoute.statusline(call) }'
  - 'get("/") { call.respondText(dashboardHtml(), ContentType.Text.Html) }'
  - 'get("/dashboard") { call.respondText(dashboardHtml(), ContentType.Text.Html) }'
  # every verb the rule names
  - 'put("/api/thing") { respond(call, thing()) }'
  - 'patch("/api/thing") { respond(call, thing()) }'
  - 'delete("/api/thing") { respond(call, thing()) }'
  - 'route("/api/sub") { respond(call, thing()) }'
  # the allowlist is ANCHORED to the exact path: a prefix must not inherit /health's exemption
  - 'get("/health/detail") { call.respondText(secrets()) }'
  - 'get("/healthz") { call.respondText(secrets()) }'
  # a trailing comment is not an authorization decision the build can see
  - 'post("/launch/{head}") { launchRoutes.launch(call) } // stdin-piped per tick; no bearer'
