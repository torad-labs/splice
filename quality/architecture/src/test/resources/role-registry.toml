# checks/config/role-registry.toml — the DISPOSITIONS for checks/role-registry.ts (V4-89,
# ARCH-AUDIT 2026-09-17, audit B row 5).
#
# ONE ROLE, ONE INTERFACE. Several hundred `fun interface` declarations in main sources normalise to
# far fewer single-abstract-method signatures, and dozens of those signatures are carried by two or
# more NAMES. The exact three numbers are NOT written here, deliberately: this header claimed "200
# declarations over 132 signatures, 26 shared" from the Sept 17 audit and was never recounted, and by
# Oct 10 the tree held 458 declarations — a census in prose goes stale silently, which is the failure
# this whole file exists to prevent. The live count is RoleRegistryLawTest's own, printed with every
# group when the law fails, and kept honest by its second test, which recounts the denominator through
# Konsist's AST and fails when the two disagree. Read it from a run, never from a line here.
# Sharing a shape is not a defect — kt-no-lambda-seam.yml's header is explicit that collapsing
# distinct roles into a shared `BooleanSupplier` would be STRICTLY WORSE than the lambdas it
# replaced, and its canonical example lives in this file: ClientGone (the client hung up — abandon
# the turn) and ClientFrameEmitted (the client already saw output — too late to retry) are read a
# few lines apart on the same retry path and drive OPPOSITE decisions. Swapping them compiled
# before that wave and produced either an abandoned healthy turn or duplicate output on the wire.
#
# So the wall cannot decide; it can only insist the decision be WRITTEN. Every name in a shared
# group must appear in this file under its signature, with a non-empty reason. Absence is not a
# disposition: an unlisted name fails BY NAME, which is how ADDING a lambda-shaped port costs one
# sentence, and a name listed here that no longer exists fails as STALE, which is how a fix is
# detected.
#
# THREE NAMES WERE DELIBERATELY ABSENT, and V4-122 RECONCILED ALL THREE rather than disposing of
# them — which is what this file said the fix row would have to do:
#   ElapsedNow    (upstream/RuntimeSeams.kt)          -> typealias of ElapsedClock  (core/util/RuntimePorts.kt)
#   AccountNow    (upstream/credentials/AccountSelection.kt) -> typealias of WallClock     (core/util/RuntimePorts.kt)
#   HeaderLookup  (gateway/usage/RateLimitHeaders.kt) -> typealias of QuotaHeaderRead (core/usage/QuotaHeaders.kt)
# They were never distinct roles, and the evidence was in the declarations rather than the audit:
# ElapsedNow's KDoc said "a monotonic now-reading in milliseconds … retry deadlines and the shared
# 429 cooldown", which is ElapsedClock's contract verbatim; AccountNow's said "epoch time seam used to
# compare provider reset timestamps", exactly WallClock's "compared against a foreign epoch"; and
# QuotaHeaderRead's KDoc ADMITTED the duplication — "the gateway's own HeaderLookup lives a module
# above this one". The honest fix was to make each pair ONE declaration, not to write a reason for
# two names of one role: listing them here would have closed the wall without merging anything, which
# is what the note above meant by calling that a lie. A typealias merges them and keeps every call
# site and SAM conversion compiling, so the names are gone from this file because they are gone from
# the tree — a disposition may not outlive its subject, and these subjects were fixed.
#
# WHAT IS STILL LISTED, AND WHY: every remaining name in a shared group is a role that genuinely
# differs from its siblings, and each carries a reason saying what it IS. The wall stays useful
# because ADDING a lambda-shaped port still costs one sentence.
#
# HOW TO ADD AN ENTRY. The census comes from the law itself — `./gradlew :quality-architecture:test
# --tests 'splice.quality.RoleRegistryLawTest'` computes it on every run and prints it under the
# failure that sent you here. (Until 2026-09-21 this line named `bun checks/role-registry.ts report
# .`; that script was deleted with the port to Kotlin, so the remedy named a command nobody could
# run, which is an absence wearing a label.) Then write the signature verbatim, today's date, the
# names, and a reason that says what each role IS. A reason a reviewer cannot check is worse than
# none, because it looks like work.

[[groups]]
signature = "()->JsonObject"
dated = "2026-10-13"
names = ["GlobalMcpServers", "RawMessageFragmentBuild"]
reason = """GlobalMcpServers reads the operator's current global MCP server configuration from disk for the MCP host. RawMessageFragmentBuild scrubs one captured raw message for the private fragment cache, without reading account, header or global configuration state. Substituting the configuration reader for the message builder would cache server configuration as a message; substituting the message builder for the reader would give the MCP host message content instead of its server inventory."""

[[groups]]
signature = "(Usage?)->Unit"
dated = "2026-10-04"
names = ["RowRelease", "RowWrite"]
reason = """RowRelease ends ONE hold a source round has on its posting turn's perf row: the provider calls it once per round, it writes nothing, and only the last release lets the row go. RowWrite writes the row itself, once, with the usage every settled round left. A RowWrite passed as a release would write one row per round; a RowRelease passed as the write would never write the row."""

[[groups]]
signature = "suspend (WireSink)->Unit"
dated = "2026-10-04"
names = ["BufferedSinkWrite", "SourceFrameAction"]
reason = """BufferedSinkWrite retains tentative client output until certification releases it. SourceFrameAction delivers one validated native event immediately inside an opaque-field scope that always unwinds; delaying that scope would lose source ordering."""

[[groups]]
signature = "(Path)->Boolean"
dated = "2026-10-02"
names = ["DayFileRemoval", "PluginFileMatch"]
reason = """DayFileRemoval performs filesystem deletion and reports whether a file existed; its IOException refuses a purge. PluginFileMatch only classifies a path for plugin discovery and never deletes it. A predicate cannot implement the destructive operation, so these contracts remain distinct."""

[[groups]]
signature = "suspend (Long)->Unit"
dated = "2026-10-19"
names = ["Wait", "Waiter"]
reason = """Waiter pauses an upstream retry or probe loop for a number of milliseconds, inside integrations-upstream. Wait pauses the peer webhook pusher between two attempts of one push, from 5 seconds to 30 minutes, and the peer helper wires it to its own Waiter at the one place it builds the pusher. Both only suspend the caller, so the shape is the same and this sentence says why there are two types: features-sessions has no dependency on integrations-upstream and cannot import Waiter, so the pusher names the pause it needs as its own port."""

# ── Nullary effects, () -> Unit ───────────────────────────────────────────────────────────────────
[[groups]]
signature = "()->Unit"
dated = "2026-10-13"
names = [
    "AccountMembershipRefresh",
    "AuthRefreshObserver",
    "ClaudePoolChange",
    "CodeModeCleanup",
    "ConfigRevisionChanged",
    "FileIoTask",
    "FragmentReleased",
    "HandoffMark",
    "HoldChange",
    "McpIdleSweep",
    "McpWriteAvailable",
    "McpWriteFailureDrain",
    "NotificationEnqueue",
    "ListingReturned",
    "McpWriteExpired",
    "MuseMintWriteGuard",
    "ParseTally",
    "ProtocolAnomaly",
    "PulseTick",
    "RawSseFlush",
    "RecordingCompleted",
    "RestoreStep",
    "ShutdownDaemon",
    "StopControl",
    "StreamStart",
    "TurnEnd",
    "UpstreamBytes",
    "WorkerExited",
    "WsRoundAbort",
    "NativeGrpcProtocolEvent",
    "NativeGrpcWaitReleased",
]
reason = """A nullary effect is the widest shape in the language and the one that says the least: \
every one of these is an EVENT or an ACTION with its own lifecycle owner, and no two are wired \
from the same place. HoldChange mutates credential-owned refusal state under its generation monitor; \
it is neither a stream-start notification nor dispatched file IO. ClaudePoolChange publishes current stored membership into one booted head, \
retaining session choices and captured credentials. AccountMembershipRefresh reconciles externally written \
credentials before the upstream selector captures a generation; unlike app-only mutation publication, \
it cannot complete an account withdrawal. ConfigRevisionChanged reports publication of a new \
per-head override map so the config snapshot cache invalidates its held generation; it neither \
changes account membership nor controls a stream or daemon lifecycle. ShutdownDaemon ends that head instead; swapping \
these roles would stop serving on login edits or fail to release resources on shutdown. \
FragmentReleased returns one fragment's retained-byte and entry capacity only after its last cache, \
temporary-reader or escaped-output owner releases; unlike TurnEnd, it is not tied to one built turn's \
provider lifecycle, and eviction alone does not return capacity still held by escaped outputs. \
Notifications the caller only observes: AuthRefreshObserver (a credential \
refresh happened mid-attempt), WorkerExited (the code-mode worker process died), ProtocolAnomaly \
(a WS frame arrived that the protocol does not allow), StreamStart (the upstream began emitting), \
PulseTick (the spinner's next frame is due), UpstreamBytes (a provider body chunk or WebSocket JSON \
event arrived; stamp the live turn's silence clock before parsing or client output, never on \
headers, watchdog touch, socket pings or client keep-alives), TurnEnd (a built turn is over, on whatever path — the \
provider gives back what it held for it, a llama-server slot lease since V4-165). Actions the caller commands: StopControl (shut the control plane down), ShutdownDaemon \
(the daemon's own stop path), WsRoundAbort (abandon the in-flight WS round), CodeModeCleanup \
(release the worker's cell), RawSseFlush (push buffered bytes to the client socket), RecordingCompleted (FrameRecording.complete returned \
successfully, so the detached drive may keep its recording only if its terminal also ended cleanly; \
this acknowledgement never runs after failed completion, unlike the earlier HandoffMark or the \
provider resource release at TurnEnd, proved by TurnStreamerCleanupTest), RestoreStep \
(undo one already-applied upgrade step), FileIoTask (the body to run on the file-IO dispatcher), \
MuseMintWriteGuard (the pre-write assertion before a minted key is persisted), ListingReturned (a hosted \
child's tools/list answer is back and the cache has not kept it yet: the one instant a change notification can \
land, which the cache's own test uses to force that interleaving), HandoffMark (the \
turn has been handed to upstream — a MARK the pipeline sets once, which is why it is a name of \
its own rather than folded onto one of the observers above: an observer is subscribed to, a mark \
is set). ParseTally (9cfae331a) counts one perf line decoded, the read's own measure of how much it \
decoded; wired where FileIoTask or a release was meant it would count nothing while the work ran. \
Substituting any for any other is not a type error and would be silent: RestoreStep \
for WsRoundAbort unwinds an upgrade in the middle of a turn. McpWriteAvailable signals that a bounded stdin slot opened for retained reverse replies. McpWriteFailureDrain is the asynchronous stop-and-reap action returned after the exact transport failure has already been synchronously fenced and published. NotificationEnqueue requests dispatch of a hosted child notification only after the host confirms ownership. McpWriteExpired records that one queued child write timed out; substituting slot availability for failure draining would leave the failed child unreaped, while using the drain as an availability signal would stop a child when capacity opens. Expiring a notification would discard a reply the client still awaits. These roles need MORE naming than a shared shape, not less. NativeGrpcProtocolEvent delivers one inbound native gRPC frame to its session, and the router invalidates that session alone when the delivery throws. NativeGrpcWaitReleased is a closed wait claim's one notice that its slot's permit is back, so the next queued wait may run; a delivery wired there would run a frame on every release, and a release wired as a delivery would free a slot no claim gave back. McpIdleSweep runs the host's scheduled idle maintenance; stopping its scheduler is separate from executing a turn or stopping the control plane, so it cannot replace StreamStart, TurnEnd, StopControl or a transport abort."""

# ── 24 names, () -> Boolean ───────────────────────────────────────────────────────────────────────
[[groups]]
signature = "()->Boolean"
dated = "2026-10-27"
names = [
    "ClientFrameEmitted",
    "ClientGone",
    "ConfigRepair",
    "CodeModeJournaling",
    "CodeModeReplayReasoning",
    "CodeModeSweepOwnership",
    "ConsolePresence",
    "ContentReached",
    "CopyingOriginals",
    "DaemonDraining",
    "DaemonRestart",
    "DaemonSuccessor",
    "DaemonSupervised",
    "EdgesStored",
    "Readiness",
    "KeyPresenceProbe",
    "KeepingRecordings",
    "McpHubLive",
    "McpShareChoice",
    "ProgressLineOn",
    "SessionTranscriptViewEnabled",
    "StderrEcho",
    "TerminalSeen",
    "TopologyStale",
    "WatchdogTripped",
    "StdinTerminal",
]
reason = """THE CANONICAL GROUP, documented in kt-no-lambda-seam.yml's own header. ClientGone (the \
client hung up, so abandon the turn) and ClientFrameEmitted (the client already saw output, so a \
retry would duplicate it) are read a few lines apart on the same retry path and drive OPPOSITE \
decisions; swapping them compiled before HD-22 and produced either an abandoned healthy turn or \
duplicate bytes on the wire. The remaining names describe distinct decisions about different \
subjects: ContentReached (has any content frame left the emitter yet — the question the pre-content \
wire-type rule turns on), WatchdogTripped (did the turn watchdog fire), TerminalSeen (has the WS \
stream produced its terminal event), TopologyStale (has splice.toml changed under the running \
daemon), KeyPresenceProbe (is a management key present right now), ConsolePresence (is a TTY \
attached), DaemonRestart (restart the daemon \
and report whether it came back), DaemonSuccessor (arm the detached CLI before this unsupervised \
daemon drains; false keeps it serving), and DaemonSupervised (V4-137: was this process started \
under systemd — read from INVOCATION_ID, which systemd sets on every process it starts). \
DaemonSupervised ASKS whether the unit brings it back; DaemonSuccessor ACTS only when it does \
not, while DaemonRestart is the external command that waits for the new health response. \
Swapping their Boolean signatures would start a competing daemon under systemd or drain an \
unsupervised daemon with no successor. \
DaemonDraining (a736f4592) asks whether the daemon's ordered stop has begun, so the turn-path \
probe counts no stall while a planned drain or restart closes the heads; read in place of \
DaemonSupervised it would hide every real stall on a daemon systemd started. \
SessionTranscriptViewEnabled (V4-354, 2026-09-27) reads the live global transcript-view knob \
before either the sessions or turns route opens a Claude Code transcript; one port owned by \
sessions serves both routes, and confusing it with a client disconnect or daemon-state probe \
would silently expose private conversation text or hide it despite the operator's switch. \
CopyingOriginals, KeepingRecordings and CodeModeJournaling (2026-10-11) are the three live prompt-store \
switches: each is asked at the moment its writer is about to put the user's prompts on disk (a moved \
transcript's original, a parked compaction answer, a code-mode journal save), and each answers the \
same console choice for a different store. Swapping them would keep what the user stopped, or stop \
what they kept. \
EdgesStored (2026-10-12) is the fourth store switch and the only one for metadata: asked at each SendMessage edge before it \
is written, it answers Settings' "Save who messaged whom", not a prompt store, so wired as one of those it would keep \
or stop the wrong thing. \
CodeModeReplayReasoning (2026-10-12) asks whether an earlier turn's reasoning rides back to the model, at each code-mode \
post; it is the replay_reasoning setting, not a prompt-store switch, so wired as one it would keep reasoning \
the operator turned off, and read as the others it would stop a journal the operator kept. \
CodeModeSweepOwnership (2026-10-24) asks whether native sessions still need periodic cleanup after their execution \
records retire. It keeps the sweep armed for those sessions; a client-disconnect or configuration predicate here \
could leave native hosts without a cleanup owner or keep an unnecessary timer running. \
StderrEcho (V4-353, 2026-09-27: should this daemon.log line also go to stderr, which is daemon-boot.log \
until the daemon is up) is a logging decision read per line; read as any of the others it would either \
re-grow the boot log for the daemon's whole life (V4-258) or drop the reason a failed boot prints. A single \
shared BooleanSupplier would make every one of those substitutions compile. ConfigRepair (2026-10-10) offers the \
fix session for a splice.toml boot refuses and answers whether every finding was fixed: its true lets `splice \
restart` read the file again and go on to stop and start a daemon, so wired where a probe is wanted it would \
restart on a read, and a probe wired here would restart on a file still broken. \
ProgressLineOn (2026-10-10) asks, at every heartbeat of a quiet turn, whether splice may write its own status line \
to the client; it says nothing about the client being gone or the transcript being viewable, and swapped with either it \
would write the line to a hung-up socket or hide the wait from a user who left it on. McpShareChoice (integrations/claude-code McpSharing.kt, 2026-10-13) \
is the MCP setup's share answer, read at every decision: true shares every server that can be shared, false starts \
one copy per session. McpHubLive (integrations/claude-code McpHubLaunch.kt, 2026-10-13) asks, as each Claude Code \
launch is planned, whether this daemon's MCP hub is up with no off reason, so a front.json a stopped hub left behind is \
not taken as a running front. It answers whether the hub serves, not what the operator chose: read as McpShareChoice it \
would point a session at a dead hub whenever sharing is on, and McpShareChoice read here would plan per-session copies \
while the hub serves. Readiness asks whether a just-started hosted child reached the point where it can receive work; it is neither the hub's availability nor a client or daemon state probe, and wiring either in would direct a request to an unready child or make a ready child disappear. StdinTerminal (2026-10-27) asks specifically whether file descriptor 0 is a terminal before a harness-hook command reads its JSON payload. ConsolePresence asks whether the process has a console, which may be absent merely because stdout is piped. Substituting it could make an operator command wait for terminal input or skip a real hook payload; neither transport-terminal detection nor client/daemon liveness answers this stdin question."""

# ── 13 names, () -> Long (TWO MORE ARE DUPLICATES AND ARE NOT LISTED) ─────────────────────────────
[[groups]]
signature = "()->Long"
dated = "2026-10-27"
names = [
    "ElapsedClock",
    "HeadPerfSkipSource",
    "HostClock",
    "IngressReadIdleMs",
    "KeptBytes",
    "MaterializationBudgetBytes",
    "MaterializedByteCap",
    "QuotaIntervalMs",
    "RemainingTurnWait",
    "RequestReadBudgetMs",
    "ServerRequestId",
    "WallClock",
    "WriteBoundMs",
    "WsPathPulse",
]
reason = """Five KINDS of long, none interchangeable: three clocks, an age, a count, the budget left of a \
deadline already running, and the ceilings and cadence an operator configures (the last group arrived through \
the live-read work of Oct 10 and is why this entry grew). WallClock reads UNIX \
epoch milliseconds — a real point in calendar time, persisted as a perf row's `ts`, minted into \
MgmtKey.mintedAtMs, and compared against a token's `exp` and a file mtime this process did not \
author. ElapsedClock reads a MONOTONIC timebase whose origin is arbitrary and per-process: a \
single reading means nothing, only a difference does, and it exists precisely so an NTP step or a \
suspend/resume cannot abort a healthy turn or pin a gate slot forever. Substituting either for the \
other is the incident MonoClock was introduced for, and both KDocs forbid it in writing. HostClock \
is the MCP host's own injected epoch reading, scoped to that subsystem's config so host session \
ages are testable without a process-global clock. RemainingTurnWait is a BUDGET — how much of the \
turn deadline is left — not a clock reading at all. WsPathPulse is an AGE, milliseconds since the \
last WS ping, which is a derived difference rather than either clock. HeadPerfSkipSource is not a \
time at all: it is a COUNT of perf rows that could not be attributed. RequestReadBudgetMs (Oct 10) is a \
CONFIGURED CEILING, the first of the three an operator sets rather than a reading of anything: how long ONE \
client body read may take, read fresh at every read so a PATCH bounds the next one without a restart. It is \
not a reading of either clock, and it is not RemainingTurnWait, which is what is left of a deadline already \
running — wiring that budget in here would bound every body read by the remainder of one turn, and wiring \
this one there would restart the turn's deadline at every read. The other two are BYTES rather than \
milliseconds, and they are the pair most easily swapped, because one DERIVES from the other (Oct 10). \
MaterializationBudgetBytes is what the operator configured — materializationHeapBytes, in which 0 means \
'derive it from spare JVM heap' — and only SpliceConfig and the gate's own default produce one. \
MaterializedByteCap is the EFFECTIVE ceiling that budget becomes once the materialization gate caps it by \
the process heap ledger, so it is always positive, and the gate is its only producer: the ingress guard in \
front of the head asks the gate's own reader rather than deriving a second copy, so the 413 the transport \
writes names the number the gate would have refused on. Swap them and an untouched install, whose budget \
reads 0, answers 413 to every request — a ceiling of zero bytes where the budget meant 'take the ledger' — \
while the reverse swap caps a configured budget at itself and reads as correct forever. \
WriteBoundMs (Oct 10) is the second CONFIGURED CEILING in milliseconds, and the one most easily taken for the \
first: how long the upstream may take none of ONE request's bytes before the write is cut, read fresh at \
each request so a PATCH of firstByteTimeoutMs bounds the next one. It is not RequestReadBudgetMs, which bounds \
a CLIENT's body read on the way in — this bounds splice's own write on the way out — and it is not \
RemainingTurnWait, which is what is left of a turn deadline already running: wiring that here would cut every \
write by the remainder of one turn, and wiring this one there would restart the turn's deadline at every write. \
QuotaIntervalMs (Oct 10) is the one CADENCE among them: how long a quota poller waits between two looks at an \
account's usage endpoint, read at every wait so a PATCH of quotaPollIntervalMs governs the next one. A cadence \
is not a ceiling on one operation and not what is left of a deadline — it is how often something REPEATS, and \
its floor is 30 s where the ceilings are measured against a single request. Wired where any of the three \
ceilings is expected it would give that operation five minutes to finish by default, and a ceiling wired here \
would poll the provider's usage endpoint as often as one request is allowed to take, which is the hammering \
ConfigCoercion's floor exists to prevent. \
IngressReadIdleMs (Oct 11) is the third CONFIGURED CEILING in milliseconds, and the one that sits between the two: how long the control listener lets a request body go SILENT after its headers before it closes the connection, re-armed at every chunk so a PATCH of ingressReadIdleMs bounds the next one. It is not RequestReadBudgetMs, which bounds how long a head spends reading one whole body, and it is not WriteBoundMs, which bounds splice's own write outward: this one is a gap between two chunks, so a slow upload that keeps sending is never cut by it. \
KeptBytes (failure-handling slice 5, 2026-10-27) reads the bytes of one request whose turn is held, for the \
live held-turn row and its heap share. It measures what this turn retains; neither a configured materialization \
budget nor its effective ingress ceiling is that reading. A clock substituted here would report an arbitrary \
instant as memory, and a byte ceiling would report capacity instead of retained request size. \
ServerRequestId (added 2026-10-21) allocates the numeric identifier passed to the hosted child's reply writer for each reverse request; it identifies an exchange, not a time or budget, so a clock-shaped substitute would silently change the protocol identifier. DELIBERATELY ABSENT: ElapsedNow (upstream/RuntimeSeams.kt:40) is ElapsedClock's role in a \
second module, and AccountNow (upstream/credentials/AccountSelection.kt:22) is WallClock's. Both are red \
by name until the fix row reconciles them; listing them here would be a lie that closes the wall."""

# ── 3 names, () -> Duration ───────────────────────────────────────────────────────────────────────
[[groups]]
signature = "()->Duration"
dated = "2026-10-10"
names = [
    "McpHandshakeBudget",
    "McpIdleBudget",
    "McpRequestBudget",
]
reason = """THREE BUDGETS ON ONE HOST, and the whole group was born on Oct 10 when the MCP host's \
lifecycle values stopped being numbers: each is read at its OWN enforcement point off the operator's config as \
it stands then, so a PATCH moves the next one without a daemon restart. They are not interchangeable and the \
compiler cannot tell them apart. McpRequestBudget bounds how long ONE FORWARDED REQUEST may wait for a child's \
answer (30 min by default, because a long tool call is a legitimate request). McpHandshakeBudget bounds how long \
a STARTING CHILD may take to answer initialize (1 min, because a server that cannot handshake in a minute is not \
hostable). McpIdleBudget is not a bound on an operation at all: it is how long a server with no stream and no \
request is KEPT before the sweep closes it (30 min). Swap the request budget and the handshake budget and every \
tool call dies after a minute while a hung child is waited on for half an hour; wire the idle budget where either \
belongs and a request waits as long as an unused server is kept, which is the same number by default and so \
would pass every test that does not move one of them. That default coincidence is exactly why the disposition is \
written: they agree today and mean different things. A fourth name on this shape that is not one host's budget \
needs its own sentence here before it compiles into the tree."""

# ── 12 names, () -> String ────────────────────────────────────────────────────────────────────────
[[groups]]
signature = "()->String"
dated = "2026-10-27"
names = [
    "ClaudeVersionRead",
    "ClaudeWrap",
    "Current",
    "FailureDescription",
    "McpBearer",
    "NoteIds",
    "PeerStdin",
    "SupervisorUnitName",
    "TopologyDigest",
    "TurnIdMint",
    "UpgradeStatus",
    "WallClockIso",
    "HookStdin",
    "OwnCgroup",
]
reason = """Fourteen distinct string roles. SupervisorUnitName (added 2026-09-26, V4-243) is the NAME of the systemd unit a cold start sends `systemctl restart` to: the operator's SPLICE_SUPERVISOR_UNIT, splice.service by default, read when a route is asked for. It is an ADDRESS FOR A SIDE EFFECT, which is why it keeps its own port: wiring TopologyDigest or ClaudeVersionRead where the unit is wanted compiles and sends `systemctl restart` a hash or a version, and a name read from the wrong seam can restart another service on the host, while the reverse prints a unit name where a status, a page or a bearer is expected. ClaudeWrap (added 2026-09-20, V4-175) is the only one here that is not a READ at all: it POSTS /api/claude-head/wrap and returns the single line the setup wizard prints about what happened — "wrapped: …", or the daemon's own refusal sentence. Its return is a REPORT OF AN ACTION ALREADY TAKEN, which is why sharing a port with any name below would be a live hazard rather than a tidiness one: wiring UpgradeStatus where the wizard expects ClaudeWrap compiles, prints a plausible sentence, and silently never wraps anything — the operator reads a confident answer about a side effect that did not happen, and their `claude` command is untouched while the summary says otherwise. The reverse substitution is worse: calling ClaudeWrap where a status string is wanted REWRITES two files in ~/.claude as a side effect of rendering a panel. (TurnIdMint added 2026-09-20, V4-174: it MINTS the id every record of one traced turn carries — a fresh random value per call, injectable so a test can pin it; sharing it with any of the eight below would let a version string or a bearer become a turn id with both compiling). Eight remaining roles, and the pair that proves the UNIT is part of the role. WallClockIso renders wall time as an ISO-8601 instant, and its KDoc records why it is not a String alias for WallClock: both call sites are `put(FIELD_LAST_REFRESH, JsonPrimitive(nowIso