title = "MgmtKey silently mints a new bearer on ANY read failure || PROBLEM: `MgmtKey.ensure()` wraps the read of the existing key file in `runCatching { ... }.discard('unreadable/empty key file falls through to regeneration below')` and falls through to generating 32 fresh random bytes. The discard reason is honest about *what* it does but conflates two very different situations: 'no key file yet' (mint — correct) and 'the key file exists but I could not read it' (a permissions change, a partial read, a disk-pressure event) where minting silently revokes the dashboard session, any script holding the key, and the launch shim's ability to stop a stale daemon. The operator's symptom is … || SPLICE TODAY: `gateway/core/src/main/kotlin/splice/core/config/MgmtKey.kt:19-25` (the `runCatching`/`discard` fallthrough) → `:26-29` (unconditional mint + `SecureFile.writeAtomic0600`). The header comment at `:1-3` claims the key is 'minted ONCE', which the code contradicts. Doctor's view: `DoctorCommand.kt:155-168` (`mgmtKeyCheck` does `Files.readString(keyFile).trim().isNotEmpty()` and returns OK on present). Consumers that break on rotation: `RestartCommand.kt:17-28` and `bin/splice-launch:156-157` / `:106-116` (the stale-daemon shutdown POST). Note this is a **documented L2 decision** (the `.discard(why)` annotation), … || PROPOSAL: Distinguish absent from unreadable. `NoSuchFileException` → mint quietly (first run, expected). Any other throwable, or a present-but-blank/short file → mint **and** emit a loud one-line warning naming the path, the exception class, and the consequence ('every existing bearer token is now invalid; re-copy the key from /<path/>'), plus record a `mgmtKeyMintedAtMs` exposed on `/api/status` so doctor can report 'key minted 3m ago' when it is suspiciously fresh relative to daemon uptime. **Operator fork:** on an unreadable-but-present file, the alternative is to fail daemon start rather than mint — a silently rotated bearer on a loopback single-user da