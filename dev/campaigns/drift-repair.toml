# [2026-08-30] 2026-08-30 LAW COLLISION flagged by codex-splice: codex-rs parity says a torn round renders nothing (characterization test only — violates EVIDENCE-FIRST red-test), while restoring torn-delta rendering is red-testable but an operator-visible divergence from parity. claude-splice ruling: convert to the empirical question first — determine whether any torn-mid-part shape exists that does NOT trigger e00ecdc whole-request restart and still renders nothing. If YES: that reachability gap is the defect; fix by ROUTING it into the already-sanctioned restart (red-testable by breaking the trigger, no parity break). If NO: DR-7 closes as covered-by-e00ecdc with the coverage test pinning the route. Only if a render-nothing shape exists that CANNOT ride the restart does this become an operator fork — then BLOCKED note, not a unilateral behavior change. Deferred by codex-splice until this determination.
