name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The world wall (webui/tests/world.test.ts) derives its denominator from the BASE branch's
      # token sheet, and the checkout above brings only the PR merge ref — so `git show main:...`
      # was `fatal: invalid object name 'main'` and the webui leg went red for a reason that had
      # nothing to do with the code under test. One shallow ref is all the wall needs.
      - name: fetch the base branch the world wall reads
        run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Several gate legs are bun scripts (checks/gate.sh:67 onward) and `bun tools/gate` is the
      # gate of record's entry from PR 3 — so this job runs bun, and gets it from a pinned action
      # rather than from the `bun` npm package's postinstall.
      # BOTH pins are load-bearing: the SHA (resolved from the GitHub API, tag v2.2.0) because a
      # mutable tag is a supply-chain hole, and bun-version because setup-bun falls back to the
      # LATEST bun when it cannot resolve one — an unpinned toolchain on the leg whose verdict is
      # the gate.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: install workspaces
        run: npm ci
      - name: complete repository gate
        run: npm run gate

  walls-annotate:
    # Annotation-only surface for ast-grep wall violations.
    # The gate job at checks/gate.sh:70 remains the SOLE pass/fail authority
    # (same checker run twice deliberately). The `|| true` is deliberate:
    # this job exists only to surface violations as PR diff annotations, not
    # to block merges. GitHub caps annotations at roughly 10 error + 10 warning
    # per step, so large violation sets truncate to the log.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: install workspaces
        run: npm ci
      - name: annotate wall violations
        run: npx --no-install ast-grep scan --format github || true

  wrapper-validation:
    # Validates the Gradle wrapper checksum on every pull request.
    # This catches a tampered gradle-wrapper.jar arriving via fork PR before
    # any build step executes it. The action discovers wrapper files recursively,
    # so no path inputs are required (repo has gateway/gradlew + wrapper jar).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
