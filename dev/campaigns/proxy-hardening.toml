title = "A watchdog stall discards the round entirely || PROBLEM: splice already recovers mid-stream truncation: a `TurnOutcome.Failure` carrying a `PartialRound` feeds `ReanchorRunner`, which re-POSTs a continuation and salvages the work. But a **stall** — the same observable outcome, an incomplete stream — takes a completely different path: `watchdogOutcome` builds a `Failure` with **no** partial, and both continuation gates short-circuit on `signals.watchdogFired()`. So a turn that generated 4 minutes of reasoning and then went silent for the idle cap loses everything and hands the user a retry, while a turn that got a truncated frame at the same point is transparently … || SPLICE TODAY: `gateway/dialect-openai-responses/src/main/kotlin/splice/dialect/responses/ResponsesStreamTranslator.kt:248-257` (`watchdogOutcome` → `TurnOutcome.Failure(OVERLOADED, '...stream stalled...')` with no `partial=`), against the sibling truncation branch at `:224-230` which passes `partial = partialOrNull(reducer)`. The in-repo justification is verbatim at `:236-239`: 'watchdog failures never carry one (their turn coroutine is being cancelled — nothing may re-POST)'. Both continuation gates refuse: `gateway/gateway/src/main/kotlin/splice/gateway/head/TurnDriver.kt:778` (`searchContinuation`) and `:904` … || PROPOSAL: Split the watchdog's two jobs. Keep `target.cancel()` for `TotalCap` (a hard ceiling must kill). For `Idle` breaches, first set the sentinel and close only the **upstream read channel** — cancelling the round's stream, not the turn job — let the translator produce its normal unfinished terminal **with** the partial it already has, and let `ReanchorRunner` decide whether a continuation is worth one more round (bounded by the existing re-anchor attempt budget and NF-03's turn-wide cap so it can never loop). Drop the `watchdogFired()` short-circuit at `TurnDriver.kt:778`/`:904` for the Idle case only. || EFFORT/RISK: L. **Risk** **Highest-risk item in this document.** The watchdog cancel is described in-repo as 'the only lock-safe kill' and the two-tier design exists because || VERIFY-SPEC: `gateway/provider-spi/src/test/kotlin/WatchdogTest.kt` must keep every existing case green (prefill-not-reaped-before-first-byte, post-byte idle reap, total-cap reap) as the regression oracle. New case in `gateway/gateway/src/test/kotlin/head/HeadServerFoldTest.kt`: a stub upstream that streams reasoning then goes silent past `streamIdle` produces a re-anchored continuation whose output includes the pre-stall text, and the turn still terminates within `totalCap`. Gate: `npm run gate` + `checks/e2e/heads-e2e.sh` tier 1. --- ## 6. Improvements — self-heals || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### NF-11'"
