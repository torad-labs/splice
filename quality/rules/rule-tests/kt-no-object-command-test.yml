id: kt-no-object-command
valid:
  - 'object AdminSupport { fun help() {} }'
  - |
    sealed class Command {
        data object Doctor : Command()
    }
  - |
    object AdminSupport {
        val usage = """Usage: object FooCommand <args>"""
        val x: FooCommand = TODO()
    }
invalid:
  - |
    object InstallCommand {
        fun install() {}
    }
  - |
    public object LoginCommand {
        fun login() {}
    }
