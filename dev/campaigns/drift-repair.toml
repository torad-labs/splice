
[[items]]
id = "DR-166"
phase = "repair"
title = "RefreshRetry cancellation short-circuit is unpinned: found by codex-splice's test audit — swapping Cancellables.runCatchingCancellable for the stdlib runCatching in refreshWithRetry leaves all 41 RefreshRetryTest arms PASS. Production is correct; the coverage is absent, so the guard was free to be deleted by anyone. With stdlib runCatching a CancellationException is captured, classified as RefreshStep.Retry, and the loop spends all three attempts plus two backoff sleeps inside a refresh nobody is awaiting before the final rethrow. Distinct from DR-82, which pins a final IOException reaching the provider boundary and cannot fail for this. Land a permanent arm asserting the SAME cancellation instance escapes after exactly one call with zero recorded waits, plus a control proving the wait recorder is a live instrument."
files = ["gateway/app/src/test/kotlin/RefreshRetryTest.kt"]
status = "done"
verify = "cd gateway and ./gradlew --no-daemon :app:test --tests RefreshRetryTest :app:detekt --rerun-tasks"
# [2026-09-01] 2026-09-01 LANDED (test-only; production byte-identical). Provenance: codex-splice test audit. Mechanism confirmed by reading RefreshRetry.kt and Cancellables.kt: runCatchingCancellable catches only IOException, SerializationException and IllegalArgumentException, so a CancellationException propagates out of the loop body at once. Under stdlib runCatching it is captured instead, classify never runs on it, the result is folded to RefreshStep.Retry, and the loop spends all three attempts plus two backoff sleeps before the final rethrow releases it — a cancelled turn sleeping about 6s inside a refresh nobody awaits. Two permanent arms in RefreshRetryTest: the DR-166 arm asserts the SAME instance escapes with exactly one call and an EMPTY wait list, and a control proves the wait recorder is a live instrument. Mutation proof dr166_cancel_mutants.py, 3 mutants, 0 discrimination failures, RefreshRetry.kt restored byte-identical sha256 a977f5c5785a57d6: N1 is codex EXACT mutant (runCatchingCancellable to stdlib runCatching) and REDs ONLY the DR-166 arm while DR-82 stays green, which is the demonstration that DR-82 could never have caught this; N2 disables backoff and REDs ONLY the control, so the no-waits assertion is measured not assumed; N3 deletes the final rethrow and REDs ONLY DR-82, not DR-166, because a cancellation never reaches that line — the two arms pin different properties rather than one property twice. Shipping test sha256 fe994375d52eb79e. Gate on the committed tip below.
