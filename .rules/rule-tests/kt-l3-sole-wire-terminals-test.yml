id: kt-l3-sole-wire-terminals
valid:
  - 'val evt = "content_block_delta"'
  - '// comment naming message_stop is fine (PORT-OF headers cite invariants)'
  - 'val msg = "the message " + received'
  - 'val msg = "stop" + "watch"'
invalid:
  - 'write("event: message_stop\ndata: {}\n\n")'
  - 'val kind = "message_delta"'
  - 'val kind = "message_" + "stop"'
  - 'val kind = "message_" + "delta"'
