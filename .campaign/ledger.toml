spec = '''
`splice desktop credential` is the program Claude Desktop runs as its inferenceCredentialHelper (outcome 1).
- With stdout not a terminal, it prints the desktop key alone on one line and exits 0. Desktop reads a bare token from stdout.
- With stdout a terminal, it prints no key and exits 1, saying on stderr: "splice desktop credential: this is Claude Desktop's credential helper; it prints the desktop key only to the program that runs it". splice shows the desktop key on a terminal only where a person must paste it (standard mode's `on`, which prints Desktop's environment variables); this command, which no person needs to read, never does.
- It reads the key from splice's state folder itself (DesktopKey's file) and needs no running daemon: Desktop runs it at launch and whenever its cached credential runs out, maybe before splice's daemon is up. When there is no key yet it mints one, as DesktopKey.get does.
- After `splice desktop rotate-key` it prints the new key.
- `splice desktop`'s usage line names `credential`. It is not one of the daemon verbs in DoorVerbs.
