reason = """Two frame writers on two different planes. FrameWrite "writes one already-serialized frame to the client" on the L3 turn stream, and its KDoc names its place: "the third rung of this file's write-port ladder: FrameWrite -> ImmediateSseWriter.write -> RawSseWrite + RawSseFlush". Suspending is its contract, not a detail — the write back-pressures on the client socket and a failure out of it is how the head learns the client is gone. SseWrite writes one frame on the MCP transport's own SSE channel (control/api/McpRoutes.kt), read by an MCP client, never by the turn. Sharing a port would let management-plane frames into a client turn — the leak the L3 wire walls exist for — and turn frames into an MCP session."""
