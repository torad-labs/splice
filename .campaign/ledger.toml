[[row]]
id = 'df-live-run'
title = 'The live test runs on the real Desktop in the sandbox, and its record is in the spec'
feature = 'desktop-full'
status = 'todo'
owner = ''
blocked_by = [
  'df-features',
  'df-sandbox',
  'df-wire-limits',
  'df-turn-headers',
]
guard = false
spec = '''
The campaign runs the live test itself, on the real Claude Desktop in the sandbox (df-sandbox), driven by screenshots and xdotool as a person would. The feature isn't done until it passes (outcome 8, added Nov 18, 2026 at the founder's direction).
Run `bun tools/desktop-sandbox/main.ts start --heads person --app`. Take a `shot` after each step and read it as an image before going on. Cover every case below in app mode with no human step, and check `/api/perf/turns` on the person's daemon for each turn.
Record the run in docs/specs/desktop-full.md, in a new section "## The live test, run". It holds a table `| case | result | what was seen |` with one row per case, named exactly: on and relaunch; picker in Chat; picker in Cowork; picker in Code; turn on a GPT head; turn on a Grok head; turn on Claude; model switch mid-session; effort levels; context meter; compaction; subagent naming a tier; titles; image attachment; MCP tool; auto mode; web search and fetch on a non-Claude head; usage display; Chat turn; Cowork turn; perf rows; picker after a head is added; off; standard mode.
- "picker in Code" also records which row a new session starts on, which df-models makes the door's saved default. "picker after a head is added" adds a head to the sandbox daemon and checks three things: `splice desktop` says the picker changed, Desktop shows the new row only after a relaunch, and the notice clears after that.
- The result is one of pass, fail, unavailable (a feature named unavailable, with Desktop's or the head's reason) or needs sign-in.
- Standard mode needs a claude.ai sign-in in the sandbox. Cover what runs without one. Where only a sign-in unblocks the rest, open it on --watch (Xephyr) and ask once, through the lead. If no answer comes, record "needs sign-in".
- A case that fails is fixed in splice in this item and run again. The check holds no "fail".
- The section also answers each Unknown of the app study, by these names: standard-mode picker, standard-mode titles, connectors under the switch, Remote Control under the switch, Developer menu.
- It corrects any statement in the spec that the run disproves, and desktop-door.md's "Dropped" row (CLAUDE_CODE_HOST_OFFERS_DEVICE_MCP is deleted unless Desktop sets it).
- What the run settles goes into `splice desktop`'s features (df-features), so none is left "unknown".
- The screenshots judged are attached to the PR, after checking that none shows a key, an account name or a private path. They are not committed.
Proof: `bun test ./.campaign/checks/desktop-full/live-record.test.ts`.

