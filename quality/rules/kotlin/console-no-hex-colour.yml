# THE LAW (Marcos approved the Splice brand kit on Oct 19, 2026). Every colour the console draws comes from
# app/src/main/resources/console/tokens.css, which is the kit's .design/brandkit/tokens/splice.css. A hex colour anywhere else
# in the console's CSS, JS or HTML is a second palette, and it is how a console ended up with its own cream, its own red and a
# review panel in magenta. Use a token (var(--splice-...)) or one of the console's aliases of one (var(--wall), var(--claude)).
# A colour the kit has no token for is added to the kit's tokens first, with its contrast measured, then copied to tokens.css.
#
# This file sits in quality/rules/kotlin because sgconfig.yml names that one rule directory; the three documents below scope
# themselves to the console by files:. rgb() and rgba() literals are not covered.
id: console-no-hex-colour-css
language: css
severity: error
message: A hex colour in the console CSS outside tokens.css is a second palette.
note: Use var(--splice-...) from tokens.css, or the console alias of it (var(--wall), var(--text), var(--claude)). A new colour goes into the kit's tokens first.
files:
  - app/src/main/resources/console/*.css
ignores:
  - app/src/main/resources/console/tokens.css
rule:
  kind: color_value
---
id: console-no-hex-colour-js
language: javascript
severity: error
message: A hex colour in the console JS is a second palette.
note: Read the colour from a token with getComputedStyle, or give the element a class and let the CSS use var(--splice-...).
files:
  - app/src/main/resources/console/*.js
rule:
  kind: string_fragment
  regex: '^#(?:[0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$'
---
id: console-no-hex-colour-html
language: html
severity: error
message: A hex colour in a console page's style attribute is a second palette.
note: Give the element a class and let the CSS use var(--splice-...).
files:
  - app/src/main/resources/console/*.html
rule:
  kind: attribute_value
  regex: '#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b'
  inside:
    stopBy: end
    kind: attribute
    has:
      kind: attribute_name
      regex: '^(?:style|fill|stroke|color)$'
