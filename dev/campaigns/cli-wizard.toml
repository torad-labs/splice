# [2026-09-15] REVIEW ROUND 2 - all four fixes verified, one NEW defect found on re-read, verdict held until it clears. VERIFIED FIXED: bin is now InstallLayout().localBin(env) so both Summary lines are computed; the spinner message is derived from the outcome and a throwing install now stops with Install failed before the exception is rethrown, so the success string can no longer appear on a failure path; the pick reaches summaryLines; the seeded-decline test reads the file before and asserts byte-identity; cancel-at-select is exercised. Predicted 9 observed 9 is the discipline I asked for. NEW DEFECT, and it is the same class as the one I sent you back for - the Summary naming something other than what happens. SetupStart.Existing produces exactly one line, no starter will be written because one is already present, and it omits the wrapper line entirely. Both halves are wrong. runInstall is unconditional: it calls init, which materializes the starter when the file is absent, then install --all and installSelf, which link wrappers every time regardless of the pick. So picking Existing on a machine with no topology states that nothing will be written and then writes the starter; and picking Existing on any machine promises no wrappers and then installs them. The confirm is load-bearing precisely here, and the two-picks test currently pins the false line as correct, so the wall is holding the defect in place. THE FIX, and it removes the whole class rather than the instance. Line 1 comes from the DISK, not from the pick: when Files.exists(path) render Existing topology at path will be reused, otherwise render Starter topology arrow path. That is true for every option including a fresh-machine Existing pick. Line 2, Wrapper commands under bin, appears in ALL THREE branches because wrappers are always installed. Line 3 stays as it is and is the only pick-driven line: for OAuth only, starter is still OpenRouter plus the splice add command. Keep SetupStart.Existing in the