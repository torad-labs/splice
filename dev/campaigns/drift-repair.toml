# [2026-08-27] DEPLOY PAIRING (orchestrator, 2026-08-27): commit 71c0849 (InboxListener poisons the pooled connection on onClose/onError) is COMMITTED AND PUSHED BUT NOT DEPLOYED — the jar is built and hashed bb14490014eca1b2, but a 50-minute watcher never found a 3-minute quiet window to restart the daemon in, and the operator holds the deploy decision because a restart cancels other sessions' in-flight turns and wipes the reasoning cache. DR-16's fix (cap InboxListener.assembly against BufferCapacity.MAX_BUFFERED_CHARS and route over-cap to onAnomaly) lands in THE SAME FILE, three lines away, so it should ride the SAME restart rather than buying a second one. Live rate while parked: 69 stale sends in the current daemon.log, 8 of them after the fix was committed, all benign (round rides SSE, no failed turn) — which is the argument for batching rather than rushing the restart. Whoever takes DR-16 must rebase onto 71c0849 first and re-read InboxListener.onClose/onError, since that commit changed both callbacks.
# [2026-08-27] POST-DEPLOY EVIDENCE for 71c0849 (orchestrator, 2026-08-27 02:14, PRELIMINARY — N=3 ws rounds in 22 minutes, far too small for a rate claim). The fix is LIVE and firing: jar bb14490014eca1b2 deployed at 01:52, and both new diagnostics appear. Two poisonings observed, and they split into the two DIFFERENT mechanisms the commit message predicted. (1) 02:14:19 status=1006 (abnormal closure, no close frame) fired STANDALONE with no accompanying send failure — this is the fix working exactly as designed: a dead socket poisoned proactively so no later round is handed the corpse. (2) 02:13:58 status=1011 fired in the SAME SECOND as a send failure on ws-7e15559a, poisoning line first. That socket connected at 01:55:05 and had been idle 18m53s with no intervening round, so the server had almost certainly dropped it silently long before; the send is what SURFACED the close, and the JDK delivered onClose as part of the failure. The poisoning was a consequence of the failed send, not a preventive of it — i.e. exactly the silent-drop half the commit message said this change could not cover. CONCLUSION SO FAR: close-poisoning removes the reuse-after-observed-close case but not the idle-silent-drop case, and the idle case may be the dominant one. The residual fix is a KEEPALIVE PING (or a pre-send liveness probe) on idle pooled sockets, not a further liveness flag — no flag can know about a close the peer never announced. Do NOT open that as an item on this evidence; re-measure over a multi-hour window with real ws traffic first, counting standalone poisonings vs poison-with-simultaneous-send-failure. That ratio IS the metric.
# [2026-08-27] METRIC SHARPENING (orchestrator, 2026-08-27 02:45, N=3 poisonings over 50 min of now-heavy ws traffic — still preliminary but a clean pattern). The close STATUS CODE predicts which mechanism fired, 3/3 so far: status=1011 (server terminating on an unexpected condition) has BOTH times coincided with a send failure in the same second, poisoning line first — the send is what surfaced a socket the server had already abandoned, so the fix cannot prevent these; status=1006 (abnormal closure, no close frame) fired STANDALONE with no send failure — the fix working proactively. Both 1011 cases followed a multi-minute IDLE gap on the key: ws-7e15559a connected 01:55:05 and failed at 02:13:58 (18m53s idle), then last chained 02:32:23 and failed at 02:42:11 (9m48s idle). If that correlation holds at larger N the residual work is precisely scoped: a keepalive ping on sockets idle beyond ~8 minutes, which is cheaper than a pre-send probe and targets the only case left. SEPARATE OBSERVATION, not investigated, do not act on it without evidence: key ws-9dfcfb60 registered four generations (5,6,7,8) in 3.5 minutes and logged 12 'busy — concurrent round rides SSE' lines in the same window. Everything degraded correctly to SSE and no turn failed, but that is more connection churn than the one-socket-per-key model implies, and nothing in the log explains what retired generations 5-7. Worth a look ONLY if it recurs at scale.
