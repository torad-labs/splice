phase = "m1"
title = "SHELL: ROUTER, RAIL, RULE, PALETTE, VIEWS (CONTRACTS.md section 3; FEATURES.md 4.1; spec regions top-rule, wordmark, clocks, health, nearest-window, no-window, rail, rail-labels in webui/.impeccable/build/spec.json and their boxes in webui/.impeccable/build/scaffold/layout.css). Replace the hash-tab router in webui/src/app/App.tsx with React Router 7.18.4 createHashRouter: the thirteen addresses #/fleet #/turns #/sessions #/teams #/projects #/accounts #/usage #/settings #/models #/logs #/compaction #/mcp #/doctor; old addresses #fleet #burn #auth #config #logs #compaction redirect to #/fleet #/usage #/accounts #/settings #/logs #/compaction; unknown goes to #/fleet. Pages are discovered with import.meta.glob('../pages/*/index.tsx') keyed by directory name and rendered through their default export; a missing directory renders <Empty text='page not built' source='row M2-0N'> from a map in app/rows.ts (fleet M2-01, sessions and projects M2-02, turns and logs M2-03, accounts M2-04, settings M2-05, usage, compaction and models M2-06, mcp and doctor M2-07, teams M1-05). No directory is renamed: discovery maps an address to pages/<address>/index.tsx when that module exists and otherwise to the alias in app/rows.ts (usage to burn, accounts to auth, settings to config), so an M2 row that creates the real directory needs no shell edit; add `export default` to every existing page index (fleet, burn, auth, config, logs, compaction); change nothing else inside them. Layout in webui/src/app/app.css bound to the scaffold: the rule is the top-rule region box (full width, its measured height), the rail is the rail region box (its measured width, full remaining height, --room-deep ground, hairline right edge), the page area is the rest; the wordmark, clocks, health, nearest-window and no-window cells sit at their measured x and width inside the rule; rail labels at the rail-labels box. Rail (webui/src/widgets/rail): thirteen HolderEdge tabs in address order, green when active, grey otherwise, label = the address word; arrow keys step focus, Enter opens; strings.ts beside it. Rule (webui/src/widgets/rule): wordmark `splice` at --text-6 in --font-label lowercase; local and UTC clocks HH:MM:SS in --font-figure ticking each second; daemon health from @entities/control-status as a HolderEdge (green ok, amber degraded, red unreachable) with the word printed; the plan window nearest exhaustion computed from the existing exports of @entities/usage and @entities/auth as `<head> <account> <window> <pct>%` or `no window reported`; the count `<N> heads report none`; every number through Figure with its basis; reads entities through their existing public exports only, never edits them. Palette (webui/src/features/palette, cmdk 1.1.1 already installed): ctrl+k and `/` open it; items are the thirteen addresses, `theme dark`, `theme light`, and the saved views of the current page; radius 0, no icons. Views (webui/src/features/views): useViews and ViewTabs with EXACTLY the contract's types and storage key splice.views.<pageId>; add, rename, duplicate, reorder, remove, exportJson; removing the last view restores defaults. DEPENDS ON M1-01 (useTheme) AND M1-02 (Empty, HolderEdge): this row is claimed only after both are done, so its typecheck is green from the start. cmdk 1.1.1 and react-router 7.18.4 are installed at the repo-root node_modules (npm workspaces hoist; check with `node -e \"require.resolve('cmdk')\"`, never `ls webui/node_modules`). Keep webui/src/features/unlock-mgmt working (it is the mgmt-key entry the shell mounts). Delete the old header, tabs and footer markup; the shell has no footer. TESTS webui/tests/router.test.ts (address table, redirects, unknown address, page discovery map; pure functions extracted from App.tsx) and webui/tests/views.test.ts (every useViews operation on an in-memory storage shim; exportJson round-trips). Read /home/user/.claude/skills/impeccable/reference/craft-floor.md and .dev/web-console/CONTRACTS.md before editing. HERO REGIONS: the hero capture (M1-05) includes this row's rail and rule; when M1-05 reports a rail or rule region below its verdict (region id and score), splice-design reopens this row as a fix row and its builder repairs that region from the crop under webui/.impeccable/review/diff/hero/regions/."
