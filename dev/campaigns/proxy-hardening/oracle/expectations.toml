# but is not enrolled here "wasn't counted and wasn't protected against regression" (bun#34441).
# Enrolment is what makes a green result MEAN something.
#
# WHAT THE ORACLE IS  dev/campaigns/proxy-hardening/oracle/fixtures/*.json — both wire directions of the LEGACY Node
# stack (server/), recorded byte-exactly by dev/campaigns/proxy-hardening/oracle/capture.mjs while that stack was green
# (104/104, `cd server && node --test`). It is the reference implementation of this protocol.
#
# THE ORACLE IS NOT A SPEC — IT IS A RECORDING. It faithfully encodes the reference's BUGS as
# well as its correctness. The Kotlin gateway deliberately fixed several of them (the G-series in
# dev/research/gateway-gaps-tracker.md). So a replay divergence has exactly two readings, and
# every one must be classified into one of them, never left ambiguous:
#
#   status = "not-yet-replayed"    no verdict exists yet. The birth state of every row.
#   status = "kotlin-wrong"        the gateway diverges and the reference was right. A BUG. Fix
#                                  the gateway; the row leaves this file when it passes.
#   status = "sanctioned"          the gateway diverges ON PURPOSE and is better. MUST cite the
#                                  G-number or campaign item that authorised it, and MUST pin the
#                                  new expected bytes — a sanctioned divergence is still pinned,
#                                  otherwise it is an unmonitored hole.
#
# A row is NEVER deleted to make the runner green. Deleting a row un-protects the scenario, which
# is the precise failure bun#34441 names. Rows leave only by passing.
#
# BIRTH STATE 2026-07-26: 11 captured, 0 replayed. The replay runner does not exist yet, so every
# row is not-yet-replayed. That count IS the work inventory (#954: red is the honest inventory).

