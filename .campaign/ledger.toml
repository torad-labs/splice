spec = "[server.telemetry] forward_to names the operator's OTLP/HTTP collector by its base URL, http or https with a host; anything else refuses boot with a finding naming server.telemetry.forward_to, listed with every other finding (boot fails closed). Claude Code on a laptop sends its own telemetry to POST /server/otlp/v1/{metrics,logs,traces} with the person's key as a bearer, as JSON (application/json) or protobuf (application/x-protobuf), gzipped or not. The server sets splice.person and user.email to the key's person, and splice.team to their team, on every resource of the request, a resource with no attributes included, over whatever the client claimed: the verified key is the only word on who sent it. A person on no team gets no splice.team, and a team the client claimed is dropped, never kept. Every other attribute and record is kept as sent. The request goes to <forward_to>/v1/<signal> in the same encoding, with none of the client's headers but its content type, so never the person's key, and the client gets the collector's answer. A collector that answers an error or can't be reached is a 502, 503 or 504 to the client (503 for the collector's 429 or 503), the codes an OTLP exporter retries, said once in the daemon log when it starts failing and once when it answers again. No key, an unknown key and a revoked key are each a 401 in the server's usual refusal, and nothing is forwarded; a path under /server/otlp that is no OTLP signal is a 404. GET /server/profile names the relay as telemetry: {otlp: <the address laptops reach this server at>/server/otlp} (behind a proxy in trusted_proxies, from its X-Forwarded-Proto and -Host); the laptop's half (server-telemetry-recipe) reads exactly that field. A server with no [server.telemetry] has no /server/otlp route (404) and says telemetry: null. Start from the parked code: git diff 0970e5f5d 0970e5f5d^ restores both telemetry items and applies cleanly on this base. This item takes its server half: core ServerConfig