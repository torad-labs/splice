# Copy gate (locked design decision): zero em-dashes in UI text. Functional
# labels only. Applies to JSX text and string literals; code comments are free.
#
# Widened 2026-07-26 (ast-grep-walls-audit): matched only the literal `—`
# character, but HTML entity encodings (`&mdash;`, `&#8212;`, `&#x2014;`)
# CST-parse to their own `html_character_reference` node — a sibling of
# `jsx_text`, invisible to the old rule. All three encodings bypassed pre-fix.
# Added a case-insensitive html_character_reference branch; verified against
# `&amp;`/`&nbsp;` as false-positive controls (3 of 5 entities correctly flagged).
id: webui-no-emdash-ui-text
language: tsx
severity: error
message: "Zero em-dashes in UI text (locked copy gate) — rewrite the label."
note: |
  Functional labels only: split the phrase, use a colon, or drop the clause.
  Data cells use a plain hyphen or an explicit empty-state string, never an
  em-dash placeholder.
files:
  - webui/src/**/*.tsx
rule:
  any:
    - kind: jsx_text
      regex: "—"
    - kind: string_fragment
      regex: "—"
    - kind: html_character_reference
      regex: "(?i)^&#?(mdash|8212|x2014);$"
