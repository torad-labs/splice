<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounts · splice</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/splice-app-256.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="composer.css">
<link rel="stylesheet" href="accounts.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="mark"><img class="lockup night" src="brand/splice-horizontal-night.svg" alt="splice" width="380" height="128"><img class="lockup day" src="brand/splice-horizontal-day.svg" alt="splice" width="380" height="128"></div>
    <!-- The nav is drawn by kit.js from its one PAGES list: which pages exist, in which order, and the
         rule that a link appears only with its page (Marlin) and that one page draws no nav (hitstop). -->

    <div class="foot">
      <button class="icon" data-act="theme" aria-label="Day or night">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </aside>
  <main class="page">
    <header class="head">
      <h1>Accounts</h1>
      <div class="read">
        <span class="unheard" id="unheard" role="alert" hidden></span>
        <span class="unheard" id="dayunread" role="status" hidden></span>
        <button class="act quiet small" data-act="probe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span class="w">Read again</span>
        </button>
      </div>
    </header>
    <section class="board" id="board" aria-live="polite"></section>
  </main>
</div>
<script src="kit.js"></script>
<script src="api.js"></script>
<script src="reqview.js"></script>
<script src="knobs.js"></script>
<script src="perf-heads.js"></script>
<script src="console.js"></script>
<script src="composer.js"></script>
<script src="pilot.js"></script>
<script src="accounts.js"></script>
</body>
</html>
