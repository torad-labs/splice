# [2026-09-15] DISPATCH: to=splice-builder (packet emitted)
# [2026-09-15] SLOT — complete design, zero design freedom. (1) TerminalMode is an internal CLASS (no top-level functions, no companion) taking an injected command runner seam so tests never touch a real terminal. Its single public member is a bracket: raw(block) which returns the block result. On a TTY it (a) captures the current mode by running stty dash g reading from /dev/tty, (b) enters raw by running stty with minus icanon, minus echo, min 1, time 0, again against /dev/tty, (c) runs the block inside try/finally, (d) restores in the finally by running stty with the captured mode string. (2) It ALSO registers a JVM shutdown hook, once, holding the captured mode, so a SIGINT that kills the process mid-prompt still restores; the hook deregisters on normal exit so a long-lived daemon does not accumulate them. (3) When System.console is null, raw(block) runs the block with NO stty calls at all and the runner must record zero invocations - that is asserted. (4) KeyReader is an internal class over an injected InputStream. Sealed class Key (NOT sealed interface, project convention kt-no-sealed-interface) with objects Up, Down, Left, Right, Enter, Space, Escape, CtrlC, Backspace and a data class Char carrying the codepoint. Decoding: byte 3 is CtrlC; 13 or 10 is Enter; 32 is Space; 127 or 8 is Backspace; 27 begins an escape sequence - read the next byte, and if it is 91 (open bracket) read one more where 65 is Up, 66 is Down, 67 is Right, 68 is Left. (5) THE TWO CASES THAT MUST BE TESTED BECAUSE THEY ARE WHERE THIS BREAKS: a CSI sequence split across two read calls (the three bytes do not arrive together), and a LONE 27 with nothing after it, which must yield Escape rather than blocking forever waiting for a second byte. Use available() or a short bounded wait - do not block unbounded on a lone ESC.
