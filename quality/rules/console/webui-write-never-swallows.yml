# A write says how it ended. An exported function that sends a write (its request carries a
# `method:`) and answers `null` or `false` from its catch hands its caller "nothing" for a refusal,
# a network failure and a route not built yet alike; the caller cannot tell any of them from a
# success, and the panels printed "Saved" and "Sent" over each (Marlin's HOLD, 2026-09-25: putBudgets,
# putAlerts, sendTestAlert). The successor's typed mutations preserve the refusal or failure
# as an error so the caller cannot mistake it for success.
id: webui-write-never-swallows
language: typescript
severity: error
message: "A write preserves its failure, never null or false from a catch."
note: |
  Let the typed mutation reject on a refusal or network failure. Render its error in the caller;
  only a fulfilled mutation may read as success. Never convert a rejected write into an empty answer.
files:
  - console-next/src/**/*.ts
rule:
  any:
    - pattern: return null
    - pattern: return false
    - pattern: return undefined
  inside:
    kind: catch_clause
    stopBy: end
    inside:
      kind: export_statement
      stopBy: end
      has:
        kind: property_identifier
        regex: ^method$
        stopBy: end
