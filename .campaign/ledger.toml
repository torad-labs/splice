A provider reached through a company's TLS-inspecting proxy works (issue #680, outcome 11): today every turn fails with a bare PKIX error because splice trusts only the roots Java ships with.

After this item, splice's upstream client trusts, for every provider: the roots Java ships with, plus the operating system's trust store, read at start (on Linux the bundle SSL_CERT_FILE names when it is set, else the first of /etc/ssl/certs/ca-certificates.crt, /etc/pki/tls/certs/ca-bundle.crt, /etc/ssl/cert.pem that exists; on macOS /etc/ssl/cert.pem and the system keychain); and for one provider, its `ca_file` (cp-schema: a PEM bundle of one or more certificates), trusted for that provider only. A certificate none of them trusts fails the turn with an error in Anthropic's shape whose message names the provider and the fix: `splice: <provider>'s server at <host> presented a certificate splice does not trust (<the TLS reason, short>). Name the certificate authority that signed it in providers.<provider>.ca_file, or add it to this machine's trust store.` Nothing is retried for it. Hostname verification stays on everywhere; no option turns verification off.

Decided here: an unreadable OS bundle is skipped with one log line, never a boot finding (the person did not write it); an unreadable ca_file is a boot finding (cp-schema).

