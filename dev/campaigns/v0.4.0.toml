# [2026-09-13] REVIEW 1 (splice-astra, 2026-09-13): exact row gate PASS with no output: cd gateway && buildgate ./gradlew --offline --continue :core:test --tests "*SessionRegistry*" :app:test --tests "*SessionsCommand*" :core:detekt :control:detekt :app:detekt -q. Verdict: NOT ACCEPTABLE. Finding 1 (false head provenance): ProcessEnvironment identifies a head only from ANTHROPIC_BASE_URL and consumers map its loopback port directly (ProcessEnvironment.kt:23-25; SessionsCommand.kt:82-85; ControlPlane.kt:102-105). Any manually launched Claude process pointing at a configured port is reported as a splice-made launch even though LaunchService already authors SPLICE=1; this violates join-to-heads-by-launches-splice-made. Finding 2 (unavailable rows advertised as messageable): SessionsCommand.sendLine excludes only GONE, so a STALE session with a name or socket still prints a copyable SendMessage line (SessionsCommand.kt:58-63). The test stale fixture has neither address and misses this acceptance violation; only LIVE rows may print it. Finding 3 (read-only command writes and fails closed around topology): the default CLI registry uses TopologyLoader.loadOrMaterialize before listing (SessionsCommand.kt:77-85), so splice sessions creates starter config on a fresh install and a malformed topology prevents registry enumeration instead of degrading head attribution to unknown. That contradicts the row read-only contract. Finding 4 (untrusted registry text is emitted unsafely): name/status/cwd/head are printed without control-character sanitization and name is inserted into quoted SendMessage syntax without escaping (SessionsCommand.kt:39-49,58-63). A registry name containing a quote, newline, or ANSI/OSC sequence can forge rows/terminal controls or produce an invalid command; an empty name also wins over a valid socket. Finding 5 (one scalar-invalid record aborts all rows): ProcessHandle.of(pid) is outside the per-record parse guard, so pid 0 or negative throws IllegalArgumentException and breaks both CLI and API rather than tolerating the row (SessionRegistry.kt:54,67-73,91-94). Additional privacy debt: ProcessEnvironment materializes every /proc/<pid>/environ entry, including credentials, into a Map even though attribution needs only launcher markers. Coverage gaps: no ProcessEnvironment or SessionsRoutes test, no stale-address, nonpositive-pid, control-character, topology-unavailable, or full optional-field schema test. Verified present: every requested field is parsed optionally, malformed JSON is skipped, gone wins over stale, newest-first ordering works, API is bearer-guarded, headless -p absence is stated, and reviewed paths never write sockets.
