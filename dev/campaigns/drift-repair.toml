title = "ClaudeConfigMaterializer performs two non-atomic mutations of operator-owned state, and both failure paths are swallowed. (a) replaceWithSymlink at :131-140 does Files.delete(dst) then Files.createSymbolicLink(dst, src) as separate syscalls with no restore, and linkOneShared at :128 swallows the result. If the create fails after the delete succeeded the item is GONE, permanently, unlogged: ~/.claude-grok/CLAUDE.md exists as a real file, the policy shares CLAUDE.md, the delete lands, then createSymbolicLink hits ENOSPC (a symlink still consumes an inode) or an EPERM from a hardening LSM — the head now has no CLAUDE.md and the operator file is unrecoverable. This is simultaneously a comment lie: the line directly above says Best-effort: an I/O race here just leaves whatever is already on disk, which is exactly what it does NOT do, because what was on disk was deleted first. (b) writeSettings at :159 and writeClaudeJson at :209 both end in a bare Files.writeString (truncate-then-write) against files a LIVE Claude Code process owns, while this same repo declares SecureFile.writeAtomic0600 the codebase one atomic-write primitive (LoginOutcomeFile.kt:39-41) and the sibling SessionRegistryLink was designed so a live session keeps writing across the swap. Torn-write arm: splice launch claudex in terminal B while a claudex session runs in terminal A; writeClaudeJson truncates .claude.json and terminal A reads it mid-write. The swallow makes it permanent: a truncated .claude.json feeds readJson at :220-224 whose getOrDefault(EMPTY_JSON) eats the SerializationException, local becomes empty, and :209 rewrites the file containing ONLY the five synthesized keys — destroying every other local key including the customApiKeyResponses.approved list that :216 is trying to preserve, while reporting success. Fix: temp+ATOMIC_MOVE for the symlink swap, route both writes through SecureFile.writeAtomic0600, and make readJson distinguish absent (empty, fine) from unparseable (abort the rewrite) as KeyStore.entriesStrict does. NOTE the concurrent-Claude-Code-writer arm is UNVERIFIED — it rests on Claude Code write behaviour, not on code in this repo."
