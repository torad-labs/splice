# [2026-09-15] REVIEW - REDO. Five findings, three of them defects in code that reported green. (1) THE SELECT ANSWER IS DISCARDED. runWizard binds picked from choose() and then only tests it for Cancelled; the chosen SetupStart never reaches any behaviour. Whichever starting point the user picks, runInstall does init plus install --all plus installSelf. A user who picks an OAuth head gets the OpenRouter starter and no sign-in for that kind. That is a false affordance and it is worse than having no select at all. ROOT CAUSE IS MY SLOT: I specified a widget and also specified do not change what install writes, which leaves the widget nothing it is allowed to do. My gap, not yours. RESOLUTION, and it is now part of the slot: the pick must drive the Summary. Build the NoteBox lines from the picked SetupStart so each option states truthfully what will happen - for OpenRouter the starter path and the wrapper path; for an OAuth kind the same two lines PLUS a line saying the starter topology is still the OpenRouter one and naming the command that adds that head; for Existing a line saying no starter will be written because one is already present. Then add a test that two different picks produce two different Summary bodies. That test is the thing that goes RED if the value is ever discarded again. (2) THE SPINNER REPORTS SUCCESS ON THE FAILURE PATH. spinner.stop with the fixed string Installed wrappers sits in a finally, so a failed install prints Installed wrappers and then returns false with no explanation, and a thrown install prints it too on the way out. Stop with a message derived from the outcome. (3) THE SUMMARY HARDCODES THE BIN PATH. The topology line is computed from TopologyLoader.configPath(env) but the wrapper line is the literal tilde slash .local slash bin, and InstallPaths.kt line 18 honours SPLICE_BIN_DIR before that default. The confirm is load-bearing precisely because the user is consenting to named writes at named paths, so a Summary that names the wrong directory is consent obtained under a false statement. Use InstallLayout().localBin(env). One line in that box is computed and the other is guessed - make both computed. (4) DECLINE IS THE WEAKER CLAIM, as you disclosed, and the disclosure is why this is a fix and not a finding against you. Add the case the slot asked for: seed an existing splice.toml, decline, assert the bytes are identical to what was seeded. Absence-on-fresh-home cannot catch a decline that truncates and rewrites an existing file. (5) THE CANCEL PATH HAS NO TEST. frame.cancel, WizardCancelled and the catch that turns it into true are entirely unexercised. That is the same shape as the CW-5 defect where nothing tested the production default. Add one: cancel at the select, assert no topology is written and setup returns true. WHAT I VERIFIED AND ACCEPT: the oracle is genuine - captured at tip c668522b with the pre-CW-7 command compiled, and not regenerated afterwards; configPath(env) is the same value as the old no-arg call because both default to EnvReader of System::getenv, so no CW-6-style regression; SetupStart.OAuth is a data class so the initialIndex equality really matches rather than silently returning minus one; and four of the six tests run SetupCommand with full production defaults, which is Law 11 satisfied rather than recited.
