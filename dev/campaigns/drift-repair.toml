# LAW [2026-08-26]: PROVENANCE — Eli drift audit of 285987d..71c0849 (the nine commits landed
#   after the PR-99 gate-clear), commissioned by the operator to prove no architectural/hook/style
#   drift. Architecture, hooks, Kotlin style laws, mirror_reasoning and kimi byte-identity all came
