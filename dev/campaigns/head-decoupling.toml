it, per the brief. safePath went private -> internal for that. Its semantic owner InstallCommand is at 14 of 14 so it could not host them, and pushing them into StatusCommand would invert doctor-reads-status. DoctorCommand gains one field and one receiver (238.5 -> 239.0 C).
# [2026-08-18] HD-25 cli split, PART 2 — WHERE I STOPPED AND WHY, and the residual. ControlPlaneClient STOPPED AT 2.78, off HIGH, as briefed. The next cut would split the four accessors (healthView/headsRuntime/headPorts/authPresence) from `request`/`body`, which each call once - every accessor is one request block plus one parse, and the file header correctly calls them same idiom, same timeouts. That is a number-driven split, not a concern-driven one, so it was not taken. DoctorProbes STOPPED AT 3.87, STILL HIGH, and that is the honest outcome. Its residual is FLOOR-SCORING DEBT, not density: its ONLY neighbour package is splice.core.util with median C 15.0, so it does not score against a real neighbourhood at all - the denominator is the floor, 23.8 = half the global package median of 47.5. Its own package splice.app.cli has median 63.5, ABOVE the global median, so it is not surrounded by tiny helpers. 24 of its 92 C is the concern term counting three declarations, and what remains is ONE pipeline: the five-entry BINARIES table, PATH resolution, the concurrent probe run (runProbes exists because claude ~1s and gh up to PROBE_SECONDS of network dominate sequential wall time) and a verdict per binary. Splitting it separates the probe table from the probes. Same arithmetic bounds the two NEW files: with the denominator floored at 23.8 a splice.app.cli file may carry at most C 42.8 to read below 1.8, and a single `internal class` plus a single splice.* import already costs 16 of that, leaving 53 logic lines for a whole file. DaemonStop lands at 2.00 (C 47.5, 63 logic lines) and DoctorInstallProbes at 2.86 (C 68.0, 72 logic lines) - both well below the HIGH band and both strictly smaller than the file they came out of, but neither can reach 1.8 without re-deriving code, which law 1 forbids. Reported rather than gamed. NOT added to CEILING_EXCEPTIONS: that list is for files that provably cannot be refactored under the gate, and DoctorProbes' HIGH is an artefact of a floored denominator that a later app/cli landing will move - the same class of movement the tool's own docstring calls a band-calibration decision for the orchestrator. Referencing the HD-25 calibration note (2026-08-17 weighting sweep, one-declaration-one-bill).
# [2026-08-18] HD-25 cli split, PART 3 — WALLS, DRIFT, GATES, COMMITS. WALLS: none edited, none needed re-anchoring, none broadened. `grep -rln 'ControlPlaneClient|DoctorProbes|stopDaemon|pollStopped|daemonOnPort|pidsOnPort|installationChecks|jarCheck|shimCheck|wrapperCheck|pathCheck' dev/campaigns/proxy-hardening/walls/ .rules/` returns exactly one hit, jw_02_doctor_sees_dead_heads.py, and it keys on code that did NOT move: it asserts 'HealthView' in ControlPlaneClient.kt (still there, the data class and its accessor stayed) and 'failedHeads' + 'not listening' in DoctorCommand.kt (untouched by this item). Live run GREEN and --selftest OK, both before and after. No wall reads DoctorProbes.kt at all (`grep -n 'ROOT /' walls/*.py | grep cli/` lists AdminSupport, ControlPlaneClient, Command, DoctorCommand, DoctorRuntime, DoctorProbeWrite - not DoctorProbes), so nothing pinned the install probes to their old home. kt-no-println.yml ignores gateway/app/** so both new files keep the :app carve-out; kt-no-object-command.yml is a non-issue since both new units are classes, matching DaemonLaunch. DRIFT, isolated because the shared tree carried three other seats' work: `--since ee9f76f` on the tip reports 32 moved | own 5 | neighbourhood 27, but 27 of those belong to the topology landing in the same commit. Measured MY contribution alone by scoring the tip twice - once as-is, once with only my six files reverted to ee9f76f and my two new files excluded: 6 files move, ALL of them own or CREATED, ZERO neighbourhood. Nothing untouched moved because of this item, and no file crossed 1.8 on my drift. Tree census over that same pair: HIGH 10 -> 9, moderate 32 -> 35, over-1.8 42 -> 44 (the +2 are the two new files themselves, at 2.00 and 2.86). Neither new file is in `--top 20`'s HIGH rows. GATES: `./gradlew check --rerun-tasks` on the clean tip 01fc9ea - BUILD SUCCESSFUL, exit 0, 162 actionable tasks 162 EXECUTED, ZERO from cache, zero FAILED markers, :app:detekt / :app:test / :app:check all ran. `npm run gate` - GATE: PASS, every leg green. Both also run earlier on an isolated clone of cf1dc64 carrying ONLY my eight files: gradlew check --rerun-tasks 162/162 SUCCESSFUL and GATE: PASS, which is what proved the red I hit on the shared tree was not mine. THREE SHARED-TREE REDS DIAGNOSED, NOT ATTRIBUTED AWAY: (1) :core:detekt 4 issues at Topology.kt:121 - proven to be inside another seat's uncommitted diff hunk; (2) 25 :app tests NoClassDefFoundError - a concurrent `gradlew clean check` (pid 2639705) was deleting app/build mid-test, signature being ':app:classes UP-TO-DATE' under --rerun-tasks; (3) :provider-spi:test NoSuchFileException on in-progress-results-generic.bin, same cause. Waited for the concurrent build to exit, then re-ran to a real uncached green. GOLDENS BYTE-FROZEN: git diff ee9f76f..HEAD over gateway/dialect-anthropic-passthrough/src/test/resources/goldens/ is EMPTY and the dir is git-clean. Behaviour-preserving throughout - no println string, no HTTP status branch, no timeout, no poll count, no DoctorCheck name/detail/fix string changed; every moved member kept its name. THREE COMMENT CROSS-REFERENCES re-anchored onto the new homes rather than left stale: AdminSupport.kt:115 'ControlPlaneClient.stopDaemon' -> 'DaemonStop.stopDaemon', Main.kt:237 'ControlPlaneClient.GRACEFUL_POLLS' -> 'GRACEFUL_POLLS in cli/DaemonStop.kt', DoctorCommand.kt:5 now names both probe files. COMMITS: this work is in 651f7a9 (swept in by the topology seat's commit during the shared-index collision that seat has already recorded from its side; content byte-identical to what I gated in isolation) plus b595c52, my repair of the AdminSupport call site that the same collision stranded and which left HEAD non-compiling. NOT REWRITTEN - other seats had already stacked commits on top. PRE-EXISTING, NOT MINE, FLAGGED IN TRANSIT: DoctorCommand.kt:211 emits 'Unnecessary safe call on a non-null receiver' (h?.topologyStale where h was already null-checked by the preceding `?: return null`); it is a warning not an error, the code is untouched by this item and present at ee9f76f. Local only, nothing pushed.

