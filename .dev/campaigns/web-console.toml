# [2026-09-18] 2026-09-18 DEFECTS THE CAPTURES CAUGHT: (1) strip columns were SHRINKING below their declared ch widths, so every long value clipped with an ellipsis - the fields are flex items and default to flex-shrink: 1; I first worked around it in my own CSS and removed that workaround when you fixed it in ui.css, which is where it belongs (it affected every page, not just mine). (2) several widths were simply too narrow for what the column prints: a value of N characters needs about N + 3 ch, and for a column that can be absent the widest thing is '- unavailable', not the value. Both pages' widths are now measured off a capture. (3) the logs page polled the slice's own default head (codex) on mount, which 404s, and then rendered that error over a capture fixture; the page now names its head on mount and a fixture is not blanked by a failed live read.
# [2026-09-18] 2026-09-18 NOTE (shared pending rule): entities/perf no longer declares PendingRoute or the pending rule - it imports them from @shared/api (CONTRACTS.md 8) and keeps a ONE-ARGUMENT binding exported from the slice, because webui/tests/entities-turns.test.ts (M2-D1, outside this row's fence) calls pendingOf(err) with one argument. The rule itself has one implementation; only the row name is local. The M2-D3 test still passes.
# [2026-09-18] 2026-09-18 NOTE (what the turns page says today, and why): in flight reads /api/heads gate snapshots and cocks a turn past its head's own stream_idle_ms (printed as 'stalled' versus 'running'); summary reads /api/perf/summary and renders today; landed reads /api/perf/turns and renders the honest empty naming V4-127. An empty summary window carries 'no turns in window' on its grey edge and prints '-' with basis unavailable for every percentile, never a zero. A row whose async_io_drops is above zero prints 'telemetry dropped' in its own column rather than smaller numbers.
# [2026-09-18] 2026-09-18 NOTE (view -> selection, and one flat list): all four views (table, timeline, by model, by outcome) are ONE virtualized list of items, each either a row or a band naming what follows, so a grouped or bucketed view cannot be the one page that renders every strip it holds. A group or bucket with no rows contributes no band (an empty band would read as 'this hour has turns, they are just not listed'); the idle-bucket count is printed as a Figure in the header instead. The strips are exported components because a virtualized list renders nothing without a viewport, which is also why the page's tests are on the pure projections and the strips, not on the rack.
# [2026-09-18] 2026-09-18 NOTE (the request drawer, and where it lives): the drawer is one component in widgets/waterfall, exported from that widget and used by BOTH pages - the fence gives exactly two widget directories and the drawer belongs to a turn's detail (the waterfall is the rest of that detail). It prints one of three things and never an empty frame: the pending empty naming V4-133, the literal sentence 'capture off for this head' when capture is off (the default for every head), or the bodies behind a Reveal. Reading the capture route for a LOG LINE has no turn id to ask about: a line names its head and its outcome, not a turn, and the address scheme that would link the two is an open decision builders must not invent (surface brief section 7), so the logs page asks about its own head.
# [2026-09-18] 2026-09-18 NOTE (coverage): pages/turns/coverage.ts and pages/logs/coverage.ts split the baseline's M2-03 group - /api/perf, /api/perf/summary, /api/perf/turns (pending V4-127) on turns, /api/logs/{head} on logs. /api/logs/{head} was briefly declared in BOTH (the wall reported it twice); it lives on the logs page only. /api/heads and /api/heads/{head}/capture are read by these pages but deliberately NOT declared here: each name has exactly one owner everywhere and those belong to the fleet page and the MCP and Doctor row.
# [2026-09-18] 2026-09-18 TEST: webui/tests/turns.test.ts, 23 tests: the waterfall's phase rows and their geometry (a phase the row does not carry has no row at all), the in-flight derivation and its cocked threshold, the filter model (tags, levels, substrings, and an unmarked line reporting no level rather than 'info'), the telemetry-dropped sentence, the view->item projection for all four views, and the pending empties naming V4-127 and V4-133 plus the capture-off sentence.
