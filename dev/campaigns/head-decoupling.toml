# [2026-08-17] [2026-08-17] ORACLE FIX (checks/concentration.py only; zero Kotlin, git diff -- '*.kt' empty). The ResponsesRequestBuilder landing note's 'risks identified: None' was wrong and is corrected here. CONFIRMED the review finding by re-running one script version over both trees (git archive of 647ed02^ into a scratch dir + the same concentration.py): the split lowered its own ratio partly by lowering everyone else's denominator. core/wire/AnthropicRequest.kt 1.97 -> 5.57 (neighbours 9 -> 17, neighbour_median_C 140.0 -> 49.5, moderate -> HIGH) and dialect/responses/Harvested.kt 2.99 -> 3.13 (moderate -> HIGH) with not one line of either file changed; tree-wide HIGH 37 -> 38, files over the 1.8 gate 60 -> 59, and 71 untouched files drifted. ROOT CAUSE, in the metric not the Kotlin: the denominator took a median over neighbour FILES, so a package votes once per file it contains — decomposing one importer into twelve siblings multiplies that package's vote twelvefold and drags the median down, and the global-median floor moved the same way (57.5 -> 55.0) because the tree gained 12 files. A splitting campaign whose oracle is dilutable by splitting corrupts its own measurements with every landing. FIX: one vote per PACKAGE. neighbour_median_C is now the median over neighbouring packages of each package's median C, and the global median (floor + the 'must clear the median to leave band low' gate) is taken over package medians instead of file C. Nothing else changed — C, the bands, the neighbour DEFINITION (packages imported plus packages importing mine) and the CLI are untouched. INVARIANCE PROVEN, not asserted: with the fixed script run over 647ed02^ and HEAD, exactly ONE file common to both commits moves — ResponsesRequestBuilder.kt itself, 6.78 HIGH -> 0.64 low. Every other file reads identically before and after, AnthropicRequest.kt and Harvested.kt included. RECALIBRATION, stated because it is real: removing the file-count vote lowers ratios tree-wide, HIGH 37 -> 24 at 647ed02^ and 23 at HEAD, over-1.8 60 -> 43. Of the 12 HD-24 targets 10 still read HIGH (TurnDriver 9.15, Daemon 7.93, ControlServer 6.93, ResponsesStreamTranslator 6.61, ChatStreamTranslator 6.08, HeadServer 5.91, PassthroughRequestBuilder 5.24, SseEmitter 4.05, UsageHud 3.36), the two landed ones read low (WsUpstream 0.54, ResponsesRequestBuilder 0.64), and ChatRequestBuilder drops HIGH -> moderate at 2.82 — it stays on the target list, since the item names it explicitly and the gate is 1.8, not the HIGH band. REPORTED, NOT FIXED (both pre-existing, neither introduced or masked by this change): (1) AnthropicRequest.kt reads 3.34 HIGH under the corrected metric at BOTH commits — a 133-line pure DTO file, 19 domain types, zero splice imports, so its only neighbours are its consumers. It is no longer a regression but it is still a decomposition target a '--top N' list would dispatch, and the honest reading is that C charges a domain-type module 11 points per declared type (3 export + 8 concern) while the docstring's old calibration sentence ('scores 2.0, the right shape') was true only because its consumers happened to be the fat request builders this campaign is decomposing. Whether C should score a DTO hub at all is a calibration decision about C and belongs to the orchestrator, not to a fix commit; the docstring now says so instead of claiming 2.0. (2) 'concentration.py --file ResponsesRequestBuilder' — the exact string in this item's verify note and in the review brief — exits 2 'no such production file' on the ORIGINAL script too: the --file matcher is r['file'].endswith(arg), which needs the '.kt'. Verified against 647ed02's own copy of the script run over this tree. Left alone as out of scope; use --file ResponsesRequestBuilder.kt. GATES on the fixed script: --file ResponsesRequestBuilder.kt = 0.64, band low, under 1.8. gateway ./gradlew check --rerun-tasks BUILD SUCCESSFUL, 162/162 tasks executed, 1107 tests / 0 failures / 0 errors across 14 module