<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splice · Settings</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/splice-app-256.png">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="deck-settings.css">
</head>
<body class="no-rail-l no-rail-r no-comp">
<main class="field" id="field">
  <section class="centre" aria-label="Settings">
  <div class="mc" id="mc">
    <header class="mc-head">
      <div>
        <div class="eyebrow" id="mcEyebrow"></div>
        <h1>Settings</h1>
      </div>
      <div class="status"><span class="lamp live mc-live"></span><span id="mcRunning"></span><span class="faint">·</span><span id="mcClock"></span></div>
    </header>

    <div class="mc-flow" id="flow">
      <svg class="wires" id="wires" aria-hidden="true"></svg>
      <button class="pt pt-cc press" data-part="cc" type="button"></button>
      <div class="pt-gates" id="gates"></div>
      <button class="pt pt-watch press" data-part="watch" type="button"></button>
      <button class="pt pt-back press" data-part="reasoning" type="button"></button>
    </div>

    <div class="mc-sys" id="sys">
      <button class="pt pt-sys press" data-part="limits" type="button"></button>
      <button class="pt pt-sys press" data-part="mcp" type="button"></button>
      <button class="pt pt-sys press" data-part="modes" type="button"></button>
      <button class="pt pt-sys press" data-part="desktop" type="button"></button>
      <button class="pt pt-sys press" data-part="storage" type="button"></button>
      <button class="pt pt-sys press" data-part="projects" type="button"></button>
      <button class="pt pt-sys press" data-part="splice" type="button"></button>
      <button class="pt pt-sys press" data-part="internals" type="button"></button>
    </div>
  </div>
  </section>
</main>
<script src="api.js"></script>
<script src="deck-lens.js"></script>
<script src="deck.js"></script>
<script src="deck-common.js"></script>
<script src="pilot.js"></script>
<script src="deck-settings-model.js"></script>
<script src="deck-desktop-policy.js"></script>
<script src="deck-settings.js"></script>
</body>
</html>
