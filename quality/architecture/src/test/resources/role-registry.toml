eletes history by whether a line happens to be a retired key. CredentialMatch (added 2026-10-26, PR #247 review round 4, ProcessEnvironment.CredentialMatch) is handed the VALUE of a running process's environment variable, a credential kept nowhere, and answers whether it is the one its caller looks for: `splice sessions relaunch` asks it whether a session's ANTHROPIC_AUTH_TOKEN is one of splice's keys and relaunches the session when it is. Wiring Retired in its place compiles and relaunches only sessions holding a retired key, stranding those that hold a current one; wiring CredentialPresenceProbe or DirectoryProbe reads the credential as a head or a path, so sessions are relaunched by accident or never. SessionHeadPooled (2026-10-27) asks whether the named head has a credential pool whose short client recheck already notices a newly joined login. Session wake uses it to leave that retry path alone while waking a single-login client from its longer sleep. CredentialPresenceProbe asks whether any credential exists and would wrongly suppress a single-login wake; a session-idleness, URL or filesystem predicate cannot answer this head-pool policy."""

