title = "The auth probe reports healthy for a latched credential and for any serve-stale state || PROBLEM: `probeOnce()` defines health as `credentials() != null`. For all three OAuth providers, `credentials()` returns the current token when a refresh fails but the token has not hard-expired (`refreshed ?: (if (clock() < expiresAt) current else null)`), and `doRefresh()` short-circuits to `Rejected(invalid_grant)` without any network call once the `InvalidGrantLatch` is armed. So a credential whose refresh token is **confirmed dead** — the one state the daemon knows with certainty and already surfaces as `refresh_latched` in `describe()` — reports healthy to the probe, logs nothing, and transitions nothing. Same for … || SPLICE TODAY: `gateway/app/src/main/kotlin/splice/app/AuthProbeLoop.kt:70-71` — `var ok = auth.credentials() != null; if (!ok) ok = auth.refresh() != null`. Serve-stale: `GrokAuthProvider.kt:117` `refreshed ?: (if (clock() < expiresAt) current else null)`, identical at `CodexAuthProvider.kt:97` and `KimiAuthProvider.kt:93`. Latch short-circuit: `GrokAuthProvider.kt:170` `if (invalidGrantLatch.isLatched(mtime)) return RefreshOutcome.Rejected(INVALID_GRANT_REASON)` — the same state already rendered as `refresh_latched` at `:299`. || PROPOSAL: Stop inferring health from a nullable token. Add `suspend fun health(): AuthHealth` to `RefreshableAuthProvider` (default impl derives today's behaviour so non-OAuth providers are unaffected), returning a small sealed value: `Healthy(expiresInMs)` | `Stale(expiresInMs, lastRefreshFailure)` | `Dead(reason)` — where `Dead` is exactly the latched / NoRefreshToken / NoCredentialsFile set the providers already compute. `AuthProbeLoop` switches on that instead of `!= null`, so a latch flips healthy→unhealthy on the first tick after arming and a serve-stale run logs a distinct STALE transition. This is the precondition for SH-08 (surfacing) and SH-09 (doctor). || EFFORT/RISK: M. **Risk** Low-medium: a new SPI method tou