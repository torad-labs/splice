name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The existing required context joins exact-candidate receipts, not advisory coverage or Docker.
  gate:
    needs: [plan, workers, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every selected worker and macOS
        env:
          PLAN: ${{ needs.plan.result }}
          WORKERS: ${{ needs.workers.result }}
          MACOS: ${{ needs.macos.result }}
        run: test "$PLAN" = success && test "$WORKERS" = success && test "$MACOS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PR collection verifies receipts with Bun only. Main also runs Gradle discovery.
      - uses: ./.github/actions/ci-setup
        if: github.event_name == 'push'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'pull_request'
        with:
          bun-version: 1.4.2
      - name: Install collector dependencies
        if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ci-receipt-${{ github.run_attempt }}-*
          path: .ci/receipts
      - name: Reconcile every obligation and test result
        run: bun tools/gate ci collect .ci/receipts
      - name: Retain verified main products
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splice-jar
          path: |
            app/build/libs/app-all.jar
            app/src/main/dist/bin/splice-launch
            integrations/mcp-hub/build/bin/linuxX64/holderReleaseExecutable/splice-mcp-holder.kexe
            integrations/mcp-hub/build/bin/linuxX64/frontReleaseExecutable/splice-mcp-front.kexe
          retention-days: 14
          if-no-files-found: error

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR checkout is GitHub's tested merge plus its two exact parent commits.
          fetch-depth: 2
      - uses: ./.github/actions/ci-setup
      - name: Derive selected tasks and execution ownership
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            bun tools/gate ci plan-pr "$PR_HEAD_SHA"
          else
            bun tools/gate ci plan
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: |
            .ci/plan.json
            .ci/empty/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  workers:
    name: verify (${{ matrix.worker }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Attribution reads ancestry; retain the release rehearsal's existing checkout too.
          fetch-depth: ${{ (matrix.worker == 'source' || matrix.worker == 'rehearsal') && '0' || '1' }}
      - uses: ./.github/actions/ci-setup
        with:
          browser: ${{ matrix.worker == 'browser' || matrix.worker == 'rehearsal' }}
          cache-write: ${{ github.ref == 'refs/heads/main' && matrix.worker == 'source' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.worker == 'native' || matrix.worker == 'rehearsal'
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .ci
      - name: Check the adapter against a real isolated Gradle fixture
        if: matrix.worker == 'tooling'
        env:
          SPLICE_CI_ADAPTER_TEST: '1'
        run: bun test tools/gate/test/ci-adapter.test.ts
      - name: Run owned verification
        env:
          WORKER: ${{ matrix.worker }}
        run: bun tools/gate ci worker "$WORKER"
      - name: Keep candidate-bound receipts even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-receipt-${{ github.run_attempt }}-${{ matrix.worker }}
          path: .ci/out/${{ matrix.worker }}/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Keep diagnostic timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-timings-${{ github.run_attempt }}-${{ matrix.worker }}
          # A load test that is about to fail writes a dump of every thread beside its report (*-threads.json).
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
            **/build/reports/tests/*-threads.json
          retention-days: 3
          if-no-files-found: ignore

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      # Gradle's caches (dependencies, build cache, wrapper): a pull request reads them and a push to main writes them, so a
      # fork or branch run can never poison what main serves. The configuration cache is on in gradle.properties.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: install workspaces
        run: bun install --frozen-lockfile
      - name: verify stock Bash
        run: /bin/bash -c 'test "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2'
      - name: portable process and hook tests
        run: |
          ./gradlew :core:test --tests splice.core.process.LaunchOwnersTest
          ./gradlew :features-sessions:test --tests splice.sessions.registry.ProcessEnvironmentTest
          ./gradlew :integrations-claude-code:test --tests splice.client.login.PortablePendingLoginTest --tests splice.client.login.PortablePendingScriptTest
          ./gradlew :app:test --tests splice.app.cli.CommandParserTest
      - name: build packaged daemon
        run: ./gradlew :app:shadowJar
      - name: launcher ownership across exec
        run: bun test tools/e2e/test/launch-owner.test.ts
      - name: packaged daemon conformance
        run: |
          mkdir -p test-results
          bun tools/e2e conformance --artifact app/build/libs/app-all.jar --json test-results/macos-conformance.json
      # The installer as a person runs it on a Mac: install.sh alone, an empty home, and nothing on PATH but the system's
      # folders, where /usr/bin/java is the stub that asks to install Java. It takes a Java 21 the Mac has, or downloads
      # Temurin's, and splice runs on it.
      - name: installer on a Mac with no Java on PATH
        run: |
          work="$(mktemp -d)"
          mkdir "$work/home"
          cp install.sh "$work/install.sh"
          env -i HOME="$work/home" PATH=/usr/bin:/bin:/usr/sbin:/sbin TMPDIR="$RUNNER_TEMP" \
            SPLICE_JAR="$PWD/app/build/libs/app-all.jar" SPLICE_SHIM="$PWD/app/src/main/dist/bin/splice-launch" \
            /bin/bash "$work/install.sh"
          ls -la "$work/home/.local/share/splice/java"
          env -i HOME="$work/home" PATH=/usr/bin:/bin "$work/home/.local/bin/splice" version
      - name: keep macOS proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-proof
          path: |
            **/build/test-results/**/*.xml
            test-results/macos-conformance.json
          retention-days: 14
          if-no-files-found: warn

  walls-annotate:
    # Annotation-only surface for ast-grep wall violations.
    # The gate job (`npm run gate` = `bun tools/gate run`) remains the SOLE pass/fail authority
    # (same checker run twice deliberately). The `|| true` is deliberate:
    # this job exists only to surface violations as PR diff annotations, not
    # to block merges. GitHub caps annotations at roughly 10 error + 10 warning
    # per step, so large violation sets truncate to the log.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: install workspaces
        run: bun install --frozen-lockfile
      - name: annotate wall violations
        run: ./node_modules/.bin/ast-grep scan --format github || true

  wrapper-validation:
    # Validates the Gradle wrapper checksum on every pull request.
    # This catches a tampered gradle-wrapper.jar arriving via fork PR before
    # any build step executes it. The action discovers wrapper files recursively,
    # so no path inputs are required (repo has gradlew + wrapper jar at the root).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
