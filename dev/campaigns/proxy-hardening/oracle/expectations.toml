# ── FIELD-LEVEL divergences the gateway makes ON PURPOSE ─────────────────────
# A [[divergence]] is a sanctioned difference that cuts ACROSS scenarios rather than living in one,
# so it cannot be a [[scenario]] row without corrupting the roster. Same law as a sanctioned
# scenario, and cx_19_oracle_replay.py applies it through the SAME checker (_grade_status): cite
# what authorised it, pin the expected bytes, never delete a row to make a runner green.
# (Design + prompt_cache_key row rescued from the 2026-07-30 review repair — branch
# stash-archive/cx19-round2-repair-2026-07-30 — and re-validated against today's tree.)

[[divergence]]
field = "expected_upstream_requests[].stream_options"
status = "sanctioned"
authority = "PR #57/#58 (789b2ce/561d7ec): turn-scoped summary dedup — sequential-cutoff summary delivery; wall exception bdf6bc0"
pinned_value = '{"reasoning_summary_delivery":"sequential_cutoff"}'
pinned_sha256 = "695bd96a217d1af7e8af90d19e93b9efa7d1fc933eff3fdbbc694ee2598e737e"
affects = "every request the responses dialect sends — the field did not exist at capture time (captured 2026-07-26, feature merged 2026-07-27)"
reason = """
The legacy reference re-requested reasoning summaries on every continuation round, duplicating
them; the gateway's turn-scoped dedup requires the upstream to deliver summaries with a
sequential cutoff, expressed as stream_options.reasoning_summary_delivery on EVERY request.
The oracle predates the feature by one day, so the frozen upstream bytes lack the field. A
replay observation of exactly the pinned value is sanctioned; any OTHER value or shape is a
regression and must go kotlin-wrong.
"""

[[divergence]]
field = "expected_upstream_requests[].prompt_cache_key"
status = "sanctioned"
authority = "cache-key strategy quirk: ResponsesRequestBuilder.kt:141 CacheKeyStrategy.SESSION_ID (TOML cache_key = \"session-id\", shipped for grok at config/splice.example.toml:94); review repair 2026-07-30"
pinned_sha256 = "ab79a7c5bb0a3cec72e01e4e19b47fac"
affects = "all 11 frozen fixtures — every one pins splice-ab79a7c5bb0a3cec72e01e4e19b47fac (the first-message-hash fallback)"
expected_with_session_header = "claudex:<x-claude-code-session-id>"
expected_without_session_header = "splice-ab79a7c5bb0a3cec72e01e4e19b47fac"
reason = """
The legacy Node reference derives prompt_cache_key from the FIRST USER MESSAGE
(server/src/codex/translate-request.mjs docstring: "Claude Code exposes no thread id, so we key
on the FIRST user message") — a premise the gateway can improve on: the x-claude-code-session-id
header is in hand for every head, and a content-derived key is orphaned by any transcript-head
rewrite (/compact, resume-from-summary), precisely when the cached prefix is largest. The gateway
ships the session-id strategy as a TOML quirk; the codex head TODAY still selects
"first-message-hash" (config/splice.example.toml:29), so this divergence is LATENT.
"""
note = """
READ THIS BEFORE CLASSIFYING A REPLAY: the fixtures record client_request as a BODY ONLY — no
request headers. replay.mjs deliberately sends no x-claude-code-session-id, so a faithful gateway
hits the first-message-hash fallback and reproduces the frozen bytes EXACTLY
(sha256("Say the answer.")[:32] = ab79a7c5bb0a3cec72e01e4e19b47fac) — these rows do NOT go red on
their own. The divergence only materialises if a runner supplies the header while the codex TOML
selects the session-id strategy, and THAT is the reading it must take then: sanctioned, not
kotlin-wrong.
"""
