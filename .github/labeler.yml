# Path → label map for actions/labeler@v6 (pr-labeler.yml).
# Labels must already exist in the repo; the action does not create them.
gateway:
  - changed-files:
      # LAYOUT-01: :integrations-claude-code is part of the Kotlin gateway even though its module
      # home is outside gateway/. The label stays a repository label while its path moves.
      - any-glob-to-any-file:
          - 'integrations/claude-code/**'
          - 'core/**'
          - 'integrations/upstream/**'
          - 'integrations/dialects/**'
          - 'integrations/providers/**'
          - 'integrations/mcp/**'
          - 'features/**'
          - 'daemon/**'
          - 'app/**'
          - 'quality/architecture/**'
          - 'quality/compiler-plugin/**'

console:
  - changed-files:
      - any-glob-to-any-file: 'console/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'tools/**'
          - 'quality/**'

release:
  - changed-files:
      - any-glob-to-any-file:
          - 'install.sh'
          - 'app/src/main/dist/**'
          - 'tools/release/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'bun.lock'
          - 'gradle/**'
