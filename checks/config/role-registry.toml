reason = """Both are wizard steps taking a name and reporting success, and they differ in what they touch. HeadSignIn "signs ONE head in, answering whether it ended up authenticated" and is described in its own KDoc as the heaviest seam in the wizard: production opens a browser, binds a loopback port, and blocks until the vendor redirects back. ProfileAdd is "one `splice add profile --yes` call; production is AddCommand with a no-op restart", which ends in an atomic write to splice.toml. A swap either asks for a sign-in against a profile that does not exist yet, or appends a head for a key the operator only meant to authenticate."""

