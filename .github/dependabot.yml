version: 2
# Patch+minor updates arrive as ONE grouped PR per ecosystem per week (majors stay
# individual PRs and are excluded from auto-merge by dependabot-automerge.yml).
# cooldown applies to VERSION updates only — security updates still open immediately.
# 7 days clears zizmor's dependabot-cooldown floor and covers the window in which a
# compromised package is usually yanked; majors get 30 since they already wait for a
# human per dependabot-automerge.yml. github-actions gets default-days only — Dependabot's
# validator rejects semver-*-days for that ecosystem (PR #52 check failure 2026-07-26).
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # plugin-react majors need a coherent webui tree first (phantom root vite 6 +
      # ts7/typescript-eslint peer conflict, frozen by bun.lock) — see issue #43. Unignore
      # after the lockfile regeneration lands.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # typescript 7 is the native compiler and exports no JS compiler API (its root export is the version
      # alone): tools/gate's no-python leg (tools/gate/src/lib/no-python-sources.ts) parses sources with
      # ts.createSourceFile from typescript 5, while tsc runs from @typescript/native, which already IS
      # typescript 7. Lift this when that leg moves to the native API (PR #431 closed, 2026-11-02).
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      bun-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # Dependabot does not bump the Kotlin compiler/toolchain: a Kotlin release that CodeQL's Kotlin extractor does
      # not read yet fails CodeQL (KotlinVersionTooRecentError, see #18/#37), a required check, and Kotlin releases
      # run ahead of it. Kotlin is bumped by hand, after reading the versions the pinned CodeQL bundle lists
      # (github/codeql java/kotlin-extractor/versions.bzl): 2.3.21 to 2.4.21 on 2026-11-13, when 2.27.3 listed 2.4.20.
      # The gate's scope guard (tools/gate/src/lib/dependabot.ts) requires these two lines.
      # The block is group-scoped to the Kotlin compiler/toolchain only; org.jetbrains.kotlinx.* is
      # intentionally released into gradle-minor-patch.
      - dependency-name: "org.jetbrains.kotlin:*"   # group:artifact form: kotlin-stdlib, kotlin-compiler-embeddable (CodeQL Kotlin block, #18/#37)
      - dependency-name: "org.jetbrains.kotlin.*"   # plugin-id + marker forms: org.jetbrains.kotlin.jvm, .plugin.serialization, and any future org.jetbrains.kotlin.* plugin (e.g. .plugin.compose)
      # protobuf-java stays on its ABI-compatible 3.x line beside the current gRPC (gradle/libs.versions.toml,
      # "protobuf stays on its ABI-compatible 3.x line"); 4.x changes the runtime ABI that code mode's
      # DynamicMessage/Descriptors callers bind to (PR #433 closed, 2026-11-02).
      - dependency-name: "com.google.protobuf:protobuf-java"
        update-types: ["version-update:semver-major"]
      # kotlinx-serialization 1.12.0 is held in the catalog (its JVM parser caps nesting at 400) and cannot be
      # ignored here: the gate's Dependabot scope guard forbids any glob that matches a kotlinx name.
    groups:
      gradle-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
