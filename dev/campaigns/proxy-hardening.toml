title = "No update path or update awareness || PROBLEM: There is no `splice update` verb and nothing ever tells an operator that a newer release exists. Upgrading means remembering that install.sh is the mechanism and re-fetching it by hand. For a tool whose whole failure story is 'a Claude Code update can break splice at any time' (the README's own words), the operator most in need of an upgrade is the one whose install just broke — and the broken install is silent about the fix having already shipped. The version machinery to build this on already exists and is exercised: `GATEWAY_VERSION`, `SHIM_VERSION`, the `/health` handshake, and the shim's automatic … || SPLICE TODAY: `gateway/app/src/main/kotlin/splice/app/cli/Command.kt:44-55` — the verb table has no update/upgrade. Versions exist at `gateway/core/src/main/kotlin/splice/core/Versions.kt:6,11` and are already compared across three surfaces (`bin/splice-launch:105` daemon handshake, `:152` shim marker, `DoctorCommand.kt:128-139` CLI-vs-daemon). `install.sh:300-357` already implements staged atomic replacement with a `restore_previous_artifacts` rollback. || PROPOSAL: Two separable pieces, in order. **(a) `splice update`**: fetch and verify the release exactly as install.sh does — reusing its sha256 + Sigstore attestation gates — then `splice restart`. **Note the correction**: the existing `splice install` verb (`InstallCommand.kt:35-38`) only re-links wrappers and the shim from an already-present jar and hard-checks `launch shim not found at $launchShim (run install.sh)`, so there is **no in-CLI fetch/verify path today** — this is genuinely new code and must reuse install.sh's gates rather than reinvent them. **(b)** An opt-in, **default-OFF** `updateCheck` knob: when enabled, **doctor and only doctor** (never the daemon, never the shim's hot path) queries the releases endpoint at most once per day, caches the answer under the state dir, and prints an INFO row when a … || EFFORT/RISK: M. **Risk** Any background network call from a loopback-only tool is a posture change (it does not violate the loopback lock, which is about inbound exposure, b || VERIFY-SPEC: New `gateway/app/src/test/kotlin/UpdateCommandTest.kt` with a fake installer script on PATH asserting the invoke-then-restart ordering and a non-zero exit when the installer fails. For (b): assert the check is skipped entirely when the knob is off (no socket opened), and that a cached answer is reused within the day. `checks/release/accept.sh` gains a post-update version assertion. Gate: `npm run gate`. --- ## 8. Improvements — correctness || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### JW-22'"
