[[row]]
id = 'muse-tool-load'
title = 'A tool ToolSearch loads costs a Muse session only what it adds'
feature = 'muse-tool-cache'
status = 'done'
owner = ''
blocked_by = []
guard = false
spec = "On a Muse head, the request that carries a tool Claude Code's ToolSearch loaded (a tool_reference in the search's result, the tool's definition declared defer_loading) reads everything the conversation had already sent from Meta's prompt cache, and so does every request after it. The tool list of the conversation's first request goes to Meta unchanged, in order and in bytes, on every request. From its first request, every Muse conversation's list holds one tool of the head's own, the caller, which takes a tool's name (a string) and its arguments (an object), both required and nothing else, under a name no Claude Code tool has. The loaded tool is written into the history at the place it was loaded: its name, description and schema as text, with the words that say it is called through the caller, in bytes that are the same on every later request whatever Claude Code's cache_control mark does. The model calls it through the caller, and the head hands that call to Claude Code as a call of the loaded tool, under its own name, with its arguments; Claude Code never sees the caller. When Claude Code sends that call back in the history it goes to Meta the way the model made it, the same bytes every time. That holds for one tool or several loaded by one search, for a second load later in the conversation, for a subagent's conversation, for the request that compacts the conversation, and after a daemon restart. A tool declared defer_loading that no result references stays out of the request. Round 1 showed on the real head that Meta returns the calls of a tool handed over as its tool-search pair with no arguments, and that the caller works (docs/specs/muse-tool-cache.md, What Meta does); round 1's uncommitted work is in the tree with the pair turned off, and what of it stays is the builder's call. The real head is the last word: the builder shows the finished build on it the way the spec's section Showing it on the real head says (a load, a call, its result, a second call; every request 200, the cached counts within one 128-token block of the request before, both calls reaching the client under the tool's own name with arguments that fit), and the feature review does the same in a real Claude Code session. A 401 or a 403 from Meta stops that run and goes to the lead. See docs/specs/muse-tool-cache.md, decisions 1 to 4 and 7 to 9."
