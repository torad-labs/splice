spec = '''
`splice add provider <file|url>` installs a team's published provider definition with no hand-edited TOML (issue #680, outcome 3), as `splice add api-key` installs a key provider today.

A definition (decided here) is a TOML file in splice.toml's own grammar holding one [providers.<key>] table with its [[providers.<key>.models]], the [heads.*] whose provider is that key, and any [door.commands.*] whose head is one of those heads; nothing else. A head may leave out `port` and `discovery_prefix`: splice fills the port as `splice add` does (AddPortChoice) and the prefix as `claude-<head>--`.

After this item:
- `splice add provider <file>` and `splice add provider <url>` read the definition, check it, merge it into splice.toml with TopologyWriter (comments and order of the rest kept), reload the daemon the way `splice add` does today, and print what was added: the provider, its heads and their commands, its models, its door commands, and what to do next (`splice login <head>` when its auth is a command). The installed model is in the next session's /model with no restart.
- Over the network: https from any host; http only from this machine (127.0.0.1, ::1, localhost); anything else is refused naming https. 15 seconds and 1 MiB at most.
- Findings: the definition is checked as boot checks splice.toml, by running the same ConfigFindings (structure, decode, TopologyFindings) over splice.toml with the definition merged in, plus the definition's own: a table other than the provider, its models, its heads and its door commands (e.g. [daemon]) is a finding naming it (`daemon: a provider definition holds only ...`). Every finding is listed at once, each with its dotted path, like boot; the command exits non-zero and splice.toml is left byte for byte as it was.
- An empty base_url is a finding at boot as well (providers.<key>.base_url), if it is not one already.
- `--check` runs the same reading and checking, prints the findings or that the definition is good, writes nothing, and exits non-zero on findings.
- Installing a definition whose provider key is already installed replaces it: the provider table, its models, its heads (a head of the same key keeps its port and prefix) and its door commands are replaced; its heads and door commands the new definition no longer names are removed. Another provider's tables are never touched.

Where: features/configuration/.../add/ (beside AddProfiles / AddPrepare / AddPortChoice), app/.../cli/CommandParser.kt (the `add` verb's `provider` word), core/.../topology/TopologyWriter.kt only through its public use. No new top-level functions or companion objects.

Proven by: bun test ./.campaign/checks/custom/install.test.ts — on a machine with only splice, --check on a good file writes nothing; installing it fills the head's port, puts claude-acme--glm-5.3-flash in /model and runs a turn; a definition from a loopback URL is installed; a newer acme replaces the old, keeping the port, and its new label shows; a definition with four mistakes (a [daemon] table, an empty base_url, a head on an undeclared provider, a door command on no head) is refused with all four named and splice.toml unchanged, with and without --check; plain http from another host is refused naming https.'''
checks = [
