# [2026-08-17] REVIEW FIX on the ChatRequestBuilder landing (06002e6). CONFIRMED the finding before changing anything, by running ONE script version (they are identical at 06002e6~1 and HEAD) over both trees via git archive into a scratch dir: the split moved 47 files nobody edited, not 4. splice.dialect.chat went from files [20.5, 180.0, 216.5] to [17.0, 19.5, 20.5, 28.0, 44.5, 47.0, 105.0, 216.5], package median C 180.0 -> 36.25, and with C byte-identical and zero lines edited core/wire/AnthropicRequest.kt read 3.34 -> 6.19 (neighbour median 82.4 -> 44.5, C unchanged 275.5), app/Daemon.kt 7.93 -> 8.95 (C 605.5), spi/UpstreamClient.kt 4.98 -> 5.20 (C 331.5), app/cli/Command.kt 1.95 -> 2.00 crossing low -> moderate. The 06002e6 landing note's 'ratio 2.82 -> 0.70' was true and its 'None identified' was wrong; this note corrects the record. Exactly ONE file crossed the 1.8 gate and it was ChatRequestBuilder.kt itself (2.82 -> 0.70), so the false-green half of the failure is latent here, not realised. ROOT CAUSE: one-vote-per-package (3de3fb8) removed the vote-COUNT multiplication, which is all its invariance proof ever covered; a package still votes with the MEDIAN C of its own files, so redistributing that package's content across more files moves its single vote. The 3de3fb8 note's 'INVARIANCE PROVEN' held only because splice.dialect.responses already had 53 files and its median did not move; splice.dialect.chat had 3. WHAT I DID NOT DO, and why it is the orchestrator's call: the only partition-free denominator is the neighbouring package's AGGREGATE C, and I measured it rather than asserting it. It IS invariant (worst untouched drift 0.08 across both the chat and responses landings, zero band flips, zero gate crossings) but adopting it re-scopes HD-24: raw it gives over-1.8 40 -> 4 and HIGH 22 -> 0, and at every rescaling constant tried (K=2.0..4.0) it flips the 1.8 verdict of 19-29 untouched files, reading 8 of the 12 named targets (ChatStreamTranslator 0.99, UsageHud 0.99, PassthroughRequestBuilder 0.98, SseEmitter 1.24, AnthropicRequest 0.90 ...) as decomposed without a line being touched. That is the same false-green class the finding condemns, delivered wholesale, so a fix commit must not ship it silently; it is a band-calibration decision that changes the campaign LAW's 1.8/3.0 numbers and belongs to the orchestrator. Recorded here so it is a decision on the table, not a rediscovery. WHAT I DID (checks/concentration.py only; git diff -- '*.kt' EMPTY, zero Kotlin, zero test edits): (1) the docstring no longer claims 'Package votes make the oracle invariant to how a neighbour is split' — it now states exactly what the package vote buys, carries the 06002e6 counter-example with its numbers, records the measured aggregate-denominator option and why it was not taken, and the stale 'AnthropicRequest reads 3.34' sentence is corrected to 6.19 with the 3.34 -> 6.19 step attributed to neighbourhood drift. (2) NEW --since <ref>: reports every file whose ratio moved between a git ref and the working tree and labels the cause 'own' (its own C changed) or 'neighbourhood' (C identical, only the denominator moved), with a stderr WARNING when an untouched file crosses --max-ratio on drift alone. This is the expected-delta instrument the campaign was missing: it makes both halves of the failure mechanical instead of silent — a builder can no longer misattribute a neighbour-driven gap to a file's own density, and a landing can no longer be recorded as having decomposed a file it never opened. RED-GREEN PROVEN, not asserted: 'concentration.py --since 06002e6~1' prints 48 moved | own 1 | neighbourhood 47 with the four named files labelled neighbourhood, and '--since 06002e6~1 --max-ratio 4.0' fires the stderr WARNING on AnthropicRequest.kt '3.34 -> 6.19 C unchanged at 275.5'. BEHAVIOUR-PRESERVING ON THE ORACLE'S NUMBERS, proven by diffing the pre-change script against the post-change script over the same tree: --json byte-identical, default table byte-identical, --max-ratio 1.8 output and exit code identical, --file identical. No band, no C term, no neighbour definition, no threshold changed. GATES: concentration.py --file ChatRequestBuilder.kt = ratio 0.70 band low C 44.5, under the 1.8 gate; gateway ./gradlew check --rerun-tasks BUILD SUCCESSFUL, 162/162 tasks executed, 1107 tests / 0 failures / 0 errors / 1 skipped across 158 test classes; npm run gate GATE: PASS; PassthroughGoldenTest goldens byte-identical (git status clean under gateway/dialect-anthropic-passthrough/src/test/resources/goldens/). FLAKE OWNED, NOT ATTRIBUTED AWAY: the first ./gradlew check run exited BUILD FAILED on ':gateway:test' with java.nio.file.NoSuchFileException on build/test-results/test/binary/in-progress-results-generic.bin — Gradle result-file bookkeeping, not a test. Read before re-running: all 158 result XMLs from that run were present and totalled 1107 tests / 0 failures / 0 errors, results-generic.bin had been written (19457 bytes) and only the in-progress temp was missing; journalctl over the window shows no OOM and no reaper kill (mem available held at ~74%). The clean re-run above is the run of record. REPORTED, NOT FIXED (both pre-existing, neither introduced nor masked here): (1) 'concentration.py --file ChatRequestBuilder' still exits 2 'no such production file' because the matcher is endswith(arg) and needs the '.kt' — same defect the 3de3fb8 note already recorded for ResponsesRequestBuilder, still out of scope. (2) the table's display expression '.replace("gateway/", "")' replaces ALL occurrences, so gateway/gateway/... files print as 'src/main/kotlin/splice/wire/CollectingTerminal.kt' with the module and one path segment eaten; cosmetic, pre-existing on the main table, and --since reuses the same expression deliberately so both tables read alike. 8 of 12 HD-24 targets remain; item stays todo.
