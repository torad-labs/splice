# The proxies and the bearer-guarded management plane are loopback-only
# infrastructure. Every listen() must pass the literal '127.0.0.1' — a bare
# listen(port) binds all interfaces, and a variable host is an unauditable bind.
#
# The options-object exemption path was rewritten: a rule this shape's ancestor
# (submitted as `pattern: host: '127.0.0.1'`) does NOT parse to the object-literal
# `pair` node that `{ host: '127.0.0.1' }` actually produces — standalone, that
# text parses as a `labeled_statement` (label `host`, string statement) instead,
# so the exemption could never match and the rule flagged its own compliant
# `server.listen({ port, host: '127.0.0.1' })` sample. Fixed with `context:` +
# `selector: pair` (both quote styles), which forces the parse into an object-
# literal context so the pattern lands on the real `pair` node.
id: loopback-bind-only
language: javascript
severity: error
message: "Bind 127.0.0.1 explicitly — listen(port, '127.0.0.1', ...). No bare or variable-host binds."
note: |
  The management API is bearer-guarded but still loopback-only by design; the
  proxies serve one operator on one machine. Pass the literal host string so
  the bind is auditable at the call site: `server.listen(port, '127.0.0.1', cb)`.
files:
  - server/**/*.mjs
rule:
  any:
    - all:
        - pattern: $S.listen($P)
        - not:
            has:
              stopBy: end
              any:
                - pattern:
                    context: "({host: '127.0.0.1'})"
                    selector: pair
                - pattern:
                    context: '({host: "127.0.0.1"})'
                    selector: pair
    - pattern: $S.listen($P, $HOST)
    - pattern: $S.listen($P, $HOST, $$$REST)
constraints:
  HOST:
    not:
      any:
        - pattern: "'127.0.0.1'"
        - pattern: '"127.0.0.1"'
labels:
  HOST:
    style: primary
    message: "host must be the literal '127.0.0.1'"
