[[row]]
id = 'df-uninstall'
title = "splice uninstall puts Claude Desktop back: app mode's configuration out, standard mode's variables named"
feature = 'desktop-full'
status = 'todo'
owner = ''
blocked_by = [
  'df-app-on',
  'df-diagnostics',
]
guard = false
spec = '''
`splice uninstall` of the whole of splice (no head named, or --all) puts Claude Desktop back, as it already takes away splice's systemd units and splice's /login (InstallWiring.retireUnits, retireLogin; door-default.md decision 5). Without this, a person who uninstalls splice while Desktop is on it is left with a Desktop whose gateway and credential helper no longer run, and no word on why (outcome 1: `off` restores what was there; uninstalling is the other way out).
- App mode (splice's configuration is in Desktop's library): uninstall takes it out exactly as `splice desktop off` does (df-app-on: splice's file and _meta.json entry removed, appliedId put back as it was, or kept if the person applied another configuration meanwhile; _meta.json and the folder removed if splice made them). It needs no running daemon, since uninstall stops it: the CLI does the library work itself from splice's desktop record, with the same code `off` uses, and leaves the record saying off. It also removes the credential helper file `<state dir>/desktop-credential`. It says: "splice: took splice's configuration out of Claude Desktop; quit and reopen Claude Desktop: it opens on your claude.ai login again."
- Standard mode (the door is on through Desktop's environment store, which splice can't write): it says "splice: Claude Desktop's Code tab still has splice's variables; remove them in Claude Desktop → Settings → Claude Code → Environment variables:" and then each name of DesktopEnvironment.names on its own line, indented two spaces, the same names `splice desktop off` names.
- Off: it says nothing about Desktop.
- Uninstalling one head's command leaves Desktop as it is, in every mode, like retireUnits and retireLogin.
- A library splice can't read or write is named in one line ("splice: left Claude Desktop's configuration as it is: <path>: <why>; `splice desktop off` takes it out") and uninstall goes on with the rest; it never deletes a file that isn't splice's.
Files: app/src/main/kotlin/splice/app/InstallWiring.kt (a retireDesktop beside retireLogin), app/src/main/kotlin/splice/app/cli/Command.kt (Uninstall calls it), and the off path in app/src/main/kotlin/splice/app/desktop/DesktopSwitch.kt made callable without the daemon. Proof: `bun test ./.campaign/checks/desktop-full/uninstall.test.ts`.

Shared across desktop-full (decided once, the same in every item): one door at /desktop on the control port and one desktop key serve both of Desktop's modes. "Standard mode" is today's Code-tab door through Desktop's environment store (`splice desktop on`). "App mode" is Desktop's third-party gateway mode, the whole app on splice (`splice desktop on --app`). In JSON the mode is one of "off", "standard", "app", "other" (a third-party configuration that is not splice's). Every request Desktop sends in app mode carries the header `x-splice-desktop: app`, which splice writes into the configuration's inferenceCustomHeaders. That header is how the door tells an app-mode request from a standard one. Refusals keep the door's Anthropic error shape and the "splice desktop: " prefix. Picker rows are DesktopLineup.picker, the terminal's rows (don't fork them; the custom-provider campaign, #680, is changing labels and tiers there at the same time). Vendor facts about Desktop (paths, key names, row fields, ID filter) live in integrations/claude-code/src/main/kotlin/splice/client/desktop/, beside the other Desktop facts. Goal: docs/specs/desktop-full.md.'''
