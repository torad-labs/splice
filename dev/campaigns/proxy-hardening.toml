title = "daemon.log rotation can wedge permanently || PROBLEM: `persistentLogger` tracks `written` in memory and rotates at 64MB by moving daemon.log to daemon.log.1. If that `Files.move` throws — the file was removed by an external logrotate, the state dir went read-only, a permissions change — control falls into the `onFailure` branch, which closes and nulls the writer but leaves `written` at its ≥MAX value. Every subsequent line therefore re-enters the rotate branch, throws again **before ever reaching `Files.newBufferedWriter`**, and never writes. daemon.log stops receiving anything, forever, with no error surfaced anywhere — the stderr tee still runs, but on a nohup'd … || SPLICE TODAY: `gateway/app/src/main/kotlin/splice/app/Main.kt:121-147` — `written` seeded once from `Files.size(file)` at `:126`; the rotate branch at `:132-137` does `writer?.close(); Files.move(file, rolled, REPLACE_EXISTING); writer = null; written = 0L`; the `onFailure` at `:142-145` resets **only** `writer`, never `written`. The stderr tee at `:138` goes to `/dev/null` (`bin/splice-launch:136`, `AdminSupport.kt:125`). Repo-wide grep for `persistentLogger` returns only its definition (`:121`) and its single call site (`Main.kt:50`); there is no `MainTest`. || PROPOSAL: Stop caching the size, or reconcile it on every failure. **Preferred**: route daemon.log through the already-tested `JsonlSink` rotate primitive (or extract that primitive into a shared `RotatingWriter` in `:core`) so there is one rotate implementation with one test suite instead of two implementations and one test suite. **Minimum viable** if that refactor is too wide: in the `onFailure` branch recompute `written = Files.size(file)` (defaulting to 0 when the file is gone) so a failed rotate self-corrects on the next line, and emit one stderr line naming the rotate failure so a wedged logger is not silent. || EFFORT/RISK: S. **Risk** Low. The size recompute is one line and strictly restores forward progress. The `JsonlSink` consolidation is the better outcome but touches the daem || VERIFY-SPEC: New `MainTest` exercising `persistentLogger` against a temp dir: force a rotate failure by deleting daemon.log after `written` crosses the cap, then assert the next line **is** written (today it is not) and that the rotate-failure line was emitted; plus a case pinning rotation at `MAX_LOG_BYTES`. Gate: `npm run gate`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### SH-14'"
