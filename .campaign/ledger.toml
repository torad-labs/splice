[[row]]
id = 'df-app-on'
title = 'splice desktop on --app puts all of Desktop on splice; off puts it back'
feature = 'desktop-full'
status = 'todo'
owner = ''
blocked_by = [
  'df-models',
  'df-credential',
]
guard = false
spec = '''
`splice desktop on --app [--yes]` puts all of Claude Desktop on splice as its gateway provider (outcome 1). `splice desktop off` puts Desktop back.
Before it changes anything, `on --app` says what app mode costs, in these words: "In app mode all of Claude Desktop runs on splice: Chat and Cowork too, not only the Code tab. Your conversations are kept on this computer, not in your claude.ai account. Remote Control and Anthropic's cloud environments are not offered, and SSH sessions can't reach splice, which listens on this computer only. Quit and reopen Claude Desktop for it to take effect." On a terminal it then asks "Put Claude Desktop on splice? [y/N]". With --yes it goes on without asking. With no terminal and no --yes it exits 1 having changed nothing, and says to run it again with --yes. It refuses with nothing changed, naming what it found, in four cases: no head is in the door (as `on` does); `/etc/claude-desktop/managed-settings.json` exists (checked for existence only, never opened, since a managed configuration decides Desktop's provider over any local one); Desktop's library holds a file splice can't read; or the library can't be written.
What it writes, in Desktop's configuration library `$XDG_CONFIG_HOME/Claude-3p/configLibrary/` (`~/.config` when unset), the daemon writing as the person:
- One configuration `<uuid>.json` (a fresh lowercase UUID, kept in splice's desktop record and reused by every later `on --app`), with exactly these keys: inferenceProvider "gateway"; inferenceGatewayBaseUrl, the door's address (`http://127.0.0.1:<control port>/desktop`, loopback http, which Desktop accepts); inferenceGatewayAuthScheme "bearer"; inferenceCredentialHelper (below); inferenceCredentialHelperTtlSec 300, so a rotated key reaches Desktop within five minutes; inferenceCustomHeaders {"x-splice-desktop": "app"}; modelDiscoveryEnabled true; autoModeEnabled true; inferenceGatewayAutoModeServerChecks false, the app-mode twin of the store's CLAUDE_CODE_AUTO_MODE_SERVER=0, so Claude Code's auto-mode check runs as a model call that splice reviews on every head. No autoModeClassifierModel: Desktop 5.11492.5 does not read it (it is marked for a later release), so Claude Code's classifier call names its own model and the door routes it like any side call, on the session's head (df-claude-picks). There is no inferenceModels (df-models: discovery fills the picker) and no inferenceGatewayApiKey. No key is written anywhere in the library.
- `_meta.json`: an entry {"id": <uuid>, "name": "splice"}, added once and never duplicated, and appliedId set to it. Every other entry and file is left byte for byte. What appliedId was before (or that there was no _meta.json) is kept in splice's desktop record.
- The credential helper: an executable file splice lays at `<state dir>/desktop-credential` (mode 0700), named by its absolute path, since Desktop takes an absolute path to an executable file. It runs `splice desktop credential` (df-credential) on the same Java, jar and state folder as the splice that wrote it, all baked in as absolute paths. Desktop runs it with Desktop's own environment, which has no SPLICE_* variable. It holds no key. It is rewritten at each `on --app` and each daemon start while app mode is on, so it follows an upgrade. At that daemon start splice also rewrites its own configuration file when the door's address in it is no longer the door's address (the control port changed), and only its own file: the person then quits and reopens Desktop, which `splice desktop` says (df-diagnostics counts this rewrite as a write).
Then `on --app` opens the door, as `on` does. The record's mode is "app", and `splice desktop --json` says on true and mode "app". When it replaced someone else's applied configuration, it names it: "replaces Work Bedrock while splice is on; `splice desktop off` puts it back".
`off` in app mode removes splice's file and entry, and puts appliedId back as it was. If there was no _meta.json before, it removes _meta.json, and the configLibrary folder if splice made it and it is now empty. If the person applied another configuration in Desktop meanwhile, `off` keeps their choice. It closes the door (403 as today) and says: "Quit and reopen Claude Desktop: it opens on your claude.ai login again." Plain `on` after `on --app` does what off does to the library, then is standard mode as today. `on --app` leaves Desktop's environment store alone, since app mode doesn't read it. splice never reads or writes the managed file, the keyring or Desktop's encrypted stores.
Files: DesktopSwitch.kt, DesktopRecord.kt, DesktopService.kt (mode in state) in app/src/main/kotlin/splice/app/desktop/; DesktopRoutes.kt (`/api/desktop/on` body {"model"?, "app"?}); app/cli/desktop DoorVerbs.kt, DesktopCommand.kt, DesktopSaid.kt (flags, the question, the words); a new integrations/claude-code/.../client/desktop/DesktopAppConfig.kt (library paths, key names, _meta shape). Proof: `bun test ./.campaign/checks/desktop-full/app-on.test.ts`.

Shared across desktop-full (decided once, the same in every item): one door at /desktop on the control port and one desktop key serve both of Desktop's modes. "Standard mode" is today's Code-tab door through Desktop's environment store (`splice desktop on`). "App mode" is Desktop's third-party gateway mode, the whole app on splice (`splice desktop on --app`). In JSON the mode is one of "off", "standard", "app", "other" (a third-party configuration that is not splice's). Every request Desktop sends in app mode carries the header `x-splice-desktop: app`, which splice writes into the configuration's inferenceCustomHeaders. That header is how the door tells an app-mode request from a standard one. Refusals keep the door's Anthropic error shape and the "splice desktop: " prefix. Picker rows are DesktopLineup.picker, the terminal's rows (don't fork them; the custom-provider campaign, #680, is changing labels and tiers there at the same time). Vendor facts about Desktop (paths, key names, row fields, ID filter) live in integrations/claude-code/src/main/kotlin/splice/client/desktop/, beside the other Desktop facts. Goal: docs/specs/desktop-full.md.'''
