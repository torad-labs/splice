# [2026-08-31] 2026-08-31 PREMISE CORRECTED before any implementation, on codex-splice's challenge and grok-splice's source trace. My original title said the 1x1 was 'almost certainly synthesized or degenerate rather than user-supplied'. The synthesized half is DISPROVEN: splice never creates PNG pixels, ChatWireMapper and ResponsesInputParts wrap the client's MediaSource.data verbatim. That was me speculating past the evidence in a ROW TITLE, which is the worst place for it - a title is what the next seat reads first and it would have aimed the repair at a placeholder that does not exist. Origin stays unproven absent payload inspection, and the repair is built around the real gap: no dimension floor on the outbound path. Retaining codex's map for the implementation - header-only dimension probe in core for PNG/JPEG/GIF/WebP with unknown or truncated returning null and forwarding unchanged; opt-in minImageSidePx quirk set to 8 for xAI chat and Grok Responses ONLY, null everywhere else; below-floor DROPS that one image and inserts an honest marker naming the vendor minimum, never resizing and never fabricating and never failing a mixed turn; result split from DR-94 unreadable so a valid 1x1 is not miscalled unreadable; tool_result follow-up must exclude the dropped image too.
# [2026-08-31] 2026-08-31 IMPLEMENTATION SEAM from codex-splice, recorded before it is lost: returning null from imagePart for an undersized image is NOT an honest disposition, because null is already overloaded three different ways downstream. ChatWireMapper folds every null into 'unreadable image source' (normal message path around lines 54-60, tool results around 136-145); ResponsesInputBuilder labels null 'unsupported source' (around 82-94); ResponsesInputTools silently DROPS a null tool-result image (around 112-115). So a valid-but-undersized xAI image would be reported to the user as unreadable, which is a lie about why it was dropped. Requirement: carry a TYPED mapping outcome (or otherwise preserve the drop reason) so the new minimum-dimension policy gets its own honest marker, including on tool_result siblings, while unreadable and unsupported keep their existing reasons. Do not fold the new policy into a nullable JsonObject.
# [2026-08-31] 2026-08-31 grok-splice read-only SOURCE MAP received (no edits, no ledger touch from that seat; implementation stays here). Root: no min-px, no header probe, and no dimension field exist anywhere on this tip. Live xAI is ChatArm GROK_OAUTH, supportsVision defaults true, and ChatWireMapper.imagePart turns any nonempty base64 into a data URL with no decode, so a real 1x1 PNG rides upstream and xAI 400s invalid_image. Note the existing aGk= fixtures are base64 of the word hi, NOT a 1x1 PNG - they forward because nonempty, so they are not a stand-in for this bug and a new arm must use real synthetic headers. DESIGN: a shared dialect-agnostic header probe returning width/height/format or null for unknown, reading only the header window and logging only format and dimensions, never payload bytes; ChatQuirks.minImageEdgePx and ResponsesQuirks.minImageEdgePx both defaulting to null so every non-grok arm is byte-identical and never decodes; 8 set ONLY at ChatArm GROK_OAUTH and GrokQuirks.defaultQuirks; no TOML overlay. Probe runs only when min is set AND type is base64 AND data is nonempty. Decode failure, unknown magic or truncated header FORWARDS - never fail closed. A below-min drop gets its OWN marker and its OWN counter, so a message with both kinds emits TWO markers; relabeling below-min as unreadable is named as the mutant. Chat tool_result must fold the below-min count separately, and Grok Responses tool_result (silent today) must emit the min marker without changing the unrelated unsupported-drop silence. Passthrough never probes. Format boundaries specified for PNG (require IHDR at offset 12, not chunk length alone), JPEG (walk to a real SOF, C0-CF except C4/C8/CC, progressive SOF2 included), GIF87a/89a, and WebP VP8 / VP8L / VP8X including the minus-one canvas encoding and skipping ICCP/EXIF/ANIM/XMP chunks. Probe from BYTES, so a PNG media_type wrapping JPEG bytes still classifies correctly. 27-arm matrix supplied, each naming the mutant it kills, including off-by-one (7x8 and 8x7 drop, 8x9 forward), zero dimensions, truncated headers forwarding, URL sources never probed, and construction arms asserting minImageEdgePx is 8 for GROK_OAUTH and null for api-key.
