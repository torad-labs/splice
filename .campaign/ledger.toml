- A picked model's window is its declared `context_window`, unless its provider names `served_window = { url, field }` (cp-schema) and that read succeeded: then the window the provider reports is the window of every model of that provider, since it is the real ceiling. Never report a window past the real one, and never spell a model id past its ceiling to move the client's window (section 22: scale instead).
- served_window is read once when the daemon starts (and again when splice.toml is reloaded): GET url, at most 5 seconds, with the provider's auth headers when it has a key at hand and none otherwise; `field` is a dotted path to a positive integer in the JSON answer (llama-server's /props: default_generation_settings.n_ctx). Its failure never refuses boot or a turn: the declared window stays in force, one log line says why, and `splice doctor` names it: `providers.<key>.served_window: <url> <what happened> (HTTP 404 / not JSON / no positive integer at <field> / timed out); the declared context_window (<n>) is in force`.
- The local-server /props probe that exists for `local = true` providers keeps working as it does; served_window is the same idea for any provider, written explicitly.

Where: the window a head's catalog reports for a model (core/.../model/ModelCatalog.kt contextWindowFor / usageScale, app/.../daemon/TopologyWindows.kt), the probe beside LocalRuntimeProbe (integrations/upstream/.../local), and a doctor check (features/diagnostics/.../doctor, DoctorConfigChecks).

