# ci-hardening.toml — CI/CD hardening + automation campaign for splice (2026-07-25).
# LAW: concept #945 — this manifest IS the memory; access ONLY via dev/campaigns/manifest.py
#   (`python3 dev/campaigns/manifest.py dev/campaigns/ci-hardening.toml <verb>`). Raw edits skip
#   the flock and the validate-rollback gate.
# LAW [2026-07-25]: PROVENANCE — items derive from the 2026-07-25 CI/CD review vs top-OSS
#   practice (exa research: Cilium CNCF dependency-lockdown 2026-06, OpenSSF post-tj-actions
#   blueprint, GitHub supply-chain post 2026-04, gradle/actions dependency-submission docs,
#   ast-grep CLI reference, zizmor docs, Dependabot cooldown changelogs 2025-07/2026-07) plus a
#   full audit of this repo's .github/workflows. Supersedes the draft .claude/PLAN.md (deleted).
# LAW [2026-07-25]: SHA DISCIPLINE — NEVER invent action SHAs. KNOWN PINS (reuse verbatim):
#   checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
#   setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
#   setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
#   codeql-action@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
#   New actions: resolve latest tag + SHA via `gh release view -R <owner>/<repo> --json tagName
#   --jq .tagName` then `gh api repos/<owner>/<repo>/commits?sha=<tag> --jq .sha`; pin full
#   40-char SHA + `# vX.Y.Z` comment.
# LAW [2026-07-25]: NO PUSH, NO SETTINGS — agents never push, never rewrite history, never
#   change GitHub settings/branch protection/rulesets/required checks (operator-only). gh usage
#   is read-only (release view, api GET) except in-item verbs (CI-7's issue comment/label).
# LAW [2026-07-25]: SCOPE FENCE — wave 1 (CI-1..CI-4) edits ONLY .github/workflows/** and
#   .github/dependabot.yml. NEVER .claude/hooks/**, .rules/**, checks/**, checks/gate.sh.
#   Wave 2 (CI-5) adds the named gateway Gradle build files only.
# LAW [2026-07-25]: FENCES are exclusive within a wave — every file exactly ONE owner slot.
#   Cross-wave file reuse (issue-triage.yml in CI-2 then CI-7) is serialized by the next-queue,
#   never concurrent claims.
# LAW [2026-07-25]: NON-BLOCKING — AI-assisted and externally-dependent checks degrade to a
#   logged skip or a comment, never a red check. Hard gates (build, tests, walls) stay hard.
# LAW [2026-07-25]: STYLE — every workflow carries a header comment explaining WHY; minimal
#   permissions per workflow/job; concurrency group + cancel-in-progress: true; timeout-minutes
#   on every job; persist-credentials: false on every checkout; PR title type `ci:` (pr-title
#   lint is enforced).
# LAW [2026-07-25]: ZIZMOR/ACTIONLINT findings on EXISTING workflows are fixed or suppressed
#   with an inline rationale comment per site — never disable an audit globally.
# LAW [2026-07-25]: BUILDERS EDIT + TARGETED VERIFY ONLY (serial, one builder at a time); the
#   full gate `npm run gate` is orchestrator-only, run once per wave before the PR.
# LAW [2026-07-25]: HONEST STATUS — set-status done requires the item's OWN verify command
#   actually run green; verified is orchestrator-only after diff read + gate.
# LAW [2026-07-25]: BASE — orchestrator cuts the wave branch from MAIN tip (shared checkout is
#   on feat/tool-surface-5.6; NEVER include tool-surface work in this campaign's PRs).

[campaign]
name = "ci-hardening"
created = "2026-07-25"
goal = "Close the Gradle dependency-graph blind spot, add workflow self-analysis (zizmor + actionlint), surface ast-grep wall violations as PR annotations, Dependabot cooldown, wrapper validation, coverage visibility; spec/gate nightly live-provider e2e and duplicate-issue detection"
next = ["CI-1", "CI-2", "CI-3", "CI-4"]

# ── P1-workflows — wave 1: ONE ci: PR, config-only, locally verifiable ────────

[[items]]
id = "CI-1"
phase = "P1-workflows"
title = "NEW .github/workflows/dependency-submission.yml — close the Gradle blind spot: GitHub's dependency graph has NO Gradle manifest support, so Dependabot alerts/security-updates and the dependency-review gate currently see npm deps only and the Kotlin gateway is invisible. Triggers: push to main + workflow_dispatch ONLY (PR-side submission needs contents: write, which Dependabot/fork-triggered runs never receive — the header comment must state this documented limitation: PR-compare coverage for Gradle deps in dependency-review stays npm-only). permissions contents: write (Dependency Submission API); concurrency dependency-submission-<ref> cancel-in-progress; timeout 20m; checkout + setup-java from KNOWN PINS (cache: gradle); gradle/actions/dependency-submission@<RESOLVE per SHA law> with build-root-directory: gateway — VERIFY the exact input name for a non-root build in gradle/actions docs/dependency-submission.md BEFORE writing. PR body must carry the post-merge operator verification (Insights → Dependency graph shows a Gradle manifest; run logs show snapshot submitted) — it cannot be exercised from the PR itself."
files = [".github/workflows/dependency-submission.yml"]
status = "verified"
verify = "python3 -c 'import yaml; yaml.safe_load(open(\".github/workflows/dependency-submission.yml\"))' && uvx zizmor --offline .github/workflows/dependency-submission.yml"
# [2026-07-25] Landed .github/workflows/dependency-submission.yml. Item verify exit 0 (yaml.safe_load + uvx zizmor --offline file). actionlint exit 0. cannot_fail_probe: (1) unclosed quote in name broke yaml.safe_load exit 1; (2) injected ${{ github.ref }} into run: block broke zizmor exit 14 with error[template-injection]; both restored, file clean. Repo-wide zizmor --offline still reports 8 unsuppressed findings (exit 14), unchanged from baseline. Workflow file count 10 -> 11. Uses KNOWN PINS verbatim: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0, gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0. build-root-directory: gateway confirmed against gradle/actions docs; gateway/settings.gradle.kts, gateway/build.gradle.kts, gateway/gradlew present.
