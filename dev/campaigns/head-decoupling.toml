# LAW [2026-08-16]: RULE CLASSIFICATION CORRECTED (operator, 2026-08-16): an earlier pass classified the dormant .rules/kotlin pack by GREPPING for Android markers, so any rule whose exception clause mentioned @Composable was mislabelled UI-only. Read by substance instead, these are ARCHITECTURE rules and are wanted: no-lambda-seam (name seams with fun interface — splice has 209 raw function-type seams against 6 fun interface, 48 of them the same log: (String)->Unit threaded by hand; naming those IS the port extraction), converters-must-be-usecases (behaviour in a class with operator fun invoke — the repo has ZERO operator fun invoke, i.e. no use-case shape at all), no-logic-in-collect (collect is a thin terminal; logic belongs in operators — directly the discipline the Flow<TurnEvent> work needs), usecase/repository-injection-discipline (depend downward only — the layer law HD-13 needs, with the ViewModel/UI vocabulary retargeted to head/dialect/port), no-coroutine-scope-factory, flow-over-suspend, no-secondary-constructor, no-invented-layer. Classify rules by what they CHECK, never by a keyword in their prose.
# LAW [2026-08-16]: THE FOUR 'CONTRADICTING' RULES ARE CONVERGENCE TARGETS, NOT DELETIONS (operator ruling, 2026-08-16): 'if the rule contradicts our architecture then the architecture is wrong.' no-mutable-var (178 var in main sources), no-extension-functions (23 member extensions), no-delay-in-production (6 sites), main-no-hardcoded-dispatchers (10 Dispatchers.* references) stay on the books as targets the codebase converges toward, each landing as a dated RATCHET (current count recorded, count may only fall) rather than a big-bang red gate.
# LAW [2026-08-16]: A CENSUS IS NOT EVIDENCE UNTIL THE RULE IS RED-PROVEN (discovered promoting HD-17 part 1, 2026-08-16): no-lateinit in the dormant pack matched 'kind: property_modifier', which DOES NOT EXIST in this tree-sitter grammar (it is member_modifier) — the rule could never match anything, anywhere. Promoted verbatim it would have passed forever while blind, and its 'zero violations' census was meaningless because the matcher was dead. Two siblings had softer versions of the same defect: flow-over-suspend's 'follows: function_value_parameters' is LOAD-BEARING (it makes the rule return-type-only; without it the rule flags the 4 live driveTurn(upstream: Flow<JsonObject>, sink: WireSink) SPI signatures and reds the gate on the provider contract), and no-todo-throws named NotImplementedError in its prose but matched only TODO(). THEREFORE: every rule in HD-17 parts 2 and 3 gets a synthetic RED proof before its violation count is believed, and any count taken from an unproven matcher is discarded.
# LAW [2026-08-16]: TRUE CENSUS, taken with the real matchers (ast-grep 0.44.0 scan --rule, 2026-08-16) — my earlier grep figures were wrong in BOTH directions and are void: no-lambda-seam 246 (grep said 209), no-mutable-var 79 (grep said 178), no-extension-functions 28, no-delay-in-production 11 (grep said 6), main-no-hardcoded-dispatchers 7, no-reflection-in-production 6 (grep said 2), no-unsafe-bang-bang 5, no-raw-thread 4 (grep said 1), no-coroutine-scope-factory 4, no-logic-in-collect 3, converters-must-be-usecases 0. Total 393. Every future count comes from the matcher, never from grep.
# LAW [2026-08-17]: SEAM CENSUS BY ROLE (2026-08-16, from the matcher + declaration lines): the 246 no-lambda-seam hits are 49 distinct shapes but only a handful of ROLES. log 47, envReader 29 + env 27 (ONE role under two names), clock 18, block 18, refreshCall 5, clientGone 5, watchdogFired 5, decodeReasoningEnvelope 4, sink 3, onRetry 3, clientFrameEmitted 3, identityHeaders 2, nowIso 2. Three interfaces (LogSink, EnvReader, Clock) therefore cover 121 of 246. NAME BY ROLE, NEVER BY SHAPE — shape-identical seams are not necessarily the same concept, and collapsing distinct roles into a shared BooleanSupplier would be worse than the lambdas.
# LAW [2026-08-17]: THE 18 'block' SEAMS ARE A RULE DEFECT, NOT A CODE DEFECT (2026-08-16): they are the parameters of INLINE higher-order utilities (runCatchingCancellable(block: () -> T) and siblings). Converting an inline lambda parameter into a fun interface breaks inlining and forbids non-local returns — it would make the code worse to satisfy a matcher. The honest fix is to amend the rule to exempt parameters of inline functions, with a rule-test pinning both sides, and to say so in the wall's header. Complying blindly here is the failure mode.
# LAW [2026-08-17]: DECOMPOSITION ORACLE (2026-08-17): checks/concentration.py is the campaign's measure and its gate. C = 0.5*logic + 3*exports + 8*concerns, where concerns = declared types + distinct splice.* subsystems imported — chosen precisely because splitting a god class INTO THE SAME FILE raises the score, which is exactly what the 14-function ceiling caused during the style migration. Graded against the median C of import neighbours, denominator floored at half the global median so a file with trivial neighbours cannot read as a god object on arithmetic alone (the first draft scored a 63-line CLI file at 63x). Bands: <1.8 low, 1.8-3.0 moderate, >=3.0 HIGH. Baseline at campaign start: 36 HIGH, 22 moderate, 102 low across 160 files. SUCCESS = every named target at ratio < 1.8 with 1107 tests green, kimi goldens byte-identical, and npm run gate PASS.
