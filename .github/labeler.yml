# Path → label map for actions/labeler@v6 (pr-labeler.yml).
# Labels must already exist in the repo; the action does not create them.
gateway:
  - changed-files:
      # restructure PR 3: :client is the first Gradle module to live outside gateway/. The LABEL
      # is a repo label the action cannot create, so it keeps its name while the directory moves —
      # what it means is "the Kotlin gateway", and :client is part of that.
      # Every §2.2 module home; a glob over a directory that does not exist yet matches nothing.
      - any-glob-to-any-file:
          - 'gateway/**'
          - 'client/**'
          - 'core/**'
          - 'upstream/**'
          - 'dialects/**'
          - 'providers/**'
          - 'daemon/**'
          - 'app/**'
          - 'quality/architecture/**'
          - 'quality/compiler-plugin/**'

console:
  - changed-files:
      - any-glob-to-any-file: 'console/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - '.docs/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'checks/**'
          - 'quality/**'

release:
  - changed-files:
      - any-glob-to-any-file:
          - 'install.sh'
          - 'bin/**'
          - 'checks/release/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'bun.lock'
          - 'gradle/**'
