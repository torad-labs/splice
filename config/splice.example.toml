# splice — example multi-provider topology.
#
# Copy to ~/.config/splice/splice.toml for the comprehensive example. `splice init` writes the
# zero-config OpenRouter API-key starter instead. Adding a provider/head requires a daemon restart.
#
# The OAuth sections below are what splice was built for — Claude Code on your ChatGPT, Grok,
# or Kimi subscription. They are unofficial: they reuse each vendor CLI's public OAuth client
# identity, which no vendor documents for third parties. Use them at your own risk.
# A new OpenAI-compatible API-key vendor is otherwise pure TOML: base URL, key env, and models.

[daemon]
control_port = 3096          # loopback-only control plane + dashboard

# Reasoning display — edit here, restart daemon. No code change.
# Env aliases (CLAUDEX_SHOW_REASONING etc.) and runtime PATCH still override these.
show_reasoning = "text"      # "text" | "thinking" | "off"  — stream thinking into Claude Code
summary        = "detailed"  # "detailed" | "concise" | "auto" | "none"
# effort       = "high"      # optional; omit → high (Grok floors invalid values to low)
replay_reasoning = false     # NEVER turn on lightly: replaying prior opaque encrypted reasoning items thins fresh reasoning

# ── EXPERIMENTAL OPT-IN: ChatGPT Codex subscription via OAuth ─────────────────
[providers.codex]
dialect = "openai-responses"
base_url = "https://chatgpt.com/backend-api/codex"
# EXPERIMENTAL: reuses the Codex CLI's public OAuth client identity — NOT a vendor-documented
# third-party integration. auth.json is password-equivalent; splice reads AND refreshes it in place.
# Documented alternative: OpenAI Platform API keys (kind = "api-key", env = "OPENAI_API_KEY").
auth = { kind = "chatgpt-oauth", file = "~/.codex/auth.json" }
quirks = { store = false, account_id_header = true, cache_key = "first-message-hash", effort_ceiling = "max", summary_field = true }
# reasoning_cache (default true): the gateway holds each turn's encrypted reasoning and reinjects
# it on tool round-trips (codex-CLI parity — without it the model re-derives its plan at every
# tool result: repeated tool calls, duplicated reasoning). The gateway retains only the OPAQUE
# encrypted envelopes, bounded + TTL'd; set reasoning_cache = false to restore the old behavior.
# parallel_tool_calls (default false): the VALUE sent for parallel_tool_calls on responses-lite
# (gpt-5.6) turns — the field itself always rides, since a lite request without it 400s. codex-rs
# reads this per model rather than hardcoding it, so it is a knob here too. false = one tool call
# per turn, which is why claudex averages ~2x the round-trips of grok/kimi and re-sends the whole
# context each time. To opt in, add `parallel_tool_calls = true` INSIDE the inline quirks table
# above (a separate [providers.codex.quirks] section would clash with it and fail to parse).
# Guardrails: a client's explicit disable_parallel_tool_use=true always wins, and toolless turns
# stay false. Lite-only — ignored on non-lite turns (grok's value comes from the client's
# tool_choice). UNTESTED against the live backend: leaving the field out entirely once let the
# backend default to parallel and gpt-5.6 sprayed 30-50 parallel Task calls. Opt in to measure.
# websocket (default false): serve rounds over the Responses WebSocket with previous_response_id
# chaining, so a continuation turn sends ONLY the new items instead of the whole history. Measured
# on a 12-round tool loop: wire bytes go FLAT (~2.4KB) while the full send grows linearly — 92.5%
# less at round 12. Add `websocket = true` INSIDE the inline quirks table above (a separate
# [providers.codex.quirks] section would clash with it and fail to parse).
# It is an OVERLAY: any failure — handshake, busy socket, send, first-event timeout, or a round that
# fails before the client sees content — falls back to the normal SSE path, which keeps sole
# ownership of retry, the 401 refresh and the 429 cooldown. With the key absent no WebSocket is ever
# constructed and the request path is byte-identical to a build without the feature.
[[providers.codex.models]]
id = "gpt-5.6-sol"
label = "Codex 5.6 Sol"
context_window = 400000
[[providers.codex.models]]
id = "gpt-5.6-terra"
label = "Codex 5.6 Terra"
context_window = 400000
[[providers.codex.models]]
id = "gpt-5.6-luna"
label = "Codex 5.6 Luna"
context_window = 400000
[[providers.codex.models]]
id = "gpt-5.5"
label = "Codex 5.5"
context_window = 272000
[[providers.codex.models]]
id = "gpt-5.4"
label = "Codex 5.4"
context_window = 272000
[[providers.codex.models]]
id = "gpt-5.4-mini"
label = "Codex 5.4 Mini"
context_window = 272000
[[providers.codex.models]]
id = "gpt-5.3-codex-spark"
label = "Codex Spark"
context_window = 128000

# ── EXPERIMENTAL OPT-IN: xAI/Grok OAuth (SuperGrok/X Premium+) ──────────────────
[providers.xai]
dialect = "openai-responses"
base_url = "https://api.x.ai/v1"
# EXPERIMENTAL: reuses the Grok CLI's public OAuth client identity — NOT a vendor-documented
# third-party integration. auth.json is password-equivalent; splice reads AND refreshes it in place.
# Documented alternative: an OpenRouter API key (kind = "api-key", env = "OPENROUTER_API_KEY").
auth = { kind = "grok-oauth", file = "~/.grok/auth.json" }  # browser login: `claude-grok login`
# summary_field=true enables the reasoning.summary field (value comes from [daemon].summary).
# Raw reasoning items stay encrypted by xAI; public form is summary/reasoning_text only.
# reasoning_cache = false documented here because xai returns no encrypted reasoning envelopes —
# the cache would only widen the request's include[] for nothing (it defaults on for codex).
quirks = { cache_key = "session-id", effort_ceiling = "high", summary_field = true, tool_choice = true, reasoning_cache = false }
[[providers.xai.models]]
id = "grok-4.6"
label = "Grok 4.6"
context_window = 500000       # docs.x.ai: grok-4.6 = 500k; grok-4.5 = 500k; grok-4.3 = 1M; grok-build = 256k
[[providers.xai.models]]
id = "grok-4.5"
label = "Grok 4.5"
context_window = 500000
[[providers.xai.models]]
id = "grok-4.3"
label = "Grok 4.3"
context_window = 1000000
[[providers.xai.models]]
id = "grok-build-latest"
label = "Grok Build"
context_window = 256000

# ── openrouter: the "new vendor = pure TOML, zero code" proof (Chat Completions) ─
# Swap base_url + env for Ollama (http://localhost:11434/v1), LM Studio, DeepSeek, etc.
# api-key resolution: $OPENROUTER_API_KEY from the daemon's env wins; else the shared
# ~/.config/splice/keys.toml store (written by `claude-openrouter login` / `splice key set` /
# the in-session token-capture hook) — env always overrides the store.
[providers.openrouter]
dialect = "openai-chat"
base_url = "https://openrouter.ai/api/v1"
auth = { kind = "api-key", env = "OPENROUTER_API_KEY" }
[[providers.openrouter.models]]
id = "meta-llama/llama-4-maverick"
label = "Llama 4 Maverick"
context_window = 1048576

# ── strict OpenAI-compatible vendor: reasoning_effort must be turned OFF ────────
# This dialect emits reasoning_effort/reasoning by default (DeepSeek/xAI/OpenRouter accept and
# use them). Strict OpenAI-compatible validators (Fireworks) 400 on unrecognized fields — set
# reasoning_effort = false to omit both (issue #21).
[providers.fireworks]
dialect = "openai-chat"
base_url = "https://api.fireworks.ai/inference/v1"
auth = { kind = "api-key", env = "FIREWORKS_API_KEY" }
quirks = { reasoning_effort = false }
[[providers.fireworks.models]]
id = "accounts/fireworks/models/llama-v3p1-70b-instruct"
label = "Llama 3.1 70B (Fireworks)"
context_window = 131072

# ── EXPERIMENTAL OPT-IN: Kimi device-flow OAuth (x-api-key) ─────────────────────
# api.kimi.com/coding speaks the Anthropic Messages wire natively. Browser device login:
# `claude-kimi login` (RFC 8628 — enter a code, no loopback redirect). The wire id sent upstream
# is the BARE model (the `[1m]` suffix is stripped); the 1M context tier is a plan entitlement,
# not a distinct model. Moonshot's pay-per-token anthropic base (api.moonshot.ai/anthropic) works
# too — set auth = { kind = "api-key", env = "MOONSHOT_API_KEY" } and it authenticates via Bearer.
[providers.kimi]
dialect = "anthropic-passthrough"
base_url = "https://api.kimi.com/coding"
# EXPERIMENTAL: reuses the Kimi CLI's public OAuth client identity — NOT a vendor-documented
# third-party integration. kimi-code.json is password-equivalent; splice reads AND refreshes it in place.
# Documented alternative: a Moonshot API key (kind = "api-key", env = "MOONSHOT_API_KEY").
auth = { kind = "kimi-oauth", file = "~/.kimi/credentials/kimi-code.json" }
# The anthropic-passthrough dialect forwards the client's bytes FAITHFULLY by default; each knob
# below opts into one deformation Kimi's /coding surface requires. They were hardcoded while Kimi
# was the dialect's only consumer — declaring them here is what lets an api.anthropic.com-shaped
# vendor share the dialect without inheriting Moonshot's wire (see the [providers.anthropic] entry).
#   mfjs                  — rewrite tool input_schema into Moonshot-Flavored JSON Schema (drops
#                           format, prefix-item schemas, $ref siblings; collapses tuple items)
#   block_allowlist       — Kimi's own 400 enumerates these tags; every other block is DROPPED
#   strip_cache_control   — Kimi rejects cache_control markers (no prompt caching to lose here)
#   synthesize_signatures — Kimi never signs thinking blocks and Claude Code discards unsigned ones
#   map_thinking_adaptive — Kimi takes adaptive thinking + output_config.effort, not budget_tokens
quirks = { mfjs = true, strip_cache_control = true, synthesize_signatures = true, map_thinking_adaptive = true, block_allowlist = ["text", "image", "thinking", "tool_use", "tool_result", "server_tool_use", "web_search_tool_result"] }
# Static vendor headers, pure TOML. Kimi's /coding endpoint 403s unrecognized user agents (this
# exact UA is proven-accepted), and the Anthropic wire needs its version header on every request.
# `Accept` and the X-Msh-* device identity stay in code: one is a dialect invariant, the other is
# COMPUTED per install rather than declared.
extra_headers = { anthropic-version = "2023-06-01", User-Agent = "KimiCLI/1.5" }
# Window lookups happen on the STRIPPED id ("k3"), while the picker entry below keeps the "[1m]"
# hint — this exact-match row keeps K3's 1M window independent of model-list order.
[[providers.kimi.extra_windows]]
id = "k3"
context_window = 1048576
[[providers.kimi.models]]
id = "k3[1m]"                  # sent upstream as bare `k3`; [1m] is a display/context-tier hint
label = "Kimi K3 (1M)"
description = "1M context needs the Allegretto plan or higher — Moderato serves 256K."
context_window = 1048576
[[providers.kimi.models]]
id = "kimi-for-coding"
label = "Kimi K2.7 Code"
context_window = 262144
[[providers.kimi.models]]
id = "kimi-for-coding-highspeed"
label = "Kimi K2.7 Code (highspeed)"
context_window = 262144

# ── heads: each is a Claude Code wrapper on its own loopback port ───────────────
# `command` names the installed wrapper (`splice install` links ~/.local/bin/<command>).
[claude]                       # global config-sharing policy for every wrapper
# `sessions` shares the cross-session-messaging peer registry, so sessions on ANY head (and plain
# `claude`) can see and message each other; drop it (or isolate it per head) to wall a head off.
share = ["settings", "agents", "commands", "skills", "hooks", "plugins", "CLAUDE.md", "mcps", "sessions"]

[heads.claudex]
provider = "codex"
port = 3099
discovery_prefix = "claude-codex--"
pinned_model = "gpt-5.6-sol"
[heads.claudex.claude]
command = "claudex"

[heads.claude-grok]
provider = "xai"
port = 3100
discovery_prefix = "claude-grok--"
pinned_model = "grok-4.6"
[heads.claude-grok.claude]
command = "claude-grok"
isolate = ["commands"]         # this head gets its own commands/, everything else shared

[heads.openrouter]
provider = "openrouter"
port = 3101
discovery_prefix = "claude-openrouter--"
pinned_model = "meta-llama/llama-4-maverick"
[heads.openrouter.claude]
command = "claude-openrouter"

[heads.fireworks]
provider = "fireworks"
port = 3103
discovery_prefix = "claude-fireworks--"
pinned_model = "accounts/fireworks/models/llama-v3p1-70b-instruct"
[heads.fireworks.claude]
command = "claudefw"

[heads.claude-kimi]
provider = "kimi"
port = 3102
discovery_prefix = "claude-kimi--"
pinned_model = "k3[1m]"
[heads.claude-kimi.claude]
command = "claude-kimi"
# PER-HEAD KNOBS. Keys are the knob names from ConfigService's Knob enum (maxInflight, maxQueued,
# upstreamTimeoutMs, streamIdleMs, firstByteTimeoutMs, ...), always as STRINGS. The same names work
# in an optional top-level [defaults] table, which this example deliberately omits: a knob put there
# governs EVERY head, which is the exact problem per-head overrides exist to solve. Precedence:
#   knob defaults <- [defaults] <- [heads.<key>.overrides] <- state config.json <- env <- PATCH
#
# maxInflight is the one that matters most: it is the concurrency the UPSTREAM ACCOUNT tolerates,
# not what the gateway can hold. The gate admits up to this many turns and QUEUES the rest — which
# is the backpressure that stops a workflow fan-out from bursting into a 429 storm (a real 429 arms
# a shared per-head cooldown and every concurrent turn then fails fast, no retry). Measured on this
# box: 0.3% turn failure at inflight<=14, 11% at 38, 67% at 100.
#
# Start near the observed-good ceiling and raise only with perf-jsonl evidence.
[heads.claude-kimi.overrides]
maxInflight = "8"
# kimi K3 reasons 10-20 min; keep the long cap HERE instead of [defaults], where it also handed
# codex and grok a 40-min ceiling (a wedged turn holds its inflight slot for the whole budget).
upstreamTimeoutMs = "2400000"

# ── Claude on the CLIENT's OWN login (the "no shortcuts" head) ───────────────────
# The only head whose upstream is Anthropic itself, and the only one where splice holds NO
# credential: `kind = "client"` forwards the caller's own Authorization / x-api-key /
# anthropic-version / anthropic-beta upstream and keeps Claude Code's native auth lifecycle —
# credentials, keychain, refresh and /login all stay the client's. Nothing to sign into here,
# nothing for splice to rotate, and no vendor OAuth reimplemented.
#
# It exists so a Claude session gets the same gateway machinery every other head has — unified
# usage/telemetry, per-head knobs, the model picker, the dashboard — without changing how it
# authenticates. Two consequences worth knowing:
#   · this head's port does NOT enforce the local gateway credential (there is none to protect:
#     a caller that forwards no valid Anthropic auth simply gets Anthropic's own 401). It is
#     loopback-only, like every head.
#   · being a faithful passthrough, it declares no quirks at all — cache_control markers, full
#     JSON Schema tool definitions and native thinking blocks all reach Anthropic untouched.
[providers.anthropic]
dialect = "anthropic-passthrough"
base_url = "https://api.anthropic.com"
auth = { kind = "client" }
# A DEFAULT: whatever the client sends wins. Present so a caller that omits the header still
# produces a valid Anthropic request.
extra_headers = { anthropic-version = "2023-06-01" }
[[providers.anthropic.models]]
id = "claude-fable-5"
label = "Claude Fable 5"
context_window = 200000
[[providers.anthropic.models]]
id = "claude-opus-5"
label = "Claude Opus 5"
context_window = 200000
[[providers.anthropic.models]]
id = "claude-sonnet-5"
label = "Claude Sonnet 5"
context_window = 200000
[[providers.anthropic.models]]
id = "claude-haiku-4-5"
label = "Claude Haiku 4.5"
context_window = 200000

[heads.claude-splice]
provider = "anthropic"
port = 3104                    # 3103 is fireworks above
discovery_prefix = "claude-splice--"
pinned_model = "claude-fable-5"
[heads.claude-splice.claude]
# MUST NOT be `claude`: that is the real binary this head launches, and shadowing it on PATH
# would make the wrapper invoke itself.
command = "claude-splice"
