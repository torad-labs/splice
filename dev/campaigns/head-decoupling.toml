# [2026-08-16] [citation audit, before any edit] Verified every synthesis citation against source. STALE — gap #5's premise is wrong: it claims attempts/retries/refreshes/backoff_ms/post_send_retries/search_rounds are 'written every turn'. TurnPerf.add() early-returns on a zero delta (core/src/main/kotlin/splice/core/perf/TurnPerf.kt, 'if (delta == 0L) return'), pinned by TurnPerfTest.kt:61-64 (assertTrue(RETRIES !in snap.counters)), so retries/refreshes/post_send_retries are ABSENT on a clean turn, never 0. And 'attempts' is written by UpstreamClient.kt:229 only, which the WebSocket runner bypasses — census over the live JSONLs: claudex attempts present on 5486/132410 rows (4%, ws-served), claude-kimi 33492/33830 (99%), claude-grok 33832/33845 (99%). So the literal 'assert attempts == 1' the synthesis prescribes would RED claudex, the very head the item must keep green. Correct oracle is value-when-present for attempts and absent-or-zero for retries/refreshes. Also NOT assertable: search_rounds is legitimately 1-3 on 493 healthy claudex rows (tool_search deferral). CONFIRMED as cited: WANTED_HEADS dead (shellcheck SC2034 on unmodified HEAD), discovery loop :255-268, stream_probe.py:150-153 bearer, HeadServer.kt:472-478 authorize short-circuit + :398-402 verbatim forward + :420-421 local count_tokens, ClientAuthProvider.kt:38 no-refresh, pick_model regex :106-110. /api/heads field name is 'authKind' (ControlServer.kt:500,518; Daemon.kt:978 = providerCfg.auth.kind); a client-auth head reports the literal 'client' (ClientAuthProvider.kt:17 CLIENT_AUTH_KIND, ExampleConfigTest.kt:101).
# [2026-08-16] [item 1 — SAFETY, client-auth heads] Taught discovery the auth kind. /api/heads field is 'authKind'; discover() now emits key<TAB>label<TAB>port<TAB>healthy<TAB>authKind and HARD-FAILS if a daemon omits the field (guessing 'probably not client-auth' is the assumption that leaks the key). New probe_bearer() resolves the credential BEFORE /v1/models, before the turn and before count_tokens — there is no safe 'probe a little' state, since all three present a bearer. authKind=client with no SPLICE_E2E_CLIENT_TOKEN => skip both tier-1 checks; with the token set, THAT rides instead of $MGMT. stream_probe.py's env knob renamed SPLICE_MGMT_KEY -> SPLICE_PROBE_BEARER because on a client-auth head the value is emphatically not the mgmt key (heads-e2e.sh is its only caller). Deleted the dead WANTED_HEADS (shellcheck SC2034 cleared). PROOF, fabricated client-auth head via a scratch control-plane stand-in on :3196 reporting claude-splice/authKind=client on :3197, where :3197 is a RECORDER logging every request+headers — the operator's splice.toml was never touched. (A) no token: '- claude-splice/wire SKIP — client-auth head, no caller credential supplied (set SPLICE_E2E_CLIENT_TOKEN to probe it)' + '- claude-splice/count_tokens SKIP', harness rc=0, and the recorder logged ZERO requests — the head was never contacted, so the mgmt key could not have gone upstream. (B) red-green with SPLICE_E2E_CLIENT_TOKEN=not-a-real-caller-credential: all three requests arrive (GET /v1/models, POST /v1/messages, POST /v1/messages/count_tokens), all three carry 'Authorization: Bearer not-a-real-caller-credential', and grep -F of the real 32-byte mgmt key across all 18 recorded header lines finds NOTHING.
# [2026-08-16] [items 2+3 — perf_rows_ok is now an oracle] Rewrote perf_rows_ok. It no longer filters to outcome=='ok' before counting: rows in the window are partitioned, ok rows must still meet the min-count (existing assertion preserved, not weakened), and ANY non-ok row now FAILS the head with its outcome tags — closing the hole where a head that was alive but wrong could not be failed by anything in the harness. Counter assertions are attempts==1 / retries==0 / refreshes==0 via r.get(name, clean) != clean, i.e. absent reads as compliant and a WRITTEN value must be right. That shape is forced by the source, not a softening: TurnPerf.add() drops zero deltas so retries/refreshes are absent (not 0) on a clean turn, and attempts is written only by UpstreamClient.kt:229 which the WebSocket runner bypasses. search_rounds is reported, never asserted (legitimately 1-3 on a healthy responses head). LIVE PROOF, tier 2 on claude-kimi (2 real wrapper turns): 'perf: 4 ok rows / 0 non-ok, slowest total=12803ms, attempts==1 on 4/4 rows carrying it, retries=0, refreshes=0' — 3 pass / 0 fail. RED-GREEN, running the SHIPPED python (sed-extracted from the script, not a copy) over windows built from REAL production rows: A ws-served claudex rows carrying no attempts field => rc=0 PASS 'attempts==1 on 0/4 rows carrying it'; B real ok rows + one real error:conn-reset row => rc=1 'non-ok rows in window: error:conn-resetx1'; C real ok rows with attempts=2 => rc=1; D real ok rows with retries=1 => rc=1; E a real clean row with refreshes forced to 1 => rc=1 'refreshes=[1] on 1/1 ok rows (want 0)'. CONTROL on fixture A: the synthesis's literal 'assert attempts == 1' flags 4/4 rows (tier 2 RED on every ws-served head, i.e. claudex); the shipped oracle flags 0/4.
# [2026-08-16] [item 4 — cheap-model picker] pick_model now returns '<id><TAB><why>' and tier1 prints the rationale, so a run can never silently bill the expensive row again. Regex gained haiku (the Anthropic cheap tier) plus nano: E2E_CHEAP_MODEL_RE overrides it. The real fix is the HONESTY, not the token: when nothing matches, the fallback is still rows[0] but it now says so loudly instead of passing as a considered choice. LIVE PROOF both ways. Cheap-match arm, tier 1 on claudex: 'model choice: cheap tier, matched /haiku|mini|spark|flash|lite|nano/' selecting claude-codex--gpt-5.4-mini. No-match arm, tier 1 on claude-kimi: 'model choice: NO row matched /haiku|mini|spark|flash|lite|nano/ — falling back to the catalog head, the MOST EXPENSIVE row of [claude-kimi--k3-256k, claude-kimi--kimi-for-coding, claude-kimi--k3[1m], claude-kimi--kimi-for-coding-highspeed]' — previously that fallback was completely invisible. Anthropic arm proven on the fabricated claude-splice head: 'model claude-splice--claude-haiku-4-5 — cheap tier', i.e. the fable-5 cost trap the synthesis predicted is closed before the head ships. Scope note: the synthesis said only anthropic falls through; live /v1/models shows grok (grok-4.6/4.5/4.3) and kimi fall through too, and both now announce it.
# [2026-08-16] [item 3 — LIVE red-green on the real daemon, the strongest proof of the run] tier 2 --head claudex: the wrapper answered BOTH prompts (tui-turn1 + tui-turn2 PASS) while 5 turns in the same window died error:upstream-failed. New oracle: '✗ claudex/perf-rows — non-ok rows in window: error:upstream-failedx5', rc=1. Ran BOTH oracles over one identical window (ts>=1786930524162, 43 ok + 9 error:upstream-failed) — OLD perf_rows_ok from git HEAD: rc=0 GREEN '43 ok rows, slowest total=72680ms'; NEW: rc=1 'non-ok rows in window: error:upstream-failedx9'. That is the synthesis's rank-6 gap exactly: a head alive but WRONG, previously unfailable by anything in the harness. KNOWN PROPERTY worth the orchestrator's attention: the window is per-head wall-clock, not per-harness-turn, so concurrent operator sessions on the same head fall inside it — a busy head can now red for traffic the harness did not send. This matches the specified oracle ('zero error:* rows during the tier-2 window') and the pre-existing min-rows assertion already counted unrelated ok rows the same way, so it was NOT softened; flagging it as a deliberate consequence, not an oversight.
# [2026-08-16] [blocker + adjacent findings, NOT fixed] (1) BLOCKER on the assigned verify command 'tier 1 --head claudex must still pass': it cannot pass right now and not for code reasons — the head's upstream answers 'rate_limit_error: The usage limit has been reached (plan=pro, resets in 3d 1h)'. Proven external TWICE: raw curl straight at :3099 with the harness uninvolved reproduces it, and the UNMODIFIED HEAD harness (git show HEAD:checks/e2e/heads-e2e.sh run from a scratch copy, md5 dd443298 vs working 7a9874ae) fails claudex/wire identically. count_tokens passes on both versions. Tier 1 was therefore demonstrated end-to-end green on claude-kimi instead — the other credentialed head — 2 pass / 0 fail, 177 events / 169 deltas / ttfb 2102ms, receipt emitted. So of the four heads: claudex now quota-blocked (was one of the two working), claude-kimi working, claude-grok out of vendor credits, openrouter not logged in. (2) ADJACENT DEFECT found, deliberately left alone as outside this item's four: the SKIP-report loop at heads-e2e.sh:107 ('for want in kimi') is stale and prints a FALSE report on every full run — it greps the head keys for an exact 'kimi', but the configured key is 'claude-kimi' (splice.toml:196), so a run emits '- kimi SKIP — no head configured — add a [heads.kimi]' about a head that exists and is one of the two that work. Observed live in the fabricated-head run. It is also the last shellcheck warning on the file (SC2043, present at baseline). Fixing it changes which heads get SKIP-reported for every consumer, so it wants its own decision rather than a drive-by.
# [2026-08-16] [landed] Committed 2ba8780 'fix(e2e): stop the harness leaking the mgmt key and calling failed turns green' — checks/e2e/heads-e2e.sh + checks/e2e/stream_probe.py only, 128 insertions / 33 deletions. NOT pushed. Commit deliberately scoped to the two fenced files: the working tree also carries concurrent HD-14 work (CompactTest.kt, TurnPipelineTest.kt modified, UpstreamClientRefreshChainTest.kt new) and this ledger holds both builders' notes interleaved, so both were left staged-free for the orchestrator rather than swept into an e2e commit. Verify set: (1) --list green, now emitting authKind as a 5th column; (2) 'tier 1 --head claudex' CANNOT pass — plan quota exhausted, proven external against raw curl and against the pristine HEAD harness, so tier 1 was demonstrated on claude-kimi instead (2 pass / 0 fail); (3) 'tier 2 --head claudex' correctly RED on the new assertion (non-ok rows in window: error:upstream-failedx5) while tier 2 on claude-kimi is 3 pass / 0 fail; (4) fabricated client-auth-head skip proven with a zero-request recorder; (5) shellcheck rc=1 with ONE warning left, SC2043 on the pre-existing ':107 for want in kimi' loop (baseline had SC2034+SC2043; SC2034 cleared by deleting WANTED_HEADS). Billed spend for the whole item: 3 provider turns (1 kimi tier-1 wire + 2 kimi tier-2 wrapper turns); claudex attempts were rejected by the quota gate and the fabricated-head runs never left loopback.
# [2026-08-16] [adversarial-review fixes, commit 1c01e0b] All five review findings fixed + the flagged ALSO; every citation re-verified against source and live data first, and all five held (only drift: the reviewer's claude-kimi census read 2,264 non-ok / 33,856 rows, live now 2,277 / 33,871 — the file grew; error:upstream-failed=2092 and claudex client_abort=71 matched EXACTLY). Found one citation ADDENDUM: client_abort has a THIRD emission site the review did not name, TurnPipeline.kt:52 (TurnOutcome.ClientAbandoned), which strengthens finding 2 rather than weakening it — all three sites mean the client went away. (1) WINDOW: start_ms is milliseconds now (python3 time.time()*1000), was $(($(date +%s)*1000)). PROOF, constructed --tier all equivalent replaying the real path (tier-1 row written, tier-1's count_tokens curl, tier2's mktemp -d, then start_ms): measured gap tier-1-row -> new start_ms = 12-13ms, i.e. inside the OLD second-truncated window every time. 2x2 over one fixture with the sed-extracted oracles: old-oracle+OLD-window rc=1 'non-ok rows in window: error:upstream-failedx1' (the reviewer's consequence (a) exactly — tier 2 red for a tier-1 event) vs new-oracle+NEW-window rc=0. Consequence (b) arm, tier-1 ok row + only ONE tier-2 turn: OLD window rc=0 GREEN (counting tier 1's row as tier 2's second) vs NEW window rc=1 'only 1 ok perf rows since window start (want >= 2)'. (2) ORACLE, chose ADJACENCY RECOVERY over the alternatives: client_abort leaves the fail set entirely (reported as info), and a non-ok row is RECOVERED iff the NEXT row in the window is ok. Chosen from measured data, not taste: over the live JSONLs isolated single failures dominate (claudex 63% of 1194 failure runs are length 1, p50 1735ms failure->next ok = the retry) while genuine sickness shows runs (claude-kimi's bad period: 12/44/83/149 consecutive). Rejected one-to-one count pardoning because it scales with AMBIENT ok traffic — a busy head could pardon hundreds of failures; adjacency cannot be bought with volume since unrelated ok rows break runs up instead. Rejected N>=2-threshold as arbitrary on a 2-turn denominator. RED-GREEN with the SHIPPED python sed-extracted from the script (working tree vs git HEAD), fixtures built from REAL production rows: A clean 4 ok -> both rc=0 (no regression); B isolated real error:conn-reset followed by ok -> OLD rc=1 FALSE RED, NEW rc=0 '+ retried-then-ok: error:conn-resetx1 (informational)'; C real client_abort row -> OLD rc=1 FALSE RED, NEW rc=0 '+ client_abort x1 (informational — client went away)'; D two real error:upstream-failed in a row -> BOTH rc=1; E trailing failure with nothing after -> BOTH rc=1; F attempts=2 and G retries=1 -> BOTH rc=1 identical (counter assertions untouched, not weakened). TEETH KEPT on the strongest proof of the original commit: the same claudex window ts>=1786930524162, real rows ts untouched (snapshot 107 rows, 91 ok / 16 non-ok, run lengths 1,1,1,1,5,7) is STILL RED, 'unrecovered non-ok rows in window: error:upstream-failedx4, failure:overloaded_errorx7' = 11 unrecovered — the run of 5 and the trailing run of 7 — while the 4 isolated blips and the tail of the 5-run are correctly pardoned. (3) LEAK: FATAL preflight refusal when SPLICE_E2E_CLIENT_TOKEN == mgmt key, placed BEFORE discovery so nothing reaches a head. PROOF on the real daemon: with the mgmt key -> 'FATAL: SPLICE_E2E_CLIENT_TOKEN is the daemon mgmt key...' rc=1; controls with a different token and with it unset both rc=0. (4) README rewritten to match the script: the oracle's three assertions + the recovery rule, cheap-model regex now haiku|mini|spark|flash|lite|nano with the loud no-match fallback, and a new 'Client-auth heads' section covering SPLICE_E2E_CLIENT_TOKEN, the tier-1 SKIP, the mgmt-key refusal and the tier-2 quota decision. (5) QUOTA, chose DOCUMENT + ANNOUNCE over gating tier 2. Justification: the two gates protect different things — tier 1's exists because probing a client-auth head with $MGMT ships the key upstream (a LEAK), while tier 2 cannot leak it (LaunchService withholds ANTHROPIC_AUTH_TOKEN so the wrapper rides the operator's own login) and only spends. Gating tier 2 on SPLICE_E2E_CLIENT_TOKEN would also be incoherent: tier 2 never uses that credential, so setting it would silently ENABLE subscription spend. And tier 2 already spends an OAuth subscription on claudex/claude-grok/claude-kimi, so gating the client-auth head alone singles out a universal cost. Instead: COST paragraph in the file header, a README section, and a per-head runtime notice (tier2 now takes auth_kind). PROOF on a fabricated client-auth head (scratch control plane :3196 reporting claude-splice/authKind=client on :3197, a request RECORDER; operator splice.toml never touched, stub wrapper on PATH so no real client ran): tier 1 still gated '- claude-splice/wire SKIP — client-auth head, no caller credential supplied' + count_tokens SKIP, and tier 2 prints 'NOTE: client-auth head — these 2 turns bill YOUR personal Anthropic subscription, not a splice credential'; recorder log EMPTY, zero requests reached the head. (ALSO) Removed the stale want-list loop rather than renaming it — discovery is the only roster and a head missing from splice.toml is the operator's own choice. PROOF side by side on a full run (no --head) against the fabricated CP: git-HEAD harness prints '- kimi SKIP — no head configured — add a [heads.kimi]...' about a working head, this one prints no kimi line at all. SHELLCHECK 1 -> 0 (SC2043 cleared; baseline was the single SC2043 at :107). LIVE VERIFY SET, all green: (1) --list rc=0, 4 heads with authKind; (2) tier 1 --head claude-kimi 2 pass / 0 fail, 122 events / 114 deltas / ttfb 2150ms, receipt emitted; (3) tier 2 --head claude-kimi 3 pass / 0 fail, 'perf: 5 ok rows / 0 unrecovered non-ok, slowest total=35567ms, attempts==1 on 5/5 rows carrying it, retries=0, refreshes=0'; (4) shellcheck rc=0. BILLED SPEND: 3 provider turns total (1 claude-kimi tier-1 wire + 2 claude-kimi tier-2 wrapper turns) plus 3 count_tokens metering calls; claudex untouched (still vendor quota-blocked, not chased), every synthetic proof stayed on loopback or on frozen fixtures. COMMITTED 1c01e0b, NOT pushed, scoped to checks/e2e/heads-e2e.sh + checks/e2e/README.md only — the working tree also carries a sibling agent's live gateway/** edits (Daemon.kt, TopologyLoader.kt, cli/*.kt, HeadServerClientAuthTest.kt, new ClientAuthDerivationTest.kt) which were deliberately left unstaged per the fence.
