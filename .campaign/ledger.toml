[[row]]
id = 'cp-schema'
title = "splice.toml speaks a team's provider definition"
feature = 'custom-provider'
status = 'todo'
owner = ''
blocked_by = []
guard = false
spec = '''
splice.toml gains the keys a team's provider definition is written with (issue #680), parsed, checked at boot and documented, so every later item of custom-provider reads one grammar. This item decides the grammar; the behaviour behind each key is its own item's.

The keys (decided here once; .campaign/checks/custom/lib/team.ts repeats them):
- [providers.<key>].auth = { kind = "command", credential_command = "<shell command>", login_command = "<shell command>" }. A new auth kind, generic (no vendor in it): credential_command prints the current credential (cp-credential), login_command is an interactive sign-in (cp-login). credential_command is required with kind = "command" and refused on any other kind; login_command is optional and only with kind = "command". Allowed on every dialect; the key rides where an api-key's rides on that dialect.
- [providers.<key>].picker and [heads.<key>].picker = true | false (absent = today's rule; a head's wins over its provider's). Behaviour: cp-picker.
- [providers.<key>].ca_file = "<path>": a PEM bundle of one or more certificates; ~ expands, a relative path resolves against splice.toml's folder. A file that is missing, unreadable or holds no certificate is a finding. Behaviour: cp-tls.
- [providers.<key>].error_messages = "whole" | "filtered" (absent = "filtered"). Any other string is a finding. Behaviour: cp-errors.
- [providers.<key>].served_window = { url = "<http(s) URL>", field = "<dotted JSON path>" }. A url that is not absolute http(s) or an empty field is a finding. Behaviour: cp-window.
- [[providers.<key>.models]].max_output_tokens = <positive integer>; 0 or negative is a finding. Behaviour: cp-output.
- [door.commands.<name>] = { head = "<head key>", models = "head" | "door" } (models absent = "head"). A command a wrapper starts Claude Code on the door through (cp-command). Findings: head missing or not a head in splice.toml, a head whose provider forwards the caller's own Claude login (auth kind client, never in the door), models not one of the two words, a name that is `claude` or the command of any head ([heads.*.claude].command, or the head key when it sets none) or of another door command.
- The existing send_version keeps its key (its new header is cp-identity's); description and label on a model already exist.
Every finding is a TopologyFinding with its dotted path (e.g. providers.acme.ca_file, door.commands.claude-acme.head) and refuses boot with every other finding at once, like every key today (repo CLAUDE.md, "Boot fails closed"); a string-valued key is read as a string and checked, so one bad value never hides the rest behind a decode error. Keys follow the existing @Serializable classes in core/.../topology (ProviderConfig in Topology.kt, AuthConfig in TopologySchema.kt, HeadConfig.kt, ModelEntry in core/.../model/ModelCatalog.kt, a new DoorConfig file for [door]); findings live beside TopologyChecks (TopologyWriter.kt) and AuthCompatibility (AuthKind.kt). No new top-level functions or companion objects.
A kind = "command" provider must not make boot fail for want of a key: until cp-credential lands, its turns may refuse as a head with no key does today.
Document every key in docs/specs/custom-provider.md (create it: a section "splice.toml" with each key, its values and its finding), which cp-team turns into the team's guide.

Proven by: bun test ./.campaign/checks/custom/schema.test.ts — a splice.toml using every key boots and `splice claude --json` answers; a file with a mistake in each new key (and kind=command without credential_command, credential_command on api-key, three bad door commands) does not boot and its log names every path.'''
checks = [
  'bun test ./.campaign/checks/custom/schema.test.ts',
]
sources = [
  'core/src/main/kotlin/splice/core/topology/Topology.kt',
  'core/src/main/kotlin/splice/core/topology/TopologySchema.kt',
  'core/src/main/kotlin/splice/core/topology/HeadConfig.kt',
  'core/src/main/kotlin/splice/core/model/ModelCatalog.kt',
  'core/src/main/kotlin/splice/core/topology/AuthKind.kt',
  'core/src/main/kotlin/splice/core/topology/TopologyWriter.kt',
  '.campaign/checks/custom/lib/team.ts',
]
reviews = [
  'feature',
  'code',
]
