# [2026-09-18] 2026-09-18 THREE THINGS THE TITLE ASKS FOR THAT THE DATA DOES NOT YET SUPPORT, each shipped as an honest empty rather than a guess. (1) COST IS UNAVAILABLE UNTIL V4-127. The dollars are the daemon exact token sums times a rate card, and the ONLY route serving a rate card is GET /api/models, which is pending. So the cost inset prints `no rates declared` with basis `unavailable` today and will price itself the day the route lands; the page is built for it (ratesFor reads the head pinned model card). The fixture capture shows it priced, and the fixture is named. (2) THE by-provider VIEW HAD NO PROVIDER. FEATURES.md section 6 describes GET /api/models as "catalog per head with slots, windows, sources, rates, pinned" — no provider — while the row asks for a by-provider view. I added `provider?: string` to HeadCatalog (optional, additive over M2-D1) and the view groups on it; a payload that omits the field groups every head under one bay labelled `provider not reported` rather than deriving a provider from the head key, which would be printing a guess as data. REQUEST: the V4-127 route should carry the head provider. (3) FEATURES.md 4.10 lists "Effective instructions | route" and section 6 has NO route for it and no V4 row serves it, so the compaction page cannot name a pending row for it and does not claim it. Also: the title names views for usage and models only, so compaction ships no ViewTabs.
# [2026-09-18] 2026-09-18 CAPTURES, three, all 1536x1024 by PNG header, dark, taken with the vendored .dev/web-console/capture.mjs against the orchestrator dev server on localhost:5173 (left running), each with its named fixture: webui/.impeccable/review/sections/usage.png (fixture usage), compaction.png (fixture compaction), models.png (fixture models). The fixture query is read from useLocation().search, which under the hash router is the hash query, per the pinned CONTRACTS.md section 4 note. TWO ROW DEFECTS FOUND BY LOOKING AT THE FIRST CAPTURES AND FIXED FORWARD: (a) clipped strip values and a wrapped holder-edge label, from field widths sized for the pre-4a4b99f1 type ladder — every w in my three pages is now sized from its widest real value, and the head strip was trimmed from eight fields to six (a strip whose fields outrun its bay squeezes the edge, and a wrapped edge label stops the rack reading as a rack). The orchestrator then fixed the shared/ui sizing itself; my widths are declared widths and stay, and the re-captures are the check. (b) THE BYTES CHART WAS WRONG: request bytes and upstream bytes are two READINGS of the same traffic, not parts of a whole, and stacking them drew a volume neither number ever was — and on a deferring head (upstream below request) it buried the very saving the second number exists to show. It now draws paired bars on their own baseline (BarMode group, peakMax), and the stack/group distinction is pinned by a test. The token and tool charts stay stacked because their series ARE parts of a whole.
