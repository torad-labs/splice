- Each turn's usage and each count_tokens answer are reported as the same share of that declared window that they are of the model's own, so every model compacts at its own limit.
- A request without the header is standard mode and keeps the recorded window, as today.
- Chat and Cowork turns follow the same rule, and the live test confirms what Desktop's meter shows for them.
