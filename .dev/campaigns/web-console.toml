[[items]]
id = "M1-02"
phase = "m1"
title = "PRIMITIVES IN THE WORLD'S VOCABULARY (CONTRACTS.md section 2; brief section 3; craft floor). In webui/src/shared/ui add the named exports Strip, StripField, Bay, HolderEdge, ScopeInset, FieldBox, Reveal, Empty, Figure with EXACTLY the props in CONTRACTS.md section 2, split into one file per primitive under webui/src/shared/ui/ and re-exported from index.tsx; every existing export (Panel, StatusPill, Metric, Btn, Field, Well, EmptyState, ErrorNote, SkeletonRows, Stale, MeterBar, ConfirmBtn) keeps working unchanged because old pages use them until M2. Strip: a keyboard-focusable row (tabIndex 0; Enter and Space call onOpen; aria-label from the prop), holder edge on the left as a HolderEdge whose label is always printed, cocked = edge amber or red, struck = a 1px line drawn across the strip at mid height plus edge grey plus aria-disabled, selected = the edge extends the full height; accepts className and style passthrough so the hero row can bind measured boxes. StripField: fixed width in ch (style width: <w>ch), label above at --text-1 in --font-label, value at --text-3 in --font-figure with tabular figures, clipped with text-overflow ellipsis, never wrapped; basis printed after the value as text when not measured. Bay: a section with the label and count in the rack header, hairline rails top and bottom (--hair), rows stacked with --space-2 gaps, renders <Empty> from the empty prop when it has no children; accepts className and style passthrough. ScopeInset: --scope ground, --scope-ink title, --scope-grid hairlines, basis printed in the frame corner. FieldBox: label, value input, provenance printed as text under the value, hot prints 'applies live' else 'restart to apply'. Reveal: a button with the label; children render only after the click; never in the DOM before. Empty: text plus source, both printed. Figure: value, unit, basis as text. CSS in webui/src/shared/ui/ui.css using only var(--space-N), var(--text-N) and the contract's color, font and motion tokens; radius 0 everywhere; no icon, gradient, shadow or glow; focus ring var(--focus) 2px offset 1px on every focusable primitive; transitions only on the holder edge (--dur-1) and the strip swell (--dur-2). KNOWN IN-FENCE FINDING TO REPAIR (measured: detect.mjs is red on the tree today at webui/src/shared/ui/ui.css line 179, `.myx-meter-fill { transition: width }`, a layout-transition; fix it, it is not a regression to chase). TEST webui/tests/primitives.test.ts (a .ts file: no JSX; build elements with React.createElement and assert on renderToStaticMarkup output): every primitive renders its label as text, cocked and struck states print their label, Reveal hides children before the click, Empty prints its source, Figure prints its basis, StripField sets width in ch. Read /home/user/.claude/skills/impeccable/reference/craft-floor.md and .dev/web-console/CONTRACTS.md before editing."
files = ["webui/src/shared/ui/**", "webui/tests/primitives.test.ts"]
status = "todo"
verify = "cd webui && npx tsc --noEmit && npx eslint src/shared/ui tests/primitives.test.ts && npx vitest run tests/primitives.test.ts && cd .. && for d in webui/src/shared/ui; do test -e \"$d\" || exit 1; done && ast-grep scan -c sgconfig.yml webui/src/shared/ui && node /home/user/.claude/skills/impeccable/scripts/detect.mjs webui/src/shared/ui"
