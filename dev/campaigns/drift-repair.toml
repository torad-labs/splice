# [2026-09-01] 2026-09-01 REDO round 1 of codex-splice's four items - three closed, WS still open. ITEM 4 FIRST because it is a correction, not a repair: my claim that the cancel cause type is load-bearing, that a CancellationException there would propagate into the turn coroutine and reproduce the bug, is FALSE. codex replaced body.cancel(IOException) with body.cancel(CancellationException) and the whole acceptance suite stayed green; I replayed it myself and got 6/6 green. Every translator already swallows a cancellation when the watchdog has fired - ResponsesStreamTranslator does it explicitly at the catch of CancellationException guarded on watchdogFired. The comment is rewritten to say what is actually true: IOException is DEFENSIVE, kept because it does not depend on that swallow and reads as an ordinary torn read on any translator including one written later that forwards cancellation faithfully. The commit message for 2fc7ad50 carries the false claim uncorrected in history; this note is the correction of record. ITEM 3, TearAwareEvents G5 rider: pinned by a new SseRoundConsumeTest arm driving a real streaming request against a new idlepre mock scenario, where the backend acknowledges with response.created and then goes silent. RED with the rider removed, failing by propagating StreamTornBeforeClient. Three rig facts cost real time and are worth recording: a scenario that only sleeps is untestable because the client blocks on headers so the stall lands before the head has a stream at all; a bare SSE comment ends the round instantly as a dead-head body rather than stalling it; and the DR-90 arm's buffered client.post reads the WHOLE response before consume runs, so the arm had to move to preparePost/execute or it would assert against an already-complete channel. ITEM 2, resetFirstByte: three new WatchdogTest arms, each mutation-proved with exact targeting - deleting the Idle clear reds 'clears a stale Idle' and 'a stale Idle would block the later TotalCap from recording', and making it an unconditional set(null) reds 'preserves a TotalCap verdict'. The third arm is codex's named consequence and the one that actually bites: firedRef is written by compareAndSet(null,...), so a sentinel left set from an earlier round silently blocks the whole-turn cap from ever recording its own verdict. STALE PROSE fixed in Watchdog.launchIn KDoc (no longer claims it watches total elapsed), launchTotalCap KDoc (no longer refers to launchIn's totalCap check as present), resetFirstByte KDoc (now states the Idle clear and the TotalCap survival), WatchdogTest header, and the ReanchorRunnerTest header sentence that still said watchdog fires never continue.
# [2026-09-01] 2026-09-01 PROSE REDO landed - all six findings, codex's (1)(2)(3) plus grok's C4/C5 and codex's C6, each independently confirmed by the other seat. C1 MockChatGptUpstream idlepre: the outer comment said NO EVENT EVER while the inner comment and the code four lines below send response.created - two comments in one hunk contradicting each other. Rewritten to say what is actually true and load-bearing: no CLIENT FRAME, which is the state G5's reissue path claims; it does not mean no event and not no byte. C2 SseRoundConsumeTest: the comment claimed firstByteTimeout judges a pre-content stall. FALSE - TearAwareEvents.onBytes calls markByte on the RAW read, so response.created flips the watchdog to streamIdle before the stall begins. This got more than a comment: grok is right that the arm could not tell the tiers apart AT ALL, both budgets being 1s with nothing asserting sawFirstByte, which is exactly how the false claim survived two commits. Budgets are now 20s first-byte / 1s streamIdle so the deadline itself names the tier, and the arm asserts fired.sawFirstByte directly. PROVEN: deleting markByte from the raw read reds the arm at SseRoundConsumeTest.kt:272 (the tier assertion) and green returns on restore, TearAwareEvents.kt byte-identical at sha256 54e8b1d54473b254 - the same hash codex recorded in its own replay. Also labelled the frameEmittedThisRound stub as a stub: SseRoundDriver wires CONTENT_FRAMES_OUT and a constant false only HAPPENS to agree here, which the arm does not observe. C3 ReanchorRunnerTest arm renamed - the veto survived DR-7, its stated reason did not; it is now more work on a spent budget, not cancellation owns the turn. C4 ReanchorRunner.kt production header carried the same retired sentence that ReanchorContinuation quotes in order to retire it. C5 RoundPorts WatchdogTripped: narrowed to the SUCCESS-side gates that still consult it - FoldContinuations and RoundSplice.searchContinuation, its only two live consumers, verified by grep - and the file header now records that DR-7 found the ONE place the reason did change the answer and moved that path OFF the port rather than widening it. C6 RoundSplice searchContinuation: the same rule re-anchor applies parenthetical is false since the watchdog half of continuationForFailure's gate was removed; replaced with why they legitimately diverged. gateway SseRoundConsumeTest 2/2 and ReanchorRunnerTest 6/6, fresh XML.

