An interaction that writes (sending in the composer, signing in, changing a setting, stopping a session) is judged on a Splice of the campaign's own, never the one running on the machine. This item makes that Splice one command away, with made-up data, so every review tries writes the same way.

`tools/console-own` (Bun/TypeScript, `bun tools/console-own <verb>`; no Python):
- `up [--json]`: builds the daemon from this checkout (`./gradlew :app:shadowJar`, through the build gate like any build) and starts it in a home folder of its own under /tmp (its own HOME, config, state, ports and tmux socket; it refuses to start if any path it would write resolves into the person's ~/.splice, ~/.config/splice, ~/.claude or keyring, and never uses the control port 3096 or a running daemon's ports). Its splice.toml is made up: two providers on a local stand-in upstream the tool serves (OpenAI-compatible chat, answering every request with a short made-up reply and usage, one model each, made-up prices, a made-up API key in the daemon's env), each with its own command. Once up it sends a dozen requests through each command the way Claude Code does (so Activity and Providers have rows, at least one of them failing with a 429 from the stand-in), creates one team in that splice (PUT /api/teams) and starts one probe session: a Claude Code session launched through that splice on one stand-in command in its own tmux socket, which /api/sessions lists as live and which answers from the stand-in, never from a real provider. It prints, last, one JSON line `{"home","console","key","launch"}` with `--json` (the console address, that splice's own management key, which is made up and only good for that home, and the launch page `splice console --no-browser` wrote for it), and a human line otherwise.
- `down <home>`: stops every process of that home and removes the folder.
- Names, accounts, paths and prompts in it are made up; nothing is copied from the machine's own Splice.
- README.md says how a review uses it with tools/console-look: up, open the console and the launch page, try the write, read the effect, down.

Proven by: `bun test ./.campaign/checks/console-night-deck/own.test.ts`: up answers with a console that is not :3096 and a launch page; its /api/sessions lists a live session; /api/perf/turns, read once per head /api/heads lists (`?head=<key>&since=0&n=50`), has rows, at least one of them an error (the stand-in's 429); /api/teams a team; down removes the home and the console stops answering.

