id = "BS-4"
phase = "P3-lifecycle"
title = "Daemon survives SIGTERM and 'splice restart' races bound ports to zero daemons (observed 2x 2026-07-24; diag: probable, two defects). DEFECT A: JVM termination gates entirely on Daemon.stop() returning — no overall deadline, per-head engine stops accidentally serialized on a single-threaded runBlocking, and NO Runtime.halt() fallback, so one wedged head/Netty non-daemon thread makes SIGTERM a no-op. DEFECT B: the CLI restart proceeds to spawn a new daemon after reporting the stop failed, racing the still-bound ports (new daemon dies on bind; killing the old one afterwards leaves zero serving). Fix per diag spec (bug-sweep-raw.json): bounded stop with STOP_DEADLINE watchdog thread + halt(0) fallback in Main shutdown drivers; parallel per-head stops on a real dispatcher with per-head budget; CLI refuses to spawn while the control port is still bound (poll-free wait then abort with instructions). Walls: DaemonStopDeadlineTest (blocking heads cannot hold stop past budget); restart-refuses-while-bound covered at CLI level"
