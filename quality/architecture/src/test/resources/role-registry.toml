reason = """Two GAUGES and a CAP, and InflightGate's own KDoc draws the line: LiveLimit is "a concurrency limit READ FRESH at every admission decision, never captured at construction" — the freshness is why kotlinx Semaphore is banned there, since a live PATCH of maxInflight must change the next admission without a head restart — and it is "distinct from a GAUGE (ControlServer.failedHeads), which is also `() -> Int` but reports what IS rather than bounding what may happen next". FailedHeads is that gauge, counting heads that failed to start, which the control plane turns into `ok:false`. OpenSockets counts live WS sockets on the responses path. A gauge wired where the limit was expected admits traffic against the current occupancy, so the gate stops gating — and both are non-negative Ints, so nothing complains. RetentionDays (Oct 10) is a fourth role: the days of history the operator chose (historyRetentionDays), read fresh so a live change moves the trace window on the next day asked. It counts days to keep, not live things. RequestByteCap (Oct 10) is a fifth role and the second cap: the largest request BODY the gateway will decode, in bytes, read fresh at every request by the head path and by the ingress guard in front of it — two layers, one knob, which is why its type sits in core rather than beside either enforcer. It bounds ONE request's size where LiveLimit bounds HOW MANY requests run at once, so swapping them would cap a body at the inflight ceiling and admit as many concurrent turns as a body has bytes, and neither is a gauge of what is happening now. McpServerCeiling (Oct 10) is a sixth role and the SECOND concurrency ceiling in the group, which is the dangerous pairing here: LiveLimit bounds how many REQUESTS run at once on one head, McpServerCeiling bounds how many child PROCESSES the shared MCP host owns at once (32 by default, past which the longest-idle streamless server is evicted). Swapped, splice would cap hosted children at the inflight ceiling and admit as many concurrent turns as there are hosted servers, and both are small non-negative Ints so nothing would complain until a user noticed their turns queueing behind a process count. It is also read ONCE per spawn attempt and carried into the eviction path, because the refusal names the ceiling and a second reading could print a number that never applied. RequestByteCap, RetentionDays, LiveLimit and McpServerCeiling are the four a config PATCH changes while the daemon runs; the two gauges answer to nothing but what is running."""

