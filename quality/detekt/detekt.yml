# Lineage: copied verbatim from .rules/kotlin/detekt.yml (torad kit) 2026-07-16 (P1-KONSIST); prune with the reason in the commit message.
# Torad Kotlin Detekt Configuration
# Install: copy to project root as detekt.yml
# Builds on detekt defaults; warnings fail the build (warningsAsErrors).
# Thresholds follow "no monsters" stance — keep code small and simple.

build:
  maxIssues: 0
  weights: {}

config:
  validation: true
  warningsAsErrors: true
  excludes: ''

processors:
  active: true

console-reports:
  active: true

# === COMPLEXITY ===
# Keep functions small, classes focused, conditions simple.
complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 3
  CyclomaticComplexMethod:
    active: true
    threshold: 10
  LargeClass:
    active: true
    threshold: 400
  LongMethod:
    active: true
    threshold: 50
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 8
    ignoreDefaultParameters: false
    ignoreDataClasses: false
    # Marcos, 2026-10-09: the one exception to no-ignores. @Serializable classes mirror an outside format field by field
    # (splice.toml, saved state, the Claude and OpenAI wire bodies), so grouping their fields would change the format.
    ignoreAnnotated: [Serializable]
  TooManyFunctions:
    active: true
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15
    ignoreDeprecated: true
    ignoreOverridden: false
  NestedBlockDepth:
    active: true
    threshold: 4
  StringLiteralDuplication:
    active: true
    threshold: 4
    excludeStringsWithLessThan5Characters: true

# === STYLE ===
# Consistent formatting and idioms.
style:
  active: true
  # THE ANTI-BYPASS WALL (2026-07-18): quality findings are fixed, never suppressed. An agent
  # (any model) that @Suppress-es its way past a structural rule ships the debt invisibly — the
  # exact fix-the-gate-not-the-code failure this repo legislates against. Same-checker-twice:
  # quality/rules/kotlin/kt-no-quality-suppress.yml blocks the annotation at WRITE time; this
  # rule fails the GATE if one slips through anyway.
  ForbiddenSuppress:
    active: true
    rules:
      - 'TooManyFunctions'
      - 'LongMethod'
      - 'LargeClass'
      - 'CyclomaticComplexMethod'
      - 'ComplexCondition'
      - 'LongParameterList'
      - 'ReturnCount'
      - 'NestedBlockDepth'
      - 'MagicNumber'
      - 'MaxLineLength'
      - 'TooGenericExceptionCaught'
      - 'SwallowedException'
      - 'StringLiteralDuplication'
      - 'UnusedPrivateMember'
      - 'UnusedPrivateProperty'
      - 'UnusedParameter'
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2', '100', '1000']
    ignoreEnums: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  # NO TEST EXEMPTION (2026-10-09). Both line-length rules used to carry `excludes: ["**/test/**"]`,
  # which made the 120-column limit a property of which source set a file sat in: a test could run a
  # setup call off the right edge of the screen and no gate noticed. A test is read more often than
  # the code it covers, by whoever is diagnosing a red, so it earns the same width.
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 3
  ThrowsCount:
    active: true
    max: 2
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedPrivateClass:
    active: true
  UseDataClass:
    active: true
  WildcardImport:
    active: true
  ForbiddenComment:
    active: true
    comments: ['STOPSHIP:', 'FIXME:', 'XXX:']
  NewLineAtEndOfFile:
    active: true
  ExplicitItLambdaParameter:
    active: true
  UnnecessaryAbstractClass:
    active: true
  UnnecessaryInheritance:
    active: true
  UtilityClassWithPublicConstructor:
    active: true
  VarCouldBeVal:
    active: true

# === NAMING ===
# Consistent naming conventions.
naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-zA-Z0-9_]*)*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
    privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*'
  MatchingDeclarationName:
    active: true
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9_]*'
    propertyPattern: '[a-z][A-Za-z0-9]*'

# === POTENTIAL BUGS ===
potential-bugs:
  active: true
  CastToNullableType:
    active: true
  Deprecation:
    active: true
  DontDowncastCollectionTypes:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  HasPlatformType:
    active: true
  IgnoredReturnValue:
    active: true
  ImplicitDefaultLocale:
    active: true
  InvalidRange:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  LateinitUsage:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
  NullableToStringCall:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true

# === EXCEPTIONS ===
exceptions:
  active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'NumberFormatException'
      - 'MalformedURLException'
      - 'ParseException'
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  ThrowingNewInstanceOfSameException:
    active: true
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true

# === PERFORMANCE ===
performance:
  active: true
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

# === EMPTY BLOCKS ===
empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
  EmptyClassBlock:
    active: true
  EmptyDefaultConstructor:
    active: true
  EmptyDoWhileBlock:
    active: true
  EmptyElseBlock:
    active: true
  EmptyFinallyBlock:
    active: true
  EmptyForBlock:
    active: true
  EmptyFunctionBlock:
    active: true
  EmptyIfBlock:
    active: true
  EmptyInitBlock:
    active: true
  EmptyKtFile:
    active: true
  EmptySecondaryConstructor:
    active: true
  EmptyTryBlock:
    active: true
  EmptyWhenBlock:
    active: true
  EmptyWhileBlock:
    active: true

# === COROUTINES ===
coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithFlowReturnType:
    active: true
