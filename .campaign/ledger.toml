# The campaign ledger. Read and changed through `campaign` (run `campaign help`).
# Hand edits are fine; keep everything in fields, comments are not kept.

[campaign]
goal = "Server mode (docs/specs/server-mode.md, issue #604): one splice is a team's front door to a shared model, with per-person keys and sign-in, limits and budgets, an upstream pool for self-hosted servers, a content-free usage ledger with reports and export, and per-person metrics."
base = 'feat/provider-gateway-headers'
judged = [
  '.campaign/checks/',
  '.campaign/cases/',
]
agent = 'campaign seat --model claude-opus-5-5 --effort high'
rounds = 6

[feature."server-front"]
goal = "A splice daemon serves a team on a listener of its own: every request carries a person's key (operator-issued, hashed at rest, revocable one at a time or per person), admins manage keys from the CLI, the control plane or the listener, and each person is held to an in-flight cap and an optional requests-per-minute cap. Spec: docs/specs/server-mode.md, F1 and the limits half of F3."

[feature."server-upstreams"]
goal = "Self-hosted OpenAI-compatible servers are first-class upstreams: several per provider, health-checked and balanced with a person's preference and failover; long prefills keep the client's connection alive; OpenAI-style clients use the same keys and limits. Spec: docs/specs/server-mode.md, F4."

[feature."server-ledger"]
goal = 'Every request a person sends leaves one durable, content-free row, honestly classed, priced from the rate card and a reference card; the operator reports on it by person, team, day, model or device in JSON, CSV or markdown, exports it hourly to a folder or S3-compatible bucket, and sets daily and monthly budgets per person and team that warn or block. Spec: docs/specs/server-mode.md, F5 and the budgets half of F3.'

[feature."server-signin"]
goal = "A team member signs in once with the company's identity provider and their laptop gets a per-device key it rotates without breaking a running session; the server hands the laptop everything it needs. Spec: docs/specs/server-mode.md, F2."

[feature."server-metrics"]
goal = "Whoever runs the box sees each person's traffic live, from Prometheus on the listener and from the operator's OTLP collector. Spec: docs/specs/server-mode.md, F6."

[feature."server-hardening"]
goal = "What the server-upstreams reviewers found past its items' words: a person's key stays at the server on the Messages route as it does on the OpenAI route, an answer the upstream cuts short is an error the client sees, the provider's own response headers and usage nobody asked for stay at the server, the OpenAI route answers a lookup of one model, and it is kept alive through a long prefill as the Messages route is. Spec: docs/specs/server-mode.md, F1 and F4."

[feature."gpt-speed"]
goal = "A person running a GPT head signed in with ChatGPT switches it to Fast or Ultrafast as in Codex: /fast and /ultrafast in Claude Code's own menu, told at once what each costs, applied to that session's turns on the wire as Codex sends them, and recorded at the speed each turn was served at. Spec: docs/specs/gpt-speed.md."

[feature."desktop-door"]
goal = "Someone who uses Claude Desktop points its Code tab at splice the way Claude Code is pointed at Bedrock: splice desktop on is the whole setup, the tab's model picker then lists every model splice serves from every head it holds a credential for, picking a model runs the session on that model's head, the tab's sessions share the claude command's folder, Chat, Cowork and the terminal run as they did, and splice desktop off puts the tab back on the person's own Claude login. Spec: docs/specs/desktop-door.md."

[feature."muse-tool-cache"]
goal = "A Muse session pays for its conversation once. When Claude Code's ToolSearch loads a tool in the middle of a conversation, or a server adds or takes away a tool, the request that carries the change and every request after it read everything the conversation had already sent from Meta's prompt cache, and the model's call of the tool reaches Claude Code under the tool's own name, with its arguments. On 2026-11-16 each of 26 loads in one five-hour window made Meta read a whole conversation again at the full price, 2.69 million tokens. Spec: docs/specs/muse-tool-cache.md."

[feature."server-profile"]
goal = 'A laptop takes its commands from the team server it joins: the server answers a key holder with what it offers (each command, its models and their windows, the sign-in configuration, the telemetry relay and the minimum client), a person keeps an operator-issued key as a sign-in keeps its own, links every command the server offers in one step, follows the server as it adds and drops commands, and pins a window of its own when it wants one. Spec: docs/specs/server-mode.md, F7.'

[feature."server-policy"]
goal = "An operator decides who may use what on the team server: which commands a team and a person may use, how many tokens a person may spend in a minute, and the oldest splice a laptop may run, with an older laptop told in the conversation what to upgrade to. Spec: docs/specs/server-mode.md, F9 (the server's half) and F12."

[feature."server-pool-costs"]
goal = "The team server keeps a session's turns on the upstream that has its prompt cached, and its usage reports count what a box rented by the hour costs beside the per-token prices. Spec: docs/specs/server-mode.md, F10 and F11."

[feature."server-telemetry"]
goal = "A team's server relays each person's Claude Code telemetry to the operator's collector with the person stamped on it, every laptop launch sends it there and says which splice it runs, so the operator sees who used what and which laptops to upgrade."

[feature."telemetry-relay"]
goal = '''
# server-telemetry: the last piece of server mode (issue #604, items 7 and the client side of 9)

## Who it is for
An operator running a splice server as a team's front door to a shared self-hosted model, and the people
whose laptops are linked to it with `splice remote add`.

## What Marcos decided (Nov 18, 2026)
The relay is built as #604 asks. The pause the door lead put on it on Nov 16 (tracking of people, to be
planned with him first) is lifted by his decision: the operator's collector receives each person's Claude
Code telemetry with the verified person and team stamped on it.

## Outcomes
- The two existing items, server-telemetry-relay and server-telemetry-recipe, are the plan. Their specs
  and checks in the ledger hold; keep them unless reading the code shows a check is wrong.
- Server: `[server.telemetry] forward_to` names the collector. POST /server/otlp/v1/{metrics,logs,traces}
  with a person's key, JSON or protobuf. The server sets splice.person, splice.team and user.email on every
  resource whatever the client claimed, forwards in the same encoding without the person's key. No key is
  401; a server with no relay has no such route. The server profile names the relay.
- Laptop: a command linked from a server with a relay launches Claude Code with telemetry on, OTLP/HTTP
  metrics and logs to the server, and an otelHeadersHelper that sends the key, which is never in the
  environment. Prompts are never logged. Organisation-managed settings (remote-settings.json) that set
  telemetry of their own win; managed settings that set none leave the relay on.

## Evidence to start from
- Code written for both items on Nov 17 (f8d9b46) was taken back out on Nov 18 and kept on the local
  branch `parked/server-telemetry-relay`. Reuse it where it fits.
- docs/specs/server-mode.md is the feature's spec.

## Constraints
Follow repo CLAUDE.md and AGENTS.md: tests check what a user sees or a route returns; boot fails closed on
config findings; no Python; no new top-level functions or companion objects.'''

[feature."door-default"]
goal = "One command, claude, reaches every model a person is signed in to: it runs on the door Claude Desktop already uses, /model lists the models of signed-in accounts, /login opens splice's accounts page where any account is signed in, a fresh install works this way from the first run, and whoever still starts a session through a head's own command is told that those commands are going away. Spec: docs/specs/door-default.md."

[feature."capabilities"]
goal = "A capability is a piece of work splice runs around a session's turn, declared in splice.toml and run by a worker that can live outside splice: splice calls it by rule, holds the turn while it works, and puts its text into the session's first user message, where it stays on every later request; a failure lets the turn go on or refuses it, as declared (docs/specs/harness.md, decisions 1 to 6 and 10)."

[feature."held-status"]
goal = "A person sees on the session's status line what a held turn is doing, how long ago it last said so and how many turns are held, whether a capability or a usage limit holds it."

[feature."harness-module"]
goal = "The harness lives in a module of its own (docs/specs/harness.md, decision 11): the capabilities, their rule and workers, the Context Getter and the agent's call grow there without touching the turn, which knows them only through a port it owns, and every capability works for a person exactly as it did."

[feature."context-getter"]
goal = "On a session's first turn, the head's fast model explores the session's folder at its own effort and the session's model starts with what it found, as if the person had pasted it: on the drain task this cut the time to the first code from 16 and 23 minutes to 4 and 6. The person sees each step it takes, splice owns its process, and it works on the door (docs/specs/harness.md, decision 9)."

[feature."capability-mcp"]
goal = "A capability's work can be a tool of an MCP server the hub runs, declared in splice.toml like an HTTP worker, with its progress shown while the turn waits (docs/specs/harness.md, decision 13)."

[feature."agent-call"]
goal = "The model calls a capability itself, as a tool the client never sees: splice answers the call while the turn waits, streams the rest as one response, and keeps the call in the provider's history byte for byte so every cache prefix holds (docs/specs/harness.md, decision 12)."

[feature."harness-says"]
goal = "While a capability of round two holds a turn, the session's status line says what it is doing: the Context Getter's exploring and its tool-use summaries, an MCP worker's progress, and the agent's call. These wait on held-status's status-line piece (held-says), so they are a feature of their own and the round's other features don't wait on it."

[feature."claude-adds"]
goal = "Someone who runs Claude on their own Claude plan keeps it and gains every other account: claude stays on its head, starts on their own default as it did, and /model lists Claude's models with the models of their other signed-in accounts beside them. A request that names another account's model runs on that account, with its own login and its own window, and the person's Claude login never reaches another provider. A session that runs out on one provider moves to another with /model and keeps its conversation. Spec: docs/specs/door-default.md, decision 9."

[feature."custom-provider"]
goal = '''
# custom-provider: a team's own inference endpoint on the door (issue #680)

## Who it is for and why
A team at work runs a self-hosted model (GLM-5.3-Flash) behind an OpenAI-compatible gateway, with a small CLI
of its own that signs each person in through the company's identity provider and mints a short-lived personal
key. Today the CLI writes a provider and a head into splice.toml, and people run the head's command. Heads are
deprecated and the door is where `claude` runs, but on the door such a provider is a second-class citizen: its key
is a static env var or keys.toml entry, nothing in splice can sign the person in or renew the key, and until
today it was never in /model. On Nov 18, 2026 Marcos said this is why his team can't use the door at work.
The goal: such a provider gets on the door what Claude Code gives Amazon Bedrock — a base URL, a credential a
command obtains and refreshes, model mapping, windows and a picker — so the team moves off the head command.

## Already done, not part of this feature
The `splice` seat is landing the picker fix in its own PR (commit 29cf85c1f, on 5c701d9c7): a head on an API key
or a local server is listed in /model with the models splice.toml declares for it, or every model it lists when
it declares none (DesktopLineup.picker, door-default.md decision 4, DoorPickerRowsTest). Build on
DesktopLineup.picker. The campaign check .campaign/checks/door/picker.test.ts still pins the old rule (a key head
has no row) and must be rewritten in this plan.

## Outcomes (each is observable by a person or on a route)
1. Picker: a provider's models carry their own label and description in /model; a provider or head can opt in or
   out of the picker explicitly (e.g. `picker = true|false`).
2. Head features on door turns: everything a head of the provider has today behaves the same on a door turn —
   `local` (per-turn token counts, reasoning replayed as reasoning_content), `stream_usage`, `slot_affinity`, the
   effort vocabulary, `extra_headers` and `forward_headers`.
3. Install a published provider: `splice add provider <file|url>` installs a team's provider definition (provider,
   head, models) with no hand-edited TOML; it refuses a definition with findings, all listed, like boot does.
4. Login by command (like Claude Code's apiKeyHelper / awsAuthRefresh): a provider names `login_command` (an
   interactive sign-in, e.g. the team CLI's browser OAuth) and `credential_command` (prints the current credential
   with its expiry as JSON). splice calls credential_command when it has no key, when the key is near expiry, and
   once after the provider answers 401, then retries the turn once.
5. Accounts: the accounts page shows the provider as an account (signed in or not, expiry); its "Sign in" runs
   login_command; /login on the door reaches it like a ChatGPT or Grok sign-in.
6. No credential, no request: a missing or failed credential is refused in Anthropic's error shape, naming the
   provider and how to sign in; nothing goes upstream.
7. Tier mapping: opus, sonnet, haiku, fable and the small-fast model map to the provider's models (as model_slots
   does); a door session on the provider's model sends Claude Code's side calls (titles, subagents naming a tier)
   to that provider, not the door's default.
8. Windows: a model's declared context_window applies when it is picked, and the door session's window and
   auto-compaction follow the pick (see splice CLAUDE.md section 22: splice writes the reported counts, so scale
   them; never spell a row past its real ceiling). Optionally the provider names a URL reporting its served
   window, read at start.
9. Max output tokens per model, and the effort/thinking mapping, as heads have.
10. The provider's answers pass through: a 503 with Retry-After reaches Claude Code so it retries; a 4xx whose
    message the provider wrote ("update your CLI") is shown as written, whole, not cut to its first sentence.
11. TLS trust: a provider-level `ca_file`, and the OS trust store, so a corporate TLS-inspecting proxy does not make
    every turn fail with PKIX.
12. A named command on the door: a wrapper can start a session on the door with a given starting model and picker
    without moving the person's plain `claude` lane; a `--settings` overlay the wrapper passes (env, otelHeadersHelper)
    merges with splice's overlay (picker, /login hook) instead of replacing it.
13. Diagnostics: `splice claude` and `splice doctor` name the provider (listed or left out and why, credential state,
    last error); /api/perf/turns rows carry the provider like any head's.
14. Client identity: an optional header with the splice version and the wrapper's version, so a gateway can gate
    outdated clients and say so in-session (server-client-header already sends splice's version to a splice
    server; reuse it).

## Done looks like
On a machine with only splice and the team's provider definition installed: `claude` (or the team's wrapper) on
the door lists only the team's model in /model; /login signs in through the team's own flow; the key renews by
itself; the window is the model's own; a loading model or an outdated client gets the gateway's own message.

## Constraints
- Repo CLAUDE.md and AGENTS.md hold: vendor facts stay in their provider module; heads are isolated; boot fails
  closed; reasoning effort never varies by turn type; retries are total; tests check user-visible behavior only;
  no Python; no new top-level functions or companion objects; console changes are judged from captures.
- Credentials from credential_command are never logged or written to the environment of child processes.
- Console (accounts page) changes need dark/light captures at 1440px and ~3600px.'''

[feature."desktop-full"]
goal = '''
# Claude Desktop, fully on splice (`desktop-full`)

Goal handed to the campaign on Nov 18, 2026. It follows `desktop-door.md`, whose door is built but has never run in
the real app.

## Who it is for and why

Someone who uses Claude Desktop (Chat, Cowork and the Code tab) and runs splice. Asked for on Nov 18, 2026: Desktop
fully supported, with nothing left uncovered. splice should be to Desktop what Amazon Bedrock or an LLM gateway is to
it: the provider Desktop is configured for, so that every model splice serves can be picked inside Desktop, and
Desktop's features work as they do on any provider Anthropic supports.

## Where it stands (read Nov 18, 2026)

- The door (`/desktop/v1/messages`, `/count_tokens`) is built and its campaign checks pass (#637, #653, #656, #667).
  It has never served the real app. On this machine Desktop 5.11492.5 is installed and the door is on, but Desktop's
  Code-tab environment store (`~/.config/Claude/ccd-environment-config.json`) does not exist, so the Code tab runs
  on the person's own Claude login.
- The person has to paste five variables into Desktop by hand. splice can't write that store: Desktop encrypts it
  with the keyring.
- Desktop's picker lists only Claude's models, and splice can't add rows to it in standard mode. Every Claude model
  picked in Desktop runs the door's saved default (`claude-codex--gpt-6.1-sol`), because `DoorRouting` sends a tier
  from a session that named no selector to the caller's default. The terminal's `claude` was fixed on Nov 17–18 to
  run a Claude model on the Claude accounts added to splice (the `claude` head is in the door, 15 models). Desktop
  wasn't.
- The door answers no `GET /v1/models`.

## What Anthropic documents (read Nov 18, 2026)

Desktop has a supported way to put a provider under the whole app: **Claude Desktop on 3P**
(https://claude.com/docs/third-party/claude-desktop/overview, `/gateway`, `/code`, `/models`, `/configuration`,
`/configuration-format`).

- `inferenceProvider: "gateway"` with `inferenceGatewayBaseUrl` and a credential routes Chat, Cowork and Code through
  a gateway that implements the Anthropic Messages API. `POST /v1/messages` (streaming, tools) is required.
  `GET /v1/models` is optional and fills the picker; auto-discovery keeps only IDs that read as Claude.
- `inferenceModels` builds the picker in Chat, Cowork and Code. Each entry has `name` (the ID sent), `labelOverride`,
  `supports1m`, `prefer1m`, `anthropicFamilyTier` (the tier alias it stands for), `isFamilyDefault`, `behavesAs`
  (the Claude model whose effort levels and limits it gets) and `maxEffort`. The first entry is the default. Also
  `defaultModelEffort`, `alwaysStartWithDefaultModel`, `modelDiscoveryEnabled` and `modelPrefer1mContext`.
- Credentials: `inferenceGatewayApiKey` and `inferenceGatewayAuthScheme` (bearer or x-api-key),
  `inferenceCredentialHelper` (an executable that prints the credential), or `inferenceGatewayOidc` /
  `inferenceIdpOidc` sign-in. `inferenceCustomHeaders`.
- The Code tab's Claude Code gets these as launch environment and options ("always applied": provider, credentials,
  `inferenceModels`, `autoModeEnabled`, `autoModeClassifierModel`, OTLP keys, `inferenceMaxTokensPerWindow`,
  `organizationInstructions`, `managedMcpServers` and more) or as managed policy.
- Where the configuration lives on Linux: the per-user local configuration is `~/.config/Claude-3p/configLibrary/`
  (`_meta.json` names the applied config, one `.json` per config; the in-app window writes it, and other vendors'
  CLIs write it too). The managed configuration is `/etc/claude-desktop/managed-settings.json`, root-owned.
  The app opens in 3P mode at launch when a provider is configured; its data then lives under `~/.config/Claude-3p`.
- What 3P mode costs the person: Chat and Cowork move to the provider as well, conversations are stored on the
  device, identity is local, Anthropic-hosted cloud environments and Remote Control aren't offered, and SSH sessions
  need a gateway address that isn't localhost.
- A gateway should keep `cache_control` intact and return `usage.cache_creation` with `ephemeral_5m_input_tokens`
  and `ephemeral_1h_input_tokens` (Chat and Cowork ask for 1h). It should forward `anthropic-beta`/`anthropic-version`
  and body fields as open lists, return integer `retry-after` and `x-should-retry`, forward
  `anthropic-ratelimit-unified-*` for the usage display, and pass error bodies through unmodified
  (https://code.claude.com/docs/en/llm-gateway-protocol). Claude Code sends `x-claude-code-session-id`,
  `x-claude-code-agent-id` and `x-claude-code-parent-agent-id`.
- Standard mode (signed in to claude.ai) keeps Desktop's own `ANTHROPIC_BASE_URL` for the Code tab. That's why the
  existing door uses the Mantle switch from the environment store.

## What the installed app does (Desktop 5.11492.5, read from its bundle on Nov 18, 2026)

Read from `/usr/lib/claude-desktop/resources/app.asar` (main process). Confirm each point in the live test before
building on it.

- **Standard mode's picker can't be changed by splice.** Desktop's UI never reads the models that its Claude Code
  reports. So `modelPicker`, `availableModels` and `ANTHROPIC_CUSTOM_MODEL_OPTION` in `~/.claude/settings.json` shape
  Claude Code's own `/model` only, never Desktop's picker. Only 3P mode gives a picker splice controls.
- **3P picker source:** the `inferenceModels` list first, else discovery, else a built-in catalog. For the `gateway`
  provider, discovery is `GET {base}/v1/models?limit=1000&after_id=…` with `anthropic-version: 2023-06-01`, up to 3
  pages. It reads `data[].{id, display_name, supports_1m, max_input_tokens, anthropic_family_tier,
  is_family_default}`, `has_more` and `last_id`. IDs are filtered: for gateway and mantle, a row with
  `anthropic_family_tier` passes. For `mantle` with a static token or helper, discovery is off and the picker is only
  `inferenceModels`. Desktop also gives Claude Code `availableModels` (exact match) and a `modelPicker` built from the
  list.
- **3P base URLs accept loopback http** (`allowLoopbackHttp`), so `http://127.0.0.1:<port>/desktop` is valid for
  `inferenceGatewayBaseUrl` and `inferenceBedrockBaseUrl`.
- **3P scope is the whole app.** There is no Code-tab-only scope. `deploymentMode` is any, 3p or 1p; `any` shows a
  chooser at sign-in.
- **3P sets Claude Code managed settings:** `CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST=1`, `DISABLE_GROWTHBOOK=1`,
  `CLAUDE_CODE_MODEL_CATALOG=0`, `CLAUDE_CODE_DISABLE_FAST_MODE=1`, `DISABLE_FEEDBACK_COMMAND=1`,
  `CLAUDE_CODE_ENABLE_AUTO_MODE`, `CLAUDE_CODE_AUTO_MODE_SERVER`, `CLAUDE_CODE_MAX_CONTEXT_TOKENS=200000` (1M through
  `[1m]` on the ID), and `disableClaudeAiConnectors: true`. Under the 200000 window, splice scales the counts it
  reports so each model compacts at its own window (repo CLAUDE.md §22, door decision 5).
- **The credential:** a static token or `inferenceCredentialHelper`, which Desktop runs and puts in the session's
  environment (as `AWS_BEARER_TOKEN_BEDROCK` under mantle). Desktop sets no `apiKeyHelper`.
- **Desktop's main process calls the base itself, not only its Claude Code:**
  - `POST {base}/v1/messages`, not streamed, for the connection test (`max_tokens` 1), Claude in Chrome one-shots,
    and title and side calls. Under mantle it sends **`x-api-key`**, not Bearer (Bearer only with the bearer
    scheme). The door accepts only Bearer today.
  - A reachability probe, `GET {origin}/`, which hits `127.0.0.1:<port>/`, not `/desktop`.
- **Standard mode with a provider switch is a case Desktop expects.** Any truthy `CLAUDE_CODE_USE_*` in the session
  environment makes it skip its model check against the account and not treat a model 401 as an expired Desktop
  token. The env store drops `CLAUDE_CODE_PROCESS_WRAPPER`, `CLAUDE_CODE_AUTOUPDATER_DISABLED_BY_HOST`,
  `CLAUDE_CODE_SIMPLE` and `CLAUDE_AGENT_SDK_MCP_NO_PREFIX`. `CLAUDE_CODE_HOST_OFFERS_DEVICE_MCP` is deleted unless
  Desktop sets it, which corrects `desktop-door.md`'s "Dropped" row. Desktop sets `API_TIMEOUT_MS=900000` itself.
- **Feature by feature:**
  - In 3P: cloud sessions, Remote Control and the bridge are off, and the Cowork VM gives way to a CLI on the host.
    Fast mode is off. Auto mode needs the gateway's server-side classifier check, or it shows as unavailable.
    Usage shows a cost estimate from `inferenceModelPricing*`.
  - Standard mode under the switch: titles, Remote Control and claude.ai connectors are unknown. Claude Code has a
    cross-org guard that likely keeps connectors off.
  - Hooks, permission modes, worktrees, preview, files and images are local to the host or inline in the body, in
    both modes.
- **Unknown:** the standard-mode picker's server source, standard mode's title path, connectors and Remote Control
  under the switch, and the Developer-menu path on screen.

## Outcomes

1. **Desktop on splice as its provider (3P gateway mode).** One command (e.g. `splice desktop on --app`, name it as
   you see fit) writes a Desktop 3P local configuration in `configLibrary` that points Desktop at splice's door as a
   gateway. The person pastes nothing. The credential comes from `inferenceCredentialHelper`, a splice command that
   prints the desktop key, so no key is written in the file. `off` restores what was there, and Desktop returns to
   the person's claude.ai login. splice never touches the managed file in `/etc`. The command says, before it
   switches, what the person gives up (Chat and Cowork on splice too, local history, no Remote Control or cloud
   environments) and that Desktop must be relaunched.
2. **Every splice model in Desktop's picker,** in Chat, Cowork and Code, with the same rows as the terminal picker
   (`DesktopLineup.picker`). Each row has its label; `behavesAs` or `anthropicFamilyTier` so effort and limits are
   right; `supports1m` only where the model really takes 1M; and `maxEffort` from the head's effort vocabulary.
   Prefer the `gateway` provider with discovery: the door answers `GET /desktop/v1/models` in the shape Desktop
   reads (`id`, `display_name`, `supports_1m`, `max_input_tokens`, `anthropic_family_tier`, `is_family_default`,
   paging with `has_more`/`last_id`), so the picker follows the lineup at each launch. Rows must pass Desktop's ID
   filter. Use `inferenceModels` where discovery can't carry a field. Whichever is chosen, a sign-in or an added head
   reaches the picker at Desktop's next launch, and `splice desktop` says when a relaunch is needed.
3. **Claude picks run on Claude.** In both modes, a Claude model picked in Desktop runs on the Claude accounts added
   to splice (the `claude` head) when it serves that model, as the terminal does since Nov 18. The saved default
   stands in only when no head serves it. Tier aliases (`opus`, `sonnet`, `haiku`, `fable`) and side calls follow
   the session's head.
4. **Standard mode stays and gets its gaps closed.** The existing Code-tab-only door (the Mantle env store) remains
   for people who keep Chat and Cowork on claude.ai. Its window, tiers and recorded turns keep working.
5. **Wire parity with what Desktop expects of a gateway:**
   - The desktop key is accepted as `x-api-key` as well as Bearer.
   - `GET /` (Desktop's reachability probe) answers.
   - Desktop's own non-streamed one-shots (connection test, titles, Claude in Chrome) run like any door turn.

   Also: `cache_control` untouched, `usage.cache_creation`
   ephemeral 5m/1h fields, integer `retry-after`, `x-should-retry`, `anthropic-ratelimit-unified-*` from the head's
   own limits so Desktop's usage display means something, error bodies whole, and agent/session headers recorded
   on `/api/perf/turns`. `count_tokens` is answered on every head.
6. **Desktop features that depend on the backend** each work, or are named as unavailable with the reason in
   `splice desktop` (see the app study below): Auto mode and its classifier model, effort selector, 1M/context meter
   and compaction, title generation, subagents, web search/fetch on non-Claude heads, images and files, MCP, scheduled
   tasks.
7. **Diagnostics:** `splice desktop` and `splice doctor` say which mode Desktop is in (standard with the env store,
   3P with splice's configuration, 3P with someone else's or a managed file, or off), whether Desktop has been
   relaunched since the config changed, the picker rows, and the last turn per mode.
8. **The live test is run on the real app**, both modes, and its findings are written into the spec: picker rows,
   a turn on a GPT head, on a Grok head and on Claude, a subagent naming a tier, a long session that compacts, Chat
   and Cowork turns in 3P mode, and `off` restoring the person's login. Captures attached to the PR.

## Constraints

- Repo CLAUDE.md and AGENTS.md hold. Tests check what a user sees or what a route returns. Vendor facts (Desktop's
  config format and paths) stay in one module. Boot fails closed. No Python. No new top-level functions or companion
  objects. Reasoning effort never varies by turn type.
- Never read or write Desktop's keyring-encrypted stores, the keyring itself, or `/etc/claude-desktop`. Never print
  the desktop key.
- splice CLAUDE.md §22: splice writes the values on both sides of the wire (the picker rows, windows, counts), so
  fix behaviour by what splice writes before anything else. Reverse-engineering Desktop is a last resort.
- The `custom-provider` campaign (issue #680) is changing the door at the same time: the terminal picker and tier
  mapping for key heads. Build on `DesktopLineup.picker` and its tier mapping, and don't fork them.
- A change to the console's Desktop card needs captures in dark and light themes at 1440 px and ~3600 px.'''

