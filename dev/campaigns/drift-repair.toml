# [2026-08-31] 2026-08-31 DIAGNOSED by grok-splice, relayed via codex-splice, read-only against live daemon PID 701049. FIRST correction to my own note: the state dirs are ~/.claude-codex/state and ~/.claude-codex/logs - the root daemon.log I called a stale July Node-era file was a DECOY, and the real bodies were readable the whole time. The claude-grok half is NOT a vendor 5xx and NOT size-related. All 6 error:upstream-failed bodies are byte-identical HTTP 400 code=invalid_image, message 'Image dimensions 1x1 are too small. Both width and height must be at least 8 pixels.', appearing at BOTH ~5.7MB and ~1.0MB request sizes - which is exactly why the size correlation I drew from the perf rows was a coincidence. Splice's outbound image pipeline is shipping a 1x1 image to xAI. The existing 200-char safe error snippet had already retained the body, so no new capture and no new diagnostic surface was needed to reach this. Split out as DR-155 for the actual repair. The claudex empty_model and overloaded_error observations are DELIBERATELY NOT folded into that verdict: the 12 empty_model rows at 7.1MB are CX-09 Success-then-empty gateway decisions carrying SSE events and out_tokens, so by construction they have no upstream error body at all, and the live jar predates HEAD's finish-degraded line. Those stay open under this row.
