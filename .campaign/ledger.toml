[[row]]
id = 'df-wire-answers'
title = "Door answers carry Desktop's gateway usage, retry and error fields on every head"
feature = 'desktop-full'
status = 'todo'
owner = ''
blocked_by = []
guard = false
spec = '''
A door turn's answer is what Desktop expects of a gateway, on every head (outcome 5; https://code.claude.com/docs/en/llm-gateway-protocol).
- Usage: every answer, streamed (message_start, and message_delta where it carries usage) or not, has `usage.cache_creation` {"ephemeral_5m_input_tokens", "ephemeral_1h_input_tokens"} as integers that add up to `cache_creation_input_tokens`, after any window scaling. On a head whose provider doesn't split cache writes, the write counts as 5-minute, matching what splice charges. Chat and Cowork ask for 1h, and an Anthropic head passes Anthropic's own split through.
- To an Anthropic head (anthropic-passthrough), the body's cache_control blocks and fields splice doesn't know (context_management, any future field) are sent as Desktop sent them. `anthropic-beta` is sent as an open list holding every value Desktop sent, and `anthropic-version` as sent.
- Refusals: an Anthropic head's error body reaches Desktop whole, every field as Anthropic wrote it. On other heads, how much of a provider's own message is shown stays as splice has it: today ProviderWords' filter, and once custom-provider's cp-errors (#680, outcome 10) has landed on main, the provider's `error_messages` setting. The two campaigns run side by side and either may land first: if cp-errors is on main when you build, build on its Retry-After pass-through, not around it; if not, put the whole-seconds rule (below) where every door refusal is written, so cp-errors can build on it. Do not add an error_messages setting here.
- Every refusal the door answers carries `x-should-retry`: "true" on a 408, 409, 429 or 5xx, "false" on any other 4xx.
- A Retry-After is in whole seconds, rounded up: a provider's "6.2" or an HTTP date becomes an integer. That holds for both `retry-after` and splice's own.
- Door answers already carry the head's own limits as Anthropic's unified rate-limit headers (an Anthropic head's as sent, a ChatGPT head's 5-hour and weekly windows as the same family, none from a head that reports none). That was true on main when this was planned, so it is not built here: wire-limits.test.ts is this item's second check and keeps passing through the relay and refusal changes.
- count_tokens is answered on every head: forwarded where the provider counts (Anthropic), counted by splice where it can't (OpenAI chat, Responses), and scaled as today.
Files: the head's answer writing in features/turns and the dialects (integrations/dialects/*), and the relay's refusal path in the share module. Proof: `bun test ./.campaign/checks/desktop-full/wire-answers.test.ts`.

Shared across desktop-full (decided once, the same in every item): one door at /desktop on the control port and one desktop key serve both of Desktop's modes. "Standard mode" is today's Code-tab door through Desktop's environment store (`splice desktop on`). "App mode" is Desktop's third-party gateway mode, the whole app on splice (`splice desktop on --app`). In JSON the mode is one of "off", "standard", "app", "other" (a third-party configuration that is not splice's). Every request Desktop sends in app mode carries the header `x-splice-desktop: app`, which splice writes into the configuration's inferenceCustomHeaders. That header is how the door tells an app-mode request from a standard one. Refusals keep the door's Anthropic error shape and the "splice desktop: " prefix. Picker rows are DesktopLineup.picker, the terminal's rows (don't fork them; the custom-provider campaign, #680, is changing labels and tiers there at the same time). Vendor facts about Desktop (paths, key names, row fields, ID filter) live in integrations/claude-code/src/main/kotlin/splice/client/desktop/, beside the other Desktop facts. Goal: docs/specs/desktop-full.md.'''
