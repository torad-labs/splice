phase = "responses"
title = "SharedSummaryParts.trimToLast (Turn.kt:100-105) evicts by VALUE across all keys, so trimming one aged copy of a part revokes a dedup record still in force for a different item — silently re-enabling the duplication the mechanism exists to kill. emittedParts legitimately holds duplicates: when an item recap cursor is RECAP_DONE, markEmitted(oi, part) appends a second copy of a part already recorded under a different oi, which is the documented 2026-07-20 coincidence behaviour. trimToLast then drops emittedParts[0] and does itemEmitted.values.forEach { it.remove(dropped) }, stripping that string from EVERY item set including items whose own copy is still present in the list. Concrete: a multi-day session on one conversation key; ConversationSummaryParts.forConversation trims to 512 on every fetch and the file header records a live session that reached about 1600 parts, so trimming is the steady state rather than an edge; once a coincidentally-shared paragraph oldest copy ages out, the still-live item set no longer knows it emitted that paragraph, the next reasoning_summary_text.done restating it passes markEmitted as fresh, and the duplicate paragraph reaches the client thinking block — the exact user-visible symptom this whole subsystem was built to eliminate. The state also grows, since a third copy is appended. Fix: reference-count parts, or condition the itemEmitted removal on the dropped part no longer being present in emittedParts. Land with DR-5, which owns the other half of this file bounding story."
