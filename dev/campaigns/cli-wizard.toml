# [2026-09-15] SLOT - complete design, zero design freedom. This row exists because the operator asked for it directly: during the wizard, ask in a multi select which supported heads the user wants installed, and install them, to make it easier. It also retires the awkwardness CW-7 review exposed, where the single-select had no honourable consequence because install was fixed - now the pick genuinely decides what gets installed. (1) THE WIDGET ALREADY EXISTS AND IS ALREADY WALLED. Use MultiSelectPrompt from the toolkit. It is built, its non-TTY path is correct including the minimum check, and CW-8 covers it. Do not write a new widget. (2) THE DENOMINATOR IS AddProfiles, NOT A LIST YOU TYPE. AddProfiles holds six profiles - codex, grok, kimi, muse, claude, api-key - each already carrying a name and a written summary, and it is the same catalog splice add dispatches on. Add ONE accessor returning the profiles - find and describe exist, a list accessor does not - and build the options from it. A hand-typed list here is a tautology wearing a green tick: it cannot offer a profile nobody remembered to add. Assert in a test that every AddProfiles entry is either offered or excluded BY NAME with a reason, so a seventh profile fails this test rather than silently missing from the wizard. (3) TWO PROFILES CANNOT BE COMPLETED FROM A TICK AND MUST NOT BE OFFERED AS IF THEY COULD. api-key has baseUrl null and headKey empty; claude needs no credential but still needs a name. A tick that cannot finish is the same false affordance I sent CW-7 back for twice. Exclude them from the ticklist, and print one dim line naming the exact splice add command for each. Excluded means named with a reason, never absent. (4) HINTS COME FROM CW-6 SetupDetection, which already knows what is on disk: credential present, sign-in needed, or already installed when the head key is in the topology. An already-installed head is shown and NOT tickable. (5) PRE-TICK the profiles whose credential SetupDetection already found, and nothing else. That is the one place the wizard may guess, and it guesses from the filesystem rather than from taste. (6) INSTALL BY CALLING AddCommand PER PROFILE. Do not re-implement the TOML write. AddCommand already does candidate-parses, credential present, base URL answers, models listed, atomic save through a temp file and one rename, and leaves the previous file byte-identical on any abort before the save. Pass the flag that suppresses its own confirm so the user is not asked twice - read AddArgParser for the exact spelling rather than guessing it. (7) RESTART EXACTLY ONCE. AddCommand carries a DaemonRestart seam. Injecting the real one per profile would restart the daemon once per ticked head, which on six heads is six cutovers and a guaranteed dropped session. Inject a no-op collector and restart once at the end, only if at least one head was actually added. Assert the restart count is at most one. (8) ONE FAILING HEAD MUST NOT ABORT THE OTHERS. Collect per-head outcomes, keep going, and end with a line naming which landed and which did not. A partial success that reports total success is worse than a failure. (9) NON-TTY PARITY IS UNCHANGED AND IS THE GUARD ON ALL OF THIS. A headless run must still write exactly the CW-7 captured oracle. MultiSelectPrompt with no console returns its initial selection when it meets the minimum - so headless must tick NOTHING and add NOTHING, and CW-7 oracle test must pass untouched. If that test needs editing to accommodate this row, stop and tell me, because that edit would be the regression. (10) THE SUMMARY NOTEBOX MUST NAME EVERY HEAD ABOUT TO BE ADDED AND EVERY PATH THAT WILL CHANGE, before the confirm. The confirm has been load-bearing since CW-7 and this row adds writes to what it governs; a Summary that omits the heads is consent obtained under a false statement, which is the defect this campaign has now produced twice.
# [2026-09-15] SLOT AMENDED 2026-09-15 on operator instruction - three additions, and the good news is that two of them are already free if the row is built as specified. (1) DEEPSEEK MUST BE TICKABLE. It is now in AddProfiles as of V4-35, so because this row derives its options FROM AddProfiles rather than a typed list, it appears with zero edits here. That is the denominator discipline paying for itself - do not hand-type it, and do not special-case it. (2) OPENROUTER MUST BE TICKABLE TOO, and it currently CANNOT be, because there is no openrouter entry in AddProfiles - the catalog holds codex, grok, kimi, muse, deepseek, claude and the generic api-key. V4-34 adds that profile. This row DEPENDS on V4-34 for the OpenRouter option to exist; do not add the profile yourself, that fence belongs to splice-builder2. (3) TICKING A PROFILE WITH NO CREDENTIAL MUST ASK FOR THE KEY THERE AND THEN. This is also already free: AddCommand.authenticate at line 42-45 already does credential-already-present, else confirm Sign in now, else call login - and LoginIo.apiKeyLogin gives a MASKED console prompt and writes the key to keys.toml at 0600, telling the operator live daemons pick it up on the next request. So routing the ticked profiles through AddCommand, which rule 6 of this slot already mandates, delivers the operator's ask without a line of new prompt code. WHAT THIS MEANS FOR YOU: do not write a key prompt. If you find yourself writing one, you have bypassed AddCommand and that is the defect. THE NON-TTY OBLIGATION GETS SHARPER, NOT LOOSER, because of this. apiKeyLogin with no console does NOT hang - it prints the splice key set --stdin recipe and returns. Your headless path must still tick nothing and add nothing, so this branch should never be reached headless; assert that a headless wizard run performs zero logins. A wizard that blocks on a key prompt inside a Docker build is the single worst thing this campaign can ship, and CW-8's wall covers the widgets but NOT AddCommand, so this assertion is the only thing standing there. ONE THING I VERIFIED SO YOU NEED NOT: login parity across api-key heads is already real, not aspirational. LoginCommand dispatches on auth.kind rather than on provider name, so a deepseek head takes the identical masked-prompt path an openrouter head takes, and signInHeads counts any kind ending in oauth plus api-key. The operator asked whether login inside the deepseek head would work like openrouter - it does, by construction. Pin it with a test anyway: a claim nobody asserts is a claim that quietly stops being true.
