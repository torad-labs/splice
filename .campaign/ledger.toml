[[row]]
id = 'cp-login'
title = 'login_command signs a person in, from splice login and the control plane'
feature = 'custom-provider'
status = 'todo'
owner = ''
blocked_by = [
  'cp-credential',
]
guard = false
spec = '''
A provider's `login_command` (cp-schema) is how a person signs in to it, as awsAuthRefresh is for Bedrock in Claude Code (issue #680, outcomes 4 and 5): an interactive sign-in such as the team CLI's browser or device OAuth. The credential itself is cp-credential's.

After this item:
- `splice login <head>`, for a head whose provider is on command auth, runs login_command attached to the person's terminal (stdin, stdout and stderr inherited, so its prompts and the address it prints are seen), then has the daemon run credential_command, and prints `Signed in to <provider> until <local time>` (or `Signed in to <provider>` for a key with no expiry) and exits 0. A login command that exits non-zero, or a credential command that still fails after it, prints `splice login <head>: <provider> is not signed in: <why>` and exits non-zero. On a provider with no login_command it says the provider has none and to sign in with the team's own tool, exit non-zero.
- The control plane's sign-in, the one the accounts page's Sign in calls: POST /api/auth/<head>/login starts login_command in the daemon (no terminal; stdin closed) and answers the sign-in in the shape every sign-in has (LoginStatusJson: id, state, browser_url, failure_reason). browser_url is the first http(s) address the command prints on stdout or stderr, set as soon as it is printed. state is pending while it runs, signed_in once it exits 0 and credential_command then succeeds, failed otherwise, with failure_reason `login_command exited <code>: <its last stderr line>` (or the credential command's words). GET /api/auth/<head>/login/<id> polls it; DELETE cancels it, killing the command. A sign-in still running after 10 minutes fails as timed out.
- GET /api/auth names the head with `present` (whether splice holds a key now) and `expires_at` (RFC 3339, UTC) when the key has one, as it names a ChatGPT sign-in.
- Once signed in, the next door turn on the provider runs with no restart: the next turn's credential run finds the person signed in.
- A key splice holds is never in the environment login_command runs in (nor anything else splice holds); the command runs with /bin/sh -c and the daemon's environment.
The credential is per provider, so `<head>` may be any head of the provider. Reuse LoginRoutes / LoginStatusJson and the sign-in kind dispatch the ChatGPT and Grok sign-ins use; the command sign-in is one more kind, generic.

Where: features/accounts/.../signin/LoginRoutes.kt and its sign-in kind dispatch, app/.../cli/auth/LoginCommand.kt, the /api/auth status route.

Proven by: bun test ./.campaign/checks/custom/login.test.ts — signed out, /api/auth says present false; `splice login acme` shows the address acme-ai printed, says signed in, exits 0; a door turn then runs and /api/auth names an expiry about an hour away; the control plane's sign-in reports browser_url then signed_in; the login command's environment holds no key; a failing login command is a failed sign-in with its exit in failure_reason, and `splice login acme` exits non-zero naming acme.'''
