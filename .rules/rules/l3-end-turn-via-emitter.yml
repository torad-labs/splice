# Invariant L3 — end_turn is reachable only via emitTerminal(reason) on the SSE
# path (sse.mjs) or as the terminal stop_reason built by translate-response.mjs
# on the non-stream path. An `end_turn` literal anywhere else is a fake-success
# path (failures must go through emitError, never masquerade as a clean stop).
#
# Widened 2026-07-26 (ast-grep-walls-audit, split-literal evasion theme, §A.6):
# `"end_" + "turn"` produces the identical runtime string with no node
# containing `end_turn`, so the old single string_fragment regex never saw it.
# Added a morpheme-anchored binary_expression branch — `^(end_?|_?turn)$` on
# each operand — so a log line like `stream ended: ${reason}` still can't trip
# it, only a genuine two-piece split of the literal can. Also collapsed the two
# hardcoded ignores entries into one glob (`server/src/*/translate-response.mjs`)
# covering codex/ and grok/ — verified a no-op today (`find server/src -iname
# translate-response.mjs` resolves to exactly those two paths).
id: l3-end-turn-via-emitter
language: javascript
severity: error
message: "L3: `end_turn` may appear only in anthropic/sse.mjs or a head's translate-response.mjs (codex/grok) — failures use emitError, never a fabricated end_turn."
note: |
  A fabricated end_turn is the fake-success bug class: an upstream failure that
  reaches the client as a clean stop. Streams end via emitTerminal(reason) in
  sse.mjs; the non-stream terminal message is built only by translate-response.
files:
  - server/src/**/*.mjs
ignores:
  - server/src/anthropic/sse.mjs
  - server/src/*/translate-response.mjs
rule:
  any:
    - kind: string_fragment
      regex: \bend_turn\b
    - all:
        - kind: binary_expression
        - has:
            field: left
            kind: string
            has:
              kind: string_fragment
              regex: "^(end_?|_?turn)$"
        - has:
            field: right
            kind: string
            has:
              kind: string_fragment
              regex: "^(end_?|_?turn)$"
