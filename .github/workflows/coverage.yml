# Coverage visibility. Generates an aggregated Kotlin gateway coverage report on every PR
# and posts it as a single comment (updated in place, not a thread). Fork PRs skip the
# comment post because the default token is read-only there; the report artifact is still
# produced so local checks are not red for external contributors. WebUI vitest coverage is
# intentionally deferred to a follow-up (# TODO / PR body note).
name: coverage

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # koverXmlReport runs the module tests, and the state-layout doctor tests spawn bun to
      # drive the JS copy of the state-root rule, so this job gets the same pinned bun and the
      # same frozen install as the gate (both pins are load-bearing; see ci.yml). Without them
      # the report is red on every PR with "Cannot run program bun".
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: install workspaces
        run: bun install --frozen-lockfile
      - name: Generate aggregated kover report
        run: ./gradlew :koverXmlReport --console=plain
      - uses: mi-kas/kover-report@94d69bc9d417de89b808cd5fe846bca2840911bb # v2.7
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          title: Gateway coverage report
          update-comment: true
