title = "The give-up error names no healthy sibling head (G27's own 'cheap version') || PROBLEM: When a head gives up — auth dead, quota exhausted, sustained upstream failure — the terminal error frame tells the user what went wrong on **that** head and, for auth, which login command to run. It does not tell them the one thing that would unblock them in ten seconds: which other configured head is currently healthy and would serve this session. The operator's actual recovery is to remember their own topology, quit, and relaunch under a different wrapper — information the daemon holds precisely and completely. For the quota case the daemon even humanizes the reset as '6d 4h' and still says nothing about what … || SPLICE TODAY: `gateway/gateway/src/main/kotlin/splice/gateway/head/TurnDriver.kt:326-327` appends only the head's **own** `provider.loginCommand`; `:316` and `:567` use only `provider.loginHint()` (defined at `:666`); a grep for sibling/siblingHints across `gateway/` main sources returns **zero** hits — no head ever names another. The quota facts for the RATE_LIMIT branch are already extracted at `gateway/provider-spi/src/main/kotlin/splice/spi/UpstreamFailureClassifier.kt:100-108` (`quotaSuffix` → plan_type + humanized reset). The daemon-wide topology exists at `Daemon.kt` (the head map, per-head `loginCommand` threading at … || PROPOSAL: Thread a `siblingHints: () -> List<String>` (healthy head wrapper commands, excluding self) from the Daemon into each head's error path, and append one clause to terminal **AUTHENTICATION** and **quota-exhausted/RATE_LIMIT** messages: `other heads available now: claude-grok, claude-openrouter`. Compute it from SH-03's health state so it never advertises a head that is itself dead — a wrong suggestion is worse than none. Mirror the same line in `splice doctor` and on the dashboard head plate. Strictly message enrichment: no routing, no session migration, no retry against another head. Explicitly **not** a reopening of G27. |