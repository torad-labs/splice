id = "M3-02"
phase = "m3"
title = "MOTION AS MATERIAL (impeccable phase motion; brief signature interaction; FEATURES.md 4.1). The four gestures orchestrated once in the primitives and webui/src/shared/motion, fired by store changes the M3-01 wiring delivers: print (a new strip enters from the top edge of its bay, --dur-2), hand off (a strip slides between bays: FLIP through a registry in shared/motion keyed by strip id, --dur-3), strike (the line draws across, --dur-2, then the strip leaves), swell and cock as before; every gesture under 400 ms, none on prefers-reduced-motion (the --dur-N tokens are already 0 there; the FLIP registry also checks the media query), no gesture on first paint. Bay diffs its children keys to fire print and strike; hand off fires when a key leaves one bay and appears in another within one frame. Then `cd webui && node /home/user/.claude/skills/impeccable/scripts/build-phase.mjs advance` records the motion phase. TEST webui/tests/motion.test.ts: the diff function classifies enter, leave and transfer between two key lists, the registry pairs a leave and an enter into one hand off, reduced motion disables the registry. Read /home/user/.claude/skills/impeccable/reference/craft-floor.md and .dev/web-console/CONTRACTS.md before editing."
