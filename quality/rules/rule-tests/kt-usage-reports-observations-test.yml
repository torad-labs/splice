id: kt-usage-reports-observations
valid:
  - 'val u = Usage(reported = emptySet())'
  - 'val u = Usage(inputTokens = 100, reported = fields)'
  - 'val u = Usage(reported = fields, outputTokens = 0)'
  - 'val u = splice.core.turn.Usage(reported = fields)'
  - 'val u = Usage(clientContext = Usage(reported = fields), reported = emptySet())'
  - 'val u = OtherUsage()'
  - 'import splice.core.turn.Usage'
  - 'val u = prior.copy(outputTokens = 7)'
invalid:
  - 'val u = Usage()'
  - 'val u = Usage(100, 7)'
  - 'val u = Usage(localStep = true)'
  - 'val u = splice.core.turn.Usage(outputTokens = 7)'
  - 'val u = Usage(clientContext = Usage(reported = fields))'
  - 'import splice.core.turn.Usage as Counted; val u = Counted()'
  - 'typealias Counted = Usage; val u = Counted()'
  - 'typealias Counted = splice.core.turn.Usage; val u = Counted()'
