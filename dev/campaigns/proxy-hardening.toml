phase = "W3-see-the-daemon"
title = "Daemon cold-start stderr goes to `/dev/null` || PROBLEM: Both cold-start paths launch the JVM with output discarded. If the daemon dies before `persistentLogger` exists — broken TOML, unwritable state dir, bad `SPLICE_JVM_OPTS`, port stolen, lock failure — the stack trace is destroyed and the operator sees only `splice: daemon failed version handshake (expected 0.1.1, got <none>)`. There is no file to tail, no doctor row, no way forward except knowing to hand-run `java -jar ~/.local/share/splice/splice.jar daemon`. The codebase already names this hazard — `Daemon.kt:286-288` says a failing head 'must NOT abort the whole daemon with a stack trace to /dev/null' — but … || SPLICE TODAY: The boot order is the load-bearing fact: `gateway/app/src/main/kotlin/splice/app/Main.kt:48` runs `TopologyLoader.loadOrMaterialize(topologyPath)` (which throws on malformed TOML at `TopologyLoader.kt:61`) and `:50` only then constructs `val log = persistentLogger(statePaths.logsDir)`. Both cold-start paths discard: `bin/splice-launch:136` (`nohup java $SPLICE_JVM_OPTS -jar '$JAR' daemon >/dev/null 2>&1 &`) and `gateway/app/src/main/kotlin/splice/app/cli/AdminSupport.kt:125` (same string inside `sh -c`) plus `Redirect.DISCARD` on both streams at `:127-128`. The handshake failure at `bin/splice-launch:144-147` … || PROPOSAL: (1) In `Main.runDaemon`, construct `persistentLogger(statePaths.logsDir)` **first** and wrap the lock+topology+`daemon.start` sequence so any boot throwable is written to daemon.log before exit. (2) Replace `>/dev/null 2>&1` in `bin/splice-launch:136` and the `sh -c` string in `AdminSupport.spawnDaemon` with `>>'$LOGS_DIR/daemon-boot.log' 2>&1` (LOGS_DIR resolved the same way `StatePaths` does: `${CLAUDEX_STATE_DIR:-$HOME/.claude-codex/state}/../logs`). (3) On handshake failure, `splice-launch` prints the last ~15 lines of daemon-boot.log plus its path; `AdminSupport.ensureDaemon` does the same on `waitUntilUp` failure. (4) Rotate daemon-boot.log with the same one-generation cap already used for daemon.log. || EFFORT/RISK: S. **Risk** The shim must not itself fail when the logs dir is unwritable — guard the redirect with a fallback to `/dev/null` so a read-only home never breaks l || VERIFY-SPEC: New `gateway/app/src/test/kotlin/DaemonBootFailureTest.kt`: point `SPLICE_CONFIG` at a malformed TOML, invoke the daemon entry, assert daemon.log (or daemon-boot.log) contains the parse error. Plus a case in `checks/release/launcher-test.sh` asserting `splice-launch` prints the boot-log tail and path when `/health` never comes up. Gate: `npm run gate`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### JW-01'"
