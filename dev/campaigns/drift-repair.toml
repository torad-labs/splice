# [2026-08-31] 2026-08-31 FIXED. failure_spans now lexes string literals away BEFORE splitting on //, so a URL inside a string can no longer eat the rest of the line. Replaying codex's exact probe directly against the module: failure_spans is now [False, True, False, False] where it was [False, False, True, True, True], and renders_throwable on the post-lambda dollar-it is now False. Permanent selftest arm 12d carries that exact one-line URL-lambda shape (17 arms total); the mutant restoring the comment-before-string order reds it, and the checker restores byte-identical. Whole-tree wall unchanged at 87 sites, 68 routed, 19 exempt, 0 undispositioned - so the fix removed a false positive without loosening the wall.
