# WALL (V4-90, ARCH-AUDIT 2026-09-17 row B6; concept #924 "make drift not compile"): the ANTHROPIC
# ERROR ENVELOPE is assembled in ONE file. The envelope is the shape
#   {"type":"error","error":{"type":<wire type>,"message":<text>}}
# and it is a CONTRACT IN BOTH DIRECTIONS: Claude Code reads it to decide whether a failure is
# retryable, and splice's own readers parse it back — TurnKnownEnd hands the body to
# UpstreamFailureClassifier, which lifts `error.message`, and the presentation seam (FailureText)
# unwraps the same field. RateLimitCooldown.kt's own comment records what happens when one copy
# drifts: a hand-built `{"detail":...}` was "the one shape neither reader looked at, which is how
# our own words landed in his transcript as braces".
#
# WHY FOUR COPIES IS THE DEFECT. Each copy re-derives the same two-level nesting with its own key
# spelling — two with bare literals, one with `FIELD_TYPE`/`FIELD_ERROR` constants, one with
# `TYPE`/`MESSAGE` constants — so nothing in the compiler, and nothing in a test of any one of
# them, relates them. A fifth ending will copy whichever one it reads first, and a key renamed in
# one copy is invisible in the other three. This is the same shape V4-81 already removed once for
# the pre-content rule (four hand copies of one routing); the envelope is the body that routing
# writes into, and it never got the same treatment.
#
# THE REMEDY, and the ONE file this wall points at. Fix row V4-103 creates
#   gateway/gateway/src/main/kotlin/splice/gateway/wire/ErrorEnvelope.kt  (`splice.gateway.wire.ErrorEnvelope`)
# as the sole builder, which every terminal CALLS. It is this rule's only `ignores:` entry — the
# path does not exist yet, so the exemption is inert today and becomes live the moment the fix row
# lands, with no edit here.
#
# COORDINATION WITH law_pre_content_wire_type.py — the two walls govern DIFFERENT halves and must
# not fight (checked against that wall's denominator (d) before this rule was written; it is GREEN
# on this tree, over 631 sources):
#   - THAT wall (d) governs WHERE an in-band error envelope may be built RELATIVE TO THE EMITTER
#     SEAM, and it exempts `wire/SseEmitter.kt` (the seam) and `wire/CollectingTerminal.kt` (the
#     COLLECT path, whose exemption is about the failure's real HTTP STATUS: a buffered 429 stays
#     429 and a buffered api_error stays 502, so the pre-content TYPE remap must not reach it).
#     It detects an envelope by NAME — a `*errorEnvelope(` function, or a `.wireName` handed to a
#     JSON writer.
#   - THIS rule governs the BODY SHAPE, by STRUCTURE: the two-level `{type:"error", error:{...}}`
#     nesting, whatever the keys are spelled with. It keeps NO status exemption, because the status
#     question is not its subject; CollectingTerminal keeps that wall's STATUS exemption and is
#     still red HERE for hand-assembling the BODY. Once the fix row lands, both stay green
#     together: a CALL to ErrorEnvelope is not a hand-assembly (no nested builder here), and it is
#     not a `*errorEnvelope(` declaration there.
#   THE ONE THING THE FIX ROW MUST NOT DO: name the new builder `errorEnvelope(`. That wall's
#   `_ENVELOPE_FUN_RE` is `\w*[eE]rrorEnvelope\s*\(` and matches CALLS, not just declarations, so a
#   call from AdmissionResponses (not exempt there) would red wall (d) the day this rule goes
#   green. `ErrorEnvelope.of(...)` / `ErrorEnvelope.build(...)` clears both. Written down here
#   because the two walls are enforced by different legs and only this sentence connects them.
#
# CENSUS AT AUTHORING (2026-09-17, derived from the tree with this rule, never hand-listed — FOUR
# sites; the ARCH-AUDIT row named three, and the fourth was found by scanning):
#   gateway/gateway/head/AdmissionResponses.kt:37-46    `errorBodyJson` — bare "type"/"error"
#                                                       literals; five admission terminals share it
#   gateway/gateway/wire/CollectingTerminal.kt:168-178  `errorEnvelope` — FIELD_TYPE/FIELD_ERROR
#                                                       constants, plus an optional `usage` member
#   gateway/gateway/wire/SseEmitter.kt:199-205          inline in `emitError` — TYPE/MESSAGE
#                                                       constants + `putJsonObject("error")`
#   gateway/provider-spi/spi/RateLimitCooldown.kt:192-198  inline in the cooldown refusal — THE
#       FOURTH SITE, NOT IN THE ROW'S CENSUS, and the one with an architectural consequence:
#       provider-spi is a DEPENDENCY of gateway/gateway, so it cannot import
#       `splice.gateway.wire.ErrorEnvelope`. Either the builder lands lower (core) or this site
#       earns a written exemption. That is the fix row's design call; this wall's job is to make
#       the site impossible to miss, so it is RED BY NAME rather than scoped away.
#
# WHY THE MATCHER IS STRUCTURAL AND NOT A LITERAL SEARCH. One of the four copies spells BOTH keys
# with constants (`put(FIELD_TYPE, FIELD_ERROR)`), so there is no literal `"error"` anywhere in it;
# a literal-only matcher would have found three of four and called the census complete. The rule
# therefore requires the two halves of the row's own definition together — an object whose `type`
# field is the word `error` (literal, or a constant whose name carries ERROR), AND a nested object
# builder introduced by an `error` key (same two spellings). Measured on the tree: 4 hits, 0 false
# positives, across 631 main sources.
#
# THE CALLEE IS MATCHED BY NODE, NOT BY TEXT PREFIX (measured, 2026-09-17). `regex:
# '^(buildJsonObject|putJsonObject)\b'` on `call_expression` reported every site TWICE, because
# `buildJsonObject { … }.toString()` is itself a `call_expression` whose text also starts with
# `buildJsonObject`. `has: {nthChild: 1, kind: simple_identifier, …}` binds the callee itself, so
# the outer navigation form no longer counts as a second envelope. A duplicate finding is not
# cosmetic here: it doubles a red inventory that a fix row reads as a work list.
#
# NOT CAUGHT, and why.
#   A third key spelling. The `error` key must be the literal `"error"` or an identifier whose name
#   contains ERROR (`FIELD_ERROR`, `ERROR_KEY`). A constant named `ERR` or `E1` escapes. Closing
#   that needs constant resolution, which is a type-checker's job, not a matcher's; the fix row
#   removes the need by leaving one assembly site.
#   An envelope built through a non-kotlinx path — string concatenation, a `@Serializable` data
#   class, a template. None exist in the tree today (all four sites use `buildJsonObject`), and the
#   rule says so out loud rather than implying a coverage it does not have.
id: kt-error-envelope-single-source
language: kotlin
severity: error
message: "The Anthropic error envelope {\"type\":\"error\",\"error\":{...}} is assembled in ONE file: call splice.gateway.wire.ErrorEnvelope (gateway/gateway/src/main/kotlin/splice/gateway/wire/ErrorEnvelope.kt), never hand-build it here."
note: "The envelope is a contract in both directions — Claude Code reads it to decide retryability, and splice re-parses error.message (UpstreamFailureClassifier, FailureText). Four hand copies with three different key spellings exist today; a key renamed in one is invisible in the others. Coordinates with law_pre_content_wire_type.py: that wall owns WHERE an envelope may be built relative to the emitter seam and keeps the collect path's STATUS exemption; this rule owns the BODY SHAPE and keeps none. Do NOT name the new builder `errorEnvelope(` — that wall matches that name at CALL sites too."
files:
  - "**/src/main/**/*.kt"
ignores:
  # The sole builder, created by fix row V4-103. Inert until the file exists; live with no edit here.
  - gateway/core/src/main/kotlin/splice/core/wire/ErrorEnvelope.kt
rule:
  kind: call_expression
  all:
    # The callee, bound as a NODE — see THE CALLEE IS MATCHED BY NODE above.
    - has: {nthChild: 1, kind: simple_identifier, regex: '^(buildJsonObject|putJsonObject)$'}
    # HALF 1 — the envelope's own `type` field is the word `error`: a literal, or a constant whose
    # name carries ERROR (CollectingTerminal's `put(FIELD_TYPE, FIELD_ERROR)` is the only copy with
    # no literal in it at all).
    - has:
        stopBy: end
        any:
          - pattern: put($TK, "error")
          - all:
              - pattern: put($TK, $ERRCONST)
              - has: {stopBy: end, kind: simple_identifier, regex: 'ERROR'}
    # HALF 2 — it carries a NESTED object builder under an `error` key, in either spelling.
    - has:
        stopBy: end
        any:
          - pattern: 'putJsonObject($EK) { $$$EB }'
          - pattern: 'put($EK, buildJsonObject { $$$EB })'
constraints:
  EK:
    # The prefix is `[A-Za-z_0-9]*`, deliberately allowing EMPTY: an earlier spelling required at
    # least one character before ERROR and so silently missed `ERROR_KEY` / a bare `ERROR`. The
    # rule-test's fifth invalid case is what caught it, which is the whole reason that case is a
    # spelling nobody has written yet rather than a copy of one that exists.
    regex: '^("error"|[A-Za-z_0-9]*ERROR[A-Za-z_0-9]*)$'
