<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teams · splice</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/splice-app-256.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="sessions.css">
<link rel="stylesheet" href="teams.css">
<link rel="stylesheet" href="composer.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="mark"><img class="lockup night" src="brand/splice-horizontal-night.svg" alt="splice" width="380" height="128"><img class="lockup day" src="brand/splice-horizontal-day.svg" alt="splice" width="380" height="128"></div>
    <!-- kit.js draws the nav from its one PAGES list, into this column before .foot. -->
    <div class="foot">
      <button class="icon" data-act="theme" aria-label="Day or night">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </aside>
  <main class="page">
    <header class="head">
      <h1>Teams</h1>
      <div class="read">
        <!-- when the page last read: it re-reads itself every five seconds. teams.js markRead draws the lamp that traces on each
             read, with the time of the last one as its words, and writes "Not answering since 10:37 AM" in the time when a
             read fails after the board landed -->
        <span class="tlamp readlamp" role="img" tabindex="0" hidden></span>
        <time class="readat"></time>
        <!-- the act's own word is in its span, so markRead can read Try again once a read has failed -->
        <button class="act quiet small" data-act="read">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span>Read again</span>
        </button>
      </div>
    </header>
    <div class="teams" id="teams" aria-live="polite"></div>
  </main>
</div>
<script src="kit.js"></script>
<script src="api.js"></script>
<script src="reqview.js"></script>
<script src="knobs.js"></script>
<script src="perf-heads.js"></script>
<script src="console.js"></script>
<script src="composer.js"></script>
<script src="pilot.js"></script>
<script src="teams.js"></script>
</body>
</html>
