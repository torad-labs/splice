# [2026-08-15] ROOT CAUSE of the 336 top-level funs / 58 companions (found 2026-08-15, answers 'weren't our hooks triggering?'): the repo HAS had both rules since 2026-07-16 — .rules/kotlin/ast-grep/rules/no-loose-function.yaml and no-companion-objects.yaml, installed by torad-toolkit — but BOTH delivery paths were dead. (1) sgconfig.yml ruleDirs lists only .rules/rules and .rules/kotlin-splice; .rules/kotlin is in NO ruleDir, so neither the write-time hook nor npm run gate:rules ever scanned it. (2) The hook module that would run that pack, .claude/hooks/modules/pretooluse/_kotlin_rules.py, begins with '_' and this chain's runner sets DISABLED_PREFIX='_' (orchestrator/runner.py:64, filtered at :175) — an underscore-disabled module, never executed once. The splice-specific walls in .rules/kotlin-splice ARE live and same-checker-twice; they simply never carried these two rules. THEREFORE HD-9's enforcement capstone must also PROMOTE both rules into .rules/kotlin-splice as kt-no-loose-function.yml + kt-no-companion-object.yml (keeping no-loose-function's main()/@Composable/fun-interface exemptions), landing when the counts hit zero so the gate goes green-and-strict in one move. Konsist laws alone would leave the same silent-death mode: a rule wired nowhere fails open forever.
# [2026-08-15] HOW IT HAPPENED (git archaeology, 2026-07-16, two commits back-to-back): 846c825 'torad-toolkit install snapshot' added BOTH .rules/kotlin (65-rule generic pack incl. no-loose-function + no-companion-objects) AND an ACTIVE hook .claude/hooks/modules/pretooluse/kotlin_rules.py — at that moment the rules really were enforced at write time. Then 7589e19 'P1-HOOKS: vendor fleet hook runtime' renamed it kotlin_rules.py -> _kotlin_rules.py (pure rename, 0 line changes), stating the reason in its own commit body: 'Toolkit kotlin_rules disabled (superseded by sgconfig route in P1-WALLS).' The supersession was true of the MECHANISM and false of the CONTENT: P1-WALLS (37f211d) wired only .rules/kotlin-splice into sgconfig ruleDirs — the 10 hand-written splice walls — and never added .rules/kotlin, so the 65 toolkit rules lost their only runner. Nothing failed: ast-grep silently scans only what ruleDirs names, so an unreferenced rule dir yields zero findings, not an error. The receipt in that same commit body even reads 'gate:rules 10/10' — 10, against a pack of 65, which was the tell nobody read. LEVERAGE POINT for this item, beyond promoting the two rules: add a wall asserting every .rules/* directory containing rule files is either listed in sgconfig ruleDirs or explicitly marked unused, so a rule set can never again be present-but-unrouted (same fail-open class as the 2026-07-18 decorative quirks and the gitleaks [[allowlists]] plural syntax).

