reason = """
Both walls are scoped to the control plane: `guarded(call)` covers the 25 control-plane routes, and
LogSafe escapes the operator- and HTTP-supplied values (argv, head keys) that :control interpolates
into log lines. Only :control declares those routes. Widening either wall to the head's proxy wire
is a separate, evidence-led change to quality/rules/.
"""

