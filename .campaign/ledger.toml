results = [
  "Saved tool result (desktop-3p-bundle.md):\n# Claude Desktop 5.11492.5 (Linux), 3P mode: read from its main process code, Nov 18, 2026\n\nRead from `/usr/lib/claude-desktop/resources/app.asar`, extracted, `.vite/build/index.chunk-DOKiptke.js`\n(minified). Each line is what the code does; excerpts are abridged.\n\n## The local configuration library\n\n- Folder: `<appData>/Claude-3p/configLibrary/` (`appData` is Electron's: `$XDG_CONFIG_HOME` or `~/.config` on Linux).\n- `_meta.json`: `{\"appliedId\": \"<id>\", \"entries\": [{\"id\": \"<id>\", \"name\": \"<name>\", \"provider\"?: \"<s>\", \"note\"?: \"<s>\"}]}`.\n  Desktop's own writer starts from `{appliedId: \"\", entries: []}` when the file is absent, and refuses an id not in\n  `entries` (\"unknown config id\").\n- An id matches `/^[a-f0-9-]{36}$/` (a UUID). The config is `configLibrary/<id>.json`, one flat JSON object of config\n  keys (`inferenceProvider`, `inferenceGatewayBaseUrl`, ...).\n- Read at launch: `_meta.json`'s `appliedId`, then `<id>.json`. An unreadable entry opens as empty (logged\n  `[configLibrary] entry unreadable; opening as empty`).\n- Secret-type string keys may be stored sealed (`__sealed__:v1:` + safeStorage). Desktop's save and a later \"sweep\"\n  seal plaintext secrets in place (it rewrites `<id>.json` when the file is unchanged under it). A config with no\n  plaintext secret (no `inferenceGatewayApiKey`) has nothing to seal.\n\n## Credential helper\n\n- `inferenceCredentialHelper`: an absolute path to an executable file (`pathKind: \"file\"`; a bad path is\n  \"Path must be absolute and on the local filesystem.\"). `inferenceCredentialHelperArgs`: an array of argument\n  strings. Also `inferenceCredentialHelperTtlSec` (positive int), `inferenceCredentialHelperTimeoutSec` (≤600),\n  `inferenceCredentialHelperSilentRefreshEnabled` (bool).\n- Output formats: `bare-token` or `json`. A clean exit with nothing on stdout is a failure (\"produced no output\");\n  a non-zero exit is a failure. Its environment carries `CLAUDE_HELPER_CONTEXT` (e.g. `setup-test`) and\n  `CLAUDE_HELPER_MANUAL_RUN=1` for the setup test.\n\n## Gateway provider and the Code tab\n\n- For `inferenceProvider: \"gateway\"` the scheme is bearer unless `inferenceGatewayAuthScheme` is `\"x-api-key\"`:\n  `i = e.provider===\"gateway\" ? e.authScheme!==\"x-api-key\" : as(t)`; then\n  `ANTHROPIC_API_KEY: i ? \"\" : t, ANTHROPIC_AUTH_TOKEN: i ? t : \"\"`. A helper's credential is put in the same\n  variable (`credentialEnvVar`: bearer → `ANTHROPIC_AUTH_TOKEN`, else `ANTHROPIC_API_KEY`).\n- `inferenceCustomHeaders`: a `{name: value}` object (`record<string,string>`), readers desktop and code; it becomes\n  `ANTHROPIC_CUSTOM_HEADERS` (`\"name: value\"` lines) for the Code tab's Claude Code.\n- A gateway whose host is not Anthropic's gets `CLAUDE_CODE_DISABLE_LEGACY_MODEL_REMAP=1`.\n- Auto mode: `CLAUDE_CODE_ENABLE_AUTO_MODE` comes from `autoModeEnabled` (unset: Code on, Cowork off; `true`: both on;\n  `false`: off). `CLAUDE_CODE_AUTO_MODE_SERVER` is `\"1\"`/`\"0\"` from `inferenceGatewayAutoModeServerChecks` when set.\n  `autoModeClassifierModel` is marked `availableInVersion: \"@next\"` (not read by this release).\n- Desktop always sets `CLAUDE_CODE_DISABLE_FAST_MODE=1` under 3P.\n\n## Discovery (`GET /v1/models`)\n\n- URL: `${base.replace(/\\/+$/,\"\")}/v1/models?limit=1000[&after_id=<cursor>]`, headers: the credential header,\n  `anthropic-version: 2023-06-01`, the custom headers. Timeout 10 s per page, up to 3 pages. A non-OK first page is\n  a failure; a later page's failure keeps the rows read. `data` must be an array.\n- Per row it reads: `id` (≤255 chars), `display_name` (≤255; the label, else the id), `description` (≤100 chars),\n  `anthropic_family_tier`, `is_family_default`, and 1M from `supports_1m` when it is a boolean, else\n  `max_input_tokens >= 1000000`. Paging: `has_more === true` with a string `last_id` gives the next cursor.\n- `anthropic_family_tier` is kept only when it is one of `sonnet`, `opus`, `haiku`, `fable`, `mythos` (lowercased).\n  `is_family_default: true` is kept only on a row with a kept tier.\n- Filter for the gateway provider: a row passes when its id \"reads as Claude\" or it has a kept tier. An id reads as\n  Claude when it contains `claude`, a tier name or `anthropic`, and does not match\n  `/ark-code|...|gemini|...|glm|gpt|grok|...|kimi|...|codex|.../` (a long list of other vendors' names). So every\n  splice selector of a GPT, Grok, Kimi or GLM model needs a tier to be listed.\n- Rows whose id reads as Claude and that share both display name and tier are grouped as variants of one picker row\n  (the family default, or the plainest id, leads). An id ending `[1m]` is a 1M variant of the id without it.\n- Discovery does not carry `maxEffort`, `behavesAs` or `labelOverride`; those exist only on `inferenceModels`\n  entries, and `inferenceModels`, when set, replaces discovery. `modelDiscoveryEnabled` is a config key.\n\n## Picker and effort\n\n- Effort ladder: `low`, `medium`, `high`, `xhigh`, `max` (an unknown `maxEffort` reads as `low`).\n- `inferenceModels` entry keys: `name`, `labelOverride`, `supports1m`, `prefer1m`, `anthropicFamilyTier` (the tiers\n  above), `isFamilyDefault` (shown only with a tier), `behavesAs` (a Claude model id), `maxEffort`, plus\n  `minDesktopVersion`.\n- Claude Code reads `ANTHROPIC_DEFAULT_{OPUS,SONNET,HAIKU,FABLE,MYTHOS}_MODEL` and Desktop seeds them from the list\n  (`CLAUDE_CODE_3P_SEEDED_OPUS_DEFAULT`, `..._PROBE_WROTE_HAIKU_DEFAULT`); a family default is what a tier alias\n  resolves to.\n\n## Not read here\n\n- What Desktop's main process uses for title and side calls, the exact reachability probe, the usage display's\n  headers, and whether discovery re-runs while Desktop is open. The live test reads them.\n",
]
