# Kill-stale must be a pgrep loop that excludes the launcher's own PID.
# `pkill -f` self-matches the launcher command line (the v29 trap: launcher
# kills itself, stale proxy keeps the port, EADDRINUSE silent-exit(0),
# version-handshake loop). Any pkill in launcher strings is that trap.
#
# Widened twice:
# - `files:` grew from `server/launcher/**` to `server/**/*.mjs` — `heads.mjs` is
#   shared lifecycle code consumed by the control server too, so the ban must
#   follow the string past the launcher directory boundary, not stop at it.
# - Added a split-literal branch: `"pk" + "ill -f " + name` produces the same
#   runtime command with no single `string_fragment` node containing `pkill`,
#   so the per-node substring regex alone is evadable by splitting the literal
#   across concatenation. The new branch is scoped to a `+` binary expression of
#   two string/template operands sitting inside the `arguments` of an
#   exec-family call (execSync/exec/execFileSync/spawn/spawnSync) — narrow
#   enough that it does not fire on the real HTML-string concatenation in
#   server/src/auth/codex-login.mjs (verified: 0 hits there).
# - NARROWED 2026-07-27 (review round 2): that branch matched ANY two-literal
#   concatenation in exec arguments with no constraint on the text, so
#   `execSync('ls' + ' -la')` tripped a wall whose message is about pkill. It
#   held clean only because the codex-login concat sits outside exec arguments,
#   not because the branch was content-aware — latent, and a wall that flags
#   compliant code trains authors to reach for ast-grep-ignore, which weakens
#   every wall including this one. The branch now requires the pkill morpheme
#   itself, split across the quote boundary. All FOUR split points are covered
#   (p|kill, pk|ill, pki|ll, pkil|l) rather than only the pk|ill shape the
#   review sketched: `'p' + 'kill'` produces the identical runtime command and
#   would otherwise still walk through. The regex matches node text including
#   quotes, so ordinary spacing variants and backticks match too (both proved in
#   the rule-test). Verified 0 hits across server/**/*.mjs at 24eefbf.
id: launcher-no-pkill
language: javascript
severity: error
message: "Never pkill in the launcher — use a pgrep loop excluding process.pid, then targeted kill per PID."
note: |
  Kill-stale recipe: `pgrep -f <name>` → parse PIDs → filter out process.pid
  (and its parents) → process.kill(pid) each. pkill -f matches the launcher's
  own command line and kills it mid-restart, leaving the stale proxy holding
  the port (EADDRINUSE → silent exit(0) → version-handshake loop).
files:
  - server/**/*.mjs
rule:
  any:
    - kind: string_fragment
      regex: pkill
    - kind: binary_expression
      # "pkill" broken across a quote boundary, at any of its four split points.
      regex: "(p['\"`]\\s*\\+\\s*['\"`]kill|pk['\"`]\\s*\\+\\s*['\"`]ill|pki['\"`]\\s*\\+\\s*['\"`]ll|pkil['\"`]\\s*\\+\\s*['\"`]l)"
      all:
        - has:
            field: operator
            regex: ^\+$
        - has:
            field: left
            any:
              - kind: string
              - kind: template_string
        - has:
            field: right
            any:
              - kind: string
              - kind: template_string
        - inside:
            stopBy: end
            kind: arguments
            inside:
              stopBy: neighbor
              kind: call_expression
              has:
                field: function
                regex: ^(execSync|exec|execFileSync|spawn|spawnSync)$
