# [2026-08-17] HD-20 wave 3 landed. Matcher red-proven FIRST against a synthetic violation (flagged the extension, not the top-level fn nor the member), so the 28 census is evidence. 28 -> 0 on the promoted rule; 26 declarations converted, 2 carved out. OWNED-TYPE case (brief's member route): DaemonConfig.putFoldOverrides moved out of Topology onto DaemonConfig itself - call site 'daemon.putFoldOverrides(out)' byte-identical; visibility private -> internal because the caller is a different class in the same file (only surface change in the wave). CROSS-MODULE owned types took the parameter route with the reason recorded in-file: Topology.signInHeads (:core type, :app caller - a member would force it public in :core, explicitApi + binary compat) and ProviderConfig.responsesQuirks (same shape, 4 call sites). 21 FOREIGN receivers took the JsonScalars shape (receiver -> first param on the owning class/object): JsonObjectBuilder x6 (ChatRequestBuilder.putFunction, PassthroughRequestBuilder.copyUnhandledFields/putThinking, MfjsSanitizer.putNodeType/putSanitizedChild, ControlPayloads.putCompactScalar), JsonElement/JsonObject x6 (jsonObjectOrEmpty x3 in grok/kimi/kimi, numericFields, firstNum, jsonObjectListTexts), StringBuilder x3, Char, String.padBase64, FlowCollector x2, HttpRequestBuilder.formHeaders, CoroutineScope.launchClientPinger, FirFunctionCall x2. Every name kept identical; the receiver was always PREPENDED, never reordered. FOUR same-type-adjacent-parameter conversions verified individually at every call site (the near-miss class): putFunction(sink,name:String,args:String) 1 site - tu.name still -> "name", tu.input.toString() still -> "arguments"; putCompactScalar(sink,key:String,value:String) 1 site - the destructured (key,value) order unchanged; processLine(collector,buf,start:Int,end:Int,assembler) 1 site - 'start,i' preserved; matchesAt(buf,start:Int,end:Int,literal) 1 site. All other conversions have pairwise-distinct parameter types so a swap does not compile. TWO SHAPE changes beyond arguments: SseEmitter.appendJsonEscaped sat mid fluent-chain, so the chain is now 3 statements against the same frameBuf in the same order and its chain-only ': StringBuilder' return is gone; TurnDriver.launchClientPinger takes 'scope' and calls scope.launch{} with the call site still passing 'self' (unchanged whole-turn lifetime/parentage). DEAD-MATCHER / IMPOSSIBLE FINDINGS: (a) the 2 survivors are overrides of abstract members the Kotlin compiler API itself declares with an extension receiver - verified by javap against kotlin-compiler-embeddable 2.4.0 ('public abstract void registerExtensions(ExtensionStorage, CompilerConfiguration)', 'protected abstract void configurePlugin(ExtensionRegistrarContext)') - so no compliant spelling exists and the promoted wall carves out 'override'; PROVEN not to be a hole: a fabricated LOCAL supertype goes RED at the interface's own declaration. (b) the dormant matcher was a spelling census (kind + a regex enumerating modifiers/generics/dotted receiver); replaced at promotion by the grammar's own 'receiver:' FIELD on function_declaration - both agreed at 28 on unmodified a78875b, so no census number moved, only future blindness removed. (c) REPORTED NOT FIXED: extension PROPERTIES (property_declaration carries the same receiver field) are matched by neither rule; a probe finds 0 real ones today (its single hit is a parser artefact on the context(...) line at MustConsumeDiscardChecker.kt:71 with empty match text) - a separate rule, separate item. WALL PROMOTED: kt-no-extension-functions in .rules/kotlin-splice with files: gateway/*/src/main/**/*.kt and no redundant ignores, rule-test with 4 valid (both compliant forms, a third-party extension CALL, the override carve-out) + 4 invalid; dormant original git rm'd; 43 rule tests pass (was 42). RED-GREEN proven at BOTH halves: gate:rules exit 1 naming the rule at the exact line on a scratch violation and exit 0 after deleting it, and the PreToolUse hook blocked a Write of the same content. GATE I BROKE AND FIXED (not routed around): CX-18 campaign wall went RED because it matches the literal 'JsonScalars.firstLong(this, *keys)' that UsageHud.firstNum no longer spells; confirmed caused-by-me by running it against stashed HEAD (GREEN) vs my tree (RED); applied the wall's OWN documented remedy (equivalent-spelling tuple, the same maintenance HD-M8 already did in that file once) adding 'JsonScalars.firstLong(obj, *keys)', then re-proved teeth: wall GREEN, --selftest OK, and re-hand-rolling the HUD reader makes it RED again. VERIFY: gradlew check --rerun-tasks BUILD SUCCESSFUL in 2m17s, 162/162 tasks, 1107 tests / 0 failures / 0 errors / 1 skipped / 14 modules, NF-03 did NOT flake (the brief's 1103 is stale - HD-19's note already records 1107, and this wave touched zero test files); npm run gate PASS; promoted rule scans 0 over gateway/*/src/main. KIMI BYTE-IDENTITY intact: git status --porcelain on gateway/dialect-anthropic-passthrough/src/test/ is EMPTY, PassthroughGoldenTest 9 tests 0 failures unmodified. PROCESS NOTE: the first 3 conversions (jsonObjectOrEmpty in grok/kimi/kimi) were applied via a python script through Bash, which does not pass the PreToolUse wall - careless, not deliberate; every later edit used Edit/Write. Those 3 files are covered by the gate half regardless (tree scan 0, gate PASS), but their write-time proof comes from the scan, not the hook. Report: .superpowers/sdd/2026-08-15-head-decoupling/hd-20-report.md

