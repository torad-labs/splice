# What Claude Code 2.1.310 does with each answer splice can give: the client reaction record of the failure-handling
# design (section 11, slice 0b). Slices 3 to 5 choose ClientWire's statuses from it, and its rows are the evidence in
# ClientWire's KDoc. tools/e2e/src/client-reactions.ts loads and checks it.
#
# Built on 2026-10-26 without starting any Claude Code session (rulings.md, ruling 2), from three sources, in order:
#   journal      splice's trace (<head>-<UTC date>.jsonl: each request, its answer and the chunk hashes of both bodies)
#                and daemon log (daemon.log.1 until Oct 24 16:22 CT, daemon.log after), Oct 19 19:01 to Oct 26 06:31 CT.
#   transcript   the clients' own session transcripts. Only non-interactive sessions write a system/api_error entry per
#                retry; every session writes an assistant isApiErrorMessage entry for an error it prints.
#   shipped-code the 2.1.310 file in Claude Code's versions folder, read as bytes and never run, for about 30 minutes.
#                "at" is a byte offset in that file.
# Times are CT. Every head plants CLAUDE_CODE_RETRY_WATCHDOG=1 (LaunchService.kt), which the shipped code reads as its
# persistent retry, so every row is under it. A row's text marks a cause the sources could not show as a hypothesis.
# Splice's own lines are quoted as the client printed them, with account detail and reset dates replaced by <...>.

client = "claude-code"
version = "2.1.310"
built = "2026-10-26"

# ---------------------------------------------------------------- HTTP answers, before any 200 goes out

[[case]]
id = "http-400-invalid-request"
answer = "HTTP 400 invalid_request_error with no x-should-retry. The only ones a 2.1.310 client met carried splice's refusal line, on a request answered without streaming."
did = "Did not end the turn. Within 0.1 s of each 400 it sent the request again with only its last 64 KB chunk changed: the first time at the same length, the second time 27 bytes shorter. After the second 400 it sent a request 32 KB shorter whose first chunk had changed, and that one succeeded. The shipped code's HTTP decision fails a 400 without a retry, so these requests came from another part of the client (hypothesis: its refusal fallback). Whether a 400 with any other line ends the turn is unobserved. The sequence began with an in-band refusal at 11:05:14 CT (case inband-invalid-request-before-content)."
printed = "nothing: the transcript holds no API error entry for these"
resent = "yes"
after = "under 0.1 s"
times = "2 changed requests, then a third that succeeded"
identical = "no"

[[case.evidence]]
kind = "journal"
at = "2026-10-24 11:05:19.657 CT"
log = "daemon.log.1; trace claude-splice-2026-10-24.jsonl"
note = "FAILURE type=invalid_request_error with the refusal line, answered 400 without streaming"

