[[row]]
id = 'nd-sessions-board'
title = 'Sessions is the approved board: teams as columns of their sessions, on live data'
feature = 'console-night-deck'
status = 'todo'
owner = ''
blocked_by = [
  'nd-kit',
  'nd-look',
  'nd-own',
]
guard = false
spec = '''
sessions.html becomes the approved Sessions board (prototype sessions/i-teams-reader, console/sessions.html), on live data: the bird's-eye view of every running session, grouped by team.

What a person sees and can do once this is built:
- The board: one column per team (`#board section.team[data-team]`, its `.team-name`), its header showing the team's health in one look (one large lamp in its worst state, the counts, a combined activity spark over the hour, a state strip), its sessions as rows (`article.srow`: lamp, name, project, what it is on, time in its state); sessions on no team in their own column (`section.team.loose`); quiet teams fold to their headers; the columns reflow so 1440 and 3840 never scroll sideways.
- The right rail: the fleet as instruments while nothing is open (as the prototype's rail-right). The need float counts the sessions waiting on the person, and pressing it filters to them.
- Search (`#q`, and `/`): names, projects, what they are on; it reaches ended sessions through /api/sessions/history the way today's page does.
- Board acts the prototype has: rename a team, move a session to a team (drag, or its menu), fold a team. Each writes through the route today's console uses (team edits: PUT /api/teams/{id} and /api/teams/{id}/sessions).
- Opening a session is nd-sessions-open; on this item a press on a row may do nothing yet.

Where the data comes from (today's routes; add a read only where none gives a field): GET /api/sessions (rows, status, waiting_for, last, project, account, model; its gone_mark handling stays in api.js), /api/sessions/history, /api/teams, /api/heads/{head}/turns/live (live requests per session, as today's sessions.js reads them), /api/heads, /api/models, /api/accounts. Team membership is /api/teams' slots bound to session ids.

Old files removed here: sessions.html's old body, sessions.js, sessions.css. Old tests rewritten or deleted (named in the commit): sessions-axis-place, sessions-bar-room, sessions-columns, sessions-gone-once, sessions-lines, sessions-list, sessions-lost, sessions-projects, sessions-redraw, sessions-wide, sessions-fallback, sessions-door-slow, projects-pick.

Proven by: `bun test ./.campaign/checks/console-night-deck/sessions-board.test.ts`: at 1440 and 3840, the stub's team harbor-fix is a column holding api-fixer and map-builder, docs-writer sits in the no-team column, the right rail has content, the shell has the right rail and composer and no left rail, and sessions.js/css are gone.

## Decided once for every page of console-night-deck (the same text is in every page item)

- Files. A page is `<page>.html` plus its own `deck-<page>.css` and `deck-<page>.js` in app/src/main/resources/console. The kit is `deck.css`, `deck.js`, `deck-lens.js`, `deck-composer.js`, `deck-common.js` (item nd-kit); a page item never forks or restyles it, and a change the kit truly needs is made in the kit, kept general. Flat plain names, because ConsoleMount serves only plain names (and fonts/, brand/). The `deck-` prefix keeps the new files apart from the old console's until nd-whole removes the old ones.
- Frame. The page's HTML holds only its own field (`<main class="field" id="field"><section class="centre">…`) and its rails (`<aside class="glass rail rail-l|rail-r" data-lens aria-label="…">`), with `body` classes `no-rail-l`, `no-rail-r`, `no-comp` for what it does not have. deck.js draws the room, the nav (Sessions, Accounts, Teams, Providers, Activity, Settings, from its one list), the Night/Day switch, the need float and, unless `no-comp`, the composer. Scripts, in order: api.js, deck-lens.js, deck.js, deck-composer.js (composer pages only), deck-common.js, pilot.js, deck-<page>.js. Rails and composer: Sessions has the right rail and the composer; Accounts both rails and the composer; Teams, Providers, Activity and Settings none.
- Composer. deck-composer.js is the kit's one composer. A page tells it, from its own deck-<page>.js, what its context strip names and where Enter sends the text. Where deck-composer.js has no hook for that yet, nd-sessions-open adds one to the kit, kept general, and nd-accounts-signin uses the same hook for the manager (it waits on nd-sessions-open for that reason).
