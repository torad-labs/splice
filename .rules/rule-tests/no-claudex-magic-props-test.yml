id: no-claudex-magic-props
valid:
  - 'const { req, meta } = translateRequest(body); log(meta.effort);'
  - 'const label = "prefix" + "suffix"'
invalid:
  - 'body.__claudexEffort = "high"'
  - 'const effort = body["__claudex_effort"]'
  - 'const req = { ...body, __claudexModel: pinned }'
  - 'const effort = body["__claude" + "xEffort"]'
