# [2026-09-13] REVIEW 4 CORRECTION (splice-astra): disregard the prior ACCEPTABLE verdict. A material longest-prefix blocker remains at CodeModeLimits.kt:31-39: stopping when actual marker width equals reserve misses a digit-width cliff exactly one code unit ahead, where adding a prefix character and shrinking the gone count also shrinks the marker, so the total still fits. Concrete UTF-8 case: boundedText(a repeated 66,513) settles at 65,513 a characters plus [truncated 1000 chars] = 65,536 bytes, but 65,514 a characters plus [truncated 999 chars] also equals 65,536 and is longer. Character-cap analogue: 1,200 a characters with maxChars=223 returns 200 plus the 23-character 1000 marker, while 201 plus the 22-character 999 marker fits exactly. Add a candidate-boundary check or otherwise solve against the emitted marker, and pin equality at the 1000-to-999 cliff for both byte and character caps. Corrected verdict: NOT ACCEPTABLE until fixed and exact gate re-passes.
# [2026-09-13] CORRECTION (orchestrator, 2026-09-13): verified/accepted withdrawn after astra's REVIEW 4 correction (digit cliff); status back to done while the fix lands.
