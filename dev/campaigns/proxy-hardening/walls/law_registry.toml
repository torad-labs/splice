# Added 2026-09-17 (V4-79). A CODE invariant rather than a process law, and it belongs here for a
# mechanical reason: the item planes of this gate read dev/campaigns/proxy-hardening.toml, so a
# v0.4.0 row registered as an [[item]] would raise C2 ORPHAN. A law row is the channel that makes
# the gate RUN this wall on every `npm run gate:campaign`, with a law enforcer's INVERSE polarity —
# it must PASS today, and a red is a live violation, not an unfinished item. BLOCKING (C9), which
# is the convention the retry-law walls already carry.
[[law]]
tag = "PRE-CONTENT-WIRE-TYPE"
wall = "dev/campaigns/proxy-hardening/walls/law_pre_content_wire_type.ts"
note = "V4-78/V4-79/V4-81/V4-82: the pre-content rule is applied ONCE, at the emitter seam. The wall checks (a) wire/SseEmitter.kt declares object PreContentWireType with a fun of( and every fun emitError( applies it exactly once, as a WHOLE expression (not merely containing it, and not with the content flag pinned to the literal true, which returns the type unchanged), with the routed value the one written to the wire; (b) NO other main source under gateway/*/src/main/kotlin calls PreContentWireType.of( — the anti-hand-copy check that would have caught V4-79's four copies; (c) the governed set derived from the rule object's own body and ratcheted, so narrowing the rule reds; (d) every other in-band error-envelope construction (errorEnvelope(, or a .wireName handed to a JSON writer) is red by file:line, with ONE written exemption: CollectingTerminal (the collect path, where the real HTTP status carries the retry semantics), pinned to that file still declaring CollectingTerminal so the exemption cannot outlive its reason. Mutation-proven against the live tree 2026-09-17: 8 of 8 mutations red, baseline green."
law_present = true
