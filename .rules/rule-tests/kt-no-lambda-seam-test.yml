# HD-22 wave 4b (2026-08-17): the promoted wall's red/green pins.
#
# Carried forward from the dormant pack's HD-21 test, which pinned BOTH sides of the inline-parameter
# exemption, plus the two cases that pin the carve-outs DROPPED at promotion. The exemption exists
# because converting an inline higher-order utility's `block` into a `fun interface` breaks inlining
# AND forbids non-local return — it would damage working code to satisfy a matcher. What must NOT
# happen is the exemption quietly swallowing ordinary seams, so every `valid` case is a shape that
# must stay silent and every `invalid` case is a shape the rule must still catch even with an
# `inline` keyword somewhere nearby.
id: kt-no-lambda-seam
valid:
  # THE COMPLIANT FORM — the whole point of the rule. Three roles, three types, no raw shapes.
  - 'class Cache(private val log: LogSink, private val clock: ElapsedClock, private val env: EnvReader)'
  # The port DECLARATION itself: `operator fun invoke` keeps call sites byte-identical.
  - |
    public fun interface ClientGone {
        public operator fun invoke(): Boolean
    }
  # Two roles that share a shape are two types — the case the rule's header exists for.
  - |
    class Retry(
        private val clientGone: ClientGone,
        private val clientFrameEmitted: ClientFrameEmitted,
    )
  # DROPPED CARVE-OUT 2, and a GRAMMAR FINDING — an @Composable-annotated slot. The dormant rule
  # carried a `@Composable` exemption; it was unreachable IN PRINCIPLE, not merely unused here.
  # Measured 2026-08-17 against tree-sitter-kotlin: an annotated function type does not parse to a
  # `function_type` node at all — the annotated type becomes an ERROR node (probe: 0 function_type,
  # 1 type_modifiers, 1 annotation, 1 ERROR). So the rule cannot fire on this shape whatever the
  # exemption says, and the clause was describing a protection it never provided. It is pinned HERE
  # rather than deleted so this stays a tripwire: if the grammar ever learns to parse annotated
  # function types, this case starts reporting and goes red, and the exemption question gets a
  # deliberate answer instead of a silent one.
  - 'class Screen(private val content: @Composable () -> Unit)'
  # THE EXEMPTION. Cancellables.runCatchingCancellable — `inline` is load-bearing and documented
  # in-file; a fun interface parameter here costs an allocation and forbids `return` from the lambda.
  - |
    object Cancellables {
        inline fun <R> runCatchingCancellable(block: () -> R): Result<R> = try {
            Result.success(block())
        } catch (e: java.io.IOException) {
            Result.failure(e)
        }
    }
  # The exemption must survive a `suspend` function type — `type_modifiers` sits between the
  # parameter and the function_type, so a shape-blind ancestor walk would miss it.
  - |
    object Boundary {
        inline fun <T> timed(block: suspend () -> T): T = TODO()
    }
  # ...and a PARENTHESIZED/nullable function type, where function_type is two levels down
  # (nullable_type -> parenthesized_type -> function_type) rather than a direct child of parameter.
  - |
    object Boundary {
        inline fun <T> optional(block: (() -> T)?): T = TODO()
    }
  # Other modifiers must not be confused for `inline`: `function_modifier` is the same node kind
  # that spells suspend/operator/tailrec, which is why the regex is anchored.
  - |
    class Host {
        inline fun <T> guarded(block: () -> T): T = block()
    }
invalid:
  # A plain non-inline seam — the rule's whole reason to exist, still caught.
  - 'class Server(private val log: (String) -> Unit)'
  # A non-inline FUNCTION parameter of exactly the exempted shape. `suspend` is not `inline`:
  # SingleFlight.run and CredentialLock.withLock were real examples, now CoalescedWork /
  # CredentialRefresh.
  - |
    class SingleFlight<T> {
        suspend fun run(block: suspend () -> T): T = block()
    }
  # A RETURN type inside an inline declaration is not a parameter — the exemption must not reach it.
  - |
    object Loggers {
        inline fun persistent(dir: String): (String) -> Unit = { }
    }
  # A non-inline LOCAL declaration in an inline function's BODY. (This one survives either stopBy —
  # the outer parameter list is a sibling of the body, not an ancestor — but it is the shape a
  # reader will worry about first, so it is pinned.)
  - |
    class Host {
        inline fun outer(block: () -> Unit) {
            fun inner(seam: (String) -> Unit) { seam("y") }
            inner { }
            block()
        }
    }
  # THE stopBy PROOF. Here a non-inline member IS a descendant of the inline function's own
  # parameter list (an object expression as a default value). This is the only shape that
  # distinguishes `stopBy: {kind: function_value_parameters}` from `stopBy: end`: verified
  # 2026-08-17 that widening it to `end` lets exactly this line go green while every other case in
  # this file still passes. Without this case the narrow stopBy would be an unproven claim.
  - |
    object Host {
        inline fun outer(
            factory: Factory = object : Factory {
                override fun make(seam: (String) -> Unit) {}
            },
            block: () -> Unit,
        ) { block() }
    }
  # A constructor property on a class whose own methods are inline — the modifier belongs to the
  # function, never to the enclosing class.
  - |
    class Host(private val onEvent: (String) -> Unit) {
        inline fun run(block: () -> Unit) { block() }
    }
  # DROPPED CARVE-OUT 1 — a function type inside a generic type ARGUMENT (`type_projection`). The
  # dormant rule exempted this; measured at promotion it was masking exactly one real declaration
  # (Command.kt's verb table, now CommandFactory). A seam is still a seam inside angle brackets.
  - 'private val verbs: Map<String, (Array<String>) -> Command> = mapOf()'
