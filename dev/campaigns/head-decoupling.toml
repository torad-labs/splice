[[items]]
id = "HD-12"
phase = "design"
title = "PARSE AT THE EDGE — stop the wire format from being the domain model (design item, NOT part of the mechanical migration). MEASURED 2026-08-16: every one of the 11 modules imports raw kotlinx.serialization.json — dialect-openai-responses 16/18 files, dialect-openai-chat 3/3, control 3/4, gateway 7/15, app 10/32, core 10/45 — and core's PUBLIC api exposes raw JsonObject/JsonElement in 12 signatures, including the domain type UnknownBlock(val raw: JsonObject). That is why HD-M8's helper ripple is 46 files for the JSON scalars and 37 for runCatchingCancellable: the helpers are not the problem, they are the SYMPTOM of raw wire JSON never being parsed into typed values at an adapter boundary, so every layer needs scalar readers. Under the planned clean architecture the dialects (adapters) would own kotlinx.json entirely, parse once into domain types, and core would export TYPES not utils — moving a scalar helper would then touch one module, not nine. THE WORK: (a) identify the boundary where each wire shape becomes a domain value; (b) give core typed carriers instead of JsonObject-holding ones (UnknownBlock is the tell); (c) push scalar readers into the adapter that owns the wire; (d) THE ENFORCEMENT, without which it decays exactly like no-loose-function did — a wall permitting kotlinx.serialization.json imports ONLY in dialect modules, mirroring the existing 'core stays framework-free / no ktor in core' konsist law, landed as a dated RATCHET allowlist (it would fail in 8 modules today) that shrinks as each module is converted. BLOCKED BY: the mechanical migration (behavior-preserving only, kimi bytes frozen) must land first — it makes every helper a named object, which is what makes this sprawl countable and this refactor plannable."
files = ["TBD at planning time — spans core", "all dialects", "gateway", "control", "app"]
status = "todo"
verify = "the ratchet allowlist in the kotlinx-json import wall shrinks to the dialect modules only, with npm run gate green and kimi goldens byte-identical"

[[items]]
id = "HD-13"
phase = "design"
title = "DOMAIN LAYER — the architecture the style migration did NOT deliver (design item; the migration was a precondition, not the thing). MEASURED 2026-08-16 against the finished tree: :core is a SHARED KERNEL, not a domain layer — its packages are annotation/auth/config/head/index/launch/model/parse/perf/reasoning/topology/turn/usage/util/wire, i.e. infrastructure concerns; 11 of its files import java.io/java.nio and 2 read System.getenv, so it does IO (the konsist law only forbids ktor there); there are 0 UseCase, 0 Repository and 0 Interactor types repo-wide; TurnDriver mixes orchestration, SSE transport, failure classification, watchdog and health counters in one type. Dependencies point INTO core from 9 modules, which is the inverse of clean architecture: the thing everything depends on should be the dependency-free DOMAIN, and core is instead the util hub. WHAT EXISTS TODAY is modularity plus a provider port — real and worth keeping — not layering. TARGET, translated for a streaming gateway rather than an app: (1) DOMAIN — Turn, TurnOutcome, Usage, ModelId, HeadKey, Credentials as value objects, plus the pure policies (terminal precedence, failure classification, effort/compaction rules, context-window accounting); no IO, no JSON, no ktor. The sealed types already in core/turn are the seed. (2) APPLICATION/use cases — DriveTurn, RefreshCredential, LaunchHead, CompactTranscript, ResolveModel — orchestration expressed only against ports. (3) PORTS — UpstreamPort (built request -> stream of DOMAIN events), CredentialStore, TopologyRepository, UsageStore, Clock; provider-spi is a partial port today but shaped as HTTP transport rather than domain. (4) ADAPTERS — dialects own wire<->domain translation and kotlinx.json (see HD-12), ktor owns inbound, files/keychain own credentials. (5) UNIDIRECTIONAL FLOW — inbound -> domain Turn -> use case -> port -> adapter, with events flowing back as DOMAIN events and the SSE emitter a pure projection; today the translators write straight into a WireSink, so transport leaks into the middle. STAGING, each landing with its own wall so it cannot decay the way no-loose-function did: S1 split :core into :domain (pure, IO-free, enforced by a konsist no-IO law) + :platform (what remains); S2 parse-at-the-edge (HD-12) so the domain stops speaking JsonObject; S3 introduce ports + the first use case (DriveTurn) and make TurnDriver an adapter over it; S4 the rest of the use cases; S5 the dependency-direction ratchet from HD-11 tightened to point at :domain."
files = ["TBD at planning time — a multi-wave campaign of its own", "not an item"]
