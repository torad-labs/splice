[[row]]
id = 'cp-overlay'
title = "A wrapper's --settings merges into splice's one overlay on the door"
feature = 'custom-provider'
status = 'todo'
owner = ''
blocked_by = []
guard = false
spec = '''
Claude Code takes one --settings per launch, so today a --settings that a person or a team's wrapper passes to `claude` on the door either replaces splice's overlay (losing the picker and the /login hook) or is lost (issue #680, outcome 12). After this item, a launch of `claude` on the door (POST /launch/claude while the lane is the door) reads every --settings among the person's arguments, inline JSON or a file path, `--settings X` and `--settings=X` alike, and hands Claude Code exactly one --settings: splice's overlay with theirs merged in.

Merge rule (decided here; cp-command reuses it for door commands): objects merge key by key, the person's values win, except what keeps the session on the door and splice's picker, which splice's own values always win: env keys splice sets for the door (CLAUDE_CODE_USE_MANTLE, ANTHROPIC_BEDROCK_MANTLE_BASE_URL, AWS_BEARER_TOKEN_BEDROCK, ANTHROPIC_MODEL, CLAUDE_CODE_MAX_CONTEXT_TOKENS, DISABLE_LOGIN_COMMAND, DISABLE_LOGOUT_COMMAND) and modelPicker. hooks are concatenated per event, splice's entries first, so a wrapper's UserPromptSubmit hook runs beside splice's /login hook. Several --settings merge in the order given. The person's other arguments pass through unchanged, in order. A --settings that is neither a JSON object nor a readable file holding one refuses the launch with a non-200 answer whose text names the value (as boot refuses a bad value: say what and where, never drop it silently).

Where: the door launch overlay (app/.../desktop/ClaudeDoorLaunch.kt, features/launch/.../recipe/LaunchRoutes.kt). The merge is a class of its own beside them; no new top-level functions or companion objects. Heads' own launches are not changed by this item.

