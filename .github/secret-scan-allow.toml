# SOURCE OF TRUTH for .github/secret-scan-allow.txt.
#
# THIS file is safe to comment. Nothing here is ever fed to grep — the .txt is GENERATED from it by
# checks/gen-secret-scan-allow.py, and the generator owns the parts that kept going wrong.
#
# WHY IT IS GENERATED (brain concept #924 — "you make drift not compile"). The .txt is consumed as
# `grep -vEf`, so every line of it is a live regex, prose included. That format LIES: it looks like
# a config file with `#` comments, and both humans and agents carry an overwhelming prior that `#`
# is inert. Three hazards shipped in PR #81 on that prior alone:
#
#   1. an UNANCHORED entry, so appending a credential to the allowed declaration bypassed the scan;
#   2. bare `#` separators — unanchored regexes matching any hit CONTAINING a `#`, which exempted
#      every credential in a shell/Python/YAML/TOML comment, repo-wide;
#   3. an unbalanced `(` in prose, making the whole file an INVALID pattern set so `grep -vEf`
#      errored instead of filtering at all.
#
# Hazards 1 and 2 landed in the SAME FILE in the SAME PR, hours apart: the first was fixed as an
# instance, so the generator simply re-derived the class. Detecting them (canaries, review) is a
# probabilistic filter. Generating the file makes all three INEXPRESSIBLE:
#
#   - prose cannot reach the regex file: there is no slot for it, `reason` stays here;
#   - an unanchored entry cannot be written: the generator applies `^`...`$` itself;
#   - an invalid ERE cannot be committed: generation fails.
#
# Regenerate:  python3 checks/gen-secret-scan-allow.py
# The gate runs `--check`, so hand-editing the .txt fails the build.

[[exemption]]
# A regex FRAGMENT matching the whole source line, WITHOUT anchors — those are the generator's job,
# and it rejects a pattern that tries to bring its own.
pattern = 'const val CUSTOM_API[_]KEY_RESPONSES = "customApiKeyResponses"'
reason = """
The Claude Code settings.json key NAME, not a credential. The scan's ASSIGN pattern fires on
API_?KEY[A-Za-z_]* followed by an assignment of a 15+ character quoted string, which this constant
declaration matches by shape, while its value is a literal JSON field name that Claude Code itself
defines: the approved/rejected list for custom API keys.

SELF-EXEMPTION: the allowlist and this file are both scanned, and an entry quoting a
credential-shaped declaration is itself credential-shaped. The [_] character class keeps the regex
matching the real declaration while breaking the literal the ASSIGN pattern looks for, so neither
file has to exempt itself.
"""

[[exemption]]
pattern = 'base_url = "https.//user.hunter2.w.chatgpt\.example\.invalid/backend-api/codex"'
reason = """
A URL carrying RFC 3986 userinfo, which is the INPUT to the doctor's redaction test — the thing
under test is that splice never prints it back. The host is `.invalid`, reserved by RFC 2606 and
guaranteed never to resolve, and the password is the canonical joke one. A redaction test cannot
be written without a credential-shaped string to redact.

SELF-EXEMPTION, AND THE FIRST ATTEMPT AT IT WAS WRONG: a `[p]` class inside the password left the
scheme separator, the userinfo separator and the at-sign all intact, so the supplementary pass
matched this very line and the allowlist entry became a finding of its own. The pass keys on the
userinfo SHAPE, never on the password, so those three structural characters are each written as
`.` instead — matching them in ERE while leaving none of them spelled anywhere on this line. Note
the prose has to obey the same rule as the pattern: naming them literally here would re-create the
finding in the comment. The broadening is one arbitrary character in three fixed positions of an
otherwise exact, fully anchored line, so nothing can ride along on it.
"""

[[exemption]]
pattern = '"runtime at https.//user.hunter2.w.chatgpt\.example\.invalid/backend-api/codex answered; " \+'
reason = """
The same fixture URL as the entry above, in the EXPECTED-OUTPUT half of the same test file: the
assertion that the doctor's report reproduces the runtime line with the credential removed. Same
`.invalid` host, same joke password, and the same three structural characters written as `.` for
the same reason — this line must not itself carry a userinfo shape.
"""

[[exemption]]
pattern = 'val secre[t] = "API[_]KEY="\.toByteArray\(\) \+ junk \+ "!"\.toByteArray\(\)'
reason = """
Not a credential: a BYTE PATTERN assembled to prove the process-environment scrubber finds and
clears an API-key-shaped run of bytes. The quoted value is the eleven characters of the env var
NAME plus its equals sign; there is no value at all.

SELF-EXEMPTION: two character classes, one breaking the `secret =` assignment shape and one
breaking the env var name, neither changing which source line the regex matches.
"""

[[exemption]]
pattern = 'private const val UPSTREAM_SECRE[T] = "splice-held-upstream-secret"'
reason = """
A test marker, and self-describing: HeadTraceTest asserts that a secret splice holds upstream never
reaches the on-disk trace, so the constant IS the needle the test searches the trace for. Its value
is the literal phrase, chosen to be recognisable in a diff rather than to be secret.

SELF-EXEMPTION: `SECRE[T]` matches the declaration while breaking the `SECRET =` assignment shape.
"""
