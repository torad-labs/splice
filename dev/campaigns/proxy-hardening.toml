te' and 'does not undercount unicode' — add a case asserting a 1 MB base64 image block does not inflate the estimate beyond a few thousand tokens, and that CJK text still does not undercount. Gate: `npm run gate`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### CX-03'"
