title = "ConfigService.persistApplied uses an UNREADABLE config.json as the merge base for an atomic overwrite, destroying every previously persisted knob — and its sibling in the same package documents the correct doctrine verbatim. Orchestrator-VERIFIED at ConfigService.kt:202-206: readOnDisk is wrapped in runCatchingCancellable{}.getOrDefault(JsonObject(emptyMap())), that empty object becomes the merge base, and SecureFile.writeAtomic0600 then atomically REPLACES the file. Concrete: the operator hand-edits config.json and leaves a trailing comma; the next `splice config set effort high` throws SerializationException on read, merges {effort:high} over an empty base, and writes a one-key file. Every other persisted knob is gone at next boot. The outer .onFailure log never fires because the WRITE succeeded, so there is no log line at all and the CLI reports success. KeyStore.kt:79-86 states the rule for the identical read-modify-write shape and was orchestrator-verified to contradict this directly: ABSENT = legitimately empty (safe to write); UNREADABLE = unknown state, abort rather than let persist() rebuild a one-key file over every stored key. ConfigService was never re-checked against its own package sibling. Second arm, same file: fileLayer() at 146-147 swallows the same corruption to emptyMap so every persisted knob silently reverts to default at runtime, while envLayer eleven lines below logs for a single bad env value. Fix: give persistApplied the entriesStrict shape (abort the write on unreadable), and log in fileLayer when a present-but-unparseable file is discarded."
