actly as {id,status,detail}; tests codify rather than detect those extras. Finding 4 (option parser can write to a flag-named file): DoctorReportOptions.parse silently ignores unknown/duplicate arguments; bare --out falls back to stdout, while --out --with-logs treats --with-logs as a path and DoctorReport.emit creates or truncates that cwd file (DoctorReportOptions.kt:19-26; DoctorReport.kt emit path). --with-logs/--out without --json are silently ignored by text output. There is no parser coverage. Finding 5 (tail contract is not guaranteed): perf reads only a fixed 256 KiB active-file tail before takeLast(200), so sufficiently large valid rows produce fewer than the actual last 200; perf/log readers ignore rotated generations and read failures silently become empty arrays (DoctorReportTail.kt:78-94). Finding 6 (fence failure): exact manifest fence-checks name required split production files DoctorReportOptions.kt, DoctorReportShape.kt, and DoctorReportTail.kt as uncovered. DoctorReport directly depends on all three, and DoctorReportOptions.kt/DoctorReportShape.kt are current V4-06 implementation changes. Verified correct: schema_version 1 and version/OS/JVM fields exist; URL output is host-only; statuses and free-text check details are redacted; all current PerfKeys are listed; logs are opt-in and active-file capped; with --out the preview executes before Files.writeString; ordinary JSON parses; account auth ids/emails are structurally omitted.
