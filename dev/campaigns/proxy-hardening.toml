title = "A deleted mgmt-key file is a documented manual-kill || PROBLEM: doctor's `mgmtKeyCheck` raises a hard FAIL when the key file is missing while the daemon is running, and its remediation is literally 'terminate the daemon process manually; the next launch re-mints the key' — because the daemon holds its boot-minted key in memory, re-reads no file, and `splice restart` cannot authenticate its own shutdown without the file. That is a self-inflicted manual intervention: the process that owns the authoritative value is running, healthy, and one atomic 0600 write away from restoring the file every other component reads. This is the clearest instance in the codebase of 'a human must … || SPLICE TODAY: `gateway/app/src/main/kotlin/splice/app/cli/DoctorCommand.kt:155-176` — `:164` is the literal fix string 'terminate the daemon process manually; the next launch re-mints the key' on a hard FAIL. `gateway/core/src/main/kotlin/splice/core/config/MgmtKey.kt:13` — `private val value: String by lazy { ensure() }` holds the value for the process lifetime and `ensure()` (`:17-30`) is never re-entered. `SecureFile.writeAtomic0600` is already the write primitive at `:26`. || PROPOSAL: Make the daemon reconcile its own key file. Cheapest form: a periodic (or probe-piggybacked) check — if the daemon is running and `statePaths.mgmtKeyFile` is absent or blank, re-write the in-memory value via `SecureFile.writeAtomic0600` and log `[mgmt-key] key file missing at <path> — re-persisted from memory`. That turns doctor's FAIL into an INFO the operator may never see, and removes the only 'kill the process by hand' instruction in the whole diagnostic. Keep doctor's FAIL for the case where the daemon is running AND the re-persist itself failed (a genuinely unwritable state dir), which is the real unrecoverable state. || EFFORT/RISK: S. **Risk** Low — writing a file the daemon already owns, atomically, at 0600. **Must not** re-write when the file exists with different content; that would clo || VERIFY-SPEC: A daemon-level test that deletes the mgmt-key file mid-run and asserts it reappears with the same value and that the log line fires; plus a `DoctorCommandTest` update proving the FAIL branch now only triggers when re-persist is impossible. Gate: `npm run gate`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### SH-13'"
