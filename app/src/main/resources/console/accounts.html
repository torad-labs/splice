<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splice · Accounts</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/splice-app-256.png">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="deck-accounts.css">
</head>
<body>
<main class="field" id="field">
  <div class="marks" id="marks" aria-hidden="true"></div>
  <section class="centre" id="centre" aria-label="Claude accounts">
    <header class="head">
      <div>
        <div class="eyebrow"><span class="lamp kick-lamp"></span>&nbsp; <span id="kick">Claude</span></div>
        <h1>When each account is usable again</h1>
        <p class="sub">Drag a lane to change the order Splice moves through them.</p>
      </div>
      <div class="status"><span class="lamp live status-lamp"></span><span>Live</span><span class="faint">·</span><span id="clock"></span></div>
    </header>
    <div class="scale" id="scale"></div>
    <div class="lanes" id="lanes" role="list"></div>
  </section>
</main>
<aside class="glass rail rail-l" data-lens aria-label="Claude now">
  <section class="sec" id="serving"></section>
  <section class="sec" id="today"></section>
  <section class="sec">
    <h2 class="eyebrow">Coming back</h2>
    <ul class="back" id="backList"></ul>
  </section>
</aside>
<aside class="glass rail rail-r" data-lens aria-label="Other providers">
  <!-- the other providers, drawn by page.js -->
</aside>
<script src="api.js"></script>
<script src="deck-lens.js"></script>
<script src="deck.js"></script>
<script src="deck-composer.js"></script>
<script src="deck-common.js"></script>
<script src="pilot.js"></script>
<script src="deck-accounts.js"></script>
</body>
</html>
