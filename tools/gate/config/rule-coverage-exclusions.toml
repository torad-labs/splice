[[exclusion]]
rules = [
  "kt-no-exception-as-outcome", "kt-no-runblocking-exported-bridge", "kt-no-vanilla-config-dir",
  "kt-quota-tracker-single-resolution", "kt-turn-finally-flush-quietly",
