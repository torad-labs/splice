# [2026-09-18] 2026-09-18 CONTRACT CHANGE (orchestrator, from M2-D1's finding): entity api modules call their routes through the exported request<T> helper of @shared/api and declare payload types locally; no row edits shared/api (CONTRACTS.md section 8).
# [2026-09-18] DISPATCH: to=design-builder4 (packet emitted)
# [2026-09-18] 2026-09-18 orchestrator: dispatched to design-builder4 after M2-D1 landed (commit 1623df63). PendingRoute and pendingOf are now exported from @shared/api (hoisted from M2-D1); use them, never redeclare.
# [2026-09-18] CLAIM: owner=design-builder4 at=2026-09-18T06:24:21Z
# [2026-09-18] ATTEST-START: tree=3a442999ec817901378de63053c6f23ca9237413 at=2026-09-18T06:24:21Z
# [2026-09-18] 2026-09-18 NOTE (headless flag): shipped as the daemon's own sentence on the payload (SessionsPayload.note, from SessionsRoutes.kt:13-14), not as a per-row boolean. EVIDENCE: a headless run never registers (SessionRegistry.kt:1-3), and on this machine 2026-09-18 all 31 files in ~/.claude/sessions/ carry kind=interactive, so a per-row flag would be false on every row forever and would hide the sentence that actually explains a missing session. The row wording is respected: the page prints note where it would otherwise print no sessions.
# [2026-09-18] 2026-09-18 DECISION (session exports): the registry store/hook are sessionRegistryStore and useSessionRegistry, NOT useSessions, because this slice already exports sessionStore/useSession for the management-key gate that the shell's unlock-mgmt reads. Two near-identical names in one slice is how a page ends up gating on the wrong store. Every existing export is unchanged: initSession, unlock, sessionStore, useSession, SessionState.
# [2026-09-18] 2026-09-18 CONTRACT REQUEST for V4-130: the console needs repo as a FIELD on /api/sessions, not only as GET /api/sessions/{id}/repo as section 6 allows. Grouping by repo needs the root of every row in one payload; the per-id form is N requests for one board. Typed as SessionRepo { root, worktree?, reason? }. Likewise team is proposed as a field on the row (V4-131/V4-133): grouping by team needs the binding in the same payload, and it is unattributed for every row until teams exist.
# [2026-09-18] 2026-09-18 NOTE (/api/sessions is NOT pending): the route exists (ControlServer.kt:154), so the registry store is not a PendingRoute union and a 404 there is an error the page must show; only the repo/team fields are pending. Tested both ways (entities-sessions.test.ts, the pending-routes block).
# [2026-09-18] 2026-09-18 MEASURED (MCP): GET /api/mcp exists (ControlServer.kt:161 -> McpHost.statusJson) and is typed from McpStatus.json (eligible/ineligible union, per-name keys). Restart has no route: ControlServer.kt:162-164 are the Streamable HTTP transport, so the entity exports MCP_RESTART = { pending: 'no route; CLI only' } and contains no call that could reach it. The four host limits are NOT in this payload: they are runtime knobs read at ControlPanel build (ControlPlane.kt:135-146 -> Knob.MCP_IDLE_TIMEOUT_MS, MCP_MAX_SERVERS, MCP_REQUEST_TIMEOUT_MS, MCP_INITIALIZE_TIMEOUT_MS), so M2-07 reads them from @entities/config with their provenance and this slice restates no constant.
# [2026-09-18] 2026-09-18 NOTE (doctor typing): the report is typed from DoctorReport.build (schema 1): schema_version, generated_at, splice/claude_code versions, os, jvm, checks, and the topology/accounts/perf blocks left OPAQUE on purpose - each has its own page and entity (FEATURES.md 4.12 asks this page for checks and version drift). A check has exactly {id, status, detail} and its remedy RIDES INSIDE detail after a U+2014 separator (DoctorReportShape.kt:59), so checkFix parses the separator (assembled from its code point, never typed, so the copy gate and this parser cannot be confused) and returns null when a check offers no fix. The redaction check (model/redact.ts) mirrors DoctorRedaction's credential and identifier shapes IN ITS ORDER and reports kind + JSON path, never the matched text. NOT mirrored, with the reason: the CLI's path allowlist (DoctorRedaction.kt:55-72) is built at runtime from StatePaths/InstallPaths (DoctorRedaction.kt:35), so a console-side mirror would flag splice's own state dir as foreign and make every report read as a leak.
# [2026-09-18] 2026-09-18 GAP for M2-07 (not this slot, nothing built): FEATURES.md 4.12 Upgrade needs GET /api/upgrade (section 6: installed, latest, rollback available) and no entity owns it; this row's slot names /api/doctor only. Version drift needs nothing extra: the daemon already projects it as a doctor check (DoctorClientVersion.kt:8-10 via health.clientVersionWarning). M2-07 shares these entity directories, so it can add the upgrade call there; flagging it so the page row is not blocked late.
# [2026-09-18] 2026-09-18 NOTE (proposed shapes, pending rows): transcript uses GET /api/sessions/{id}/transcript?cursor=<opaque> with {session_id, path, messages[{index, role, ts?, text, tool?, result?}], next?, total?}; the console never parses the token. project needs only the list and the files route (GET /api/projects, GET /api/projects/{id}/files with looked_in) - no project-detail route is invented, because the page composes sessions/turns/cost/scope from @entities/session, @entities/perf, @entities/economics and @entities/config. budget is {head, daily_usd|null, action: warn|block} where null is no budget, never a budget of zero. alert is {desktop, webhook_url|null} with no chat channels (section 5 puts Slack/PagerDuty out) and the test send modeled as POST /api/alerts/test. PUT responses are typed as the daemon's NEW state, never the request.
# [2026-09-18] 2026-09-18 NOTE (no prefetch): the transcript slice has no poller and fetches nothing on import; loadTranscript reads the first page and loadMoreTranscript reads the next, and loadMore is a no-op when nothing is loaded, when the daemon said the transcript ended, or when a page from another session arrives (the cursor resets, it never interleaves two conversations).
