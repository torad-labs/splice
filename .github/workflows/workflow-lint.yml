# Static analysis for GitHub Actions workflows and Dependabot config.
#
# zizmor catches credential leakage, template injection, excessive permissions,
# cache poisoning, and other workflow-level vulnerabilities. actionlint catches
# expression/type/shellcheck errors that zizmor ignores. Both run on every
# change to the workflow surface so hardening regressions never reach main.
name: workflow-lint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Run zizmor
        run: uvx zizmor@1.28.0 --format github .

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e # v1.74.0
        with:
          reporter: local
          fail_level: error
          # reviewdog computes findings against a diff by default and the shallow PR
          # checkout has no base — "diff command is empty" red. nofilter = lint the
          # whole workflow surface every run (this gate's entire point).
          filter_mode: nofilter
