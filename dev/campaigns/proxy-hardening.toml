hronically contended path is visible rather than felt as latency. **This is an explicit operator fork:** the alternative is to time out and return … || EFFORT/RISK: S. **Risk** Medium and worth stating plainly: this trades an unbounded hang for a rare same-instant double refresh, the exact race G1 was written to close. The  || VERIFY-SPEC: Extend `gateway/provider-spi/src/test/kotlin/CredentialLockTest.kt`: hold the sibling `.lock` from a second `FileChannel` on another thread for longer than the budget; assert `withLock` returns within budget+slack, the degrade line is logged, and the block still ran. Gate: `npm run gate`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### SH-06'"
