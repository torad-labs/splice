# checks/config/role-registry.toml — the DISPOSITIONS for checks/role-registry.py (V4-89,
# ARCH-AUDIT 2026-09-17, audit B row 5).
#
# ONE ROLE, ONE INTERFACE. 200 `fun interface` declarations in main sources normalise to 132
# single-abstract-method signatures, and 26 of those signatures are carried by two or more NAMES.
# Sharing a shape is not a defect — kt-no-lambda-seam.yml's header is explicit that collapsing
# distinct roles into a shared `BooleanSupplier` would be STRICTLY WORSE than the lambdas it
# replaced, and its canonical example lives in this file: ClientGone (the client hung up — abandon
# the turn) and ClientFrameEmitted (the client already saw output — too late to retry) are read a
# few lines apart on the same retry path and drive OPPOSITE decisions. Swapping them compiled
# before that wave and produced either an abandoned healthy turn or duplicate output on the wire.
#
# So the wall cannot decide; it can only insist the decision be WRITTEN. Every name in a shared
# group must appear in this file under its signature, with a non-empty reason. Absence is not a
# disposition: an unlisted name fails BY NAME, which is how ADDING a lambda-shaped port costs one
# sentence, and a name listed here that no longer exists fails as STALE, which is how a fix is
# detected.
#
# THREE NAMES ARE DELIBERATELY ABSENT, and that is the point of the row that created this file.
# They are not distinct roles, so no reason can honestly be written for them:
#   ElapsedNow    (provider-spi/RuntimeSeams.kt:40)      == ElapsedClock  (core/util/RuntimePorts.kt:143)
#   AccountNow    (provider-spi/AccountSelection.kt:22)  == WallClock     (core/util/RuntimePorts.kt:105)
#   HeaderLookup  (gateway/usage/RateLimitHeaders.kt:22) == QuotaHeaderRead (core/usage/QuotaHeaders.kt:15)
# Each was verified against the declarations, not taken from the audit: ElapsedNow's KDoc says
# "a monotonic now-reading in milliseconds … retry deadlines and the shared 429 cooldown", which is
# ElapsedClock's contract verbatim; AccountNow's says "epoch time seam used to compare provider
# reset timestamps", which is exactly WallClock's "compared against a foreign epoch"; and
# QuotaHeaderRead's KDoc ADMITS the duplication — "the gateway's own HeaderLookup lives a module
# above this one, so the header families are decoded against this port". `role-registry.py check`
# is RED on those three names until the sibling fix row reconciles them.
#
# HOW TO ADD AN ENTRY. Run `python3 checks/role-registry.py report .` for the census, then write
# the signature verbatim, today's date, the names, and a reason that says what each role IS. A
# reason a reviewer cannot check is worse than none, because it looks like work.

# ── 15 names, () -> Unit ──────────────────────────────────────────────────────────────────────────
[[groups]]
signature = "()->Unit"
dated = "2026-09-17"
names = [
    "AuthRefreshObserver",
    "CodeModeCleanup",
    "FileIoTask",
    "HaltJvm",
    "MuseMintWriteGuard",
    "ProtocolAnomaly",
    "PulseTick",
    "RawSseFlush",
    "RestoreStep",
    "ShutdownDaemon",
    "StopControl",
    "StreamStart",
    "Teardown",
    "WorkerExited",
    "WsRoundAbort",
]
reason = """A nullary effect is the widest shape in the language and the one that says the least: \
every one of these is an EVENT or an ACTION with its own lifecycle owner, and no two are wired \
from the same place. Notifications the caller only observes: AuthRefreshObserver (a credential \
refresh happened mid-attempt), WorkerExited (the code-mode worker process died), ProtocolAnomaly \
(a WS frame arrived that the protocol does not allow), StreamStart (the upstream began emitting), \
PulseTick (the spinner's next frame is due). Actions the caller commands: HaltJvm (exit the \
process), Teardown and StopControl (shut this component / the control plane down), ShutdownDaemon \
(the daemon's own stop path), WsRoundAbort (abandon the in-flight WS round), CodeModeCleanup \
(release the worker's cell), RawSseFlush (push buffered bytes to the client socket), RestoreStep \
(undo one already-applied upgrade step), FileIoTask (the body to run on the file-IO dispatcher), \
MuseMintWriteGuard (the pre-write assertion before a minted key is persisted). Substituting any \
for any other is not a type error and would be silent: HaltJvm for Teardown kills the process \
where a component shutdown was meant, and RestoreStep for WsRoundAbort unwinds an upgrade in the \
middle of a turn. These need MORE naming than a shared shape, not less."""

# ── 10 names, () -> Boolean ───────────────────────────────────────────────────────────────────────
[[groups]]
signature = "()->Boolean"
dated = "2026-09-17"
names = [
    "ClientFrameEmitted",
    "ClientGone",
    "ConsolePresence",
    "ContentReached",
    "DaemonRestart",
    "KeyPresenceProbe",
    "TerminalSeen",
    "TopologyStale",
    "UpgradeRun",
    "WatchdogTripped",
]
reason = """THE CANONICAL GROUP, documented in kt-no-lambda-seam.yml's own header. ClientGone (the \
client hung up, so abandon the turn) and ClientFrameEmitted (the client already saw output, so a \
retry would duplicate it) are read a few lines apart on the same retry path and drive OPPOSITE \
decisions; swapping them compiled before HD-22 and produced either an abandoned healthy turn or \
duplicate bytes on the wire. The remaining eight are each a different predicate about a different \
subject: ContentReached (has any content frame left the emitter yet — the question the pre-content \
wire-type rule turns on), WatchdogTripped (did the turn watchdog fire), TerminalSeen (has the WS \
stream produced its terminal event), TopologyStale (has splice.toml changed under the running \
daemon), KeyPresenceProbe (is a management key present right now), ConsolePresence (is a TTY \
attached), UpgradeRun (does this process hold the upgrade lock), DaemonRestart (restart the daemon \
and report whether it came back — the only one here that ACTS rather than asks). A single shared \
BooleanSupplier would make every one of those nine substitutions compile."""

# ── 6 names, () -> Long (TWO MORE ARE DUPLICATES AND ARE NOT LISTED) ─────────────────────────────
[[groups]]
signature = "()->Long"
dated = "2026-09-17"
names = [
    "ElapsedClock",
    "HeadPerfSkipSource",
    "HostClock",
    "RemainingTurnWait",
    "WallClock",
    "WsPathPulse",
]
reason = """Three different KINDS of long, none interchangeable, plus a count. WallClock reads UNIX \
epoch milliseconds — a real point in calendar time, persisted as a perf row's `ts`, minted into \
MgmtKey.mintedAtMs, and compared against a token's `exp` and a file mtime this process did not \
author. ElapsedClock reads a MONOTONIC timebase whose origin is arbitrary and per-process: a \
single reading means nothing, only a difference does, and it exists precisely so an NTP step or a \
suspend/resume cannot abort a healthy turn or pin a gate slot forever. Substituting either for the \
other is the incident MonoClock was introduced for, and both KDocs forbid it in writing. HostClock \
is the MCP host's own injected epoch reading, scoped to that subsystem's config so host session \
ages are testable without a process-global clock. RemainingTurnWait is a BUDGET — how much of the \
turn deadline is left — not a clock reading at all. WsPathPulse is an AGE, milliseconds since the \
last WS ping, which is a derived difference rather than either clock. HeadPerfSkipSource is not a \
time at all: it is a COUNT of perf rows that could not be attributed. \
DELIBERATELY ABSENT: ElapsedNow (provider-spi/RuntimeSeams.kt:40) is ElapsedClock's role in a \
second module, and AccountNow (provider-spi/AccountSelection.kt:22) is WallClock's. Both are red \
by name until the fix row reconciles them; listing them here would be a lie that closes the wall."""

# ── 5 names, () -> String ─────────────────────────────────────────────────────────────────────────
[[groups]]
signature = "()->String"
dated = "2026-09-17"
names = [
    "ClaudeVersionRead",
    "DashboardPage",
    "McpBearer",
    "ProgressLine",
    "WallClockIso",
]
reason = """Five unrelated strings, and the pair that proves the UNIT is part of the role. WallClockIso renders wall time as an ISO-8601 instant, and its KDoc records why it is not a String alias for WallClock: both call sites are `put(FIELD_LAST_REFRESH, JsonPrimitive(nowIso()))`, where a WallClock would also compile and would silently persist `1755400000000` where an operator, and every `last_refresh` ever written, expects `2026-08-17T…Z`. The others share nothing but the return: McpBearer is a SECRET — "the MCP-scoped bearer at plan time; generated client configs must not carry management authority"; DashboardPage is an HTML document; ProgressLine is one client-visible status line "composed at the instant the wire takes it", a seam rather than a String because composing it CONSUMES the caller's ticker state and reads its live clock; ClaudeVersionRead is the client's reported version. A shared port would let the MCP bearer be rendered into the dashboard page."""

# ── 4 names, (String) -> Boolean ──────────────────────────────────────────────────────────────────
[[groups]]
signature = "(String)->Boolean"
dated = "2026-09-17"
names = [
    "BrowserOpener",
    "CredentialPresenceProbe",
    "DirectoryProbe",
    "VersionedRestart",
]
reason = """Two ask and two ACT, which is the distinction that matters when the answer is a bare Boolean. DirectoryProbe asks whether a path is a directory; CredentialPresenceProbe asks whether a head's credential is configured. BrowserOpener LAUNCHES a browser at a URL and reports whether the launch succeeded; VersionedRestart "restarts the daemon the plain way (stop, then cold start from this shell), waiting for a daemon that reports [expectedVersion]" — a multi-second side effect whose false means "it did not come back", not "no". A probe's double wired where an actor was meant reports a clean skip for work that never ran, which is the shape of a green upgrade that never upgraded."""

# ── 4 names, (String) -> String ───────────────────────────────────────────────────────────────────
[[groups]]
signature = "(String)->String"
dated = "2026-09-17"
names = [
    "AuthJsonFromResponse",
    "DeviceAuthForm",
    "ExchangeForm",
    "GitBranchReader",
]
reason = """Three codecs on different sides of the OAuth wire, plus one unrelated reader. ExchangeForm builds the x-www-form-urlencoded token-EXCHANGE body for a real authorization code, per-provider because codex and grok disagree on which of client_id, code_verifier and redirect_uri they require, and the ENCODING happens inside it — an unencoded `code` on the wire is an opaque 400 to the operator. DeviceAuthForm builds the RFC 8628 device-authorization REQUEST body. AuthJsonFromResponse runs the other way entirely: a token RESPONSE in, the credential JSON out, and the result is written through SecureFile.writeAtomic0600 — what comes out of one of these is a credential at rest. Two request builders and one response parser sharing a type would let a credential-shaped string be posted upstream, or a form body be written to auth.json. GitBranchReader reads the current git branch for a working directory and shares this shape by coincidence, which is the hazard the naming answers."""

# ── 4 names, (String) -> Unit ─────────────────────────────────────────────────────────────────────
[[groups]]
signature = "(String)->Unit"
dated = "2026-09-17"
names = [
    "LogSink",
    "MalformedLine",
    "RawSseWrite",
    "RetryNotice",
]
reason = """Four destinations for one string, and the split that must not compile is diagnostic plane versus client wire. LogSink writes a DIAGNOSTIC to the daemon log and stderr, head-scoped so every line carries its `[<headKey>]` prefix. MalformedLine reports one unparseable upstream SSE line, and its contract is that it is "a REPORT and not a throw" — a malformed frame must never crash the stream. RawSseWrite puts BYTES ON THE CLIENT SOCKET (the bottom rung of the write-port ladder). RetryNotice is client- and operator-facing text about a retry already decided — "a NOTICE, not a decision", and the only account an operator gets of a 429 cooldown or a stream re-issue. A LogSink wired where RawSseWrite was meant sends the client nothing and the turn hangs; the inverse writes daemon diagnostics into a transcript."""

# ── 4 names, suspend () -> T ──────────────────────────────────────────────────────────────────────
[[groups]]
signature = "suspend ()->#1"
dated = "2026-09-17"
names = [
    "CoalescedWork",
    "CredentialRefresh",
    "MaterializedRequest",
    "TimedWork",
]
reason = """Four generic suspend producers whose contracts are about DUPLICATION and OWNERSHIP, which a type parameter cannot say. CoalescedWork "runs EXACTLY ONCE per wave however many callers pile up and however many of them are cancelled mid-wait", in a scope SingleFlight owns rather than any caller's — so it must not close over one caller's cancellation or deadline. CredentialRefresh is "the whole indivisible unit" run under the credential-file lock, where anything split out leaves the race open, and it may deliberately run WITHOUT the lock once the bounded wait expires (SH-06: bounded beats hung). MaterializedRequest produces the turn's request body under the materialization gate and must NOT hold its lease across the upstream call, or it starves every other head; its `T : Any` bound makes null mean CONTENTION and nothing else. TimedWork is the body TurnPerf wraps to measure, charged to its counter even when it throws, and deliberately not inlined. Collapsing any two would make "run this at most once" and "run this and time it" the same seam."""

# ── 3 names, () -> Int ────────────────────────────────────────────────────────────────────────────
[[groups]]
signature = "()->Int"
dated = "2026-09-17"
names = [
    "FailedHeads",
    "LiveLimit",
    "OpenSockets",
]
reason = """Two GAUGES and a CAP, and InflightGate's own KDoc draws the line: LiveLimit is "a concurrency limit READ FRESH at every admission decision, never captured at construction" — the freshness is why kotlinx Semaphore is banned there, since a live PATCH of maxInflight must change the next admission without a head restart — and it is "distinct from a GAUGE (ControlServer.failedHeads), which is also `() -> Int` but reports what IS rather than bounding what may happen next". FailedHeads is that gauge, counting heads that failed to start, which the control plane turns into `ok:false`. OpenSockets counts live WS sockets on the responses path. A gauge wired where the limit was expected admits traffic against the current occupancy, so the gate stops gating — and both are non-negative Ints, so nothing complains."""

# ── 3 names, (Path, Path) -> Unit ─────────────────────────────────────────────────────────────────
[[groups]]
signature = "(Path,Path)->Unit"
dated = "2026-09-17"
names = [
    "LinkPointer",
    "SymlinkOp",
    "WrapperClaim",
]
reason = """Three link operations at three levels, each a seam for a DIFFERENT safety property that only a fault-injecting test can reach. SymlinkOp creates one symbolic link, and is a seam because "the swap's whole safety property — that a failure NEVER destroys the operator's pre-existing file — is only testable on the production path if the create can be made to fail on demand", the ENOSPC/LSM-EPERM case DR-11 was opened for. LinkPointer "repoints one symlink atomically" (UpgradeLayout.point), which is the upgrade ACTIVATION: its failure must leave the previous release live. WrapperClaim is "the one wrapper name-claiming primitive", whose DR-67 property is that a foreign file appearing AFTER the precheck wins and never gets eaten. One shared port would let the claim's refuse-on-conflict semantics be served by the primitive's plain create, which is how an unrelated binary on PATH gets clobbered."""

