# splice — example multi-provider topology.
#
# Copy to ~/.config/splice/splice.toml for the comprehensive example. `splice init` writes the
# zero-config OpenRouter API-key starter instead. Adding a provider/head requires a daemon restart.
# Context windows are the exception: the running daemon re-reads a context_window edit (model rows,
# extra_windows, window_rules, default_context_window, a head's context_window) with no restart.
#
# The OAuth sections below are what splice was built for — Claude Code on your ChatGPT, Grok,
# Kimi, or Muse subscription. They are unofficial: they reuse each vendor CLI's public OAuth client
# identity, which no vendor documents for third parties. Use them at your own risk.
# A new OpenAI-compatible API-key vendor is otherwise pure TOML: base URL, key env, and models.

[daemon]
control_port = 3096          # loopback-only control plane + dashboard

# Reasoning display — edit here, restart daemon. No code change.
# Env aliases (CLAUDEX_SHOW_REASONING etc.) and runtime PATCH still override these.
show_reasoning = "text"      # "text" | "thinking" | "off"  — stream thinking into Claude Code
summary        = "detailed"  # "detailed" | "concise" | "auto" | "none"
# effort       = "high"      # optional; omit → high (Grok floors invalid values to low)
replay_reasoning = false     # NEVER turn on lightly: replaying prior opaque encrypted reasoning items thins fresh reasoning
mirror_reasoning = false     # operator-locked off; TOML, state, env, and runtime PATCH cannot enable transcript mirrors
# Plan-usage bars: a subscription head (ChatGPT, Kimi, SuperGrok) polls its provider's usage
# endpoint every five minutes with that head's own bearer. Env CLAUDEX_QUOTA_POLL=off stops every
# poller (restart the daemon); the bars then draw only from the headers each round already carries.
# Shared MCP hosting (default on): stdio MCP servers that depend on neither a project directory nor
# client roots start once in the daemon and serve every session over loopback Streamable HTTP;
# each head's .claude.json points at the hosted URL, your own config file is never edited.
# mcp_hosting = false            # every session launches its own servers, as before
# mcp_hosting_exclude = ["name"] # keep these servers per session even when eligible; hosted servers
#                                # run in your home directory, so list any that reads its cwd unnamed

# ── compaction instructions: your text after Claude Code's own summarizer prompt ──
# Most specific scope wins and REPLACES the others (project+model > project > model > global);
# absent inherits; instructions = "" opts out. Text inline or file = "~/path". Compaction requests
# only: the cached request prefix is byte-identical with and without it. /api/compact shows the
# effective text and its source.
# [compaction]
# instructions = "Keep every file path, command and error text verbatim."
# [[compaction.model]]
# model = "gpt-6-astra"          # the upstream id, after any [1m]-style suffix is stripped
# file = "~/.config/splice/compaction-astra.md"
# [[compaction.project]]
# path = "/home/me/projects/app" # the session's working directory, longest path wins
# instructions = "Summarize the migration plan in docs/plan.md first."

# ── EXPERIMENTAL OPT-IN: ChatGPT Codex subscription via OAuth ─────────────────
[providers.codex]
dialect = "openai-responses"
base_url = "https://chatgpt.com/backend-api/codex"
# EXPERIMENTAL: reuses the Codex CLI's public OAuth client identity — NOT a vendor-documented
# third-party integration. The credential file is password-equivalent; splice reads AND refreshes it
# in place. Documented alternative: OpenAI Platform API keys (kind = "api-key", env = "OPENAI_API_KEY").
# The credential is splice's OWN: ~/.config/splice/auth/codex.json, written by `splice login claudex`,
# on whichever ChatGPT account you choose there. Set file = "~/.codex/auth.json" ONLY to share the
# Codex app's session — the two then rotate each other's refresh token and sign each other out.
auth = { kind = "chatgpt-oauth" }
# More accounts of the same kind: `splice login claudex --label work` stores a second credential at
# ~/.config/splice/auth/chatgpt-oauth/codex.json/work.json; the head switches to it between turns when the
# primary's window is exhausted or a 429 outlasts the turn, and comes back after the reset (README,
# "More than one account per provider"). No key here: the pool is whatever files exist.
# Table form, not inline: tool_surface below is a sub-table, and TOML forbids adding a sub-table
# to an inline table. Every knob here is what the daily-driven claudex runs.
[providers.codex.quirks]
store = false
account_id_header = true
cache_key = "first-message-hash"
effort_ceiling = "max"
summary_field = true
# RETIRED — compact_effort is not a knob any more, and setting it FAILS AT LOAD. A compaction is
# built exactly like a turn and inherits the session's model and effort: any pin moves the
# reasoning off the session's, and the backend's prompt cache then misses the whole transcript on
# the most expensive turn class there is. The key is still PARSED so a config that carries it is
# rejected loudly at startup instead of being ignored in silence. Remove it from any config that
# has it; it is documented here so that an operator reading this file learns why it is gone.
# retired: compact_effort — a compaction is built exactly like a turn, so any effort pin misses the prompt cache on the whole transcript
# websocket (default false in code): serve rounds over the Responses WebSocket with
# previous_response_id chaining, so a continuation turn sends ONLY the new items instead of the
# whole history. Measured on a 12-round tool loop: wire bytes go FLAT (~2.4KB) while the full send
# grows linearly — 92.5% less at round 12. It is an OVERLAY: any failure — handshake, busy socket,
# send, first-event timeout, or a round that fails before the client sees content — falls back to
# the normal SSE path, which keeps sole ownership of retry, the 401 refresh and the 429 cooldown.
# With the key false or absent no WebSocket is ever constructed and the request path is
# byte-identical to a build without the feature.
websocket = true
# zstd_request_body (default false): compress request bodies the way codex-cli 0.145.0 does to
# this endpoint (2.7x measured). Codex ONLY — xAI 400s on a compressed body; never set it elsewhere.
zstd_request_body = true
# reasoning_cache (default true): the gateway holds each turn's encrypted reasoning and reinjects
# it on tool round-trips (codex-CLI parity — without it the model re-derives its plan at every
# tool result: repeated tool calls, duplicated reasoning). The gateway retains only the OPAQUE
# encrypted envelopes, bounded + TTL'd; set reasoning_cache = false to restore the old behavior.
# parallel_tool_calls (default false): explicit wire policy for responses-lite turns.
# Official Codex also sends false for Lite, even when model metadata advertises parallel support.
# This controls backend function-call batching, not tool callbacks inside one JavaScript cell.
# A client's disable_parallel_tool_use=true always wins; toolless turns stay false.
# true was tried live 2026-09-20: the ChatGPT lite backend 400s every turn ("requires
# `parallel_tool_calls` to be false"). Leave it unset; batching comes from code mode.
# parallel_tool_calls = false
# code_mode (default TRUE for chatgpt-oauth + openai-responses providers, off everywhere else):
# adds splice's JAR-bundled JavaScript runner and orchestration instructions only to eligible turns:
# GPT-6 Astra and Sol in both families by default, or the ids in code_mode_models. Set the list to
# the models this box routes, e.g. ["gpt-6-astra", "gpt-5.6-sol"], so subagent tiers get it too. Ordinary tools remain Claude Code's permission-checked client handlers, which
# execute the real operations. Code mode requires neither Codex nor Node. Only chatgpt-oauth +
# openai-responses providers may enable it; code_mode = false turns it off. Compact/toolless/forced-
# tool turns retain the ordinary path; a single tool result over 64 KiB is truncated at admission
# behind a "[truncated N chars]" marker. Child JVMs bound workers/time/heap and deny guest host/I/O
# access; Graal community is not an OS-hardened same-user attacker sandbox.
# This setting is shared by every head using providers.codex and read only at boot: finish ongoing
# work before editing, then run `splice restart` for a FULL daemon restart. A head restart alone does
# not reload TOML. Finish code-mode work first: restart discards pending execution and splice never
# reruns the lost JavaScript source automatically.
# code_mode = false
# The JAR-bundled JavaScript worker pool, shown with its code defaults. Each is an OVERLAY:
# leave it out and the default below rides. All are code-mode only (chatgpt-oauth + responses).
#   code_mode_workers = 4      the GraalJS child-JVM pool size
#   code_mode_timeout_ms = 5000 ms one worker exchange may wait for the child's answer
#   code_mode_heap = 128       MB each child JVM's -Xmx
#   code_mode_models = ["gpt-6-astra", "gpt-6-sol", "gpt-5.6-sol"]  models offered the runner
# Deferred tool surface: Claude Code advertises 64-87 tools and every schema used to ride every
# request; this defers the mcp__* tail and answers the model's tool_search at the gateway.
[providers.codex.quirks.tool_surface]
enabled = true
# LSP availability brake: gpt-5.6 over-calls Claude Code's LSP tool when its schema rides every
# request (Anthropic-native sessions keep it deferred, so the asymmetry only shows on this head).
# Forcing it into the deferred set drops the schema from the eager surface; the model reaches it
# only via tool_search, which it rarely does for navigation it can already do with grep/read.
# Prior LSP use replays its declaration in history; it never promotes LSP into the stable
# initial tool list. The partition depends on the current catalog and policy, not usage.
defer = ["LSP"]
# The rest of the tool_surface policy, shown with its code defaults. Every one is an OVERLAY: leave
# it out and the default below is what rides, which is what the daily-driven claudex runs. Names
# here are the TOOL NAMES Claude Code advertises, matched exactly.
#   eager = []                 names FORCED onto the eager surface; wins over every defer rule
#   defer_prefixes = ["mcp__"] every name under these prefixes is deferred wholesale
#   min_deferred = 8           below this many deferrable tools the split buys nothing and costs
#                              a round, so the whole surface stays eager
#   search_limit = 8           most tools one tool_search answer returns (clamped 1..this). A
#                              HIGHER limit answers a broad query in fewer rounds at the cost of a
#                              bigger payload every round; a LOWER one keeps each answer small but
#                              pushes more queries toward the exhaustive final round
#   search_rounds = 3          permitted tool_search rounds before the FINAL round answers with the
#                              ENTIRE deferred set regardless of query — capability at the cap is
#                              exactly today's full surface, so the loop cannot wedge
[[providers.codex.models]]
id = "gpt-6-astra"
label = "Codex 6 Astra"
description = "GPT-6 Astra (2026-09-03). Effort up to max; included in the ChatGPT plan."
context_window = 400000
[[providers.codex.models]]
id = "gpt-5.6-sol"
label = "Codex 5.6 Sol"
context_window = 400000
[[providers.codex.models]]
id = "gpt-5.6-terra"
label = "Codex 5.6 Terra"
context_window = 400000
[[providers.codex.models]]
id = "gpt-5.6-luna"
label = "Codex 5.6 Luna"
context_window = 400000
[[providers.codex.models]]
id = "gpt-5.5"
label = "Codex 5.5"
context_window = 272000
[[providers.codex.models]]
id = "gpt-5.4"
label = "Codex 5.4"
context_window = 272000
[[providers.codex.models]]
id = "gpt-5.4-mini"
label = "Codex 5.4 Mini"
context_window = 272000
[[providers.codex.models]]
id = "gpt-5.3-codex-spark"
label = "Codex Spark"
context_window = 128000

# ── EXPERIMENTAL OPT-IN: xAI/Grok OAuth (SuperGrok/X Premium+) ──────────────────
[providers.xai]
dialect = "openai-responses"
base_url = "https://api.x.ai/v1"
# EXPERIMENTAL: reuses the Grok CLI's public OAuth client identity — NOT a vendor-documented
# third-party integration. The credential file is password-equivalent; splice reads AND refreshes it
# in place. Documented alternative: an OpenRouter API key (kind = "api-key", env = "OPENROUTER_API_KEY").
# The credential is splice's OWN: ~/.config/splice/auth/grok.json, written by `claude-grok login`.
# Set file = "~/.grok/auth.json" ONLY to share the Grok CLI's session (see the codex note above).
auth = { kind = "grok-oauth" }  # browser login: `claude-grok login`
# summary_field=true enables the reasoning.summary field (value comes from [daemon].summary).
# Raw reasoning items stay encrypted by xAI; public form is summary/reasoning_text only.
# reasoning_cache = false documented here because xai returns no encrypted reasoning envelopes —
# the cache would only widen the request's include[] for nothing (it defaults on for codex).
quirks = { cache_key = "session-id", effort_ceiling = "high", summary_field = true, tool_choice = true, reasoning_cache = false }
[[providers.xai.models]]
id = "grok-4.6"
label = "Grok 4.6"
context_window = 500000       # docs.x.ai: grok-4.6 = 500k; grok-4.5 = 500k; grok-4.3 = 1M; grok-build = 256k
[[providers.xai.models]]
id = "grok-4.5"
label = "Grok 4.5"
context_window = 500000
[[providers.xai.models]]
id = "grok-4.3"
label = "Grok 4.3"
context_window = 1000000
[[providers.xai.models]]
id = "grok-build-latest"
label = "Grok Build"
context_window = 256000

# ── local runtime: Ollama / LM Studio / vLLM on this machine (Chat Completions) ─
# A loopback base_url is local by default (local = true|false overrides). splice never downloads a
# model or starts the runtime; at boot and in `splice doctor` it asks the runtime what it serves and
# REFUSES a row the runtime does not list or that declares more context than the runtime serves
# (the refused head is DEGRADED, the rest of the daemon serves). Ollama: /api/ps reports the window
# a LOADED model was given (the model card is only a ceiling); LM Studio: loaded_context_length;
# vLLM: max_model_len. `splice doctor --live` proves streaming + one tool call per listed model.
# The key env is unused by these runtimes but the api-key kind needs a name; any value works.
# A local head also ASKS FOR TOKEN COUNTS: usage frames are opt-in on this dialect
# (stream_options.include_usage), and a head that never asks reports zero tokens per turn, so Claude
# Code never auto-compacts and the session hits the context wall. llama.cpp, Ollama, vLLM and LM
# Studio all answer the field; a runtime that refuses it takes quirks = { stream_usage = false },
# and a hosted vendor known to accept it takes stream_usage = true (off there by default, because
# strict vendors 400 on unrecognized stream_options members).
# A llama-server head can also KEEP EACH CONVERSATION ON ONE SLOT: quirks = { slot_affinity = true }.
# llama-server picks slots by prompt similarity and skips empty ones, so a new session sharing Claude
# Code's ~30K preamble takes an idle conversation's slot, and that conversation re-prefills from
# zero. With the quirk, splice sends id_slot per conversation (session + opening messages), reads the
# slot count from the server's /props, and sends a turn unpinned whenever no slot is free.
# [providers.ollama]
# dialect = "openai-chat"
# base_url = "http://localhost:11434/v1"   # LM Studio: http://localhost:1234/v1, vLLM: :8000/v1
# auth = { kind = "api-key", env = "OLLAMA_API_KEY" }
# [[providers.ollama.models]]
# id = "qwen3:4b"                          # exactly as `ollama list` / /v1/models spells it
# label = "Qwen3 4B (local)"
# context_window = 32768                   # at or under what the runtime serves for this model
# [heads.ollama]
# provider = "ollama"
# port = 3105
# discovery_prefix = "claude-ollama--"
# pinned_model = "qwen3:4b"
# [heads.ollama.claude]
# command = "claude-ollama"

# ── openrouter: the "new vendor = pure TOML, zero code" proof (Chat Completions) ─
# Swap base_url + env for DeepSeek, Fireworks, etc.; a loopback runtime is the local example above.
# api-key resolution: $OPENROUTER_API_KEY from the daemon's env wins; else the shared
# ~/.config/splice/keys.toml store (written by `claude-openrouter login` / `splice key set` /
# the in-session token-capture hook) — env always overrides the store.
[providers.openrouter]
dialect = "openai-chat"
base_url = "https://openrouter.ai/api/v1"
auth = { kind = "api-key", env = "OPENROUTER_API_KEY" }
