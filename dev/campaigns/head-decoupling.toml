# [2026-08-18] INCIDENT — SHARED-INDEX COLLISION, recorded because it corrupted a commit's diffstat and nearly lost a hunk. Three seats shared one checkout and one git index. I staged my seven files, confirmed `git diff --cached --stat` showed exactly those seven, and committed — and 651f7a9 came out with FOURTEEN files, sweeping in the cli seat's DaemonStop.kt/DoctorInstallProbes.kt/ControlPlaneClient.kt/DoctorProbes.kt/DoctorCommand.kt/RestartCommand.kt/Main.kt, which I had neither written nor gated. Symmetrically, that seat's own `git update-index --cacheinfo` on AdminSupport.kt (a file we both touched) replaced MY staged blob, so 651f7a9 landed my Topology change WITHOUT its AdminSupport call-site move and the tree did not compile; that seat caught it and fixed it in b595c52, and its commit message records the same cause from the other side. NOT REWRITTEN: by the time I saw it, ee9f76f, 651f7a9 and b595c52 were already stacked and another seat had built on top, so `reset --soft` on a shared branch with live writers would risk dropping a concurrent commit — the honest record is cheaper than the rewrite. NET STATE IS CORRECT AND VERIFIED: all seven of my files at b595c52 are byte-identical to the content I gated in isolation (diffed file by file against the export), the tip gates green, and the working tree is clean. LESSON for the next multi-seat dispatch: `git diff --cached` is NOT a safe pre-commit check when seats share an index — stage and commit in one atomic step with an explicit pathspec, or give each seat its own index via GIT_INDEX_FILE. Two seats independently used `git update-index --cacheinfo` to partial-stage a shared file within minutes of each other, so this is a systematic hazard of the shared-checkout dispatch, not one seat's slip.
