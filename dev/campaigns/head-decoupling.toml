ribes; :app already declares implementation(project(":provider-spi")); and no wall, no ast-grep rule and no test names any of the five arms or constructs ProviderBuild (ripgrep over the whole tree, both checks negative). ALIAS SAFETY, CHECKED PER FILE AS INSTRUCTED: the dead trio is head/catalog/watchdog inside ResponsesArm, GrokResponsesArm and ApiKeyResponsesArm — that is 9 alias lines across 3 files, not the 3 the brief predicted. `val key = ctx.key` was KEPT in all three, because it still feeds HeadScopedLogs.headScopedLog(key, log) in the two OAuth arms and providerCfg.auth.effectiveApiKeyEnv(key) in the api-key arm. Separately, NONE of the five arms calls config.getConfig at all (only HeadBuildInputs.kt does, untouched), so kt-head-scoped-config-must-be-keyed never covered them in the first place — its rule body fires on an unkeyed config.getConfig() inside a function that binds key, which is why HeadServerFactory.kt:32's identical-looking `val key = ctx.key` IS load-bearing: that function calls config.getConfig(key) at :47-48. ChatArm and PassthroughAssembly had no dead aliases (their key/providerCfg have other uses; PassthroughAssembly never aliased). MEASURED with the read-only oracle, which is safe to run against a shared tree: ProviderBuild.kt 0.71 -> 1.09 (C 44.5 -> 66.0), ResponsesArm 0.84, GrokResponsesArm 0.76, ApiKeyResponsesArm 0.78, ChatArm 1.20, PassthroughAssembly 1.07 — every one band low and under the 1.8 gate. CAVEAT STATED RATHER THAN HIDDEN: that denominator was computed on a tree carrying the other builder's edits, so it must be re-measured on a clean tree before it is quoted as the landing number. Net was -38 lines (29 added, 67 removed), not the briefed ~43; the difference is a 9-line KDoc on the new member and one retained comment. THE WORK IS PRESERVED BYTE-EXACT, not lost: hd28-providertuning-collapse.patch, sha256 d3828af2c3c20b760de0708fb67fbb382bbc23a7b3dd2ab49aab77cee2227e18, in this session's scratchpad (/home/marcos/.cache/qgre/s