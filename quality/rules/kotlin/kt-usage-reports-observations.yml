id: kt-usage-reports-observations
language: kotlin
severity: error
message: Usage must state which token buckets were observed; numeric wire defaults are not observations.
files:
  - "**/src/main/**/*.kt"
rule:
  any:
    - all:
        - any:
            - pattern: Usage($$$ARGS)
            - pattern: splice.core.turn.Usage($$$ARGS)
        - not:
            has:
              kind: call_suffix
              has:
                kind: value_arguments
                has:
                  kind: value_argument
                  regex: ^reported\s*=
    - pattern: import splice.core.turn.Usage as $ALIAS
    - all:
        - kind: type_alias
        - has:
            kind: type_identifier
            regex: ^Usage$
            stopBy: end
    - all:
        - kind: callable_reference
        - has:
            kind: simple_identifier
            regex: ^Usage$
    - all:
        - kind: navigation_suffix
        - regex: ^::\s*Usage$
