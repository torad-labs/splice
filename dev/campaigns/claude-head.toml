# LAW: concept #945 — this manifest IS the memory; access ONLY via dev/campaigns/manifest.py
# LAW [2026-08-15]: PROVENANCE — spec docs/superpowers/specs/2026-08-15-claude-head-design.md
#   (operator-approved after 3 revisions + Eli parallax review). Contract: adding a head is one of
#   three moves — reuse a schema (pure TOML) | declare a new one (dialect/auth grammar) | reuse but
#   reshape (quirks). The claude head is the proof case; kimi is re-expressed as move 3.
# LAW [2026-08-15]: ONE-REVIEW-PER-ROW (operator law): each item receives EXACTLY ONE adversarial
#   review, captured as ONE `verdict` record when the builder reports done. A redo's findings are
#   fixed forward inside the item and the orchestrator re-verifies the FIXES against the diff and
#   the item's own verify gate directly — NEVER a second review round, never a review panel.
#   3 failed fix-forward rounds -> dated BLOCKED note and move on (the block IS a result).
# LAW [2026-08-15]: NEVER-BELOW-STATUS-QUO / KIMI-BYTE-IDENTITY — kimi's built requests and
#   translator behavior stay byte-identical through the quirks inversion. The golden harness
#   (CH-1) is the WALL and lands red-green-proven BEFORE any refactor item (walls first, #960):
#   goldens pass on unmodified HEAD and demonstrably FAIL when a deformation knob is flipped.
# LAW [2026-08-15]: SECURITY SEAM — the HeadServer.authorize() bypass is gated on auth kind
#   "client" ONLY and lands IN THE SAME ITEM as its wall test (every other head still rejects a
#   non-mgmt-key caller). A bypass commit without the wall test never merges.
# LAW [2026-08-15]: NATIVE-AUTH — splice never holds, reads, or refreshes Claude credentials.
#   The client's native auth lifecycle (creds, keychain, refresh, /login) stays untouched; the
#   head forwards inbound Authorization/x-api-key/anthropic-version/anthropic-beta verbatim,
#   exactly once, case-normalized. Splice-held Max OAuth is the REJECTED alternative (spec §3).
# LAW [2026-08-15]: NO PUSH, CLI-ONLY — builders never push or rewrite history; ledger updates
#   only via manifest.py; the orchestrator owns the single gated commit chain on the wave branch.
# LAW [2026-08-15]: BUILDERS EDIT + TARGETED MODULE TESTS ONLY (serial, one builder at a time);
#   `npm run gate` (full ladder) is the ORCHESTRATOR's verify act, never claimed by a builder.
# LAW [2026-08-15]: FENCES are exclusive within a wave — every file exactly ONE owner slot.
#   Wave 1 = CH-1..CH-2 (walls+quirks), wave 2 = CH-3..CH-4 (provider+topology), wave 3 = CH-5..CH-8 (auth+seam: core/spi/gateway/control disjoint), wave 4 = CH-9..CH-12 (head+proof).
# LAW [2026-08-15]: BASE — orchestrator cuts feat/claude-head from the main tip; record the sha
#   in a CH-1 note at cut time. Stacked work stays on that one branch until the gate-green PR.

