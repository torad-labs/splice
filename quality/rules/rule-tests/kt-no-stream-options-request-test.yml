id: kt-no-stream-options-request
valid:
  # the chat dialect's one declaration, exempt by its shape: a const val
  - 'internal const val INCLUDE_USAGE: String = "include_usage"'
  - 'put("stream", true)'
  - 'put("include", buildJsonArray { add("reasoning.encrypted_content") })'
  - 'put("stream_options", buildJsonObject { put("reasoning_summary_delivery", "sequential_cutoff") })'
  - '@SerialName("stream_options") val streamOptions: JsonObject? = null'
invalid:
  # a literal that is not a const declaration is the incident this wall exists for
  - 'val INCLUDE_USAGE = "include_usage"'
  - 'put("stream_options", buildJsonObject { put("include_usage", true) })'
  - 'val opts = buildJsonObject { put("include_usage", true) }'
  # bypass: a raw string has different delimiters (full-text regex missed it) but identical inner content
  - 'val opts = buildJsonObject { put("""include_usage""", true) }'
