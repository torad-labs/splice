# [2026-09-18] READINGS AND ONE ROW SPLIT. (A) COVERAGE SPLIT because a name carries exactly ONE page disposition and the wall fails on two: this row's seven routes are declared across pages/mcp/coverage.ts (/api/mcp) and pages/doctor/coverage.ts (the other six). /mcp/{name} is NOT declared anywhere - the baseline already excludes it with a reason ('client transport, not an operator surface'), and re-declaring an excluded name would only restate it. (B) THE MCP RESTART IS AN EMPTY, NOT A CONTROL, and it names the CLI rather than a row: measured 2026-09-18, there is no restart route to wait for - /mcp/{name} is the JSON-RPC transport (ControlServer.kt:162-164), and a POST there would be speaking initialize into the protocol endpoint, not restarting a child. M2-D3 already encodes this as MCP_RESTART = { pending: 'no route; CLI only' }; the page prints it. (C) THE FOUR HOST LIMITS are read from @entities/config by their wire keys (mcpIdleTimeoutMs, mcpMaxServers, mcpRequestTimeoutMs, mcpInitializeTimeoutMs - Knob.kt:331-358), never restated. The RUNNING daemon is 0.3.2 and carries none of them, so all four render with their name, an empty value and 'not carried by this daemon' - which is the honest reading of version skew, not a defect. (D) /api/heads/{head}/capture is disposed pending V4-133: that row's title names it explicitly ('opt-in body capture per head (GET/PUT /api/heads/{head}/capture...)'), so the row id is read from the campaign, not invented. This row builds no control for it and the doctor page says so. (E) THE DOCTOR PAGE'S VERSION/UPGRADE SECTION renders whether or not the report has landed: it was inside the payload guard, so a pending report hid three empties naming rows the operator is waiting on. Fixed. (F) THE PLAYGROUND IS A REDUCER, not booleans, because 'never recorded' is a promise the daemon keeps and the console must not break: the request and response live in one state, are dropped at the moment a new run begins, and a test runs a full cycle