# B09 app wiring supplies this authenticated route on the loopback control listener.
scrape_configs:
  - job_name: splice
    scrape_interval: 15s
    metrics_path: /api/perf/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/splice-management-key
    static_configs:
      - targets: [127.0.0.1:3096]
