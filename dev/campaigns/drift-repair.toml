# [2026-08-31] 2026-08-31 SEAM WITHDRAWN — the gate caught it and the gate was right. My first landing added codex's suggested injected write seam and the gate went RED on two legs. (1) ast-grep kt-no-lambda-seam: a raw function type is banned by standing operator law; the wall even names the remedy, a fun interface named for its ROLE. (2) SH-10 campaign wall: 'the kimi credential write no longer reaches SecureFile.writeAtomic0600 - refusing to pass vacuously'. The second one is the real objection and it goes deeper than style. SH-10's anchor is the DATAFLOW - whatever content reaches the atomic 0600 write must be the merge - and it exists because #924 extracted SecureFile to make the world-readable window INEXPRESSIBLE. ANY injection point, fun interface or not, makes the actual writer a runtime choice and reopens exactly that class. Trading a security invariant for test convenience on a credential write is backwards, so I removed the seam entirely and restored the three private forwards rather than reshaping it into a fun interface that would have passed wall 1 while still weakening wall 2. This DEVIATES from codex's map, which asked for the seam; flagging rather than silently complying or silently deviating. Consequence, stated plainly: the three provider-level HOSTILE-throwable arms are gone, because without injection the only throwable a real persist failure produces is a FileSystemException, which SafeFailureText ALLOWLISTS by design. The withholding property is unaffected - it lives at the sink, where DR-151 moved the render decision, and PersistFailedRenderTest proves it there with mutant A reddening all its arms. Replaced them with ONE arm, GrokPersistLinePrivacyTest, using the same denied-parent-directory technique BS-2 already uses: it proves the provider REACHES the typed Write branch and that the persist line never quotes the rotated token or the refresh token. DENOMINATOR MOVED and here is why: the wall now reads 85 sites, 66 routed, 19 exempt, 0 undispositioned, down from 87/68/19/0. That is -3 provider call-site renders collapsing into +1 sink render, which IS the DR-151 repair - three places deciding how to sanitize became one. A denominator change with a reason is fine; an unexplained one would not be. Full gate PASS on the corrected tree.

