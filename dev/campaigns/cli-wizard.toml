# [2026-09-15] SLOT — complete design, zero design freedom. This is the row the campaign exists for, and it is also the row most able to regress a working command, so read NEVER-BELOW-STATUS-QUO in the laws before touching anything. (1) THE NEW FLOW, in order, mirroring torad init which the study rated the cleanest of the three: frame intro badge; a dim Detected line from CW-6 SetupDetection, printed only when something was actually detected; a SelectPrompt for the starting point with counts carried in the option hints; a NoteBox titled Summary naming exactly what is about to be written and to which path; confirm; the existing install work wrapped in a Spinner; the existing per-head sign-in walk UNCHANGED; the existing four-line next-steps block UNCHANGED; outro. (2) WHAT MUST SURVIVE BYTE-FOR-BYTE IN BEHAVIOUR, each of which gets an assertion: the per-head sign-in walk including its dim unofficial-OAuth warning about vendor CLI client identity; the credential hygiene where each head owns its own file; the four next-steps lines Launch, Dashboard, Status, Checkup with Checkup keeping its anything-wrong-prints-its-fix tail; and the headless default-return. (3) THE CONFIRM IS LOAD-BEARING, NOT DECORATION: declining it must write NOTHING. Today setup materializes the topology and links wrappers with no warning at all, which the study named as a real gap. Assert that a declined confirm leaves the topology file byte-identical. (4) NON-TTY PARITY IS THE ACCEPTANCE THAT MATTERS MOST: a headless run must write exactly what the pre-campaign setup wrote. Capture the written topology from the current command BEFORE you change it, and assert the new command produces the identical bytes on the non-TTY path. That captured artifact is the oracle; do not hand-write the expectation. (5) Do not move the sign-in walk, do not reorder logins, do not change what install writes. The only new writes are the ones the user confirms.
