# Adopted 2026-11-03 from the repo's hand-kept config, every entry unchanged, when the review of
# github-operator#129 found it on the global regexTarget = "match" the paragraph before [extend]
# explains. The header that follows is the repo's own.
#
# Repo-local gitleaks config (auto-loaded from the scan root). Extends the default
# ruleset — this file only narrows false-positive classes, never disables rules.
#
# Each entry sits on the allowlist of the rule whose findings it silences, never on the global
# [allowlist]. gitleaks v8.21.2 appends its own default global regexes to that one and tests
# them against its regexTarget: under "match", the default `(?i)^true|false|null$` silenced any
# finding whose match, variable name included, held `false` (github-operator#129,
# 2026-11-03). Nothing is appended to a rule's own allowlist, so the defaults keep the secret
# as their target.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "splice fixture shapes that pattern-match generic-api-key but are not credentials"
# Tested against each finding's MATCH. The default target is the bare secret, which never holds the
# key name, so the regex below allowed nothing (Oct 2: a ResponsesCodexWireGoldenTest fixture failed the scan).
# A match is one finding, so another secret on the same line is still its own finding and still fails.
regexTarget = "match"
regexes = [
  # splice's own prompt-cache key: "splice-" + md5 hex, a digest splice mints, never a credential.
  # Exact value shape, whatever names it: a fixture's prompt_cache_key or a golden test's constant
  # (ResponsesPreparationGoldenTest's GOLDEN_KEY, Oct 3).
  '''"splice-[0-9a-f]{32}"''',
  # Code-mode record keys in retention fixtures: the whole value is "conversation-" + digits, which
  # crosses the 3.5 entropy floor by length alone (CodexCodeModeRetentionTest, CodexResponsesArmTest).
  '''"conversation-[0-9]+"''',
  # The transcript redaction tests' synthetic secret, "token=abcdefgh" + digits: the string the redactor must hide.
  # Wrapping its line past 120 columns (34844d63e) made the history scan match it.
  '''token=abcdefgh[0-9]+''',
]
