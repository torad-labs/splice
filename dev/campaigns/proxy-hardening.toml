title = "The whole-turn wall clock is unenforced outside an open stream || PROBLEM: `TurnWatchdog.totalCap` is the only whole-turn ceiling, but its poller is launched inside the successful-response block and cancelled in that block's `finally` — so it only runs while an upstream stream is actually open. During connect, headers-wait, retry backoff, refresh, and between fold/re-anchor rounds, nothing enforces the cap. `deadlineExceeded(t0)` is a per-`post()` budget (t0 captured per round), so an N-round fold or re-anchor turn gets N × `upstreamTimeoutMs` of retry budget against a single `totalCap`. The consequence is not just a slow turn: it holds its `InflightGate` slot the whole time, and with … || SPLICE TODAY: `gateway/gateway/src/main/kotlin/splice/gateway/head/TurnDriver.kt:462` launches the poller inside the response block (`val poller = drive.watchdog.launchIn(self, drive.slot, turnJob)`) and `:477-479` cancels it in that block's `finally`. `Watchdog.kt:37` (`private val startedAt = clock()`) is turn-scoped so the cap is *measured* correctly — it is simply never sampled; `Watchdog.kt:64-87` is the only place `elapsed >= budget.totalCap` is evaluated. The only whole-turn coroutine is the client-liveness pinger (`TurnDriver.kt:377,620-633`), which checks liveness, never elapsed time. Per-round budget: … || PROPOSAL: In `driveOneTurn`, next to `launchClientPinger`, launch a turn-scoped cap poller reusing the **same** `TurnWatchdog` instance: poll `pollInterval()`, and when `elapsed >= totalCap` set the typed `WatchdogFired.TotalCap` sentinel and cancel `turnJob` — identical semantics to the existing breach path, just always running. Keep `launchIn` for the idle tiers (they need the slot). Since the sentinel is set before cancellation, every translator's existing `if (ctx.watchdogFired() == null) throw e` guard converts it into the honest `watchdogOutcome` failure with no other change. || EFFORT/RISK: M. **Risk** The cap now genuinely bites on long multi-round turns that previously ran past it; a fold turn on a slow head that completed at 1.5× `totalCap` now  || VERIFY-SPEC: New case in `gateway/provider-spi/src/test/kotlin/WatchdogTest.kt` for the turn-scoped poller path. New case in `gateway/gateway/src/test/kotlin/head/HeadServerFoldTest.kt`: a multi-round fold whose rounds sum past `totalCap` terminates with a `TotalCap` failure and releases its gate slot within one poll interval (assert via the gate snapshot). Gate: `npm run gate`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### NF-03'"
