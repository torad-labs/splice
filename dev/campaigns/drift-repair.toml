id = "DR-11"
phase = "launch"
title = "ClaudeConfigMaterializer performs two non-atomic mutations of operator-owned state, and both failure paths are swallowed. (a) replaceWithSymlink at :131-140 does Files.delete(dst) then Files.createSymbolicLink(dst, src) as separate syscalls with no restore, and linkOneShared at :128 swallows the result. If the create fails after the delete succeeded the item is GONE, permanently, unlogged: ~/.claude-grok/CLAUDE.md exists as a real file, the policy shares CLAUDE.md, the delete lands, then createSymbolicLink hits ENOSPC (a symlink still consumes an inode) or an EPERM from a hardening LSM — the head now has no CLAUDE.md and the operator file is unrecoverable. This is simultaneously a comment lie: the line directly above says Best-effort: an I/O race here just leaves whatever is already on disk, which is exactly what it does NOT do, because what was on disk was deleted first. (b) writeSettings at :159 and writeClaudeJson at :209 both end in a bare Files.writeString (truncate-then-write) against files a LIVE Claude Code process owns, while this same repo declares SecureFile.writeAtomic0600 the codebase one atomic-write primitive (LoginOutcomeFile.kt:39-41) and the sibling SessionRegistryLink was designed so a live session keeps writing across the swap. Torn-write arm: splice launch claudex in terminal B while a claudex session runs in terminal A; writeClaudeJson truncates .claude.json and terminal A reads it mid-write. The swallow makes it permanent: a truncated .claude.json feeds readJson at :220-224 whose getOrDefault(EMPTY_JSON) eats the SerializationException, local becomes empty, and :209 rewrites the file containing ONLY the five synthesized keys — destroying every other local key including the customApiKeyResponses.approved list that :216 is trying to preserve, while reporting success. Fix: temp+ATOMIC_MOVE for the symlink swap, route both writes through SecureFile.writeAtomic0600, and make readJson distinguish absent (empty, fine) from unparseable (abort the rewrite) as KeyStore.entriesStrict does. NOTE the concurrent-Claude-Code-writer arm is UNVERIFIED — it rests on Claude Code write behaviour, not on code in this repo."
files = ["gateway/core/src/main/kotlin/splice/core/launch/ClaudeConfigMaterializer.kt", "gateway/core/src/main/kotlin/splice/core/util/SecureFile.kt", "gateway/core/src/test/kotlin/ClaudeConfigMaterializerTest.kt"]
status = "todo"
verify = "cd gateway && ./gradlew :core:test --console=plain"

[[items]]
id = "DR-12"
phase = "passthrough"
title = "PassthroughTerminalState.kt:122 maps model_context_window_exceeded to ErrorType.API_ERROR with a bespoke message, defeating the compaction contract its sibling classifier documents as the entire point. UpstreamFailureClassifier header states the law: overflow must be INVALID_REQUEST and must carry the phrase prompt is too long, which is Claude Code compact trigger phrasing. This stop-reason path never reaches that classifier because it is a STREAM TERMINAL, not an HTTP error, so it produces API_ERROR which CollectingTerminal.statusFor turns into a 502 whose message matches no trigger. Concrete: a Kimi passthrough session grows past the context window; instead of a 400 plus prompt is too long that makes Claude Code auto-compact and continue, the user gets a 502, and every subsequent turn re-sends the same oversized history and hits the same wall — a deterministic failure surfaced in the one shape that invites replay — until the user notices and compacts by hand. Fix: map it to INVALID_REQUEST with the prompt is too long prefix, reusing UpstreamFailureClassifier.overflowFailure so the one contract has one implementation. Kimi byte-identity is NOT at risk here (this is an error-path classification, not a built request), but confirm that explicitly in the item note before landing."
files = ["gateway/dialect-anthropic-passthrough/src/main/kotlin/splice/dialect/passthrough/PassthroughTerminalState.kt", "gateway/provider-spi/src/main/kotlin/splice/spi/UpstreamFailureClassifier.kt", "gateway/dialect-anthropic-passthrough/src/test/kotlin/PassthroughStreamTranslatorTest.kt"]
status = "todo"
verify = "cd gateway && ./gradlew :dialect-anthropic-passthrough:test --console=plain"

[[items]]
id = "DR-13"
phase = "responses"
title = "A SECOND regression guard was deleted with its hazard still live: the test named an exact within-item part repeat is suppressed, removed by 22a0744 from ResponsesStreamTranslatorTest.kt, with no replacement anywhere. The arm it pinned is still live at SummaryDedup.kt:67 (!shared.markEmitted(oi, part)) and the class comment at 20-22 still cites the incident it guards — a WITHIN-item repeat where item.done restates parts whose deltas then re-arrive, the openai/codex#16801 ordering anomaly, live 2026-07-19. The commit that deleted it is the very commit whose message says the hazard is live: 22a0744 claims it is killing the residual class codex tolerates, a restated part re-fired under the active item own id, OBSERVED LIVE. The two surviving tests do not cover it — SequentialCutoffRenderTest second case restates p0 under a DIFFERENT output_index (rs_1/oi=0 then rs_2/oi=1), which exercises the cross-item anchorOf arm; nothing exercises a repeat under the SAME oi, which is the arm the deleted assertion pinned. Note the sequencing that makes this a process finding as well as a code one: bbd165f asserted all three pinned regressions hold unchanged, and 22a0744 deleted all three pins 65 minutes later. Fix: re-add one done-event test firing the same >=20-char part twice under one item id, asserting it reaches the sink exactly once. Pairs with DR-3, which covers the other genuinely-missing guard; the third deleted test DOES have equivalent replacement coverage and is deliberately NOT in scope."
