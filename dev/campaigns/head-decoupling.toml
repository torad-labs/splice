title = "Comment-satisfiability: sweep the code_only() stripper across the remaining campaign walls. A wall that greps RAW file text is satisfiable by a COMMENT — delete the real call site, leave the literal token behind in a '// TODO: restore ...', and the wall still reads GREEN while the invariant is gone. PROVEN, not theorised: with the behaviour deleted and the token left in a comment, cx_01 printed 'CX-01 WALL GREEN' and w4_a printed 'W4-A WALL GREEN' (fixtures built out-of-tree; both now RED after the fix). FIXED ALREADY in the five walls the decomposition campaign touched: cx_01, w4_a, jw_06, jw_08, jw_13. STILL RAW, roughly 26 walls, unaudited for this class: cx_19, inf_01, inf_02, inf_04, jw_01, jw_02, jw_04, jw_05, jw_17, law_locked_non_goals, law_wave0_is_the_net, nf_01..nf_06, sh_01, sh_02, sh_04, sh_06, sh_10, sh_11, sh_12, sh_14. Only 4 of ~34 walls carried the stripper before this. NOTE THE DIRECTIONALITY, which jw_08 gets right and a blind sweep would get wrong: strip comments for REQUIRED tokens (so a comment cannot satisfy them) but NOT for BANNED strings (so a comment cannot hide them). Each wall needs its own red-proof — delete the behaviour it protects, confirm RED — never a bulk edit trusted on inspection."
