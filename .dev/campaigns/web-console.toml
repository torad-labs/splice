# [2026-09-18] app.css: what was DROPPED, named here so M3-04 deletes the sheets behind them rather than the shell losing rules it still needs. Gone from the shell, with the component that owns it: .myx-table/.myx-num/.myx-ink-*/.myx-metric-row/.myx-pill-row/.myx-footnote (pages/config, pages/auth, features/edit-config); .myx-fleet-grid/.myx-plate* (widgets/head-plate); .myx-fleet-banner; .myx-log; .myx-editcfg*; .myx-inline-* (features/refresh-auth). All of those surfaces are old pages or components the shell does not render, so the shell was carrying rules for markup it never emits. What STAYS in app.css is exactly the chrome App.tsx renders: box-sizing, body, ::selection, the link hairline, ONE focus ring, .myx-console/.myx-console-body/.myx-console-page/.myx-console-pending, the 720px query, and the key gate.
# [2026-09-18] THE KEY GATE, found by LOOKING rather than by the wall: the unseeded capture showed the plate already world (paper, ink, radius 0) but its INSIDES still plate-era - a vermilion unlock bar, a dark mono command slab, a dark input with a SHOUTED mono KEY label. That markup is features/unlock-mgmt, which is OUTSIDE this fence and on the wall deletion list, so the wall could never have reported it; but App.tsx renders the gate, so the gate IS shell chrome and the shell owns the paper it sits on. Fix inside the fence: src/app/app.css now styles the gate own controls under .myx-modal (myx-btn, myx-well, myx-field/myx-field-label/myxf-field input), scoped to the modal so nothing else is touched. Re-captured and read: the plate is paper and hairline, the command is a field box, the key label is lowercase sentence case in the label face, unlock is a plain key, the amber holder edge is gone from it. The gate is a real dialog (role=dialog aria-modal) - that is the one place a covering surface is right, because there is nothing to show until the key is pasted.
# [2026-09-18] TWO JUDGEMENT CALLS, stated so the orchestrator can overrule either. (1) features/account-login keeps its raw <button> elements styled from its own account-login.css instead of taking the world Key control. It imports no old primitive, so no wall is broken, and its buttons already carry world tokens (--ink/--hairline/--edge-red); swapping them for Key is a look change on a surface the operator has not ruled on yet, so I left it. features/views and features/budgets/alerts are already on world tokens too. (2) Nothing was moved into the old pages own CSS files: the row says a rule that exists only for burn/config/auth belongs in their file, but every rule dropped from app.css belonged to a component that ALREADY has its own sheet or is deleted at M3-04, so there was nothing to move - moving them would have been inventing owners for dead rules. OUT OF FENCE, seen in the captures, for part two (M1-09) or the owning row: (a) the fleets page bay still prints a stale error: management key required strip in the old ErrorNote style - that is pages/fleet, M1-09; (b) the rail label compaction is CLIPPED to compactic at 1536x1024 - widgets/rail, so it is M1-06 or M1-09, not this row.
