]
modules = ["features-heads"]
sourceSets = ["main"]
date = "2026-09-21"
reason = """
:features-heads is new: splice.heads.start was EXTRACTED OUT OF daemon/control (ControlServer.kt
and api/fleet/HeadRoutes.kt). That origin is the denominator for this row, and the module's current
contents are NOT. An earlier version of this row reasoned from what the 37 lines happen to contain
today — "declares no refusal type, logs nothing, opens no wire" — which is the §24 defect exactly:
absence of a violating expression is not a reason a rule stops applying, because the rule exists for
the line somebody writes tomorrow. The test used here instead: does the rule's declared files: scope
COVER daemon/control, the place this code came from? If yes, the extraction punched a hole in that
rule and the remedy is to widen its glob. If no, the rule never reached this code and nothing was
lost by moving it.

SIX RULES FAILED THAT TEST AND ARE NOT IN THIS ROW. kt-control-route-guarded,
kt-json-scalars-single-source, kt-log-escapes-caller-input, kt-no-runcatching-in-coroutine,
kt-no-silent-result-collapse and kt-outcome-tag-single-source all name daemon/control/src/main in
their files:, so each lost reach when the code moved. All six now carry
`features/heads/src/main/**/*.kt` in their own files: list — widened at the rule, never excused
here. kt-log-escapes-caller-input is the one to notice: StartHead.handle reads
call.parameters["head"] and hands that caller-supplied name to HeadAudit.record, which is the
forged-audit-line hazard the rule was written for. Excluding it would have retired a live
protection, not waived a dormant one.

THE SIX BELOW PASS THAT TEST — each names a scope this code was never inside:
  kt-no-exception-as-outcome          pinned to upstream/, core/, integrations/claude-code/ — the DECLARATION sites
                                      for refusal types. The extracted code came from
                                      daemon/control, which this rule has never covered, so no
                                      declaration left its reach.
  kt-no-runblocking-exported-bridge   pinned to app/**/Main.kt and app/**/cli/** — the CLI process
                                      boundary, where a runBlocking bridge is the exported entry.
                                      :features-heads is a library module with no main().
  kt-no-vanilla-config-dir            pinned to the LAUNCH SEAM: integrations/claude-code/**, app's
                                      LaunchSpecFactory.kt, and daemon/control's Launch*.kt. It is
                                      the one rule here that names daemon/control at all, so it was
                                      checked by hand: LaunchResponse.kt, LaunchService.kt and
                                      LaunchTypes.kt are all still at that path and none of them was
                                      part of this extraction. The seam did not move.
  kt-quota-tracker-single-resolution  pinned to features/turns — the turn-admission path that owns
                                      QuotaTracker selection. Extraction source was daemon/control.
  kt-turn-finally-flush-quietly       pinned to features/turns/**/splice/head/** — the head's TURN
                                      cleanup. This is splice.heads.start in another module, with
                                      no turn lifecycle. Extraction source was daemon/control.
  kt-wire-catch-ioexception-alone     pinned to features/turns/**/wire/** — the head's wire layer.
                                      Extraction source was daemon/control, and this module opens
                                      no socket.

WHAT WOULD INVALIDATE THIS ROW: any later move of code INTO :features-heads from upstream/, core/,
integrations/claude-code/, app/'s CLI, the launch seam, or features/turns. That is a different origin from this one, so
re-run the test above rather than extending this row — the row is dated to the heads/start
extraction and covers only it.
"""

