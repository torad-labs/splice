# [2026-09-13] FIX P3 (splice-astra, 2026-09-13): a full quota window with no provider resets_at is no longer treated as exhausted forever. AccountPoolTest seeds a 100 percent primary window with null reset and proves it remains selectable rather than being killed by stale persisted state.
