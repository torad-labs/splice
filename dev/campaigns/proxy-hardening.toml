title = "`Retry-After` in HTTP-date form is silently discarded || PROBLEM: `retryAfterMs` parses only the integer-seconds form; RFC 7231 also defines the HTTP-date form, and any date-form header returns null. Three things then go wrong at once: the server's pushback is not used as a backoff floor (G3's whole point), the >15s absurd-pushback give-up cannot fire, and the 429 cooldown falls back to the 20s guess instead of the server's actual reset. Cloudflare and several gateway fronts in front of model backends emit the date form; splice would hammer a curve the server explicitly told it not to. || SPLICE TODAY: `gateway/provider-spi/src/main/kotlin/splice/spi/UpstreamClient.kt:360-362` — `/** Seconds-form Retry-After → ms; HTTP-date form and garbage → null (backoff curve decides). */` over `header?.trim()?.toLongOrNull()?.takeIf { it >= 0 }?.times(MS_PER_S)`. Three consumers inherit the null: cooldown arming (`:407-408`, falling back to the 20s `DEFAULT_RATE_LIMIT_COOLDOWN_MS`), the absurd-pushback give-up (`:418-422`), and the backoff floor (`:425` → `applyBackoff` at `:273-290`). G3 is marked `done` but landed only the seconds-form half; the shipped comment documents the date branch as unhandled. || PROPOSAL: Extend `retryAfterMs` to fall back to `java.time.format.DateTimeFormatter.RFC_1123_DATE_TIME` when `toLongOrNull()` fails, converting to a delta against the wall clock and clamping negatives to 0. Keep strict-numeric-first ordering so nothing on the existing path changes, and keep garbage → null. ~8 lines; all three consumers inherit the fix. || EFFORT/RISK: S. **Risk** Very low. A skewed client clock could compute a wrong delta — clamp to `[0, MAX]` and let NF-01's ceiling bound the top. **Wall-clock, not `MonoCloc || VERIFY-SPEC: Extend `gateway/provider-spi/src/test/kotlin/UpstreamClientRetryPolicyTest.kt` (which already pins seconds-form at ~`:97-186`): date-form-honoured-as-floor, date-form-in-the-past-clamps-to-zero, garbage-still-null. Gate: `npm run gate`. || FULL EVIDENCE: dev/campaigns/proxy-hardening/research/proxy-landscape-improvements-2026-07-26.md section '### NF-04'"
