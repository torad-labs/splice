[[row]]
id = 'cp-command'
title = "A team's door command starts claude on its own model and picker"
feature = 'custom-provider'
status = 'todo'
owner = ''
blocked_by = [
  'cp-schema',
  'cp-picker',
  'cp-tiers',
  'cp-overlay',
]
guard = false
spec = '''
A team's wrapper can start a session on the door with the team's starting model and picker, without moving the person's plain `claude` (issue #680, outcome 12). The grammar `[door.commands.<name>] = { head, models = "head" | "door" }` and its findings are cp-schema's.

After this item:
- Each door command is linked like every command splice launches (the same splice-launch shim link a head's [heads.*.claude].command gets, laid and removed on boot and reload as those are), and `POST /launch/<name>` answers a launch on the door exactly as `claude` on the door does (door-default.md decision 2: the Mantle variables at the same door address, the unset list, DISABLE_LOGIN_COMMAND, splice's /login hook and file, the person's own Claude folder), with: ANTHROPIC_MODEL the selector of its head's pinned model; the overlay's modelPicker the rows of its head alone (`models = "head"`, the default; the same rows and order DesktopLineup.picker gives that head) or the door's whole picker (`models = "door"`); and a door key of its own (AWS_BEARER_TOKEN_BEDROCK), kept in splice's state like the terminal's key (door-default.md decision 3), admitted by the door, retired when the command leaves splice.toml.
- The person's plain `claude` lane does not move: its default model, its chosen model and its picker are what they were; a session of the command never records a chosen model for the lane.
- Side calls follow the command: a tier ID (haiku for titles, a subagent's opus/sonnet/fable) in a session of the command that has not named a selector runs on the command's head as its model_slots say (else its pinned model), not on the door's default. Once the session has named a selector, cp-tiers' rule holds. A plain `claude` session keeps today's rule.
- A `--settings` the wrapper passes merges into the one overlay exactly as cp-overlay decided for `claude`, with the command's own picker in place of the lane's.
