# [2026-09-18] 2026-09-18 ITEM 1 DONE: widgets/rule imports nearestWindow and headsReportingNone from @entities/usage and its local copies (NearestWindow, nearestWindowOf, headsReportingNone) are gone. Nothing else imported them: webui/tests/fleet.test.ts (M2-01) already imports both from @entities/usage, checked before deleting. The two functions were compared line by line before the swap and are the same code, so the printed cell is unchanged for the same payloads - and that is what the test proves.
# [2026-09-18] 2026-09-18 NOTE (why the cells are exported): Rule() reads four stores, and a static render sees a zustand store's INITIAL state, never its current one (the same wall every page row hit). So the rule now exports WindowCell, NoneCell and PendingRestartCell, each pure from props, and Rule() composes them. tests/rule.test.ts renders those with two payloads: a crowded fleet where the highest percentage must win over the first head, and a fleet where nobody reports - which must print 'no window reported' and never a zero. The expected values are built from the ENTITY's derivation, so a widget that started deciding for itself fails the test.
# [2026-09-18] 2026-09-18 NOTE (one markup change to disclose): NoneCell returns nothing at all until /api/usage answers, where it used to render an empty <p>. An empty cell takes a slot in the rule's grid and reads as a present-and-blank readout; the window cell's markup is byte-identical as the row requires, this is the neighbouring cell and it is named here rather than changed quietly.
# [2026-09-18] 2026-09-18 ITEM 2 DONE: the Rule cocks on a pending restart. It reads useRestartPending from @entities/config (M2-05) and renders a cell BESIDE HEALTH carrying a HolderEdge amber labelled 'restart pending' (widgets/rule/strings.ts, two words) with the count of pending keys as a Figure. It starts no route and no poll of its own: the list is what a page's own save left behind, and a restart is the only thing that honestly clears it, at which point the cell is gone. An empty list renders nothing at all rather than an empty cell.
