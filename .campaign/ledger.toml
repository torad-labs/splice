id = 'nd-accounts-signin'
title = 'On Accounts, an account that needs it is signed in from its glass, and the composer asks the manager'
feature = 'console-night-deck'
status = 'todo'
owner = ''
blocked_by = [
  'nd-accounts',
  'nd-sessions-open',
]
guard = false
spec = '''
On the approved Accounts page, an account that needs signing in says so and is signed in from its glass, and the composer asks the manager, as the prototype's page.json says (accounts/final).

What a person sees and can do once this is built:
- A lane for an account that needs a sign-in (its credential is missing, or its last read failed signed_out) reads `needs sign-in`, and its glass offers Sign in (`[data-act="signin"]`, the primary act there) and no Use now.
- Sign in starts splice's own sign-in for that account: POST /api/auth/{head}/login {label}, then the steps api.js's SIGNIN holds for every page (the browser address to open, the field to paste the code into, POST …/login/{id}/code, Cancel as DELETE …/login/{id}, the reason when it fails, Try again), drawn in the account's glass with the kit's panel rows. Adding a new account is the same flow from the field's add part. Sign out: DELETE /api/auth/{head}/accounts/{label}, asked first.
- The composer (deck-composer.js) on Accounts asks the manager: GET /api/manager for its state and session, POST /api/manager/start when it is not running, and what is typed goes to the manager's session (POST /api/sessions/{id}/say), as today's composer does. The context strip says it is the manager; `@` suggests accounts; the model picker lists SPLICE's models.
