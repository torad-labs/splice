title = "`KeyStore` write/unset destroys every other key when the file is momentarily unreadable || PROBLEM: `KeyStore.write()` and `unset()` are read-modify-write over `entries()`, and `entries()` collapses **any** read failure to an empty map via `getOrDefault(emptyMap())`. So a transient read error — an EINTR, a partially-written file from a concurrent writer, a permissions blip — makes `write()` believe the store is empty and persist a file containing **only the key being written**, silently deleting every other API key the operator had stored. `persist()` rebuilds the whole file from the map, so the loss is total, not partial. Even without a read failure, two concurrent `splice key set` invocations (a human plus … || SPLICE TODAY: `gateway/core/src/main/kotlin/splice/core/config/KeyStore.kt` — `entries()` ends in `.getOrDefault(emptyMap())`; `write()` (`:48-61`) and `unset()` (`:63-71`) both do `entries().toMutableMap()` → `persist()` (`:60`). Zero FileLock/Mutex/synchronized in the class, while the auth.json equivalent got exactly that as G1 (`done e970691`) — `gateway/provider-spi/src/main/kotlin/splice/spi/CredentialLock.kt:25`. || PROPOSAL: Two changes. (1) **Split the read paths**: keep the tolerant `getOrDefault(emptyMap())` for `read()`/`names()` (display paths), but give `write()`/`unset()` a strict variant returning `Result` that **aborts the write** on a read failure with a loud message ('keys.toml unreadable — refusing to write, existing keys preserved'). Distinguishing 'file absent' (legitimately empty, safe to write) from 'file unreadable' (unknown, unsafe) is the whole fix. (2) Route `write()`/`unset()` through a file lock. || EFFORT/RISK: S. **Risk** Low. (1) can turn a previously-silent success into a visible failure, which is the point. (2) makes a CLI-rate operation take an advisory lock; with || VERIFY-SPEC: New cases in `gateway/core/src/test/kotlin/KeyStoreTest.kt`: an unreadable keys.toml (permissions stripped) → `write()` fails loudly and