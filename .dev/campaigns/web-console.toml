# [2026-09-18] 2026-09-18 THE ARCHITECTURE DECISION, WITH THE MEASUREMENT THAT DECIDED IT. The first implementation injected a motionId prop into a bay children by cloning any child whose type was Strip, and the bay measured [data-motion-id]. I then loaded the sessions page in a real browser and counted: FIVE strips rendered, ZERO data-motion-id attributes. Cause: every bay rows are page components (SessionStrip, HeadStrip, AccountStrip, the settings field boxes), not bare Strips, so the type check never matched and the gestures would have silently done nothing on every page. A prop a page has to forward is a gesture that works only where someone remembered. REWRITTEN to drive the DOM itself: the bay holds the rows element, reads its children in order, zips them with the keys it was handed, and applies three transient things React never sets — a class, an inline transform, and one appended strike line — taking each back on a timer. No page changes, no child cooperation, and it works on a wrapper, a form row or a strip alike. It also runs in useLayoutEffect, before paint, so a printing strip first paints at the top of its travel instead of flashing into place.
# [2026-09-18] 2026-09-18 WHAT I VERIFIED IN A REAL BROWSER, AND WHAT I DID NOT. Verified, measured on localhost:5173: (1) NO GESTURE ON FIRST PAINT on three pages — sessions (5 strips), settings (45 rows), turns — zero print classes, zero struck classes on load; (2) the hand-off transition is live on the row elements: computed transitionProperty transform, duration 0.4s; (3) a NEGATIVE CONTROL that proves the diff drives the gestures rather than the render: switching the settings view from all knobs to applies live filters 45 rows to 3 and fired NO gesture, because that bay holds a single stable child and its key list never changed — the rack filters inside its own component, so there was nothing for a bay-level diff to see. That is correct behaviour and it is the same measurement that would have exposed a diff keyed on anything but identity. NOT VERIFIED, and stated rather than implied: I did not observe a gesture firing end-to-end on a live data change. I watched three pages whose data does change on this machine — live sessions 24s (rows 10,6,3,3,2,1 unchanged), turns 30s (1,7,1 unchanged), compaction 40s (7,50 unchanged) — and in each window the underlying set simply did not change, so nothing fired. The decision layer those gestures depend on is pinned by 14 unit tests (enter/leave/stay, both commit orders for a pair, one-leave-pairs-once, unclaimed leave and unpaired enter, reduced motion disabling the registry, the FLIP transform and its zero-size guard); the firing itself is the m3 gate motion phase, which the orchestrator records.
