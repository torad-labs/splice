rce by name and reads the jar: URL - the same question the protection domain answered, via the channel this wall already blesses (DashboardHtml) - so a file: URL (exploded classes) still falls through to the installed copy. WALL CORRECTED: kt-no-reflection-in-production shipped blessing two compliant forms that no longer exist (gatewayBugKind, 'read java.class.path for the running jar'); both rewritten, plus a new paragraph 'A CLOSED when IS NOT AUTOMATICALLY AN IDENTITY - closure over the BASE classes a boundary converts is not closure over the SUBCLASSES that arrive'. Rule-test valid cases updated (gatewayBugKind -> DaemonBoundary.reason, java.class.path -> getSystemResource, plus a ': $e' case); still 39 passing. Gate half of same-checker-twice re-red-proven after the edit: scratch e.javaClass.simpleName made gate:rules fail naming the rule at the exact line, deleting it returned 39 passed / 0 failed. REPORTED NOT FIXED (no-opportunistic-fixes): the same base-vs-subclass coarsening remains at DaemonBoundary.reason (only when message is null) and MgmtKey's catch(_: IOException) branch - both already disclosed in the wave report's section 5, neither on the L3 path, each needs its own item. Verify: gradlew check --rerun-tasks BUILD SUCCESSFUL in 2m16s, 1106 tests / 14 modules / 0 failures (1103 + 3 new; NF-03 did not flake); npm run gate PASS; all three live rules scan 0 over gateway/*/src/main; Kimi goldens byte-untouched (git status on the goldens dir empty). Report appended: .superpowers/sdd/2026-08-15-head-decoupling/hd-18-report.md

