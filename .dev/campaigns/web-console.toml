e, grey otherwise, label = the address word; arrow keys step focus, Enter opens; strings.ts beside it. Rule (webui/src/widgets/rule): wordmark `splice` at --text-6 in --font-label lowercase; local and UTC clocks HH:MM:SS in --font-figure ticking each second; daemon health from @entities/control-status as a HolderEdge (green ok, amber degraded, red unreachable) with the word printed; the plan window nearest exhaustion computed from the existing exports of @entities/usage and @entities/auth as `<head> <account> <window> <pct>%` or `no window reported`; the count `<N> heads report none`; every number through Figure with its basis; reads entities through their existing public exports only, never edits them. Palette (webui/src/features/palette, cmdk 1.1.1 already installed): ctrl+k and `/` open it; items are the thirteen addresses, `theme dark`, `theme light`, and the saved views of the current page; radius 0, no icons. Views (webui/src/features/views): useViews and ViewTabs with EXACTLY the contract's types and storage key splice.views.<pageId>; add, rename, duplicate, reorder, remove, exportJson; removing the last view restores defaults. DEPENDS ON M1-01 (useTheme) AND M1-02 (Empty, HolderEdge): this row is claimed only after both are done, so its typecheck is green from the start. cmdk 1.1.1 and react-router 7.18.4 are installed at the repo-root node_modules (npm workspaces hoist; check with `node -e \"require.resolve('cmdk')\"`, never `ls webui/node_modules`). Keep webui/src/features/unlock-mgmt working (it is the mgmt-key entry the shell mounts). Delete the old header, tabs and footer markup; the shell has no footer. TESTS webui/tests/router.test.ts (address table, redirects, unknown address, page discovery map; pure functions extracted from App.tsx) and webui/tests/views.test.ts (every useViews operation on an in-memory storage shim; exportJson round-trips). Read /home/user/.claude/skills/impeccable/reference/craft-floor.md and .dev/web-console/CONTRACTS.md before 