# [2026-08-17] [2026-08-17] FIVE WALLS FIXED, each red-proven; ~26 remain. cx_01, w4_a, jw_06, jw_08, jw_13 now
# [2026-08-17] strip comments and imports before matching, via the same code_only() cx_02/cx_09/cx_18 already
# [2026-08-17] carried.
# [2026-08-17] THE PROOF, built out-of-tree so the repo was never mutated. Copied the dialect sources to a scratch
# [2026-08-17] fixture, deleted a real call site, and left its literal text behind in a comment
# [2026-08-17] (`// FIXME: reinstate ...` for cx_01, `// TODO(next): restore ...` for w4_a). The wall as it stood
# [2026-08-17] printed CX-01 WALL GREEN and W4-A WALL GREEN with the invariant gone. The patched wall — the repo's
# [2026-08-17] own file, ROOT repointed at the fixture — prints RED for each step's own reason. Both stay green on
# [2026-08-17] the unmodified tree, and both still pass their own --selftest, so this is not a blunt tightening.
# [2026-08-17] jw_08 IS DELIBERATELY ASYMMETRIC and a bulk sweep would get it wrong. Its _read feeds REQUIRED
# [2026-08-17] tokens and is stripped; its _read_tree feeds a BAN and is left raw. The two directions want
# [2026-08-17] opposite treatment: stripping makes a required token harder to satisfy, but would make a banned
# [2026-08-17] string easier to hide in a comment. Both stay strict only by treating them differently.
# [2026-08-17] [2026-08-17] A SECOND WALL-ANCHORING DEFECT, same class as the comment-satisfiability one, found by
# [2026-08-17] the code scan and verified directly.
# [2026-08-17] sh_10_kimi_merge_never_rewrite.py guards the kimi credential merge. Its vacuity guard is
# [2026-08-17] `if "writeSecure(" not in kimi:` (line 38) and both its fixtures are built on that spelling
# [2026-08-17] (KIMI_OPEN/KIMI_OK, lines 58-59). It NEVER names `SecureFile.writeAtomic0600` — grep for it in the
# [2026-08-17] wall returns nothing. So the wall is anchored on the name of an incidental PRIVATE WRAPPER, not on
# [2026-08-17] the invariant it protects.
# [2026-08-17] Two consequences, both real:
# [2026-08-17]   1. `private fun writeSecure(p, c) { SecureFile.writeAtomic0600(p, c) }` is a pure no-transform
# [2026-08-17]      forward duplicated in CodexAuthProvider.kt:348, GrokAuthProvider.kt:387 and
# [2026-08-17]      KimiDeviceIdentity.kt:52, each with exactly one in-file caller. Deleting them and calling
# [2026-08-17]      SecureFile directly is MORE compliant with kt-secure-file-single-source, not less — but the
# [2026-08-17]      kimi copy (KimiAuthProvider.kt:289) must stay, purely because deleting it erases the substring
# [2026-08-17]      sh_10 greps for and turns the wall red. A wall is dictating that a redundant wrapper survive.
# [2026-08-17]   2. Worse in the other direction: a change that routed the kimi write through a differently-named
# [2026-08-17]      helper would keep `SecureFile.writeAtomic0600` intact and still turn sh_10 red, while a change
# [2026-08-17]      that kept the name and dropped the atomic-0600 write would pass. The wall does not guard what
# [2026-08-17]      it claims to guard.
# [2026-08-17] REMEDY when HD-26 is worked: re-anchor sh_10 on `SecureFile.writeAtomic0600(` — the call that
# [2026-08-17] carries the invariant — with the merge-shape fixtures expressed against that call site. Red-proof
# [2026-08-17] required both ways: delete the atomic write and confirm RED, rename the wrapper and confirm it
# [2026-08-17] stays GREEN. Do not fix this by deleting the three redundant wrappers first; that ordering turns
# [2026-08-17] the wall red for a reason unrelated to the behaviour it protects.
# [2026-08-18] BATCH LANDED (9a911ac): jw_17, nf_01, nf_02, nf_03, nf_04 — five more walls off the STILL RAW list, each red-proven individually, no bulk edit. 21 of ~34 walls now carry the stripper.
# [2026-08-18] DIRECTIONALITY, decided per wall rather than swept. jw_17, nf_01, nf_03, nf_04 assert REQUIRED tokens ONLY and carry no banned string, so every Kotlin reader is stripped. nf_02 IS ASYMMETRIC, the second one after jw_08 and for a different reason: its Knob.kt reader is stripped (the shipped default is a required token — a commented-out declaration must fire the shape guard, not keep handing the wall a number to approve), but its config/splice.example.toml reader is left RAW because the measured-good CEILING it parses IS a TOML comment BY DESIGN (# ...0.3% turn failure at inflight<=14...). Stripping there hardens nothing; it blinds the wall to its own ceiling and drops it onto FALLBACK_CEILING = 14, which is strictly WEAKER whenever the committed measurement is stricter. Proven, not asserted: a fixture whose measurement reads inflight<=8 still bites — patched wall RED, 'default 12 exceeds the measured-good ceiling 8'. So the rule generalises past required-vs-banned: do not strip a reader whose PAYLOAD is legitimately a comment.
