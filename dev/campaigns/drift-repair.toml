# [2026-08-31] 2026-08-31 FIXED per codex-splice's three dispositions, tool lifecycle traced FIRST as the verify demanded. (1) ChatProseChannels.closeOpenProse(sink) added and called INSIDE ChatToolCalls.openPendingTool, which is the single place every tool block is born - streamed, finish_reason flush, and both final-message entries funnel through it, so a close in the delta path alone leaves the other paths overlapping. Named for what the caller needs rather than exposing the two block fields, so the tool side cannot reach into prose state and decide ordering for itself. (2) Router drops prose once toolCalls.hasToolUse - OpenAI chat has no per-tool stop, so opening prose would mean closing the live tool first, and that tool's later argument deltas would land on a closed block and vanish. Dropping late prose loses the prose; closing the tool loses the CALL. Recorded as the deliberate trade it is. Router statement ORDER is unchanged, so same-frame prose plus first tool still emits prose, then close, then tool. (3) Sibling parallel tools deliberately NOT closed by each other, per codex - OpenAI interleaves args across parallel calls and closing tool 0 to open tool 1 would silently drop tool 0's remainder; there is a permanent arm pinning that as intentional rather than leaving it to be 'fixed' later. FoldRec upgraded from a bare close to close-with-index, which the row's verify called out: index-blind, the assertion 'the TEXT block closed before the tool opened' was not WRITABLE, the same harness-shaped fake-green DR-143 fixed in Rec. EIGHT permanent arms: text-to-tool, thinking-to-tool, same-frame, deferred flush, final-only, final-echo-adopting-a-pending-slot, late-prose-drop, interleaved-parallel-protection. FOUR mutants, all with cleanTest and a staleness guard: (A) no close in openPendingTool - the exact pre-fix shape - reds FIVE arms; (B) close moved to the delta path only - reds both deferred paths; (C) late prose unguarded - reds the drop arm; (D) index-blind FoldRec - reds the final-fold arm, proving the harness upgrade was load-bearing rather than cosmetic. HONEST CORRECTION mid-verification: mutant B initially reddened only ONE arm, not the two codex predicted, because my final-fold arm used a call with no pending slot and therefore routed through applyToolCall instead of ChatFinalToolFold's DIRECT openPendingTool. Rather than accept the weaker result I added the missing fourth-path arm, and B now reds both. Without that, the mutant's coverage claim would have been overstated. Restores byte-identical, ChatToolCalls sha256 prefix 83c095d6202e716b. Chat dialect suite 82 tests, 0 failures, detekt clean.
