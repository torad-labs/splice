 Its environment carries `CLAUDE_HELPER_CONTEXT` (e.g. `setup-test`) and\n  `CLAUDE_HELPER_MANUAL_RUN=1` for the setup test.\n\n## Gateway provider and the Code tab\n\n- For `inferenceProvider: \"gateway\"` the scheme is bearer unless `inferenceGatewayAuthScheme` is `\"x-api-key\"`:\n  `i = e.provider===\"gateway\" ? e.authScheme!==\"x-api-key\" : as(t)`; then\n  `ANTHROPIC_API_KEY: i ? \"\" : t, ANTHROPIC_AUTH_TOKEN: i ? t : \"\"`. A helper's credential is put in the same\n  variable (`credentialEnvVar`: bearer → `ANTHROPIC_AUTH_TOKEN`, else `ANTHROPIC_API_KEY`).\n- `inferenceCustomHeaders`: a `{name: value}` object (`record<string,string>`), readers desktop and code; it becomes\n  `ANTHROPIC_CUSTOM_HEADERS` (`\"name: value\"` lines) for the Code tab's Claude Code.\n- A gateway whose host is not Anthropic's gets `CLAUDE_CODE_DISABLE_LEGACY_MODEL_REMAP=1`.\n- Auto mode: `CLAUDE_CODE_ENABLE_AUTO_MODE` comes from `autoModeEnabled` (unset: Code on, Cowork off; `true`: both on;\n  `false`: off). `CLAUDE_CODE_AUTO_MODE_SERVER` is `\"1\"`/`\"0\"` from `inferenceGatewayAutoModeServerChecks` when set.\n  `autoModeClassifierModel` is marked `availableInVersion: \"@next\"` (not read by this release).\n- Desktop always sets `CLAUDE_CODE_DISABLE_FAST_MODE=1` under 3P.\n\n## Discovery (`GET /v1/models`)\n\n- URL: `${base.replace(/\\/+$/,\"\")}/v1/models?limit=1000[&after_id=<cursor>]`, headers: the credential header,\n  `anthropic-version: 2023-06-01`, the custom headers. Timeout 10 s per page, up to 3 pages. A non-OK first page is\n  a failure; a later page's failure keeps the rows read. `data` must be an array.\n- Per row it reads: `id` (≤255 chars), `display_name` (≤255; the label, else the id), `description` (≤100 chars),\n  `anthropic_family_tier`, `is_family_default`, and 1M from `supports_1m` when it is a boolean, else\n  `max_input_tokens >= 1000000`. Paging: `has_more === true` with a string `last_id` gives the next cursor.\n- `anthropic_family_tier` is kept only when i