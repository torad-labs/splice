# THE LAW. A monitor that guards shared STATE must not be held across blocking IO. The lock's
# contention window stops being "how long does it take to read a map" and becomes "how long does
# the filesystem take", which on a cold page cache, an NFS mount or a stalled disk is unbounded.
# Every other thread wanting that state — including the ones only READING it — queues behind a
# syscall. Read the bytes and hash them OUTSIDE, then take the lock to publish the result.
#
# THE SCAR (ARCH-AUDIT 2026-09-17, audit D row 5). `AccountPool.select` (AccountPool.kt:40) takes
# `synchronized(sessions)` and, five hops down, reads and SHA-256-hashes a credential file on disk
# for every candidate account:
#   AccountPool.kt:40  synchronized(sessions)
#     -> AccountPool.kt:41  selected(...)  -> :58 choose(...)  -> :112 acquireIfAvailable
#     -> AccountPool.kt:113  account.acquireCredential
#     -> AccountSelection.kt:48  credentialEligibility.acquire
#     -> AccountCredentialEligibility.kt:176  source?.credentialEvidence()
#     -> AccountCredentialIdentitySource.kt:49  CredentialFileEvidenceReader.read(path)
#          :50  Files.readAttributes(path, "basic:...")
#          :59  CredentialFileDigest.of(path)
#     -> InvalidGrantLatch.kt:89-90  Files.readAllBytes(path) + MessageDigest "SHA-256"
# `sessions` is the per-session stickiness map that `view()` (AccountPool.kt:74) and `reset()` (:85)
# also take — so an operator dashboard read, and every other head's turn admission, serialize behind
# a credential-file hash. The lock exists to keep a LinkedHashMap consistent; it ended up holding a
# filesystem round-trip per account per turn.
#
# THIS RULE DOES NOT CATCH THAT INSTANCE, and saying so is the point of this paragraph (premise
# check, campaign law 7). The chain above crosses FOUR files. ast-grep matches one file at a time,
# so a transitive call into blocking IO is not expressible here by any matcher — not a weakness of
# this rule's shape, a boundary of the tool. What this wall does is make the DIRECT form
# inexpressible, so the shape cannot come back the obvious way, and it names the transitive
# instance above so the sibling fix row has it. Catching the transitive form needs a call-graph
# check (:arch-tests / Konsist) or the fix that removes it; both are outside a wall row's fence.
#
# THE CENSUS (measured 2026-09-17, gateway/*/src/main). Denominator from the source, both levels:
# 112 `synchronized(` blocks in scope; of those, 3 lexical blocking-IO hits, all in one function,
# ALL EXEMPT by the dated entry below, 0 RED. Measured with the exemption arm removed, to prove the
# 3 are exempted and not merely unmatched:
#   core/src/main/kotlin/splice/core/model/ClientWindows.kt:91,:93,:94 — inside
#   `persist(path) = synchronized(ioLock) { … }`.
# A wall landing at 0 red is the intended state for this one: the instance it was written for is
# transitive and invisible here, so its whole job is to stop the next DIRECT one. It is red-proven
# against a synthetic reconstruction of the AccountPool shape in the rule-test, which is what makes
# the 0 a measurement and not a matcher that cannot fire (§24).
#
# EXEMPTION (dated; by monitor NAME, with its weakness stated):
#   2026-09-17: `synchronized(ioLock)` — a monitor whose only purpose is to SERIALIZE the IO it
#     wraps is not a state monitor, and holding it across that IO is the contract, not the bug.
#     ClientWindows.persist is the one site: it takes `ioLock` to make concurrent persists
#     non-overlapping, and takes the real state lock (`lock`) only INSIDE, for the duration of a
#     `windows.toMap()` snapshot (ClientWindows.kt:88) — exactly the read-outside/publish-inside
#     shape this rule asks for, spelled the other way round. The exemption is keyed on the
#     IDENTIFIER, so renaming a state monitor to `ioLock` would defeat it; that is a lie a reviewer
#     sees in the diff, and the alternative (no exemption) is a permanently-red wall on correct code,
#     which trains authors to reach for ast-grep-ignore instead.
#
# SCOPE IS `synchronized`, as the audit row specifies. `ReentrantLock.withLock` and
# `Mutex.withLock` carry the same hazard and are NOT matched here: neither appears with blocking IO
# under it today (measured), and a coroutine `Mutex` suspends rather than parking a thread, so the
# blast radius differs enough to deserve its own rule rather than a silent widening of this one.
id: kt-no-blocking-io-under-monitor
language: kotlin
severity: error
message: "Blocking IO under a state monitor: read/hash the bytes OUTSIDE the lock, then take it only to publish the result. Holding a monitor across a filesystem call makes its contention window the disk's latency."
note: >
  The lock exists to keep a data structure consistent, not to serialize syscalls. Compute first,
  publish second: `val digest = hash(path); synchronized(lock) { state[key] = digest }`. A monitor
  whose ONLY job is to serialize the IO it wraps (ClientWindows.persist's `ioLock`) is exempt by a
  dated entry in this rule's header. Remember the transitive form this rule cannot see:
  AccountPool.select holds `synchronized(sessions)` across a credential-file SHA-256 five hops down.
files:
  - "**/src/main/**/*.kt"
rule:
  all:
    # The blocking primitives, matched on the call node ANCHORED at its start. Anchoring is
    # load-bearing and was measured: an unanchored `\.readAllBytes\s*\(` alternative also matched
    # the enclosing `synchronized(sessions) { Files.readAllBytes(path) }` call_expression, because
    # that node's TEXT contains the substring — two findings for one site and a wall that reports
    # the lock as the violation. A metavariable method name (`Files.$M($$$A)`) is NOT usable here:
    # tree-sitter-kotlin parses a metavariable in a navigation suffix into ERROR nodes and the
    # pattern silently matches nothing (measured 2026-09-17, ast-grep 0.44.0) — which is exactly the
    # dead-matcher shape this campaign has already found twice, so it is spelled as regex instead.
    - kind: call_expression
      regex: '^(java\.nio\.file\.)?Files\.[A-Za-z]|^(java\.security\.)?MessageDigest\.[A-Za-z]|^[A-Za-z_][A-Za-z0-9_.]*\.read(AllBytes|Bytes|Text|Lines)\s*\('
    # ...under SOME enclosing monitor that is not the dated `ioLock` exemption. The `not` sits
    # INSIDE the ancestor test on purpose: it must ask "is THIS monitor exempt", so that a state
    # monitor nested inside an `ioLock` block is still red (pinned in the rule-test). Putting the
    # `not` in the outer `all` instead makes the exemption swallow that nested case.
    - inside:
        stopBy: end
        all:
          - pattern: synchronized($LOCK) { $$$MBODY }
          - not:
              regex: '^synchronized\(\s*ioLock\s*\)'
