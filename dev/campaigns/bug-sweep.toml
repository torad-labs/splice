[[items]]
id = "BS-2"
phase = "P1-honesty"
title = "Unguarded writeSecure() in token rotation loses a GRANTED rotation to a transient disk error and can brick the head: after the endpoint consumed the old refresh_token, a throwing persist (ENOSPC/EACCES/NFS blip) propagates raw through SingleFlight out of credentials(), bypassing both the credentialsOrNull logging chokepoint and the serve-current-token fallback; the dead refresh_token stays on disk so the NEXT refresh latches invalid_grant until manual re-login. RefreshOutcome.PersistFailed exists for exactly this story. Fix at all THREE sites (codex persistRotation ~:235, grok persistRotation ~:245, kimi exchangeRefreshToken ~:155): wrap the writeSecure call runCatchingCancellable -> RefreshOutcome.PersistFailed, keeping the freshly granted in-memory token serving this request where the shape allows. Walls: a throwing writer yields PersistFailed (typed), never a raw throw through refresh()/credentials()"
files = ["gateway/provider-codex/src/main/kotlin/splice/provider/codex/CodexAuthProvider.kt", "gateway/provider-grok/src/main/kotlin/splice/provider/grok/GrokAuthProvider.kt", "gateway/provider-kimi/src/main/kotlin/splice/provider/kimi/KimiAuthProvider.kt"]
