reason = """Two ask and two ACT, which is the distinction that matters when the answer is a bare Boolean. DirectoryProbe asks whether a path is a directory; CredentialPresenceProbe asks whether a head's credential is configured. BrowserOpener LAUNCHES a browser at a URL and reports whether the launch succeeded; VersionedRestart "restarts the daemon the plain way (stop, then cold start from this shell), waiting for a daemon that reports [expectedVersion]" — a multi-second side effect whose false means "it did not come back", not "no". A probe's double wired where an actor was meant reports a clean skip for work that never ran, which is the shape of a green upgrade that never upgraded. (HeadAccountPinSource sat here from 2026-09-20, V4-132, until 2026-09-24, when it gained unpin() and stopped being a fun interface. LineVisit sat here on 2026-09-26, from V4-338 until V4-343 the same day, when it began taking a DayLine that its reader reads only as far as it needs.) (DayLineKeep, added 2026-10-10, is the only one here whose String is not a name, a path or a URL but one STORED LINE, and the only one whose false DELETES: the cut on Settings > Your data asks it per row and drops every row it refuses. Wiring any of the others in its place would read a record as a path or a command and answer about the filesystem instead of about the row, which with this role's consequence means deleting history the person never asked to lose, or keeping history they did; and wiring DayLineKeep where a probe was meant would answer a question about a path from whatever that path's text happens to contain.) (LocalListAuthority, added 2026-10-12, is the only one whose String is a provider's BASE URL and whose answer decides what `splice models` calls unserved: true when the runtime at that address publishes a list it serves from (Ollama, LM Studio, vLLM), so a row it does not list reads unserved as boot refuses it, and false for a generic OpenAI-compatible server or nothing answering. Wiring Cr